name: Publicar Release

on:
  push:
    branches: [main]
    paths:
      - module.json
      - .github/workflows/release.yml
      - tools/publish-release.cjs
      - tools/windows/**
      - tests/windows-updater.test.ps1
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicar-release
  cancel-in-progress: false

jobs:
  updater-windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Comprobar actualizador privado en Windows PowerShell 5.1
        shell: powershell
        run: .\tests\windows-updater.test.ps1
  release:
    needs: updater-windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run check
      - run: npm run package
      - name: Comprobar el paquete versionado
        run: git diff --exit-code -- releases/
      - name: Publicar notas y ZIP
        uses: actions/github-script@v7
        with:
          script: |
            const publicar = require('./tools/publish-release.cjs');
            await publicar({ github, context, core });
