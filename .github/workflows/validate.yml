name: Validar módulo
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run catalog:expand
      - run: git diff --exit-code -- data/verbe.txt data/reliquias.txt docs/REPERTORIO_SHINOBI.json docs/REPERTORIO_3.0.md docs/DOTES_Y_OBTENCION.json docs/PANTEON_3.2.md docs/RELIQUIAS_3.2.md
      - run: npm test
      - run: npm run check
      - run: npm run docs:catalog
      - run: npm run balance
      - run: npm run ui:preview
      - run: npm run audit:text
      - run: npm run audit:balance
      - run: git diff --exit-code -- docs/COBERTURA_CATALOGO.md docs/ESCENARIOS_BALANCE.md docs/PROGRESION_2.10.md docs/PROGRESION_3.1.md docs/AUDITORIA_3.1.md docs/AUDITORIA_TEXTUAL_3.2.1.md docs/preview/interfaz.html
      - run: npm run package
