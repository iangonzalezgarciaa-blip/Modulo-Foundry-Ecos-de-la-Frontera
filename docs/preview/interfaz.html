eck\">\u003cinput type=\"checkbox\" data-estado=\"helado\" >Helado\u003c/label>\u003c/fieldset>\u003c/div>\n      \u003clabel>Qué hace y cómo termina\u003ctextarea data-editor name=\"efecto\" rows=\"6\" maxlength=\"4000\">\u003c/textarea>\u003c/label>\n      \u003cdetails>\u003csummary>Excepción de balance\u003c/summary>\u003clabel class=\"ecos-check\">\u003cinput data-editor name=\"excepcionDM\" type=\"checkbox\" >Aprobar una excepción al presupuesto\u003c/label>\u003clabel>Motivo y límites de la excepción\u003cinput data-editor name=\"motivoExcepcion\" type=\"text\" value=\"\" maxlength=\"500\">\u003c/label>\u003c/details>\n      \u003cdiv class=\"ev-editor-preview\" aria-live=\"polite\">\u003c/div>\u003cbutton type=\"button\" data-action=\"guardar\">Publicar para todos los jugadores\u003c/button>\u003c/div>"}},"fichas":{"jugar":{"fuego-aliento":{"title":"Aliento de brasa","html":"\u003cdiv class=\"ecos-dialogo\">\u003cp class=\"texto\">DES, mitad: 3d6 fuego. Prende lo que arde. Sube: +1d6.\u003c/p>\n      \u003ctable class=\"ecos-verbe-ficha\">\n        \u003ctr>\u003cth>Rama\u003c/th>\u003ctd>Forma · Fuego\u003c/td>\u003cth>Grado\u003c/th>\u003ctd>1\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Tiempo\u003c/th>\u003ctd>Acción\u003c/td>\u003cth>Alcance\u003c/th>\u003ctd>sobre ti\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Área\u003c/th>\u003ctd>cono 4,5 m\u003c/td>\u003cth>Duración\u003c/th>\u003ctd>instantánea\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Componentes\u003c/th>\u003ctd>gestos y voz\u003c/td>\u003cth>Tirada\u003c/th>\u003ctd>Salvación de DES, mitad si la supera\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Daño o curación\u003c/th>\u003ctd>3d6 fuego\u003c/td>\u003cth>Deja\u003c/th>\u003ctd>\u003cspan data-tooltip=\"1d6 de fuego al inicio de cada turno. Lo apagan una acción, el agua o la tierra.\">Ardiendo\u003c/span>\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Usa\u003c/th>\u003ctd>usa tu característica de Verbe\u003c/td>\u003cth>Sube\u003c/th>\u003ctd>+1d6 por cada grado de más\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Verbe por uso\u003c/th>\u003ctd>grado 1: 2 Verbe · grado 2: 3 Verbe\u003c/td>\u003cth>Para aprender\u003c/th>\u003ctd>1 Trazo\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Pide\u003c/th>\u003ctd>nivel 1 · naturaleza Fuego\u003c/td>\u003cth>Puedes\u003c/th>\u003ctd>ya la sabes\u003c/td>\u003c/tr>\n      \u003c/table>\u003cp class=\"ecos-nota\">CD con tu Verbe: 13.\u003c/p>\n      \n      \n      \u003cdiv class=\"ecos-verbe-mejora\">\u003cb>Se mejora con\u003c/b>\u003cul>\u003cli>usarla a más grado (+1d6 por grado)\u003c/li>\u003cli>rango en Forma (Experto +1 dado, Maestro +2, Legendario +3, Mítico +4)\u003c/li>\u003cli>los dones de rango de Forma\u003c/li>\u003cli>afinidad con Fuego (Entrenada +1 dado, Maestra +2)\u003c/li>\u003cli>Cultivo: Pulida, Dominada y Propia\u003c/li>\u003cli>la dote Área ancha\u003c/li>\u003cli>la escuela El Taller de las Formas\u003c/li>\u003c/ul>\u003c/div>\u003c/div>"},"forma-sustitucion":{"title":"Sustitución","html":"\u003cdiv class=\"ecos-dialogo\">\u003cp class=\"ecos-verbe-intro\">\u003cb>Es una defensa reactiva.\u003c/b> Con midi-qol se ofrece cuando un ataque va a impactarte; el aviso muestra el coste según el ataque. No la lances como una técnica normal antes del golpe. Sin esa integración, el DM resuelve la reacción, el objeto y el coste en mesa.\u003c/p>\u003cp class=\"texto\">Cuando un ataque con tirada que ves venir te va a impactar, te cambias por un objeto de tu tamaño o menor a 3 m o menos (un tronco, una capa, una piedra): el ataque falla y el objeto recibe el golpe. Cuesta 2 Verbe, y 2 más por cada grado que el ataque supere tu grado máximo (grado de un ataque: el de su técnica o conjuro; si es un arma o una criatura, la mitad de su nivel o VD). No sirve contra áreas ni salvaciones, ni sin un objeto cerca.\u003c/p>\u003cp class=\"ecos-nota\">Referencia: \u003cb>Kawarimi no Jutsu\u003c/b> · manga/anime · estudio, p. 9. Grado y cifras adaptados a esta campaña.\u003c/p>\n      \u003ctable class=\"ecos-verbe-ficha\">\n        \u003ctr>\u003cth>Rama\u003c/th>\u003ctd>Forma\u003c/td>\u003cth>Grado\u003c/th>\u003ctd>1\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Tiempo\u003c/th>\u003ctd>Reacción\u003c/td>\u003cth>Alcance\u003c/th>\u003ctd>sobre ti\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Área\u003c/th>\u003ctd>—\u003c/td>\u003cth>Duración\u003c/th>\u003ctd>instantánea\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Componentes\u003c/th>\u003ctd>gestos\u003c/td>\u003cth>Tirada\u003c/th>\u003ctd>Ninguna\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Daño o curación\u003c/th>\u003ctd>—\u003c/td>\u003cth>Deja\u003c/th>\u003ctd>—\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Usa\u003c/th>\u003ctd>usa tu característica de Verbe\u003c/td>\u003cth>Sube\u003c/th>\u003ctd>—\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Verbe por uso\u003c/th>\u003ctd>grado 1: 2 Verbe · grado 2: 3 Verbe\u003c/td>\u003cth>Para aprender\u003c/th>\u003ctd>1 Trazo\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Pide\u003c/th>\u003ctd>nivel 1\u003c/td>\u003cth>Puedes\u003c/th>\u003ctd>ya la sabes\u003c/td>\u003c/tr>\n      \u003c/table>\n      \n      \u003cdiv class=\"ecos-verbe-crece\">\u003cb>Crece\u003c/b>\u003cul>\u003cli>Contra ataques de tu grado o menos: 2 Verbe.\u003c/li>\u003cli>Cada grado que el ataque pase de tu grado máximo: 2 Verbe más.\u003c/li>\u003cli>Sustitución amplia: también contra áreas de DES. Sustitución lejana: el objeto puede estar a 9 m. Sustitución refleja: una vez por Descanso Corto no pagas los 2 de base.\u003c/li>\u003c/ul>\u003c/div>\n      \u003cdiv class=\"ecos-verbe-mejora\">\u003cb>Se mejora con\u003c/b>\u003cul>\u003cli>los dones de rango de Forma\u003c/li>\u003cli>Cultivo: Pulida, Dominada y Propia\u003c/li>\u003cli>la dote Esquivar sin Verbe\u003c/li>\u003cli>la dote Sustitución refleja\u003c/li>\u003cli>la dote Sustitución amplia\u003c/li>\u003cli>la dote Sustitución lejana\u003c/li>\u003cli>la escuela El Taller de las Formas\u003c/li>\u003c/ul>\u003c/div>\u003c/div>"},"forma-andar":{"title":"Andar por muros","html":"\u003cdiv class=\"ecos-dialogo\">\u003cp class=\"texto\">Caminas por paredes, techos y agua como por el suelo, con las manos libres. Si pierdes la Concentración en una pared, caes.\u003c/p>\u003cp class=\"ecos-nota\">Referencia: \u003cb>Kinobori no Waza\u003c/b> · manga/anime · estudio, p. 9. Grado y cifras adaptados a esta campaña.\u003c/p>\n      \u003ctable class=\"ecos-verbe-ficha\">\n        \u003ctr>\u003cth>Rama\u003c/th>\u003ctd>Forma\u003c/td>\u003cth>Grado\u003c/th>\u003ctd>1\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Tiempo\u003c/th>\u003ctd>Acción adicional\u003c/td>\u003cth>Alcance\u003c/th>\u003ctd>sobre ti\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Área\u003c/th>\u003ctd>—\u003c/td>\u003cth>Duración\u003c/th>\u003ctd>Concentración, 10 min\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Componentes\u003c/th>\u003ctd>sin gestos ni voz\u003c/td>\u003cth>Tirada\u003c/th>\u003ctd>Ninguna\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Daño o curación\u003c/th>\u003ctd>—\u003c/td>\u003cth>Deja\u003c/th>\u003ctd>—\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Usa\u003c/th>\u003ctd>usa tu característica de Verbe\u003c/td>\u003cth>Sube\u003c/th>\u003ctd>—\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Verbe por uso\u003c/th>\u003ctd>grado 1: 2 Verbe · grado 2: 3 Verbe\u003c/td>\u003cth>Para aprender\u003c/th>\u003ctd>1 Trazo\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Pide\u003c/th>\u003ctd>nivel 1\u003c/td>\u003cth>Puedes\u003c/th>\u003ctd>ya la sabes\u003c/td>\u003c/tr>\n      \u003c/table>\n      \n      \n      \u003cdiv class=\"ecos-verbe-mejora\">\u003cb>Se mejora con\u003c/b>\u003cul>\u003cli>los dones de rango de Forma\u003c/li>\u003cli>Cultivo: Pulida, Dominada y Propia\u003c/li>\u003cli>la dote Andar sin huella\u003c/li>\u003cli>la escuela El Taller de las Formas\u003c/li>\u003c/ul>\u003c/div>\u003c/div>"},"forma-brillo":{"title":"Brillo","html":"\u003cdiv class=\"ecos-dialogo\">\u003cp class=\"texto\">Tu mano o un objeto da luz brillante en 6 m y tenue 6 m más, del color de tu Verbe. La apagas cuando quieras.\u003c/p>\n      \u003ctable class=\"ecos-verbe-ficha\">\n        \u003ctr>\u003cth>Rama\u003c/th>\u003ctd>Forma\u003c/td>\u003cth>Grado\u003c/th>\u003ctd>0\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Tiempo\u003c/th>\u003ctd>Acción\u003c/td>\u003cth>Alcance\u003c/th>\u003ctd>toque\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Área\u003c/th>\u003ctd>—\u003c/td>\u003cth>Duración\u003c/th>\u003ctd>1 h\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Componentes\u003c/th>\u003ctd>gestos\u003c/td>\u003cth>Tirada\u003c/th>\u003ctd>Ninguna\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Daño o curación\u003c/th>\u003ctd>—\u003c/td>\u003cth>Deja\u003c/th>\u003ctd>—\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Usa\u003c/th>\u003ctd>usa tu característica de Verbe\u003c/td>\u003cth>Sube\u003c/th>\u003ctd>—\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Verbe por uso\u003c/th>\u003ctd>0 Verbe (pide tener al menos 1)\u003c/td>\u003cth>Para aprender\u003c/th>\u003ctd>1 Trazo\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Pide\u003c/th>\u003ctd>—\u003c/td>\u003cth>Puedes\u003c/th>\u003ctd>sí\u003c/td>\u003c/tr>\n      \u003c/table>\n      \n      \n      \u003cdiv class=\"ecos-verbe-mejora\">\u003cb>Se mejora con\u003c/b>\u003cul>\u003cli>los dones de rango de Forma\u003c/li>\u003cli>Cultivo: Pulida, Dominada y Propia\u003c/li>\u003cli>la escuela El Taller de las Formas\u003c/li>\u003c/ul>\u003c/div>\u003c/div>"},"forma-mano":{"title":"Mano de Verbe","html":"\u003cdiv class=\"ecos-dialogo\">\u003cp class=\"texto\">Una mano de Verbe que levanta, empuja o abre lo que abriría una mano, hasta 5 kg. La mueves 9 m con una AA. No ataca.\u003c/p>\n      \u003ctable class=\"ecos-verbe-ficha\">\n        \u003ctr>\u003cth>Rama\u003c/th>\u003ctd>Forma\u003c/td>\u003cth>Grado\u003c/th>\u003ctd>0\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Tiempo\u003c/th>\u003ctd>Acción\u003c/td>\u003cth>Alcance\u003c/th>\u003ctd>9 m\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Área\u003c/th>\u003ctd>—\u003c/td>\u003cth>Duración\u003c/th>\u003ctd>1 min\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Componentes\u003c/th>\u003ctd>gestos\u003c/td>\u003cth>Tirada\u003c/th>\u003ctd>Ninguna\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Daño o curación\u003c/th>\u003ctd>—\u003c/td>\u003cth>Deja\u003c/th>\u003ctd>—\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Usa\u003c/th>\u003ctd>usa tu característica de Verbe\u003c/td>\u003cth>Sube\u003c/th>\u003ctd>—\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Verbe por uso\u003c/th>\u003ctd>0 Verbe (pide tener al menos 1)\u003c/td>\u003cth>Para aprender\u003c/th>\u003ctd>1 Trazo\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Pide\u003c/th>\u003ctd>—\u003c/td>\u003cth>Puedes\u003c/th>\u003ctd>sí\u003c/td>\u003c/tr>\n      \u003c/table>\n      \n      \n      \u003cdiv class=\"ecos-verbe-mejora\">\u003cb>Se mejora con\u003c/b>\u003cul>\u003cli>los dones de rango de Forma\u003c/li>\u003cli>Cultivo: Pulida, Dominada y Propia\u003c/li>\u003cli>la dote Alcance largo\u003c/li>\u003cli>la escuela El Taller de las Formas\u003c/li>\u003c/ul>\u003c/div>\u003c/div>"},"forma-paso-doble":{"title":"Paso doble","html":"\u003cdiv class=\"ecos-dialogo\">\u003cp class=\"texto\">Dejas una imagen de Verbe donde estabas: el primer ataque de oportunidad contra ti este turno tiene desventaja.\u003c/p>\n      \u003ctable class=\"ecos-verbe-ficha\">\n        \u003ctr>\u003cth>Rama\u003c/th>\u003ctd>Forma\u003c/td>\u003cth>Grado\u003c/th>\u003ctd>0\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Tiempo\u003c/th>\u003ctd>Acción adicional\u003c/td>\u003cth>Alcance\u003c/th>\u003ctd>sobre ti\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Área\u003c/th>\u003ctd>—\u003c/td>\u003cth>Duración\u003c/th>\u003ctd>1 asalto\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Componentes\u003c/th>\u003ctd>sin gestos ni voz\u003c/td>\u003cth>Tirada\u003c/th>\u003ctd>Ninguna\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Daño o curación\u003c/th>\u003ctd>—\u003c/td>\u003cth>Deja\u003c/th>\u003ctd>—\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Usa\u003c/th>\u003ctd>usa tu característica de Verbe\u003c/td>\u003cth>Sube\u003c/th>\u003ctd>—\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Verbe por uso\u003c/th>\u003ctd>0 Verbe (pide tener al menos 1)\u003c/td>\u003cth>Para aprender\u003c/th>\u003ctd>1 Trazo\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Pide\u003c/th>\u003ctd>—\u003c/td>\u003cth>Puedes\u003c/th>\u003ctd>sí\u003c/td>\u003c/tr>\n      \u003c/table>\n      \n      \n      \u003cdiv class=\"ecos-verbe-mejora\">\u003cb>Se mejora con\u003c/b>\u003cul>\u003cli>los dones de rango de Forma\u003c/li>\u003cli>Cultivo: Pulida, Dominada y Propia\u003c/li>\u003cli>la escuela El Taller de las Formas\u003c/li>\u003c/ul>\u003c/div>\u003c/div>"},"forma-punta":{"title":"Punta de Verbe","html":"\u003cdiv class=\"ecos-dialogo\">\u003cp class=\"texto\">Ataque: 1d8 fuerza. Un dardo de Verbe sin naturaleza. Sube un dado en los niveles 5, 11 y 17.\u003c/p>\n      \u003ctable class=\"ecos-verbe-ficha\">\n        \u003ctr>\u003cth>Rama\u003c/th>\u003ctd>Forma\u003c/td>\u003cth>Grado\u003c/th>\u003ctd>0\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Tiempo\u003c/th>\u003ctd>Acción\u003c/td>\u003cth>Alcance\u003c/th>\u003ctd>18 m\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Área\u003c/th>\u003ctd>—\u003c/td>\u003cth>Duración\u003c/th>\u003ctd>instantánea\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Componentes\u003c/th>\u003ctd>gestos y voz\u003c/td>\u003cth>Tirada\u003c/th>\u003ctd>Ataque\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Daño o curación\u003c/th>\u003ctd>1d8 fuerza\u003c/td>\u003cth>Deja\u003c/th>\u003ctd>—\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Usa\u003c/th>\u003ctd>usa tu característica de Verbe\u003c/td>\u003cth>Sube\u003c/th>\u003ctd>más dados en los niveles 5, 11 y 17\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Verbe por uso\u003c/th>\u003ctd>0 Verbe (pide tener al menos 1)\u003c/td>\u003cth>Para aprender\u003c/th>\u003ctd>1 Trazo\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Pide\u003c/th>\u003ctd>—\u003c/td>\u003cth>Puedes\u003c/th>\u003ctd>sí\u003c/td>\u003c/tr>\n      \u003c/table>\n      \n      \n      \u003cdiv class=\"ecos-verbe-mejora\">\u003cb>Se mejora con\u003c/b>\u003cul>\u003cli>tu nivel (más dados en los niveles 5, 11 y 17)\u003c/li>\u003cli>rango en Forma (Experto +1 dado, Maestro +2, Legendario +3, Mítico +4)\u003c/li>\u003cli>los dones de rango de Forma\u003c/li>\u003cli>infundirla con tu elemento (Cultivo)\u003c/li>\u003cli>Cultivo: Pulida, Dominada y Propia\u003c/li>\u003cli>la dote Alcance largo\u003c/li>\u003cli>la dote Trucos afilados\u003c/li>\u003cli>la dote Forma afilada\u003c/li>\u003cli>la escuela El Taller de las Formas\u003c/li>\u003c/ul>\u003c/div>\u003c/div>"},"forma-cuerda":{"title":"Cuerda de Verbe","html":"\u003cdiv class=\"ecos-dialogo\">\u003cp class=\"texto\">FUE. Un lazo de Verbe atrapa a una criatura Mediana o menor: si falla, queda Agarrada (escape contra tu CD) y con una AA la acercas 3 m. Sube: una criatura más.\u003c/p>\n      \u003ctable class=\"ecos-verbe-ficha\">\n        \u003ctr>\u003cth>Rama\u003c/th>\u003ctd>Forma\u003c/td>\u003cth>Grado\u003c/th>\u003ctd>1\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Tiempo\u003c/th>\u003ctd>Acción\u003c/td>\u003cth>Alcance\u003c/th>\u003ctd>9 m\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Área\u003c/th>\u003ctd>—\u003c/td>\u003cth>Duración\u003c/th>\u003ctd>Concentración, 1 min\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Componentes\u003c/th>\u003ctd>gestos\u003c/td>\u003cth>Tirada\u003c/th>\u003ctd>Salvación de FUE\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Daño o curación\u003c/th>\u003ctd>—\u003c/td>\u003cth>Deja\u003c/th>\u003ctd>—\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Usa\u003c/th>\u003ctd>usa tu característica de Verbe\u003c/td>\u003cth>Sube\u003c/th>\u003ctd>una criatura más por cada grado de más\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Verbe por uso\u003c/th>\u003ctd>grado 1: 2 Verbe · grado 2: 3 Verbe\u003c/td>\u003cth>Para aprender\u003c/th>\u003ctd>1 Trazo\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Pide\u003c/th>\u003ctd>nivel 1\u003c/td>\u003cth>Puedes\u003c/th>\u003ctd>sí\u003c/td>\u003c/tr>\n      \u003c/table>\u003cp class=\"ecos-nota\">CD con tu Verbe: 13.\u003c/p>\n      \n      \n      \u003cdiv class=\"ecos-verbe-mejora\">\u003cb>Se mejora con\u003c/b>\u003cul>\u003cli>usarla a más grado (una criatura más por grado)\u003c/li>\u003cli>los dones de rango de Forma\u003c/li>\u003cli>Cultivo: Pulida, Dominada y Propia\u003c/li>\u003cli>la dote Alcance largo\u003c/li>\u003cli>la escuela El Taller de las Formas\u003c/li>\u003c/ul>\u003c/div>\u003c/div>"},"forma-replica":{"title":"Réplica","html":"\u003cdiv class=\"ecos-dialogo\">\u003cp class=\"texto\">Aparece a tu lado una copia ilusoria tuya. Cuando te atacan, tira 1d20: con 11 o más el ataque va a la copia (CA 10 + tu mod. de DES), que desaparece. No engaña a quien ve el Verbe. Sube: una copia más (máx. 3).\u003c/p>\u003cp class=\"ecos-nota\">Referencia: \u003cb>Bunshin no Jutsu\u003c/b> · manga/anime · estudio, p. 9. Grado y cifras adaptados a esta campaña.\u003c/p>\n      \u003ctable class=\"ecos-verbe-ficha\">\n        \u003ctr>\u003cth>Rama\u003c/th>\u003ctd>Forma\u003c/td>\u003cth>Grado\u003c/th>\u003ctd>1\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Tiempo\u003c/th>\u003ctd>Acción\u003c/td>\u003cth>Alcance\u003c/th>\u003ctd>sobre ti\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Área\u003c/th>\u003ctd>—\u003c/td>\u003cth>Duración\u003c/th>\u003ctd>1 min\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Componentes\u003c/th>\u003ctd>gestos y voz\u003c/td>\u003cth>Tirada\u003c/th>\u003ctd>Ninguna\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Daño o curación\u003c/th>\u003ctd>—\u003c/td>\u003cth>Deja\u003c/th>\u003ctd>—\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Usa\u003c/th>\u003ctd>usa tu característica de Verbe\u003c/td>\u003cth>Sube\u003c/th>\u003ctd>una copia más (máx. 3) por cada grado de más\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Verbe por uso\u003c/th>\u003ctd>grado 1: 2 Verbe · grado 2: 3 Verbe\u003c/td>\u003cth>Para aprender\u003c/th>\u003ctd>1 Trazo\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Pide\u003c/th>\u003ctd>nivel 1\u003c/td>\u003cth>Puedes\u003c/th>\u003ctd>sí\u003c/td>\u003c/tr>\n      \u003c/table>\n      \n      \n      \u003cdiv class=\"ecos-verbe-mejora\">\u003cb>Se mejora con\u003c/b>\u003cul>\u003cli>usarla a más grado (una copia más (máx. 3) por grado)\u003c/li>\u003cli>los dones de rango de Forma\u003c/li>\u003cli>Cultivo: Pulida, Dominada y Propia\u003c/li>\u003cli>la escuela El Taller de las Formas\u003c/li>\u003c/ul>\u003c/div>\u003c/div>"},"forma-transformacion":{"title":"Transformación","html":"\u003cdiv class=\"ecos-dialogo\">\u003cp class=\"texto\">Te ves como otra persona de tu tamaño, o como un objeto de tu tamaño. Tocarte, o Investigación contra tu CD, lo revela.\u003c/p>\u003cp class=\"ecos-nota\">Referencia: \u003cb>Henge no Jutsu\u003c/b> · manga/anime · estudio, p. 9. Grado y cifras adaptados a esta campaña.\u003c/p>\n      \u003ctable class=\"ecos-verbe-ficha\">\n        \u003ctr>\u003cth>Rama\u003c/th>\u003ctd>Forma\u003c/td>\u003cth>Grado\u003c/th>\u003ctd>1\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Tiempo\u003c/th>\u003ctd>Acción\u003c/td>\u003cth>Alcance\u003c/th>\u003ctd>sobre ti\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Área\u003c/th>\u003ctd>—\u003c/td>\u003cth>Duración\u003c/th>\u003ctd>1 h\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Componentes\u003c/th>\u003ctd>gestos\u003c/td>\u003cth>Tirada\u003c/th>\u003ctd>Ninguna\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Daño o curación\u003c/th>\u003ctd>—\u003c/td>\u003cth>Deja\u003c/th>\ >Para aprender\u003c/th>\u003ctd>1 Trazo\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Pide\u003c/th>\u003ctd>nivel 1\u003c/td>\u003cth>Puedes\u003c/th>\u003ctd>sí\u003c/td>\u003c/tr>\n      \u003c/table>\n      \n      \n      \u003cdiv class=\"ecos-verbe-mejora\">\u003cb>Se mejora con\u003c/b>\u003cul>\u003cli>usarla a más grado (una punta más por grado)\u003c/li>\u003cli>rango en Forma (Experto +1 dado, Maestro +2, Legendario +3, Mítico +4)\u003c/li>\u003cli>los dones de rango de Forma\u003c/li>\u003cli>infundirla con tu elemento (Cultivo)\u003c/li>\u003cli>Cultivo: Pulida, Dominada y Propia\u003c/li>\u003cli>la dote Alcance largo\u003c/li>\u003cli>la dote Forma afilada\u003c/li>\u003cli>la escuela El Taller de las Formas\u003c/li>\u003c/ul>\u003c/div>\u003c/div>"},"forma-esfera":{"title":"Esfera girante","html":"\u003cdiv class=\"ecos-dialogo\">\u003cp class=\"texto\">Ataque: 3d8 fuerza. Un remolino de Verbe en la palma que estalla al tocar: si impacta, el blanco sale empujado 3 m. Sube: +1d8.\u003c/p>\u003cp class=\"ecos-nota\">Referencia: \u003cb>Rasengan\u003c/b> · manga/anime · estudio, p. 10. Grado y cifras adaptados a esta campaña.\u003c/p>\n      \u003ctable class=\"ecos-verbe-ficha\">\n        \u003ctr>\u003cth>Rama\u003c/th>\u003ctd>Forma\u003c/td>\u003cth>Grado\u003c/th>\u003ctd>2\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Tiempo\u003c/th>\u003ctd>Acción\u003c/td>\u003cth>Alcance\u003c/th>\u003ctd>toque\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Área\u003c/th>\u003ctd>—\u003c/td>\u003cth>Duración\u003c/th>\u003ctd>instantánea\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Componentes\u003c/th>\u003ctd>gestos\u003c/td>\u003cth>Tirada\u003c/th>\u003ctd>Ataque\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Daño o curación\u003c/th>\u003ctd>3d8 fuerza\u003c/td>\u003cth>Deja\u003c/th>\u003ctd>—\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Usa\u003c/th>\u003ctd>usa tu característica de Verbe\u003c/td>\u003cth>Sube\u003c/th>\u003ctd>+1d8 por cada g \u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Pide\u003c/th>\u003ctd>nivel 3 · Entrenado en Forma · naturaleza Fuego\u003c/td>\u003cth>Puedes\u003c/th>\u003ctd>sí\u003c/td>\u003c/tr>\n      \u003c/table>\u003cp class=\"ecos-nota\">CD con tu Verbe: 13.\u003c/p>\n      \n      \n      \u003cdiv class=\"ecos-verbe-mejora\">\u003cb>Se mejora con\u003c/b>\u003cul>\u003cli>usarla a más grado (+1d6 por grado)\u003c/li>\u003cli>rango en Forma (Experto +1 dado, Maestro +2, Legendario +3, Mítico +4)\u003c/li>\u003cli>los dones de rango de Forma\u003c/li>\u003cli>afinidad con Fuego (Entrenada +1 dado, Maestra +2)\u003c/li>\u003cli>Cultivo: Pulida, Dominada y Propia\u003c/li>\u003cli>la dote Área ancha\u003c/li>\u003cli>la escuela El Taller de las Formas\u003c/li>\u003c/ul>\u003c/div>\u003c/div>"},"fuego-brasas":{"title":"Brasas dispersas","html":"\u003cdiv class=\"ecos-dialogo\">\u003cp class=\"texto\">3 ataques: 2d6 fuego cada uno. Tres brasas: un ataque por cada una, al mismo blanco o a varios. Sube: una brasa más.\u003c/p>\u003cp class=\"ecos-nota\">Referencia: \u003cb>Hōsenka no Jutsu\u003c/b> · manga/anime · estudio, p. 11. Grado y cifras adaptados a esta campaña.\u003c/p>\n      \u003ctable class=\"ecos-verbe-ficha\">\n        \u003ctr>\u003cth>Rama\u003c/th>\u003ctd>Forma · Fuego\u003c/td>\u003cth>Grado\u003c/th>\u003ctd>2\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Tiempo\u003c/th>\u003ctd>Acción\u003c/td>\u003cth>Alcance\u003c/th>\u003ctd>36 m\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Área\u003c/th>\u003ctd>—\u003c/td>\u003cth>Duración\u003c/th>\u003ctd>instantánea\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Componentes\u003c/th>\u003ctd>gestos y voz\u003c/td>\u003cth>Tirada\u003c/th>\u003ctd>Ataque (3 ataques)\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Daño o curación\u003c/th>\u003ctd>3 × 2d6 fuego\u003c/td>\u003cth>Deja\u003c/th>\u003ctd>\u003cspan data-tooltip=\"1d6 de fuego al inicio de cada turno. Lo apagan una acción, el agua o la tierra.\">Ardiendo\u003c/span>\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Usa\u003c/th>\u003ctd>usa tu característica de Verbe\u003c/td>\u003cth>Sube\u003c/th>\u003ctd>una brasa más por cada grado de más\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Verbe por uso\u003c/th>\u003ctd>grado 2: 3 Verbe\u003c/td>\u003cth>Para aprender\u003c/th>\u003ctd>2 Trazos\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Pide\u003c/th>\u003ctd>nivel 3 · Entrenado en Forma · naturaleza Fuego\u003c/td>\u003cth>Puedes\u003c/th>\u003ctd>sí\u003c/td>\u003c/tr>\n      \u003c/table>\n      \n      \n      \u003cdiv class=\"ecos-verbe-mejora\">\u003cb>Se mejora con\u003c/b>\u003cul>\u003cli>usarla a más grado (una brasa más por grado)\u003c/li>\u003cli>rango en Forma (Experto +1 dado, Maestro +2, Legendario +3, Mítico +4)\u003c/li>\u003cli>los dones de rango de Forma\u003c/li>\u003cli>afinidad con Fuego (Entrenada +1 dado, Maestra +2)\u003c/li>\u003cli>Cultivo: Pulida, Dominada y Propia\u003c/li>\u003cli>la dote Alcance largo\u003c/li>\u003cli>la escuela El Taller de las Formas\u003c/li>\u003c/ul>\u003c/div>\u003c/div>"},"fuego-fragua":{"title":"Calor de fragua","html":"\u003cdiv class=\"ecos-dialogo\">\u003cp class=\"texto\">2d8 fuego. Un objeto de metal que veas (un arma, una armadura) se pone al rojo. Quien lo lleva recibe el daño al empezar y cada vez que repites la AA. Si no lo suelta, CON: si falla, desventaja en ataques y pruebas hasta tu próximo turno. Sube: +1d8.\u003c/p>\n      \u003ctable class=\"ecos-verbe-ficha\">\n        \u003ctr>\u003cth>Rama\u003c/th>\u003ctd>Forma · Fuego\u003c/td>\u003cth>Grado\u003c/th>\u003ctd>2\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Tiempo\u003c/th>\u003ctd>Acción adicional\u003c/td>\u003cth>Alcance\u003c/th>\u003ctd>18 m\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Área\u003c/th>\u003ctd>—\u003c/td>\u003cth>Duración\u003c/th>\u003ctd>Concentración, 1 min\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Componentes\u003c/th>\u003ctd>gestos y voz\u003c/td>\u003cth>Tirada\u003c/th>\u003ctd>Ninguna\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Daño o curación\u003c/th>\u003ctd>2d8 fuego\u003c/td>\u003cth>Deja\u003c/th>\u003ctd>\u003cspan data-tooltip=\"1d6 de fuego al inicio de cada turno. Lo apagan una acción, el agua o la tierra.\">Ardiendo\u003c/span>\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Usa\u003c/th>\u003ctd>usa tu característica de Verbe\u003c/td>\u003cth>Sube\u003c/th>\u003ctd>+1d8 por cada grado de más\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Verbe por uso\u003c/th>\u003ctd>grado 2: 3 Verbe\u003c/td>\u003cth>Para aprender\u003c/th>\u003ctd>2 Trazos\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Pide\u003c/th>\u003ctd>nivel 3 · Entrenado en Forma · naturaleza Fuego\u003c/td>\u003cth>Puedes\u003c/th>\u003ctd>sí\u003c/td>\u003c/tr>\n      \u003c/table>\n      \n      \u003cdiv class=\"ecos-verbe-crece\">\u003cb>Crece\u003c/b>\u003cul>\u003cli>Escalera: Calor de fragua (2) → Muro de llamas (4) → Horno (6).\u003c/li>\u003c/ul>\u003c/div>\n      \u003cdiv class=\"ecos-verbe-mejora\">\u003cb>Se mejora con\u003c/b>\u003cul>\u003cli>usarla a más grado (+1d8 por grado)\u003c/li>\u003cli>rango en Forma (Experto +1 dado, Maestro +2, Legendario +3, Mítico +4)\u003c/li>\u003cli>los dones de rango de Forma\u003c/li>\u003cli>afinidad con Fuego (Entrenada +1 dado, Maestra +2)\u003c/li>\u003cli>Cultivo: Pulida, Dominada y Propia\u003c/li>\u003cli>la dote Alcance largo\u003c/li>\u003cli>la escuela El Taller de las Formas\u003c/li>\u003c/ul>\u003c/div>\u003c/div>"},"agua-chorro":{"title":"Chorro","html":"\u003cdiv class=\"ecos-dialogo\">\u003cp class=\"texto\">Ataque: 1d8 contundente. Si impacta, queda Empapado. Sube un dado en los niveles 5, 11 y 17.\u003c/p>\n      \u003ctable class=\"ecos-verbe-ficha\">\n        \u003ctr>\u003cth>Rama\u003c/th>\u003ctd>Forma · Agua\u003c/td>\u003cth>Grado\u003c/th>\u003ctd>0\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Tiempo\u003c/th>\u003ctd>Acción\u003c/td>\u003cth>Alcance\u003c/th>\u003ctd>9 m\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Área\u003c/th>\u003ctd>—\u003c/td>\u003cth>Duración\u003c/th>\u003ctd>instantánea\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Componentes\u003c/th>\u003ctd>gestos y voz\u003c/td>\u003cth>Tirada\u003c/th>\u003ctd>Ataque\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Daño o curación\u003c/th>\u003ctd>1d8 contundente\u003c/td>\u003cth>Deja\u003c/th>\u003ctd>\u003cspan data-tooltip=\"Resistencia al fuego y vulnerabilidad al relámpago.\">Empapado\u003c/span>\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Usa\u003c/th>\u003ctd>usa tu característica de Verbe\u003c/td>\u003cth>Sube\u003c/th>\u003ctd>más dados en los niveles 5, 11 y 17\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Verbe por uso\u003c/th>\u003ctd>0 Verbe (pide tener al menos 1)\u003c/td>\u003cth>Para aprender\u003c/th>\u003ctd>1 Trazo\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Pide\u003c/th>\u003ctd>naturaleza Agua\u003c/td>\u003cth>Puedes\u003c/th>\u003ctd>probarla\u003c/td>\u003c/tr>\n      \u003c/table>\n      \n      \n      \u003cdiv class=\"ecos-verbe-mejora\">\u003cb>Se mejora con\u003c/b>\u003cul>\u003cli>tu nivel (más dados en los niveles 5, 11 y 17)\u003c/li>\u003cli>rango en Forma (Experto +1 dado, Maestro +2, Legendario +3, Mítico +4)\u003c/li>\u003cli>los dones de rango de Forma\u003c/li>\u003cli>afinidad con Agua (Entrenada +1 dado, Maestra +2)\u003c/li>\u003cli>Cultivo: Pulida, Dominada y Propia\u003c/li>\u003cli>la dote Alcance largo\u003c/li>\u003cli>la dote Trucos afilados\u003c/li>\u003cli>la escuela El Taller de las Formas\u003c/li>\u003c/ul>\u003c/div>\u003c/div>"},"agua-gota":{"title":"Gota pesada","html":"\u003cdiv class=\"ecos-dialogo\">\u003cp class=\"texto\">Ataque: 1d10 contundente. Una gota de agua del tamaño de un puño, dura como piedra. Sube un dado en los niveles 5, 11 y 17.\u003c/p>\n      \u003ctable class=\"ecos-verbe-ficha\">\n        \u003ctr>\u003cth>Rama\u003c/th>\u003ctd>Forma · Agua\u003c/td>\u003cth>Grado\u003c/th>\u003ctd>0\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Tiempo\u003c/th>\u003ctd>Acción\u003c/td>\u003cth>Alcance\u003c/th>\u003ctd>18 m\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Área\u003c/th>\u003ctd>—\u003c/td>\u003cth>Duración\u003c/th>\u003ctd>instantánea\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Componentes\u003c/th>\u003ctd>gestos\u003c/td>\u003cth>Tirada\u003c/th>\u003ctd>Ataque\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Daño o curación\u003c/th>\u003ctd>1d10 contundente\u003c/td>\u003cth>Deja\u003c/th>\u003ctd>—\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Usa\u003c/th>\u003ctd>usa tu característica de Verbe\u003c/td>\u003cth>Sube\u003c/th>\u003ctd>más dados en los niveles 5, 11 y 17\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Verbe por uso\u003c/th>\u003ctd>0 Verbe (pide tener al menos 1)\u003c/td>\u003cth>Para aprender\u003c/th>\u003ctd>1 Trazo\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Pide\u003c/th>\u003ctd>naturaleza Agua\u003c/td>\u003cth>Puedes\u003c/th>\u003ctd>probarla\u003c/td>\u003c/tr>\n      \u003c/table>\n      \n      \n      \u003cdiv class=\"ecos-verbe-mejora\">\u003cb>Se mejora con\u003c/b>\u003cul>\u003cli>tu nivel (más dados en los niveles 5, 11 y 17)\u003c/li>\u003cli>rango en Forma (Experto +1 dado, Maestro +2, Legendario +3, Mítico +4)\u003c/li>\u003cli>los dones de rango de Forma\u003c/li>\u003cli>afinidad con Agua (Entrenada +1 dado, Maestra +2)\u003c/li>\u003cli>Cultivo: Pulida, Dominada y Propia\u003c/li>\u003cli>la dote Alcance largo\u003c/li>\u003cli>la dote Trucos afilados\u003c/li>\u003cli>la escuela El Taller de las Formas\u003c/li>\u003c/ul>\u003c/div>\u003c/div>"},"agua-mano":{"title":"Mano de agua","html":"\u003cdiv class=\"ecos-dialogo\">\u003cp class=\"texto\">Mueves o das forma a 1,5 m cúbicos de agua, la enfrías, apagas un fuego pequeño o sacas un balde de agua limpia del aire.\u003c/p>\n      \u003ctable class=\"ecos-verbe-ficha\">\n        \u003ctr>\u003cth>Rama\u003c/th>\u003ctd>Forma · Agua\u003c/td>\u003cth>Grado\u003c/th>\u003ctd>0\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Tiempo\u003c/th>\u003ctd>Acción\u003c/td>\u003cth>Alcance\u003c/th>\u003ctd>9 m\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Área\u003c/th>\u003ctd>—\u003c/td>\u003cth>Duración\u003c/th>\u003ctd>1 h\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Componentes\u003c/th>\u003ctd>gestos\u003c/td>\u003cth>Tirada\u003c/th>\u003ctd>Ninguna\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Daño o curación\u003c/th>\u003ctd>—\u003c/td>\u003cth>Deja\u003c/th>\u003ctd>—\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Usa\u003c/th>\u003ctd>usa tu característica de Verbe\u003c/td>\u003cth>Sube\u003c/th>\u003ctd>—\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Verbe por uso\u003c/th>\u003ctd>0 Verbe (pide tener al menos 1)\u003c/td>\u003cth>Para aprender\u003c/th>\u003ctd>1 Trazo\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Pide\u003c/th>\u003ctd>naturaleza Agua\u003c/td>\u003cth>Puedes\u003c/th>\u003ctd>probarla\u003c/td>\u003c/tr>\n      \u003c/table>\n      \n      \n      \u003cdiv class=\"ecos-verbe-mejora\">\u003cb>Se mejora con\u003c/b>\u003cul>\u003cli>los dones de rango de Forma\u003c/li>\u003cli>afinidad con Agua (Entrenada +1 dado, Maestra +2)\u003c/li>\u003cli>Cultivo: Pulida, Dominada y Propia\u003c/li>\u003cli>la dote Alcance largo\u003c/li>\u003cli>la escuela El Taller de las Formas\u003c/li>\u003c/ul>\u003c/div>\u003c/div>"},"agua-cortina":{"title":"Cortina de agua","html":"\u003cdiv class=\"ecos-dialogo\">\u003cp class=\"ecos-verbe-intro\">\u003cb>Es una defensa reactiva.\u003c/b> Con midi-qol se ofrece cuando un ataque va a impactarte; el aviso muestra el coste según el ataque. No la lances como una técnica normal antes del golpe. Sin esa integración, el DM resuelve la reacción, el objeto y el coste en mesa.\u003c/p>\u003cp class=\"texto\">Cuando te va a impactar un ataque o te alcanza un daño de fuego: +3 a la CA contra ese ataque y quedas Empapado (resistencia al fuego).\u003c/p>\u003cp class=\"ecos-nota\">Referencia: \u003cb>Suijinheki\u003c/b> · manga/anime · estudio, p. 12. Grado y cifras adaptados a esta campaña.\u003c/p>\n      \u003ctable class=\"ecos-verbe-ficha\">\n        \u003ctr>\u003cth>Rama\u003c/th>\u003ctd>Forma · Agua\u003c/td>\u003cth>Grado\u003c/th>\u003ctd>1\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Tiempo\u003c/th>\u003ctd>Reacción\u003c/td>\u003cth>Alcance\u003c/th>\u003ctd>sobre ti\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Área\u003c/th>\u003ctd>—\u003c/td>\u003cth>Duración\u003c/th>\u003ctd>1 asalto\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Componentes\u003c/th>\u003ctd>gestos\u003c/td>\u003cth>Tirada\u003c/th>\u003ctd>Ninguna\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Daño o curación\u003c/th>\u003ctd>—\u003c/td>\u003cth>Deja\u003c/th>\u003ctd>—\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Usa\u003c/th>\u003ctd>usa tu característica de Verbe\u003c/td>\u003cth>Sube\u003c/th>\u003ctd>—\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Verbe por uso\u003c/th>\u003ctd>grado 1: 2 Verbe · grado 2: 3 Verbe\u003c/td>\u003cth>Para aprender\u003c/th>\u003ctd>1 Trazo\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Pide\u003c/th>\u003ctd>nivel 1 · naturaleza Agua\u003c/td>\u003cth>Puedes\u003c/th>\u003ctd>probarla\u003c/td>\u003c/tr>\n      \u003c/table>\n      \n      \n      \u003cdiv class=\"ecos-verbe-mejora\">\u003cb>Se mejora con\u003c/b>\u003cul>\u003cli>los dones de rango de Forma\u003c/li>\u003cli>afinidad con Agua (Entrenada +1 dado, Maestra +2)\u003c/li>\u003cli>Cultivo: Pulida, Dominada y Propia\u003c/li>\u003cli>la escuela El Taller de las Formas\u003c/li>\u003c/ul>\u003c/div>\u003c/div>"},"agua-latigo":{"title":"Látigo de agua","html":"\u003cdiv class=\"ecos-dialogo\">\u003cp class=\"texto\">Ataque: 2d8 contundente. Un látigo de agua que golpea y tira: si impacta, acercas al blanco 3 m. Sube: +1d8.\u003c/p>\n      \u003ctable class=\"ecos-verbe-ficha\">\n        \u003ctr>\u003cth>Rama\u003c/th>\u003ctd>Forma · Agua\u003c/td>\u003cth>Grado\u003c/th>\u003ctd>1\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Tiempo\u003c/th>\u003ctd>Acción\u003c/td>\u003cth>Alcance\u003c/th>\u003ctd>9 m\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Área\u003c/th>\u003ctd>—\u003c/td>\u003cth>Duración\u003c/th>\u003ctd>instantánea\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Componentes\u003c/th>\u003ctd>gestos\u003c/td>\u003cth>Tirada\u003c/th>\u003ctd>Ataque\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Daño o curación\u003c/th>\u003ctd>2d8 contundente\u003c/td>\u003cth>Deja\u003c/th>\u003ctd>\u003cspan data-tooltip=\"Resistencia al fuego y vulnerabilidad al relámpago.\">Empapado\u003c/span>\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Usa\u003c/th>\u003ctd>usa tu característica de Verbe\u003c/td>\u003cth>Sube\u003c/th>\u003ctd>+1d8 por cada grado de más\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Verbe por uso\u003c/th>\u003ctd>grado 1: 2 Verbe · grado 2: 3 Verbe\u003c/td>\u003cth>Para aprender\u003c/th>\u003ctd>1 Trazo\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Pide\u003c/th>\u003ctd>nivel 1 · naturaleza Agua\u003c/td>\u003cth>Puedes\u003c/th>\u003ctd>probarla\u003c/td>\u003c/tr>\n      \u003c/table>\n      \n      \n      \u003cdiv class=\"ecos-verbe-mejora\">\u003cb>Se mejora con\u003c/b>\u003cul>\u003cli>usarla a más grado (+1d8 por grado)\u003c/li>\u003cli>rango en Forma (Experto +1 dado, Maestro +2, Legendario +3, Mítico +4)\u003c/li>\u003cli>los dones de rango de Forma\u003c/li>\u003cli>afinidad con Agua (Entrenada +1 dado, Maestra +2)\u003c/li>\u003cli>Cultivo: Pulida, Dominada y Propia\u003c/li>\u003cli>la dote Alcance largo\u003c/li>\u003cli>la escuela El Taller de las Formas\u003c/li>\u003c/ul>\u003c/div>\u003c/div>"},"agua-ola":{"title":"Ola","html":"\u003cdiv class=\"ecos-dialogo\">\u003cp class=\"texto\">FUE, mitad: 2d8 contundente. Si falla, sale empujada 3 m y queda Empapada. Apaga los fuegos abiertos. Sube: +1d8.\u003c/p>\n      \u003ctable class=\"ecos-verbe-ficha\">\n        \u003ctr>\u003cth>Rama\u003c/th>\u003ctd>Forma · Agua\u003c/td>\u003cth>Grado\u003c/th>\u003ctd>1\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Tiempo\u003c/th>\u003ctd>Acción\u003c/td>\u003cth>Alcance\u003c/th>\u003ctd>sobre ti\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Área\u003c/th>\u003ctd>cubo 4,5 m\u003c/td>\u003cth>Duración\u003c/th>\u003ctd>instantánea\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Componentes\u003c/th>\u003ctd>gestos y voz\u003c/td>\u003cth>Tirada\u003c/th>\u003ctd>Salvación de FUE, mitad si la supera\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Daño o curación\u003c/th>\u003ctd>2d8 contundente\u003c/td>\u003cth>Deja\u003c/th>\u003ctd>\u003cspan data-tooltip=\"Resistencia al fuego y vulnerabilidad al relámpago.\">Empapado\u003c/span>\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Usa\u003c/th>\u003ctd>usa tu característica de Verbe\u003c/td>\u003cth>Sube\u003c/th>\u003ctd>+1d8 por cada grado de más\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Verbe por uso\u003c/th>\u003ctd>grado 1: 2 Verbe · grado 2: 3 Verbe\u003c/td>\u003cth>Para aprender\u003c/th>\u003ctd>1 Trazo\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Pide\u003c/th>\u003ctd>nivel 1 · naturaleza Agua\u003c/td>\u003cth>Puedes\u003c/th>\u003ctd>probarla\u003c/td>\u003c/tr>\n      \u003c/table>\u003cp class=\"ecos-nota\">CD con tu Verbe: 13.\u003c/p>\n      \n      \u003cdiv class=\"ecos-verbe-crece\">\u003cb>Crece\u003c/b>\u003cul>\u003cli>Escalera: Ola (1) → Marea (3) → Diluvio (5) → Mar en tierra (7) → Ola que traga el valle (10).\u003c/li>\u003c/ul>\u003c/div>\n      \u003cdiv class=\"ecos-verbe-mejora\">\u003cb>Se mejora con\u003c/b>\u003cul>\u003cli>usarla a más grado (+1d8 por grado)\u003c/li>\u003cli>rango en Forma (Experto +1 dado, Maestro +2, Legendario +3, Mítico +4)\u003c/li>\u003cli>los dones de rango de Forma\u003c/li>\u003cli>afinidad con Agua (Entrenada +1 dado, Maestra +2)\u003c/li>\u003cli>Cultivo: Pulida, Dominada y Propia\u003c/li>\u003cli>la dote Área ancha\u003c/li>\u003cli>la escuela El Taller de las Formas\u003c/li>\u003c/ul>\u003c/div>\u003c/div>"},"agua-espejo":{"title":"Espejo de agua","html":"\u003cdiv class=\"ecos-dialogo\">\u003cp class=\"texto\">Una pared de agua lisa de 3 × 3 m: da cobertura total, quien la cruza queda Empapado y el daño de fuego que la atraviesa baja a la mitad. Sube: 3 m más de pared.\u003c/p>\n      \u003ctable class=\"ecos-verbe-ficha\">\n        \u003ctr>\u003cth>Rama\u003c/th>\u003ctd>Forma · Agua\u003c/td>\u003cth>Grado\u003c/th>\u003ctd>2\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Tiempo\u003c/th>\u003ctd>Acción\u003c/td>\u003cth>Alcance\u003c/th>\u003ctd>9 m\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Área\u003c/th>\u003ctd>—\u003c/td>\u003cth>Duración\u003c/th>\u003ctd>1 min\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Componentes\u003c/th>\u003ctd>gestos y voz\u003c/td>\u003cth>Tirada\u003c/th>\u003ctd>Ninguna\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Daño o curación\u003c/th>\u003ctd>—\u003c/td>\u003cth>Deja\u003c/th>\u003ctd>—\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Usa\u003c/th>\u003ctd>usa tu característica de Verbe\u003c/td>\u003cth>Sube\u003c/th>\u003ctd>3 m más de pared por cada grado de más\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Verbe por uso\u003c/th>\u003ctd>grado 2: 3 Verbe\u003c/td>\u003cth>Para aprender\u003c/th>\u003ctd>2 Trazos\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Pide\u003c/th>\u003ctd>nivel 3 · Entrenado en Forma · naturaleza Agua\u003c/td>\u003cth>Puedes\u003c/th>\u003ctd>probarla\u003c/td>\u003c/tr>\n      \u003c/table>\n      \n      \n      \u003cdiv class=\"ecos-verbe-mejora\">\u003cb>Se mejora con\u003c/b>\u003cul>\u003cli>usarla a más grado (3 m más de pared por grado)\u003c/li>\u003cli>los dones de rango de Forma\u003c/li>\u003cli>afinidad con Agua (Entrenada +1 dado, Maestra +2)\u003c/li>\u003cli>Cultivo: Pulida, Dominada y Propia\u003c/li>\u003cli>la dote Alcance largo\u003c/li>\u003cli>la escuela El Taller de las Formas\u003c/li>\u003c/ul>\u003c/div>\u003c/div>"},"agua-niebla":{"title":"Niebla oculta","html":"\u003cdiv class=\"ecos-dialogo\">\u003cp class=\"texto\">Niebla espesa: la zona queda muy oscura. Tú sabes dónde está cada criatura dentro, por su Verbe. Sube: +3 m de radio.\u003c/p>\u003cp class=\"ecos-nota\">Referencia: \u003cb>Kirigakure no Jutsu\u003c/b> · manga/anime · estudio, p. 12. Grado y cifras adaptados a esta campaña.\u003c/p>\n      \u003ctable class=\"ecos-verbe-ficha\">\n        \u003ctr>\u003cth>Rama\u003c/th>\u003ctd>Forma · Agua\u003c/td>\u003cth>Grado\u003c/th>\u003ctd>2\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Tiempo\u003c/th>\u003ctd>Acción\u003c/td>\u003cth>Alcance\u003c/th>\u003ctd>sobre ti\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Área\u003c/th>\u003ctd>esfera 6 m\u003c/td>\u003cth>Duración\u003c/th>\u003ctd>Concentración, 10 min\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Componentes\u003c/th>\u003ctd>gestos y voz\u003c/td>\u003cth>Tirada\u003c/th>\u003ctd>Ninguna\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Daño o curación\u003c/th>\u003ctd>—\u003c/td>\u003cth>Deja\u003c/th>\u003ctd>—\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Usa\u003c/th>\u003ctd>usa tu característica de Verbe\u003c/td>\u003cth>Sube\u003c/th>\u003ctd>+3 m de radio por cada grado de más\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Verbe por uso\u003c/th>\u003ctd>grado 2: 3 Verbe\u003c/td>\u003cth>Para aprender\u003c/th>\u003ctd>2 Trazos\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Pide\u003c/th>\u003ctd>nivel 3 · Entrenado en Forma · naturaleza Agua\u003c/td>\u003cth>Puedes\u003c/th>\u003ctd>probarla\u003c/td>\u003c/tr>\n      \u003c/table>\n      \n      \n      \u003cdiv class=\"ecos-verbe-mejora\">\u003cb>Se mejora con\u003c/b>\u003cul>\u003cli>usarla a más grado (+3 m de radio por grado)\u003c/li>\u003cli>los dones de rango de Forma\u003c/li>\u003cli>afinidad con Agua (Entrenada +1 dado, Maestra +2)\u003c/li>\u003cli>Cultivo: Pulida, Dominada y Propia\u003c/li>\u003cli>la dote Área ancha\u003c/li>\u003cli>la escuela El Taller de las Formas\u003c/li>\u003c/ul>\u003c/div>\u003c/div>"},"agua-prision":{"title":"Prisión de agua","html":"\u003cdiv class=\"ecos-dialogo\">\u003cp class=\"texto\">FUE. Una criatura Grande o menor queda Apresada dentro de una esfera de agua, Empapada, sin respirar ni hablar. Repite la salvación al final de cada turno. Mientras la sostienes tu velocidad es 0 y tienes una mano dentro. Sube: una criatura más, con la otra mano.\u003c/p>\u003cp class=\"ecos-nota\">Referencia: \u003cb>Suirō no Jutsu\u003c/b> · manga/anime · estudio, p. 12. Grado y cifras adaptados a esta campaña.\u003c/p>\n      \u003ctable class=\"ecos-verbe-ficha\">\n        \u003ctr>\u003cth>Rama\u003c/th>\u003ctd>Forma · Agua\u003c/td>\u003cth>Grado\u003c/th>\u003ctd>2\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Tiempo\u003c/th>\u003ctd>Acción\u003c/td>\u003cth>Alcance\u003c/th>\u003ctd>1,5 m\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Área\u003c/th>\u003ctd>—\u003c/td>\u003cth>Duración\u003c/th>\u003ctd>Concentración, 1 min\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Componentes\u003c/th>\u003ctd>gestos y voz\u003c/td>\u003cth>Tirada\u003c/th>\u003ctd>Salvación de FUE\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Daño o curación\u003c/th>\u003ctd>—\u003c/td>\u003cth>Deja\u003c/th>\u003ctd>Apresado, \u003cspan data-tooltip=\"Resistencia al fuego y vulnerabilidad al relámpago.\">Empapado\u003c/span>\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Usa\u003c/th>\u003ctd>usa tu característica de Verbe\u003c/td>\u003cth>Sube\u003c/th>\u003ctd>una criatura más, con la otra mano por cada grado de más\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Verbe por uso\u003c/th>\u003ctd>grado 2: 3 Verbe\u003c/td>\u003cth>Para aprender\u003c/th>\u003ctd>2 Trazos\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Pide\u003c/th>\u003ctd>nivel 3 · Entrenado en Forma · natura imo ataque; si lo empujan, va el doble de lejos.\">Desequilibrado\u003c/span>\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Usa\u003c/th>\u003ctd>usa tu característica de Verbe\u003c/td>\u003cth>Sube\u003c/th>\u003ctd>+1d6 por cada grado de más\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Verbe por uso\u003c/th>\u003ctd>grado 2: 3 Verbe\u003c/td>\u003cth>Para aprender\u003c/th>\u003ctd>2 Trazos\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Pide\u003c/th>\u003ctd>nivel 3 · Entrenado en Forma · naturaleza Viento\u003c/td>\u003cth>Puedes\u003c/th>\u003ctd>probarla\u003c/td>\u003c/tr>\n      \u003c/table>\u003cp class=\"ecos-nota\">CD con tu Verbe: 13.\u003c/p>\n      \n      \u003cdiv class=\"ecos-verbe-crece\">\u003cb>Crece\u003c/b>\u003cul>\u003cli>Escalera: Tajo largo (2) → Filo creciente (6).\u003c/li>\u003c/ul>\u003c/div>\n      \u003cdiv class=\"ecos-verbe-mejora\">\u003cb>Se mejora con\u003c/b>\u003cul>\u003cli>usarla a más grado (+1d6 por grado)\u003c/li>\u003cli>rango en Forma (Experto +1 dado, Maestro +2, Legendario +3, Mítico +4)\u003c/li>\u003cli>los dones de rango de Forma\u003c/li>\u003cli>afinidad con Viento (Entrenada +1 dado, Maestra +2)\u003c/li>\u003cli>Cultivo: Pulida, Dominada y Propia\u003c/li>\u003cli>la dote Área ancha\u003c/li>\u003cli>la escuela El Taller de las Formas\u003c/li>\u003c/ul>\u003c/div>\u003c/div>"},"tierra-barro":{"title":"Barro y piedra","html":"\u003cdiv class=\"ecos-dialogo\">\u003cp class=\"texto\">Mueves la tierra suelta de un cubo de 1,5 m: cavas, haces un relieve o lo vuelves terreno difícil.\u003c/p>\n      \u003ctable class=\"ecos-verbe-ficha\">\n        \u003ctr>\u003cth>Rama\u003c/th>\u003ctd>Forma · Tierra\u003c/td>\u003cth>Grado\u003c/th>\u003ctd>0\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Tiempo\u003c/th>\u003ctd>Acción\u003c/td>\u003cth>Alcance\u003c/th>\u003ctd>9 m\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Área\u003c/th>\u003ctd>—\u003c/td>\u003cth>Duración\u003c/th>\u003ctd>1 h\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Componentes\u003c/th>\u003ctd>gestos\u003c/td>\u003cth>Tirada\u003c/th>\u003ctd>Ninguna\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Daño o curación\u003c/th>\u003ctd>—\u003c/td>\u003cth>Deja\u003c/th>\u003ctd>—\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Usa\u003c/th>\u003ctd>usa tu característica de Verbe\u003c/td>\u003cth>Sube\u003c/th>\u003ctd>—\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Verbe por uso\u003c/th>\u003ctd>0 Verbe (pide tener al menos 1)\u003c/td>\u003cth>Para aprender\u003c/th>\u003ctd>1 Trazo\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Pide\u003c/th>\u003ctd>naturaleza Tierra\u003c/td>\u003cth>Puedes\u003c/th>\u003ctd>probarla\u003c/td>\u003c/tr>\n      \u003c/table>\n      \n      \n      \u003cdiv class=\"ecos-verbe-mejora\">\u003cb>Se mejora con\u003c/b>\u003cul>\u003cli>los dones de rango de Forma\u003c/li>\u003cli>afinidad con Tierra (Entrenada +1 dado, Maestra +2)\u003c/li>\u003cli>Cultivo: Pulida, Dominada y Propia\u003c/li>\u003cli>la dote Alcance largo\u003c/li>\u003cli>la escuela El Taller de las Formas\u003c/li>\u003c/ul>\u003c/div>\u003c/div>"},"tierra-guijarro":{"title":"Guijarro","html":"\u003cdiv class=\"ecos-dialogo\">\u003cp class=\"texto\">Ataque: 1d8 contundente. Si impacta, su velocidad baja 3 m hasta tu próximo turno. Sube un dado en los niveles 5, 11 y 17.\u003c/p>\n      \u003ctable class=\"ecos-verbe-ficha\">\n        \u003ctr>\u003cth>Rama\u003c/th>\u003ctd>Forma · Tierra\u003c/td>\u003cth>Grado\u003c/th>\u003ctd>0\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Tiempo\u003c/th>\u003ctd>Acción\u003c/td>\u003cth>Alcance\u003c/th>\u003ctd>18 m\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Área\u003c/th>\u003ctd>—\u003c/td>\u003cth>Duración\u003c/th>\u003ctd>instantánea\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Componentes\u003c/th>\u003ctd>gestos y voz\u003c/td>\u003cth>Tirada\u003c/th>\u003ctd>Ataque\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Daño o curación\u003c/th>\u003ctd>1d8 contundente\u003c/td>\u003cth>Deja\u003c/th>\u003ctd>—\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Usa\u003c/th>\u003ctd>usa tu característica de Verbe\u003c/td>\u003cth>Sube\u003c/th>\u003ctd>más dados en los niveles 5, 11 y 17\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Verbe por uso\u003c/th>\u003ctd>0 Verbe (pide tener al menos 1)\u003c/td>\u003cth>Para aprender\u003c/th>\u003ctd>1 Trazo\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Pide\u003c/th>\u003ctd>naturaleza Tierra\u003c/td>\u003cth>Puedes\u003c/th>\u003ctd>probarla\u003c/td>\u003c/tr>\n      \u003c/table>\n      \n      \u003cdiv class=\"ecos-verbe-crece\">\u003cb>Crece\u003c/b>\u003cul>\u003cli>Escalera: Guijarro (0) → Púas de tierra (2) → Erupción (3) → Montaña que cae (8) → Cordillera (10).\u003c/li>\u003c/ul>\u003c/div>\n      \u003cdiv class=\"ecos-verbe-mejora\">\u003cb>Se mejora con\u003c/b>\u003cul>\u003cli>tu nivel (más dados en los niveles 5, 11 y 17)\u003c/li>\u003cli>rango en Forma (Experto +1 dado, Maestro +2, Legendario +3, Mítico +4)\u003c/li>\u003cli>los dones de rango de Forma\u003c/li>\u003cli>afinidad con Tierra (Entrenada +1 dado, Maestra +2)\u003c/li>\u003cli>Cultivo: Pulida, Dominada y Propia\u003c/li>\u003cli>la dote Alcance largo\u003c/li>\u003cli>la dote Trucos afilados\u003c/li>\u003cli>la escuela El Taller de las Formas\u003c/li>\u003c/ul>\u003c/div>\u003c/div>"},"tierra-puno":{"title":"Puño de piedra","html":"\u003cdiv class=\"ecos-dialogo\">\u003cp class=\"texto\">1d6 contundente. Tu mano se cubre de roca: tu próximo golpe este turno suma el daño. Sube un dado en los niveles 5, 11 y 17.\u003c/p>\n      \u003ctable class=\"ecos-verbe-ficha\">\n        \u003ctr>\u003cth>Rama\u003c/th>\u003ctd>Forma · Tierra\u003c/td>\u003cth>Grado\u003c/th>\u003ctd>0\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Tiempo\u003c/th>\u003ctd>Acción adicional\u003c/td>\u003cth>Alcance\u003c/th>\u003ctd>sobre ti\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Área\u003c/th>\u003ctd>—\u003c/td>\u003cth>Duración\u003c/th>\u003ctd>1 asalto\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Componentes\u003c/th>\u003ctd>sin gestos ni voz\u003c/td>\u003cth>Tirada\u003c/th>\u003ctd>Ninguna\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Daño o curación\u003c/th>\u003ctd>1d6 contundente\u003c/td>\u003cth>Deja\u003c/th>\u003ctd>—\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Usa\u003c/th>\u003ctd>usa tu característica de Verbe\u003c/td>\u003cth>Sube\u003c/th>\u003ctd>más dados en los niveles 5, 11 y 17\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Verbe por uso\u003c/th>\u003ctd>0 Verbe (pide tener al menos 1)\u003c/td>\u003cth>Para aprender\u003c/th>\u003ctd>1 Trazo\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Pide\u003c/th>\u003ctd>naturaleza Tierra\u003c/td>\u003cth>Puedes\u003c/th>\u003ctd>probarla\u003c/td>\u003c/tr>\n      \u003c/table>\n      \n      \n      \u003cdiv class=\"ecos-verbe-mejora\">\u003cb>Se mejora con\u003c/b>\u003cul>\u003cli>tu nivel (más dados en los niveles 5, 11 y 17)\u003c/li>\u003cli>rango en Forma (Experto +1 dado, Maestro +2, Legendario +3, Mítico +4)\u003c/li>\u003cli>los dones de rango de Forma\u003c/li>\u003cli>afinidad con Tierra (Entrenada +1 dado, Maestra +2)\u003c/li>\u003cli>Cultivo: Pulida, Dominada y Propia\u003c/li>\u003cli>la dote Trucos afilados\u003c/li>\u003cli>la escuela El Taller de las Formas\u003c/li>\u003c/ul>\u003c/div>\u003c/div>"},"tierra-escudo":{"title":"Escudo de piedra","html":"\u003cdiv class=\"ecos-dialogo\">\u003cp class=\"ecos-verbe-intro\">\u003cb>Es una defensa reactiva.\u003c/b> Con midi-qol se ofrece cuando un ataque va a impactarte; el aviso muestra el coste según el ataque. No la lances como una técnica normal antes del golpe. Sin esa integración, el DM resuelve la reacción, el objeto y el coste en mesa.\u003c/p>\u003cp class=\"texto\">Cuando te va a impactar un ataque: +5 a la CA hasta el inicio de tu turno, pero tu velocidad es 0 hasta entonces.\u003c/p>\n      \u003ctable class=\"ecos-verbe-ficha\">\n        \u003ctr>\u003cth>Rama\u003c/th>\u003ctd>Forma · Tierra\u003c/td>\u003cth>Grado\u003c/th>\u003ctd>1\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Tiempo\u003c/th>\u003ctd>Reacción\u003c/td>\u003cth>Alcance\u003c/th>\u003ctd>sobre ti\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Área\u003c/th>\u003ctd>—\u003c/td>\u003cth>Duración\u003c/th>\u003ctd>1 asalto\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Componentes\u003c/th>\u003ctd>gestos\u003c/td>\u003cth>Tirada\u003c/th>\u003ctd>Ninguna\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Daño o curación\u003c/th>\u003ctd>—\u003c/td>\u003cth>Deja\u003c/th>\u003ctd>—\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Usa\u003c/th>\u003ctd>usa tu característica de Verbe\u003c/td>\u003cth>Sube\u003c/th>\u003ctd>—\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Verbe por uso\u003c/th>\u003ctd>grado 1: 2 Verbe · grado 2: 3 Verbe\u003c/td>\u003cth>Para aprender\u003c/th>\u003ctd>1 Trazo\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Pide\u003c/th>\u003ctd>nivel 1 · naturaleza Tierra\u003c/td>\u003cth>Puedes\u003c/th>\u003ctd>probarla\u003c/td>\u003c/tr>\n      \u003c/table>\n      \n      \n      \u003cdiv class=\"ecos-verbe-mejora\">\u003cb>Se mejora con\u003c/b>\u003cul>\u003cli>los dones de rango de Forma\u003c/li>\u003cli>afinidad con Tierra (Entrenada +1 dado, Maestra +2)\u003c/li>\u003cli>Cultivo: Pulida, Dominada y Propia\u003c/li>\u003cli>la escuela El Taller de las Formas\u003c/li>\u003c/ul>\u003c/div>\u003c/div>"},"tierra-parapeto":{"title":"Parapeto","html":"\u003cdiv class=\"ecos-dialogo\">\u003cp class=\"texto\">Levantas un muro bajo de 3 m de largo y 1 m de alto: media cobertura a quien se agacha detrás. CA 15, 20 PG. Sube: 3 m más de muro.\u003c/p>\n      \u003ctable class=\"ecos-verbe-ficha\">\n        \u003ctr>\u003cth>Rama\u003c/th>\u003ctd>Forma · Tierra\u003c/td>\u003cth>Grado\u003c/th>\u003ctd>1\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Tiempo\u003c/th>\u003ctd>Acción\u003c/td>\u003cth>Alcance\u003c/th>\u003ctd>9 m\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Área\u003c/th>\u003ctd>—\u003c/td>\u003cth>Duración\u003c/th>\u003ctd>1 h\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Componentes\u003c/th>\u003ctd>gestos\u003c/td>\u003cth>Tirada\u003c/th>\u003ctd>Ninguna\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Daño o curación\u003c/th>\u003ctd>—\u003c/td>\u003cth>Deja\u003c/th>\u003ctd>—\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Usa\u003c/th>\u003ctd>usa tu característica de Verbe\u003c/td>\u003cth>Sube\u003c/th>\u003ctd>3 m más de muro por cada grado de más\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Verbe por uso\u003c/th>\u003ctd>grado 1: 2 Verbe · grado 2: 3 Verbe\u003c/td>\u003cth>Para aprender\u003c/th>\u003ctd>1 Trazo\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Pide\u003c/th>\u003ctd>nivel 1 · naturaleza Tierra\u003c/td>\u003cth>Puedes\u003c/th>\u003ctd>probarla\u003c/td>\u003c/tr>\n      \u003c/table>\n      \n      \n      \u003cdiv class=\"ecos-verbe-mejora\">\u003cb>Se mejora con\u003c/b>\u003cul>\u003cli>usarla a más grado (3 m más de muro por grado)\u003c/li>\u003cli>los dones de rango de Forma\u003c/li>\u003cli>afinidad con Tierra (Entrenada +1 dado, Maestra +2)\u003c/li>\u003cli>Cultivo: Pulida, Dominada y Propia\u003c/li>\u003cli>la dote Alcance largo\u003c/li>\u003cli>la escuela El Taller de las Formas\u003c/li>\u003c/ul>\u003c/div>\u003c/div>"},"tierra-pozo":{"title":"Pozo","html":"\u003cdiv class=\"ecos-dialogo\">\u003cp class=\"texto\">DES. Se abre un pozo de 3 m bajo una criatura Grande o menor. Si falla, cae al fondo (1d6 contundente) y queda Derribada; salir le cuesta 3 m de trepar. Sube: una criatura más.\u003c/p>\n      \u003ctable class=\"ecos-verbe-ficha\">\n        \u003ctr>\u003cth>Rama\u003c/th>\u003ctd>Forma · Tierra\u003c/td>\u003cth>Grado\u003c/th>\u003ctd>1\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Tiempo\u003c/th>\u003ctd>Acción\u003c/td>\u003cth>Alcance\u003c/th>\u003ctd>18 m\u003c/td>\u003c/ a\u003c/li>\u003cli>la escuela El Taller de las Formas\u003c/li>\u003c/ul>\u003c/div>\u003c/div>"},"rayo-red":{"title":"Red eléctrica","html":"\u003cdiv class=\"ecos-dialogo\">\u003cp class=\"texto\">DES, si falla: 2d6 relámpago. Una red de rayos cae sobre la zona: si falla, queda Apresado y recibe el daño al inicio de cada turno que siga atrapado. Sube: +1d6.\u003c/p>\n      \u003ctable class=\"ecos-verbe-ficha\">\n        \u003ctr>\u003cth>Rama\u003c/th>\u003ctd>Forma · Rayo\u003c/td>\u003cth>Grado\u003c/th>\u003ctd>2\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Tiempo\u003c/th>\u003ctd>Acción\u003c/td>\u003cth>Alcance\u003c/th>\u003ctd>18 m\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Área\u003c/th>\u003ctd>cubo 3 m\u003c/td>\u003cth>Duración\u003c/th>\u003ctd>Concentración, 1 min\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Componentes\u003c/th>\u003ctd>gestos\u003c/td>\u003cth>Tirada\u003c/th>\u003ctd>Salvación de DES, nada si la supera\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Daño o curación\u003c/th>\u003ctd>2d6 relámpago\u003c/td>\u003cth>Deja\u003c/th>\u003ctd>\u003cspan data-tooltip=\"No usa reacciones; si lleva metal, el próximo ataque con arma de metal contra él tiene ventaja.\">Cargado\u003c/span>, Apresado\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Usa\u003c/th>\u003ctd>usa tu característica de Verbe\u003c/td>\u003cth>Sube\u003c/th>\u003ctd>+1d6 por cada grado de más\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Verbe por uso\u003c/th>\u003ctd>grado 2: 3 Verbe\u003c/td>\u003cth>Para aprender\u003c/th>\u003ctd>2 Trazos\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Pide\u003c/th>\u003ctd>nivel 3 · Entrenado en Forma · naturaleza Rayo\u003c/td>\u003cth>Puedes\u003c/th>\u003ctd>probarla\u003c/td>\u003c/tr>\n      \u003c/table>\u003cp class=\"ecos-nota\">CD con tu Verbe: 13.\u003c/p>\n      \n      \n      \u003cdiv class=\"ecos-verbe-mejora\">\u003cb>Se mejora con\u003c/b>\u003cul>\u003cli>usarla a más grado (+1d6 por grado)\u003c/li>\u00
