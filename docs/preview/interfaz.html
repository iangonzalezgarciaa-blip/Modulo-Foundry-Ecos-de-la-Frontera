n día: ventaja en Supervivencia, y no la pierdes en el agua ni en la roca.\u003c/small>\u003c/span>\n      \u003cspan class=\"vb\">\u003cb>2 Verbe\u003c/b>\u003csmall>por uso base\u003c/small>\u003c/span>\u003cspan class=\"acc\">\u003cbutton type=\"button\" data-action=\"aprender\" data-id=\"rastro-seguir\">Aprender · 1 Trazo\u003c/button>\u003csmall>Te quedarían 15 Trazos\u003c/small>\u003c/span>\u003c/summary>\u003cdiv class=\"ecos-verbe-ficha-cont\">\u003c/div>\u003c/details>\u003cdetails class=\"ecos-verbe-tec puede\" data-id=\"rastro-ocultar-firma\" data-tipo=\"tec\">\u003csummary>\n      \u003cspan class=\"gr\">Grado 1\u003c/span>\u003cspan class=\"nom\">\u003cb>Silencio de la firma\u003c/b>\u003csmall>Supresión\u003c/small>\u003csmall>Acción adicional · sobre ti\u003c/small>\u003csmall class=\"ev-efecto-breve\">Reducir tu firma obliga a un sensor a superar tu CD con Percepción o Control para localizarte por energía. Límites: No vuelve invisible al cuerpo ni esconde ruido, olor o huellas. Usar una técnica de grado 1 o más rompe la supresión.\u003c/small>\u003c/span>\n      \u003cspan class=\"vb\">\u003cb>2 Verbe\u003c/b>\u003csmall>por uso base\u003c/small>\u003c/span>\u003cspan class=\"acc\">\u003cbutton type=\"button\" data-action=\"aprender\" data-id=\"rastro-ocultar-firma\">Aprender · 1 Trazo\u003c/button>\u003csmall>Te quedarían 15 Trazos\u003c/small>\u003c/span>\u003c/summary>\u003cdiv class=\"ecos-verbe-ficha-cont\">\u003c/div>\u003c/details>\u003c/details>\u003cdetails class=\"ecos-verbe-grupo\" data-g=\"s-umbral\" open>\u003csummary>\u003cb>Umbral\u003c/b> \u003cspan>1 técnica · puedes aprender 1\u003c/span>\u003c/summary>\n        \u003cdetails class=\"ecos-verbe-tec puede\" data-id=\"umbral-formula\" data-tipo=\"tec\">\u003csummary>\n      \u003cspan class=\"gr\">Grado 0\u003c/span>\u003cspan class=\"nom\">\u003cb>Fórmula del punto de regreso\u003c/b>\u003csmall>Hiraishin: preparación\u003c/small>\u003csmall>1 minuto · 1.5 m\u003c/small>\u003csmall class=\"ev-efecto-breve\">Preparas una marca personal al tocar una superficie u objeto. El DM registra hasta tu competencia en marcas activas, con nombre, lugar y fecha. Límites: La marca no transporta ni espía por sí sola. No se duplica con copias del objeto y solo funciona para quien la preparó.\u003c/small>\u003c/span>\n      \u003cspan class=\"vb\">\u003cb>0 Verbe\u003c/b>\u003csmall>por uso base\u003c/small>\u003c/span>\u003cspan class=\"acc\">\u003cbutton type=\"button\" data-action=\"aprender\" data-id=\"umbral-formula\">Aprender · 1 Trazo\u003c/button>\u003csmall>Te quedarían 15 Trazos\u003c/small>\u003c/span>\u003c/summary>\u003cdiv class=\"ecos-verbe-ficha-cont\">\u003c/div>\u003c/details>\u003c/details>\u003cdetails class=\"ecos-verbe-grupo\" data-g=\"s-familia\" open>\u003csummary>\u003cb>Artes de familia\u003c/b> \u003cspan>5 técnicas · puedes aprender 5\u003c/span>\u003c/summary>\n        \u003cdetails class=\"ecos-verbe-tec puede\" data-id=\"familia-tinta-dibujo\" data-tipo=\"tec\">\u003csummary>\n      \u003cspan class=\"gr\">Grado 1\u003c/span>\u003cspan class=\"nom\">\u003cb>Dibujo que vive\u003c/b>\u003csmall>Chōjū Giga\u003c/small>\u003csmall>Acción · 9 m\u003c/small>\u003csmall class=\"ev-efecto-breve\">Dibujas con tinta de Verbe una criatura que sale del papel, con la ficha del linaje a este grado y el movimiento y el daño que le dibujas. Se deshace en tinta con agua o a 0 PG. Sube: la ficha sube con el grado.\u003c/small>\u003c/span>\n      \u003cspan class=\"vb\">\u003cb>2 Verbe\u003c/b>\u003csmall>por uso base\u003c/small>\u003c/span>\u003cspan class=\"acc\">\u003cbutton type=\"button\" data-action=\"aprender\" data-id=\"familia-tinta-dibujo\">Pedir al DM · 2 Trazos\u003c/button>\u003csmall>Te quedarían 14 Trazos\u003c/small>\u003c/span>\u003c/summary>\u003cdiv class=\"ecos-verbe-ficha-cont\">\u003c/div>\u003c/details>\u003cdetails class=\"ecos-verbe-tec puede\" data-id=\"familia-mano-gigante\" data-tipo=\"tec\">\u003csummary>\n      \u003cspan class=\"gr\">Grado 1\u003c/span>\u003cspan class=\"nom\">\u003cb>Mano gigante\u003c/b>\u003csmall>\u003c/small>\u003csmall>Acción adicional · sobre ti\u003c/small>\u003csmall class=\"ev-efecto-breve\">1d8 contundente. Tu brazo crece: tu alcance sube 3 m este turno y tu próximo golpe suma el daño.\u003c/small>\u003c/span>\n      \u003cspan class=\"vb\">\u003cb>2 Verbe\u003c/b>\u003csmall>por uso base\u003c/small>\u003c/span>\u003cspan class=\"acc\">\u003cbutton type=\"button\" data-action=\"aprender\" data-id=\"familia-mano-gigante\">Pedir al DM · 2 Trazos\u003c/button>\u003csmall>Te quedarían 14 Trazos\u003c/small>\u003c/span>\u003c/summary>\u003cdiv class=\"ecos-verbe-ficha-cont\">\u003c/div>\u003c/details>\u003cdetails class=\"ecos-verbe-tec puede\" data-id=\"familia-sombra-ata\" data-tipo=\"tec\">\u003csummary>\n      \u003cspan class=\"gr\">Grado 1\u003c/span>\u003cspan class=\"nom\">\u003cb>Sombra que ata\u003c/b>\u003csmall>\u003c/small>\u003csmall>Acción · 9 m\u003c/small>\u003csmall class=\"ev-efecto-breve\">FUE. Tu sombra se alarga por el suelo hasta una criatura: si falla, queda Apresada y copia tus movimientos, y tu velocidad también es 0. Pide luz que haga sombra. Repite al final de cada turno. Sube: una criatura más y 3 m más.\u003c/small>\u003c/span>\n      \u003cspan class=\"vb\">\u003cb>2 Verbe\u003c/b>\u003csmall>por uso base\u003c/small>\u003c/span>\u003cspan class=\"acc\">\u003cbutton type=\"button\" data-action=\"aprender\" data-id=\"familia-sombra-ata\">Pedir al DM · 2 Trazos\u003c/button>\u003csmall>Te quedarían 14 Trazos\u003c/small>\u003c/span>\u003c/summary>\u003cdiv class=\"ecos-verbe-ficha-cont\">\u003c/div>\u003c/details>\u003cdetails class=\"ecos-verbe-tec puede\" data-id=\"familia-voz-mente\" data-tipo=\"tec\">\u003csummary>\n      \u003cspan class=\"gr\">Grado 1\u003c/span>\u003cspan class=\"nom\">\u003cb>Voz en la mente\u003c/b>\u003csmall>\u003c/small>\u003csmall>Acción · 36 m\u003c/small>\u003csmall class=\"ev-efecto-breve\">Hablas mente a mente con hasta cuatro criaturas que ves; ellas pueden responderte.\u003c/small>\u003c/span>\n      \u003cspan class=\"vb\">\u003cb>2 Verbe\u003c/b>\u003csmall>por uso base\u003c/small>\u003c/span>\u003cspan class=\"acc\">\u003cbutton type=\"button\" data-action=\"aprender\" data-id=\"familia-voz-mente\">Pedir al DM · 2 Trazos\u003c/button>\u003csmall>Te quedarían 14 Trazos\u003c/small>\u003c/span>\u003c/summary>\u003cdiv class=\"ecos-verbe-ficha-cont\">\u003c/div>\u003c/details>\u003cdetails class=\"ecos-verbe-tec puede\" data-id=\"familia-sombra-imita\" data-tipo=\"tec\">\u003csummary>\n      \u003cspan class=\"gr\">Grado 2\u003c/span>\u003cspan class=\"nom\">\u003cb>Sombra que imita\u003c/b>\u003csmall>Kagemane no Jutsu\u003c/small>\u003csmall>Acción · 18 m\u003c/small>\u003csmall class=\"ev-efecto-breve\">FUE. La criatura atada por tu sombra hace lo que tú haces: si caminas, camina; si levantas el brazo, lo levanta.\u003c/small>\u003c/span>\n      \u003cspan class=\"vb\">\u003cb>3 Verbe\u003c/b>\u003csmall>por uso base\u003c/small>\u003c/span>\u003cspan class=\"acc\">\u003cbutton type=\"button\" data-action=\"aprender\" data-id=\"familia-sombra-imita\">Pedir al DM · 3 Trazos\u003c/button>\u003csmall>Te quedarían 13 Trazos\u003c/small>\u003c/span>\u003c/summary>\u003cdiv class=\"ecos-verbe-ficha-cont\">\u003c/div>\u003c/details>\u003c/details>\u003c/section>","ramas":"\u003cheader class=\"ecos-verbe-cabpanel\">\n      \u003cdiv class=\"ev-identidad\">\u003cspan class=\"ev-kicker\">EL VERBE · NIVEL 3\u003c/span>\u003cstrong>Ari · viajero del valle\u003c/strong>\u003csmall>Forma · Fuego\u003c/small>\u003c/div>\n      \u003cdiv class=\"ecos-verbe-res\">\u003cdiv class=\"ev-recurso-titulo\">\u003cb>\u003ci class=\"fa-solid fa-droplet\" aria-hidden=\"true\">\u003c/i> Verbe \u003cspan>18 / 21\u003c/span>\u003c/b>\u003csmall>ENERGÍA PARA USAR\u003c/small>\u003c/div>\u003cdiv class=\"ecos-verbe-barra grande \" role=\"meter\" aria-label=\"Reserva de Verbe\" aria-valuemin=\"0\" aria-valuemax=\"21\" aria-valuenow=\"18\" aria-valuetext=\"18 de 21 de Verbe\">\u003cdiv style=\"width:85.71428571428571%\">\u003c/div>\u003c/div>\n        \u003csmall>Se gasta al usar técnicas; vuelve al descansar.\u003c/small>\u003c/div>\n      \u003cdiv class=\"ecos-verbe-trazos hay\">\u003cspan class=\"n\">16\u003c/span>\u003cspan class=\"t\">\u003cb>Trazos\u003c/b> para aprender\u003c/span>\u003csmall>Se gastan una vez por compra\u003c/small>\u003c/div>\n    \u003c/header>\u003cnav class=\"ecos-verbe-tabs\" aria-label=\"Panel del Verbe\">\u003cbutton type=\"button\" class=\" \"  data-action=\"pestana\" data-p=\"resumen\">\u003ci class=\"fa-solid fa-house\" aria-hidden=\"true\">\u003c/i> Inicio\u003c/button>\u003cbutton type=\"button\" class=\" \"  data-action=\"pestana\" data-p=\"jugar\">\u003ci class=\"fa-solid fa-bolt\" aria-hidden=\"true\">\u003c/i> Mis técnicas\u003c/button>\u003cbutton type=\"button\" class=\" \"  data-action=\"pestana\" data-p=\"tienda\">\u003ci class=\"fa-solid fa-book-open\" aria-hidden=\"true\">\u003c/i> Aprender\u003c/button>\u003cbutton type=\"button\" class=\"activa \" aria-current=\"page\" data-action=\"pestana\" data-p=\"ramas\">\u003ci class=\"fa-solid fa-seedling\" aria-hidden=\"true\">\u003c/i> Mejorar\u003c/button>\u003cbutton type=\"button\" class=\" \"  data-action=\"pestana\" data-p=\"guia\">\u003ci class=\"fa-solid fa-circle-question\" aria-hidden=\"true\">\u003c/i> Ayuda rápida\u003c/button>\u003c/nav>\u003csection class=\"ecos-verbe-cuerpo\" aria-label=\"Mejorar\">\u003cnav class=\"ev-subnav\" aria-label=\"Cómo quieres mejorar\">\u003cbutton type=\"button\" data-action=\"pestana\" data-p=\"ramas\" aria-current=\"page\">Especialidades\u003c/button>\u003cbutton type=\"button\" data-action=\"pestana\" data-p=\"dotes\" >Dotes\u003c/button>\u003cbutton type=\"button\" data-action=\"pestana\" data-p=\"cultivo\" >Entrenar técnicas\u003c/button>\u003cbutton type=\"button\" data-action=\"pestana\" data-p=\"crear\" >Inventar una técnica\u003c/button>\u003c/nav>\u003cdiv class=\"ecos-verbe-intro\">\u003cp>\u003cb>Cada rama es un tipo de técnica (Forma, Velo, Cuerpo…).\u003c/b> Tu rango en una rama dice hasta qué grado puedes aprender técnicas de ella. Se sube con Trazos; desde Experto, sus técnicas que dañan o curan tiran dados de más y ganas los dones de la rama. \u003ca class=\"ecos-verbe-guia\" data-action=\"guia\" data-s=\"ramas-y-rangos\" data-tooltip=\"Abre la guía escrita en esa parte\">\u003ci class=\"fa-solid fa-book-open\">\u003c/i> Guía\u003c/a>\u003c/p>\u003cdetails>\u003csummary>Saber más\u003c/summary>\u003cp>Tu \u003cb>rama principal\u003c/b> empieza en Entrenado gratis, cada rango le cuesta 1 Trazo menos y sus dones llegan un rango antes. Desde la \u003cb>tercera rama\u003c/b> que entrenes, cada rango cuesta 1 Trazo más: conviene especializarse.\u003c/p>\u003ctable class=\"ecos-verbe-tabla\">\u003ctr>\u003cth>Rango\u003c/th>\u003cth>Aprendes técnicas de la rama hasta\u003c/th>\u003cth>Pide\u003c/th>\u003cth>Cuesta\u003c/th>\u003cth>Te da\u003c/th>\u003c/tr>\n      \u003ctr>\u003ctd>\u003cb>Novato\u003c/b>\u003c/td>\u003ctd>grado 1\u003c/td>\u003ctd>—\u003c/td>\n        \u003ctd>gratis: toda rama abierta empieza aquí\u003c/td>\n        \u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>Entrenado\u003c/b>\u003c/td>\u003ctd>grado 3\u003c/td>\u003ctd>—\u003c/td>\n        \u003ctd>1 Trazo (0 en tu rama principal)\u003c/td>\n        \u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>Experto\u003c/b>\u003c/td>\u003ctd>grado 5\u003c/td>\u003ctd>nivel 5\u003c/td>\n        \u003ctd>3 Trazos (2 en tu rama principal)\u003c/td>\n        \u003ctd>1 dado más en sus técnicas que dañan o curan, y su primer don\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>Maestro\u003c/b>\u003c/td>\u003ctd>grado 8\u003c/td>\u003ctd>nivel 11\u003c/td>\n        \u003ctd>5 Trazos (4 en tu rama principal)\u003c/td>\n        \u003ctd>2 dados más en sus técnicas que dañan o curan, y su segundo don\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>Legendario\u003c/b>\u003c/td>\u003ctd>grado 9\u003c/td>\u003ctd>nivel 17\u003c/td>\n        \u003ctd>8 Trazos (7 en tu rama principal)\u003c/td>\n        \u003ctd>3 dados más en sus técnicas que dañan o curan, y su tercer don\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>Mítico\u003c/b>\u003c/td>\u003ctd>grado 11\u003c/td>\u003ctd>nivel 19\u003c/td>\n        \u003ctd>10 Trazos (9 en tu rama principal)\u003c/td>\n        \u003ctd>4 dados más en sus técnicas que dañan o curan, y su cuarto don\u003c/td>\u003c/tr>\u003c/table>\u003c/details>\u003c/div>\n      \u003csection class=\"ecos-verbe-rama \">\n        \u003cheader>\u003cb>Forma\u003c/b> \u003cspan class='ecos-verbe-pill'>principal\u003c/span>\n          \u003cspan>Rango \u003cb>Entrenado\u003c/b> · tu límite ahora es \u003cb>grado 2\u003c/b>.\u003c/span>\u003cbutton type=\"button\" data-action=\"rango\" data-rama=\"forma\" disabled data-tooltip=\"Experto: aprendes hasta grado 5, sus técnicas que dañan o curan tiran 1 dado más. Pide nivel 5. Cuesta 2 Trazos.\">Subir a Experto · 2 Trazos\u003c/button> \u003cspan class=\"ecos-nota\">Necesitas nivel 5.\u003c/span>\u003c/header>\n        \u003cp class=\"ecos-nota\">El Verbe hecho forma: proyectiles, réplicas, sustituciones y las técnicas de los elementos (fuego, agua, viento, tierra y rayo). Es la rama donde están las técnicas de tu naturaleza. \u003c/p>\u003cdetails class=\"ev-dones\">\u003csummary>Qué dones gano en esta rama\u003c/summary>\u003cul class=\"ecos-verbe-dones\">\u003cli class=\"tiene\">\u003cb>Primer don · Forma precisa\u003c/b> \u003cspan class=\"ecos-nota\">ya lo tienes\u003c/span>\u003cbr>Cuando usas una técnica de Forma que cubre un área, eliges hasta tantas criaturas como tu modificador de Verbe; esas pasan la salvación sin tirar y no reciben daño. Sirve para no herir a tus aliados.\u003c/li>\u003cli class=\"\">\u003cb>Segundo don · Forma doble\u003c/b> \u003cspan class=\"ecos-nota\">llega cuando subas a Experto (un rango antes, por ser tu rama principal)\u003c/span>\u003cbr>Cuando usas una técnica de Forma con tu acción, en el mismo turno puedes usar otra técnica de Forma de grado 0 con tu acción adicional.\u003c/li>\u003cli class=\"\">\u003cb>Tercer don · Forma sin fin\u003c/b> \u003cspan class=\"ecos-nota\">llega cuando subas a Maestro (un rango antes, por ser tu rama principal)\u003c/span>\u003cbr>Una vez por Descanso Largo, usas una técnica de Forma de grado 5 o menos sin gastar Verbe.\u003c/li>\u003cli class=\"\">\u003cb>Cuarto don · Forma total\u003c/b> \u003cspan class=\"ecos-nota\">llega cuando subas a Legendario (un rango antes, por ser tu rama principal)\u003c/span>\u003cbr>Una vez por Descanso Largo, usas una técnica de Forma de grado 9 o menos sin gastar Verbe, y el daño de tus técnicas de Forma ignora la resistencia.\u003c/li>\u003c/ul>\u003c/details>\u003c/section>\u003csection class=\"ecos-verbe-rama \">\n        \u003cheader>\u003cb>Velo\u003c/b>\n          \u003cspan>Rango \u003cb>Novato\u003c/b> · tu límite ahora es \u003cb>grado 1\u003c/b>.\u003c/span>\u003cbutton type=\"button\" data-action=\"rango\" data-rama=\"velo\"  data-tooltip=\"Entrenado: aprendes hasta grado 3. Pide nivel 1. Cuesta 1 Trazo.\">Subir a Entrenado · 1 Trazo\u003c/button>\u003c/header>\n        \u003cp class=\"ecos-nota\">Ilusiones que se meten en el Verbe del otro: ver lo que no está, sentir miedo, confundirse. Casi todo pide salvación de Sabiduría. Arrasa con la gente común; otro usuario puede romperlas con Control. \u003c/p>\u003cdetails class=\"ev-dones\">\u003csummary>Qué dones gano en esta rama\u003c/summary>\u003cul class=\"ecos-verbe-dones\">\u003cli class=\"\">\u003cb>Primer don · Velo hondo\u003c/b> \u003cspan class=\"ecos-nota\">llega cuando subas a Experto\u003c/span>\u003cbr>Quien no te vio usar el Velo tiene desventaja en su primera salvación contra él.\u003c/li>\u003cli class=\"\">\u003cb>Segundo don · Velo dentro del Velo\u003c/b> \u003cspan class=\"ecos-nota\">llega cuando subas a Maestro\u003c/span>\u003cbr>Cuando alguien rompe o supera un Velo tuyo, puedes usar tu reacción para ponerle otro Velo de grado 2 o menos, sin gastar Verbe.\u003c/li>\u003cli class=\"\">\u003cb>Tercer don · Mundo propio\u003c/b> \u003cspan class=\"ecos-nota\">llega cuando subas a Legendario\u003c/span>\u003cbr>Tu Velo engaña también a quien ve el Verbe (por ejemplo, con un ojo heredado) y a los constructos y no muertos que piensan.\u003c/li>\u003cli class=\"\">\u003cb>Cuarto don · Sueño sin salida\u003c/b> \u003cspan class=\"ecos-nota\">llega cuando subas a Mítico\u003c/span>\u003cbr>Quien falla una salvación contra tu Velo no puede intentar romperlo con Control hasta el final de tu siguiente turno, y tus Velos de Concentración duran 1 minuto más aunque pierdas la Concentración.\u003c/li>\u003c/ul>\u003c/details>\u003c/section>\u003csection class=\"ecos-verbe-rama \">\n        \u003cheader>\u003cb>Cuerpo\u003c/b>\n          \u003cspan>Rango \u003cb>Novato\u003c/b> · tu límite ahora es \u003cb>grado 1\u003c/b>.\u003c/span>\u003cbutton type=\"button\" data-action=\"rango\" data-rama=\"cuerpo\"  data-tooltip=\"Entrenado: aprendes hasta grado 3. Pide nivel 1. Cuesta 1 Trazo.\">Subir a Entrenado · 1 Trazo\u003c/button>\u003c/header>\n        \u003cp class=\"ecos-nota\">El Verbe dentro del cuerpo: golpes más fuertes, saltos y aguante. Ataca con Fuerza o Destreza, como un arma, y casi todo es acción adicional, para sumarse a tus ataques. Aquí están los Ocho Cerrojos. \u003c/p>\u003cdetails class=\"ev-dones\">\u003csummary>Qué dones gano en esta rama\u003c/summary>\u003cul class=\"ecos-verbe-dones\">\u003cli class=\"\">\u003cb>Primer don · Cuerpo templado\u003c/b> \u003cspan class=\"ecos-nota\">llega cuando subas a Experto\u003c/span>\u003cbr>Mientras no lleves armadura pesada, +1 a tu CA y +3 m a tu velocidad.\u003c/li>\u003cli class=\"\">\u003cb>Segundo don · Golpe que no se pierde\u003c/b> \u003cspan class=\"ecos-nota\">llega cuando subas a Maestro\u003c/span>\u003cbr>Cuando fallas un ataque cuerpo a cuerpo, igual haces tanto daño como tu modificador de Fuerza o de Destreza (el mayor).\u003c/li>\u003cli class=\"\">\u003cb>Tercer don · Cerrojos sin precio\u003c/b> \u003cspan class=\"ecos-nota\">llega cuando subas a Legendario\u003c/span>\u003cbr>Con los Siete Cerrojos abiertos pierdes la mitad de los PG por turno.\u003c/li>\u003cli class=\"\">\u003cb>Cuarto don · Cuerpo que no cae\u003c/b> \u003cspan class=\"ecos-nota\">llega cuando subas a Mítico\u003c/span>\u003cbr>Cerrar el séptimo Cerrojo te pide CON CD 10 en vez de 20, y una vez por Descanso Largo, cuando caerías a 0 PG, quedas a 1.\u003c/li>\u003c/ul>\u003c/details>\u003c/section>\u003csection class=\"ecos-verbe-rama cerrada\">\n        \u003cheader>\u003cb>Mirada\u003c/b>\n          \u003cspan>\u003cb>Cerrada\u003c/b>.\u003c/span>\u003c/header>\n        \u003cp class=\"ecos-nota\">Ojos que ven el Verbe. No se compran: se heredan o se reciben, y despiertan en la historia. Sus técnicas vienen con cada etapa del ojo. \u003cb>Se abre si despierta un ojo, en la historia.\u003c/b>\u003c/p>\u003cdetails class=\"ev-dones\">\u003csummary>Qué dones gano en esta rama\u003c/summary>\u003cul class=\"ecos-verbe-dones\">\u003cli class=\"\">\u003cb>Primer don · Ojo largo\u003c/b> \u003cspan class=\"ecos-nota\">llega cuando subas a Experto\u003c/span>\u003cbr>El alcance de tus técnicas de Mirada se duplica.\u003c/li>\u003cli class=\"\">\u003cb>Segundo don · Ojo que no se cansa\u003c/b> \u003cspan class=\"ecos-nota\">llega cuando subas a Maestro\u003c/span>\u003cbr>Mantener el ojo abierto ya no gasta Verbe.\u003c/li>\u003cli class=\"\">\u003cb>Tercer don · Ojo pleno\u003c/b> \u003cspan class=\"ecos-nota\">llega cuando subas a Legendario\u003c/span>\u003cbr>Una vez por Descanso Largo, usas una técnica de la etapa 3 de tu ojo sin gastar Verbe, y el blanco tiene desventaja en su salvación.\u003c/li>\u003cli class=\"\">\u003cb>Cuarto don · Ojo que todo lo ve\u003c/b> \u003cspan class=\"ecos-nota\">llega cuando subas a Mítico\u003c/span>\u003cbr>Con el ojo abierto ves a través de ilusiones, oscuridad y lo invisible a 36 m, y nada que veas te sorprende.\u003c/li>\u003c/ul>\u003c/details>\u003c/section>\u003csection class=\"ecos-verbe-rama \">\n        \u003cheader>\u003cb>Sello\u003c/b>\n          \u003cspan>Rango \u003cb>Novato\u003c/b> · tu límite ahora es \u003cb>grado 1\u003c/b>.\u003c/span>\u003cbutton type=\"button\" data-action=\"rango\" data-rama=\"sello\"  data-tooltip=\"Entrenado: aprendes hasta grado 3. Pide nivel 1. Cuesta 1 Trazo.\">Subir a Entrenado · 1 Trazo\u003c/button>\u003c/header>\n        \u003cp class=\"ecos-nota\">Sellos, barreras y marcas: cerrar puertas, encerrar, guardar técnicas en papel. Casi todo pide Gestos y, a veces, tinta o papel. \u003c/p>\u003cdetails class=\"ev-dones\">\u003csummary>Qué dones gano en esta rama\u003c/summary>\u003cul class=\"ecos-verbe-dones\">\u003cli class=\"\">\u003cb>Primer don · Dos sellos\u003c/b> \u003cspan class=\"ecos-nota\">llega cuando subas a Experto\u003c/span>\u003cbr>Puedes mantener a la vez dos técnicas de Sello que piden Concentración.\u003c/li>\u003cli class=\"\">\u003cb>Segundo don · Sellos que duran\u003c/b> \u003cspan class=\"ecos-nota\">llega cuando subas a Maestro\u003c/span>\u003cbr>Tus sellos preparados (Ruptura, Que avisa, Cierre y Círculo de guarda) duran hasta que tú los rompas.\u003c/li>\u003cli class=\"\">\u003cb>Tercer don · Gran sello\u003c/b> \u003cspan class=\"ecos-nota\">llega cuando subas a Legendario\u003c/span>\u003cbr>Tu Sello de encierro sirve también con las criaturas mayores, con un ritual de tres días.\u003c/li>\u003cli class=\"\">\u003cb>Cuarto don · Sello sin llave\u003c/b> \u003cspan class=\"ecos-nota\">llega cuando subas a Mítico\u003c/span>\u003cbr>Tus sellos solo los rompe quien tenga tu rango en Sello o uno más alto, y una vez por Descanso Largo pones un Sello de grado 7 o menos sin gastar Verbe ni tinta.\u003c/li>\u003c/ul>\u003c/details>\u003c/section>\u003csection class=\"ecos-verbe-rama cerrada\">\n        \u003cheader>\u003cb>Pacto\u003c/b>\n          \u003cspan>\u003cb>Cerrada\u003c/b>.\u003c/span>\u003c/header>\n        \u003cp class=\"ecos-nota\">Un contrato de sangre con un linaje de criaturas, que se gana en la historia. Invocas a tus aliados y peleas junto a ellos. \u003cb>Se abre con un pacto que se gana en la historia.\u003c/b>\u003c/p>\u003cdetails class=\"ev-dones\">\u003csummary>Qué dones gano en esta rama\u003c/summary>\u003cul class=\"ecos-verbe-dones\">\u003cli class=\"\">\u003cb>Primer don · Vínculo fuerte\u003c/b> \u003cspan class=\"ecos-nota\">llega cuando subas a Experto\u003c/span>\u003cbr>Tu invocación suma tu bonificador de competencia a su CA y a su daño.\u003c/li>\u003cli class=\"\">\u003cb>Segundo don · Dos del linaje\u003c/b> \u003cspan class=\"ecos-nota\">llega cuando subas a Maestro\u003c/span>\u003cbr>Invocar al linaje trae dos criaturas en vez de una, cada una con la ficha dos grados más baja.\u003c/li>\u003cli class=\"\">\u003cb>Tercer don · Sangre compartida\u003c/b> \u003cspan class=\"ecos-nota\">llega cuando subas a Legendario\u003c/span>\u003cbr>Una vez por Descanso Largo, cuando tu invocación cae a 0 PG, queda a 1 PG y tú pierdes los PG que le faltaron.\u003c/li>\u003cli class=\"\">\u003cb>Cuarto don · El linaje responde\u003c/b> \u003cspan class=\"ecos-nota\">llega cuando subas a Mítico\u003c/span>\u003cbr>Tu invocación ya no pide Concentración, y una vez por Descanso Largo llamas al mayor de tu linaje durante 1 minuto sin gastar Verbe.\u003c/li>\u003c/ul>\u003c/details>\u003c/section>\u003csection class=\"ecos-verbe-rama cerrada\">\n        \u003cheader>\u003cb>Pulso\u003c/b>\n          \u003cspan>\u003cb>Cerrada\u003c/b>.\u003c/span>\u003c/header>\n        \u003cp class=\"ecos-nota\">El Verbe que cura y el que daña por dentro. Se abre con la dote Control fino del Verbe. Para las heridas de la casa cuenta como magia que cura. \u003cb>Se abre con la dote Control fino del Verbe (Mejorar → Dotes).\u003c/b>\u003c/p>\u003cdetails class=\"ev-dones\">\u003csummary>Qué dones gano en esta rama\u003c/summary>\u003cul class=\"ecos-verbe-dones\">\u003cli class=\"\">\u003cb>Primer don · Manos firmes\u003c/b> \u003cspan class=\"ecos-nota\">llega cuando subas a Experto\u003c/span>\u003cbr>Tus técnicas que curan suman tu modificador de Verbe una vez más.\u003c/li>\u003cli class=\"\">\u003cb>Segundo don · Cirujano\u003c/b> \u003cspan class=\"ecos-nota\">llega cuando subas a Maestro\u003c/span>\u003cbr>Una vez al día por paciente, Palma que cierra le baja también un nivel de Herida No Tratada.\u003c/li>\u003cli class=\"\">\u003cb>Tercer don · Vida guardada\u003c/b> \u003cspan class=\"ecos-nota\">llega cuando subas a Legendario\u003c/span>\u003cbr>Cada día guardas hasta el doble de tu nivel en Verbe. Si caes a 0 PG, ese Verbe se suelta solo y recuperas el doble en PG.\u003c/li>\u003cli class=\"\">\u003cb>Cuarto don · Pulso que devuelve\u003c/b> \u003cspan class=\"ecos-nota\">llega cuando subas a Mítico\u003c/span>\u003cbr>Una vez por Descanso Largo, tocas a alguien que murió hace 1 minuto o menos y vuelve con la mitad de sus PG y 1 nivel de Agotamiento.\u003c/li>\u003c/ul>\u003c/details>\u003c/section>\u003csection class=\"ecos-verbe-rama \">\n        \u003cheader>\u003cb>Hilo\u003c/b>\n          \u003cspan>Rango \u003cb>Novato\u003c/b> · tu límite ahora es \u003cb>grado 1\u003c/b>.\u003c/span>\u003cbutton type=\"button\" data-action=\"rango\" data-rama=\"hilo\"  data-tooltip=\"Entrenado: aprendes hasta grado 3. Pide nivel 1. Cuesta 1 Trazo.\">Subir a Entrenado · 1 Trazo\u003c/button>\u003c/header>\n        \u003cp class=\"ecos-nota\">Armas y herramientas con Verbe: hilos, agujas, armas que vuelan y marionetas. Ataca con Fuerza o Destreza, como un arma. \u003c/p>\u003cdetails class=\"ev-dones\">\u003csummary>Qué dones gano en esta rama\u003c/summary>\u003cul class=\"ecos-verbe-dones\">\u003cli class=\"\">\u003cb>Primer don · Diez dedos\u003c/b> \u003cspan class=\"ecos-nota\">llega cuando subas a Experto\u003c/span>\u003cbr>Mueves dos marionetas o dos armas suspendidas a la vez.\u003c/li>\u003cli class=\"\">\u003cb>Segundo don · Hilo que no se ve\u003c/b> \u003cspan class=\"ecos-nota\">llega cuando subas a Maestro\u003c/span>\u003cbr>Tus ataques de Hilo a distancia no tienen desventaja por alcance largo y no revelan dónde estás.\u003c/li>\u003cli class=\"\">\u003cb>Tercer don · Lluvia sin fin\u003c/b> \u003cspan class=\"ecos-nota\">llega cuando subas a Legendario\u003c/span>\u003cbr>Una vez por Descanso Corto, usas una técnica que pide pergamino de armas sin gastar el pergamino.\u003c/li>\u003cli class=\"\">\u003cb>Cuarto don · Mil hilos\u003c/b> \u003cspan class=\"ecos-nota\">llega cuando subas a Mítico\u003c/span>\u003cbr>Mueves hasta cinco marionetas o armas suspendidas a la vez, y una vez por turno, cuando una criatura a 9 m se mueve, la enredas: su velocidad queda en 0 hasta el final de su turno.\u003c/li>\u003c/ul>\u003c/details>\u003c/section>\u003csection class=\"ecos-verbe-rama \">\n        \u003cheader>\u003cb>Quietud\u003c/b>\n          \u003cspan>Rango \u003cb>Novato\u003c/b> · tu límite ahora es \u003cb>grado 1\u003c/b>.\u003c/span>\u003cbutton type=\"button\" data-action=\"rango\" data-rama=\"quietud\"  data-tooltip=\"Entrenado: aprendes hasta grado 3. Pide nivel 1. Cuesta 1 Trazo.\">Subir a Entrenado · 1 Trazo\u003c/button>\u003c/header>\n        \u003cp class=\"ecos-nota\">Tomar el Verbe del mundo en vez del propio, con Sabiduría. Da mucho, pero el mundo cobra: si fallas, lo salvaje te deja su marca. \u003c/p>\u003cdetails class=\"ev-dones\">\u003csummary>Qué dones gano en esta rama\u003c/summary>\u003cul class=\"ecos-verbe-dones\">\u003cli class=\"\">\u003cb>Primer don · Raíz honda\u003c/b> \u003cspan class=\"ecos-nota\">llega cuando subas a Experto\u003c/span>\u003cbr>Las salvaciones que te pide la Quietud bajan 2 de CD.\u003c/li>\u003cli class=\"\">\u003cb>Segundo don · Quietud en movimiento\u003c/b> \u003cspan class=\"ecos-nota\">llega cuando subas a Maestro\u003c/span>\u003cbr>Entras en Estado de Quietud con tu acción adicional.\u003c/li>\u003cli class=\"\">\u003cb>Tercer don · El mundo te conoce\u003c/b> \u003cspan class=\"ecos-nota\">llega cuando subas a Legendario\u003c/span>\u003cbr>Una vez por Descanso Largo, si fallas una salvación de Quietud, no pasa nada.\u003c/li>\u003cli class=\"\">\u003cb>Cuarto don · El mundo es tu casa\u003c/b> \u003cspan class=\"ecos-nota\">llega cuando subas a Mítico\u003c/span>\u003cbr>Al aire libre, el Estado de Quietud ya no te pide salvaciones, y mientras dura tus técnicas cuestan 1 Verbe menos (mínimo 1).\u003c/li>\u003c/ul>\u003c/details>\u003c/section>\u003csection class=\"ecos-verbe-rama \">\n        \u003cheader>\u003cb>Rastro\u003c/b>\n          \u003cspan>Rango \u003cb>Novato\u003c/b> · tu límite ahora es \u003cb>grado 1\u003c/b>.\u003c/span>\u003cbutton type=\"button\" data-action=\"rango\" data-rama=\"rastro\"  data-tooltip=\"Entrenado: aprendes hasta grado 3. Pide nivel 1. Cuesta 1 Trazo.\">Subir a Entrenado · 1 Trazo\u003c/button>\u003c/header>\n        \u003cp class=\"ecos-nota\">Sentir el Verbe a distancia: quién lo usa, dónde está y cuánto le queda. Con Sabiduría. \u003c/p>\u003cdetails class=\"ev-dones\">\u003csummary>Qué dones gano en esta rama\u003c/summary>\u003cul class=\"ecos-verbe-dones\">\u003cli class=\"\">\u003cb>Primer don · Rastro fino\u003c/b> \u003cspan class=\"ecos-nota\">llega cuando subas a Experto\u003c/span>\u003cbr>Cuando sientes a alguien con el Verbe, sabes también su naturaleza y cuánto Verbe le queda (lleno, a medias o poco).\u003c/li>\u003cli class=\"\">\u003cb>Segundo don · Nunca por sorpresa\u003c/b> \u003cspan class=\"ecos-nota\">llega cuando subas a Maestro\u003c/span>\u003cbr>Nada te sorprende, y tus aliados a 9 m suman tu bonificador de competencia a la iniciativa.\u003c/li>\u003cli class=\"\">\u003cb>Tercer don · Antes del golpe\u003c/b> \u003cspan class=\"ecos-nota\">llega cuando subas a Legendario\u003c/span>\u003cbr>Una vez por turno, cuando te ataca una criatura que estás sintiendo, el ataque tiene desventaja.\u003c/li>\u003cli class=\"\">\u003cb>Cuarto don · Rastro sin distancia\u003c/b> \u003cspan class=\"ecos-nota\">llega cuando subas a Mítico\u003c/span>\u003cbr>Sientes a cualquier criatura con Verbe que hayas tocado alguna vez, esté donde esté: sabes en qué dirección y a qué distancia está.\u003c/li>\u003c/ul>\u003c/details>\u003c/section>\u003csection class=\"ecos-verbe-rama cerrada\">\n        \u003cheader>\u003cb>Sangre\u003c/b>\n          \u003cspan>\u003cb>Cerrada\u003c/b>.\u003c/span>\u003c/header>\n        \u003cp class=\"ecos-nota\"> \u003cb>Se abre con una herencia de sangre. No tienes manera de saber si la tienes; si es así, la historia lo dirá.\u003c/b>\u003c/p>\u003c/section>\u003csection class=\"ecos-verbe-rama \">\n        \u003cheader>\u003cb>Umbral\u003c/b>\n          \u003cspan>Rango \u003cb>Novato\u003c/b> · tu límite ahora es \u003cb>grado 1\u003c/b>.\u003c/span>\u003cbutton type=\"button\" data-action=\"rango\" data-rama=\"umbral\"  data-tooltip=\"Entrenado: aprendes hasta grado 3. Pide nivel 1. Cuesta 1 Trazo.\">Subir a Entrenado · 1 Trazo\u003c/button>\u003c/header>\n        \u003cp class=\"ecos-nota\">Espacio-tiempo: marcas, traslado e intercambio. Una marca y un destino seguro importan tanto como la energía. No crea copias ni dominios infinitos. \u003c/p>\u003c/section>\u003csection class=\"ecos-verbe-rama cerrada\">\n        \u003cheader>\u003cb>Vasija\u003c/b>\n          \u003cspan>\u003cb>Cerrada\u003c/b>.\u003c/span>\u003c/header>\n        \u003cp class=\"ecos-nota\">Técnicas del huésped de una bestia. El DM concede entidad y vínculo; las transformaciones comparten tu vida, reserva y acciones. \u003cb>La abre el DM.\u003c/b>\u003c/p>\u003c/section>\n      \u003csection class=\"ev-naturalezas\">\u003ch3>Tus elementos\u003c/h3>\u003cp>Fuego. Puedes descubrir tu segunda naturaleza probando una técnica.\u003c/p>\n      \n      \n      \u003cp>Naturaleza combinada abre una combinación desde nivel 9 con maestro; Tercera naturaleza abre otro elemento desde nivel 7 con maestro. Una tercera naturaleza no concede por sí sola una combinación.\u003c/p>\u003c/section>\n      \u003ch3>Afinidad con tu naturaleza\u003c/h3>\u003cp class=\"ecos-nota\">Qué tan bien manejas tu elemento. Entrenada: sus técnicas tiran 1 dado más y sus estados duran el doble. Maestra: 2 dados más, y quien falla contra ella no resiste su daño.\u003c/p>\u003cul>\u003cli>\u003cb>Fuego\u003c/b>: Despierta \u003cbutton type=\"button\" data-action=\"afinidad\" data-nat=\"fuego\" data-tooltip=\"+1 dado a sus técnicas e infusiones, y sus estados duran el doble\">Subir a Entrenada · 2 Trazos (nivel 5, pide un maestro)\u003c/button>\u003c/li>\u003c/ul>\n      \u003csection class=\"ev-naturalezas\">\u003ch3>Tradiciones y vínculos\u003c/h3>\u003cp>El DM concede los aprendizajes secretos cuando los ganas en la historia.\u003c/p>\u003c/section>\n      \u003ch3>Control del Verbe \u003ci class=\"ecos-verbe-ayuda fa-solid fa-circle-question\" data-tooltip=\"Una habilidad nueva de tu hoja (con Sabiduría). Se tira para ganar un choque entre dos técnicas, romper un Velo, abrir los Cerrojos y no perderse en la Quietud. Se compra en Mejorar → Especialidades.\">\u003c/i>\u003c/h3>\u003cp>Sin competencia. \u003cbutton type=\"button\" data-action=\"control\" data-tooltip=\"Sumas tu competencia a las pruebas de Control\">Volverte competente · 2 Trazos\u003c/button>\u003c/p>\n      \u003ch3>Ocho Cerrojos\u003c/h3>\u003cp class=\"ecos-nota\">Un estado de Cuerpo: pegas más fuerte y más rápido, pagando PG cada turno y Agotamiento al cerrar. \u003ca class=\"ecos-verbe-guia\" data-action=\"guia\" data-s=\"siete-cerrojos\">\u003ci class=\"fa-solid fa-book-open\">\u003c/i> Guía\u003c/a>\u003c/p>\n      \u003cp>No sabes ninguno. \u003cbutton type=\"button\" data-action=\"aprenderCerrojo\" data-tooltip=\"La piel: +2 al daño de tus golpes y ventaja en pruebas de Fuerza. Grado 1.\">Aprender el 1 · La piel · 1 Trazo\u003c/button>\u003c/p>\u003c/section>","dotes":"\u003cheader class=\"ecos-verbe-cabpanel\">\n      \u003cdiv class=\"ev-identidad\">\u003cspan class=\"ev-kicker\">EL VERBE · NIVEL 3\u003c/span>\u003cstrong>Ari · viajero del valle\u003c/strong>\u003csmall>Forma · Fuego\u003c/small>\u003c/div>\n      \u003cdiv class=\"ecos-verbe-res\">\u003cdiv class=\"ev-recurso-titulo\">\u003cb>\u003ci class=\"fa-solid fa-droplet\" aria-hidden=\"true\">\u003c/i> Verbe \u003cspan>18 / 21\u003c/span>\u003c/b>\u003csmall>ENERGÍA PARA USAR\u003c/small>\u003c/div>\u003cdiv class=\"ecos-verbe-barra grande \" role=\"meter\" aria-label=\"Reserva de Verbe\" aria-valuemin=\"0\" aria-valuemax=\"21\" aria-valuenow=\"18\" aria-valuetext=\"18 de 21 de Verbe\">\u003cdiv style=\"width:85.71428571428571%\">\u003c/div>\u003c/div>\n        \u003csmall>Se gasta al usar técnicas; vuelve al descansar.\u003c/small>\u003c/div>\n      \u003cdiv class=\"ecos-verbe-trazos hay\">\u003cspan class=\"n\">16\u003c/span>\u003cspan class=\"t\">\u003cb>Trazos\u003c/b> para aprender\u003c/span>\u003csmall>Se gastan una vez por compra\u003c/small>\u003c/div>\n    \u003c/header>\u003cnav class=\"ecos-verbe-tabs\" aria-label=\"Panel del Verbe\">\u003cbutton type=\"button\" class=\" \"  data-action=\"pestana\" data-p=\"resumen\">\u003ci class=\"fa-solid fa-house\" aria-hidden=\"true\">\u003c/i> Inicio\u003c/button>\u003cbutton type=\"button\" class=\" \"  data-action=\"pestana\" data-p=\"jugar\">\u003ci class=\"fa-solid fa-bolt\" aria-hidden=\"true\">\u003c/i> Mis técnicas\u003c/button>\u003cbutton type=\"button\" class=\" \"  data-action=\"pestana\" data-p=\"tienda\">\u003ci class=\"fa-solid fa-book-open\" aria-hidden=\"true\">\u003c/i> Aprender\u003c/button>\u003cbutton type=\"button\" class=\"activa \" aria-current=\"page\" data-action=\"pestana\" data-p=\"ramas\">\u003ci class=\"fa-solid fa-seedling\" aria-hidde -barra grande \" role=\"meter\" aria-label=\"Reserva de Verbe\" aria-valuemin=\"0\" aria-valuemax=\"21\" aria-valuenow=\"18\" aria-valuetext=\"18 de 21 de Verbe\">\u003cdiv style=\"width:85.71428571428571%\">\u003c/div>\u003c/div>\n        \u003csmall>Se gasta al usar técnicas; vuelve al descansar.\u003c/small>\u003c/div>\n      \u003cdiv class=\"ecos-verbe-trazos hay\">\u003cspan class=\"n\">16\u003c/span>\u003cspan class=\"t\">\u003cb>Trazos\u003c/b> para aprender\u003c/span>\u003csmall>Se gastan una vez por compra\u003c/small>\u003c/div>\n    \u003c/header>\u003cnav class=\"ecos-verbe-tabs\" aria-label=\"Panel del Verbe\">\u003cbutton type=\"button\" class=\" \"  data-action=\"pestana\" data-p=\"resumen\">\u003ci class=\"fa-solid fa-house\" aria-hidden=\"true\">\u003c/i> Inicio\u003c/button>\u003cbutton type=\"button\" class=\" \"  data-action=\"pestana\" data-p=\"jugar\">\u003ci class=\"fa-solid fa-bolt\" aria-hidden=\"true\">\u003c/i> Mis técnicas\u003c/button>\u003cbutton type=\"button\" class=\" \"  data-action=\"pestana\" data-p=\"tienda\">\u003ci class=\"fa-solid fa-book-open\" aria-hidden=\"true\">\u003c/i> Aprender\u003c/button>\u003cbutton type=\"button\" class=\"activa \" aria-current=\"page\" data-action=\"pestana\" data-p=\"ramas\">\u003ci class=\"fa-solid fa-seedling\" aria-hidden=\"true\">\u003c/i> Mejorar\u003c/button>\u003cbutton type=\"button\" class=\" \"  data-action=\"pestana\" data-p=\"guia\">\u003ci class=\"fa-solid fa-circle-question\" aria-hidden=\"true\">\u003c/i> Ayuda rápida\u003c/button>\u003c/nav>\u003csection class=\"ecos-verbe-cuerpo\" aria-label=\"Mejorar\">\u003cnav class=\"ev-subnav\" aria-label=\"Cómo quieres mejorar\">\u003cbutton type=\"button\" data-action=\"pestana\" data-p=\"ramas\" >Especialidades\u003c/button>\u003cbutton type=\"button\" data-action=\"pestana\" data-p=\"dotes\" >Dotes\u003c/button>\u003cbutton type=\"button\" data-action=\"pestana\" data-p=\"cultivo\" aria-current=\"page\">Entrenar técnicas\u003c/button>\u003cbutton type=\"button\" data-action=\"pestana\" data-p=\"crear\" >Inventar una técnica\u003c/button>\u003c/nav>\u003cdiv class=\"ecos-verbe-intro\">\u003cp>\u003cb>Entrena una técnica que ya sabes para que crezca.\u003c/b> Cada técnica pasa por Pulida, Dominada y Propia. El selector solo ofrece mejoras con efecto en su forma. Coste: nivel de cultivo nuevo (1, 2 o 3), +1 por dado/CD/ahorro de Verbe o control de Sustitución; +2 por rapidez, componentes o infusión fija. El coste final aparece en cada opción. Puedes cultivar tantas técnicas como tu bonificador de competencia: 2 (llevas 0). \u003ca class=\"ecos-verbe-guia\" data-action=\"guia\" data-s=\"cultivo\" data-tooltip=\"Abre la guía escrita en esa parte\">\u003ci class=\"fa-solid fa-book-open\">\u003c/i> Guía\u003c/a>\u003c/p>\u003cdetails>\u003csummary>Saber más\u003c/summary>\u003cul class=\"ecos-verbe-lista\">\u003cli>+1 dado de daño o de curación.\u003c/li>\u003cli>1 Verbe menos (mínimo 1).\u003c/li>\u003cli>+1 a la CD o al ataque de esa técnica.\u003c/li>\u003cli>El área o el alcance crecen la mitad.\u003c/li>\u003cli>Más rápida, una sola vez: de 1 minuto a acción, o de acción a AA.\u003c/li>\u003cli>Infusión fija: con una naturaleza tuya elegida, infundirla ya no cuesta Verbe.\u003c/li>\u003cli>Solo se ofrecen mejoras que utiliza la actividad. Coste: nivel nuevo de cultivo (1, 2 o 3), +1 por dado, CD/ataque, ahorro de Verbe o control de Sustitución; +2 por rapidez, componentes o infusión fija.\u003c/li>\u003cli>Nuevas opciones: duración +50 % (máximo +1 minuto), toque a 3 m, sin voz o sin gestos; Sustitución: +1,5 m al objeto o −1 al recargo total. Cada opción tiene un tope; no quita requisitos del entorno.\u003c/li>\u003c/ul>\n      \u003cp>Dominada saca variantes; Propia evoluciona. \u003cb>Infundir\u003c/b> le pone tu elemento a una técnica que hace daño: +2 Verbe por uso, sin Trazos.\u003c/p>\u003c/details>\u003c/div>\n      \u003ctable class=\"ecos-verbe-tabla\">\u003cthead>\u003ctr>\u003cth>Técnic rma\u003c/b> (hasta grado 2).\u003c/p>\n      \u003cp>\u003cbutton type=\"button\" data-action=\"crear\" >\u003ci class=\"fa-solid fa-pen-nib\">\u003c/i> Crear una técnica\u003c/button>\u003c/p>\n      \u003cdetails>\u003csummary>Presupuesto por grado\u003c/summary>\u003ctable class=\"ecos-verbe-tabla\">\u003ctr>\u003cth>Grado\u003c/th>\u003cth>Un blanco\u003c/th>\u003cth>Área\u003c/th>\u003cth>Área hasta\u003c/th>\u003cth>Alcance\u003c/th>\u003cth>Estados\u003c/th>\u003c/tr>\n      \u003ctr>\u003ctd>0\u003c/td>\u003ctd>1d10\u003c/td>\u003ctd>1d6\u003c/td>\u003ctd>cono 3 m o 1,5 m alrededor\u003c/td>\u003ctd>18 m\u003c/td>\u003ctd>Empuje de 1,5 m, −3 m de velocidad; su estado de naturaleza solo con crítico\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>2d10\u003c/td>\u003ctd>2d6 (3d6 sin otro efecto)\u003c/td>\u003ctd>cono o cubo 4,5 m\u003c/td>\u003ctd>36 m\u003c/td>\u003ctd>Derribado, empuje de 3 m, estado de naturaleza, Asustado un asalto\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>3d10\u003c/td>\u003ctd>4d6\u003c/td>\u003ctd>esfera 3 m, línea 18 m\u003c/td>\u003ctd>36 m\u003c/td>\u003ctd>Apresado, Cegado, Asustado o Envenenado, repitiendo la salvación\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>5d10\u003c/td>\u003ctd>6d6 (8d6 sin otro efecto)\u003c/td>\u003ctd>esfera 6 m, cono 9 m, línea 30 m\u003c/td>\u003ctd>45 m\u003c/td>\u003ctd>Aturdido o Incapacitado un asalto, Hechizado\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>6d10\u003c/td>\u003ctd>7d6\u003c/td>\u003ctd>esfera 6 m, cubo 9 m\u003c/td>\u003ctd>45 m\u003c/td>\u003ctd>Paralizado (humanoide, repite), Dormido\u003c/td>\u003c/tr>\u003ctr>\u003ctd>5\u003c/td>\u003ctd>8d10\u003c/td>\u003ctd>8d6\u003c/td>\u003ctd>esfera 9 m\u003c/td>\u003ctd>90 m\u003c/td>\u003ctd>Controlar a un humanoide, Paralizado un asalto a cualquiera\u003c/td>\u003c/tr>\u003ctr>\u003ctd>6\u003c/td>\u003ctd>10d10\u003c/td>\u003ctd>11d6\u003c/td>\u003ctd>esfera 12 m\u003c/td>\u003ctd>150 m\u003c/td>\u003ctd>Aturdido repitiendo, bajar PG máximos\u003c/td>\u003c/tr>\u003ctr>\u003ctd>7\u003c/td>\u003ctd>11d10\u003c/td>\u003ctd>12d6\u003c/td>\u003ctd>esfera 18 m\u003c/td>\u003ctd>150 m\u003c/td>\u003ctd>Encierro, Paralizado a cualquiera repitiendo\u003c/td>\u003c/tr>\u003ctr>\u003ctd>8\u003c/td>\u003ctd>12d10\u003c/td>\u003ctd>13d6\u003c/td>\u003ctd>esfera 30 m\u003c/td>\u003ctd>1,5 km\u003c/td>\u003ctd>Controlar a cualquiera, Inconsciente en un área\u003c/td>\u003c/tr>\u003ctr>\u003ctd>9\u003c/td>\u003ctd>15d10\u003c/td>\u003ctd>14d6\u003c/td>\u003ctd>lo que pida la historia\u003c/td>\u003ctd>—\u003c/td>\u003ctd>Lo que apruebes\u003c/td>\u003c/tr>\u003ctr>\u003ctd>10\u003c/td>\u003ctd>18d10\u003c/td>\u003ctd>16d6\u003c/td>\u003ctd>esfera 36 m, línea 150 m\u003c/td>\u003ctd>1,5 km\u003c/td>\u003ctd>Encierro de un ser mayor, Aturdido en un área repitiendo\u003c/td>\u003c/tr>\u003ctr>\u003ctd>11\u003c/td>\u003ctd>20d10\u003c/td>\u003ctd>18d6\u003c/td>\u003ctd>lo que pida la historia\u003c/td>\u003ctd>—\u003c/td>\u003ctd>Lo que apruebes\u003c/td>\u003c/tr>\u003c/table>\u003c/details>\u003c/section>","guia":"\u003cheader class=\"ecos-verbe-cabpanel\">\n      \u003cdiv class=\"ev-identidad\">\u003cspan class=\"ev-kicker\">EL VERBE · NIVEL 3\u003c/span>\u003cstrong>Ari · viajero del valle\u003c/strong>\u003csmall>Forma · Fuego\u003c/small>\u003c/div>\n      \u003cdiv class=\"ecos-verbe-res\">\u003cdiv class=\"ev-recurso-titulo\">\u003cb>\u003ci class=\"fa-solid fa-droplet\" aria-hidden=\"true\">\u003c/i> Verbe \u003cspan>18 / 21\u003c/span>\u003c/b>\u003csmall>ENERGÍA PARA USAR\u003c/small>\u003c/div>\u003cdiv class=\"ecos-verbe-barra grande \" role=\"meter\" aria-label=\"Reserva de Verbe\" aria-valuemin=\"0\" aria-valuemax=\"21\" aria-valuenow=\"18\" aria-valuetext=\"18 de 21 de Verbe\">\u003cdiv style=\"width:85.71428571428571%\">\u003c/div>\u003c/div>\n        \u003csmall>Se gasta al usar técnicas; vuelve al descansar.\u003c/small>\u003c/div>\n      \u003cdiv class=\"ecos-verbe-trazos hay\">\u003cspan class=\"n\">16\u003c/span>\u003cspan class=\"t\">\u003cb>Trazos\u003c/b> para aprender\u003c/span>\u003csmall>Se gastan una vez por compra\u003c/small>\u003c/div>\n    \u003c/header>\u003cnav class=\"ecos-verbe-tabs\" aria-label=\"Panel del Verbe\">\u003cbutton type=\"button\" class=\" \"  data-action=\"pestana\" data-p=\"resumen\">\u003ci class=\"fa-solid fa-house\" aria-hidden=\"true\">\u003c/i> Inicio\u003c/button>\u003cbutton type=\"button\" class=\" \"  data-action=\"pestana\" data-p=\"jugar\">\u003ci class=\"fa-solid fa-bolt\" aria-hidden=\"true\">\u003c/i> Mis técnicas\u003c/button>\u003cbutton type=\"button\" class=\" \"  data-action=\"pestana\" data-p=\"tienda\">\u003ci class=\"fa-solid fa-book-open\" aria-hidden=\"true\">\u003c/i> Aprender\u003c/button>\u003cbutton type=\"button\" class=\" \"  data-action=\"pestana\" data-p=\"ramas\">\u003ci class=\"fa-solid fa-seedling\" aria-hidden=\"true\">\u003c/i> Mejorar\u003c/button>\u003cbutton type=\"button\" class=\"activa \" aria-current=\"page\" data-action=\"pestana\" data-p=\"guia\">\u003ci class=\"fa-solid fa-circle-question\" aria-hidden=\"true\">\u003c/i> Ayuda rápida\u003c/button>\u003c/nav>\u003csection class=\"ecos-verbe-cuerpo\" aria-label=\"Ayuda rápida\">\u003cdiv class=\"ev-titulo-pagina\">\u003cdiv>\u003cspan class=\"ev-kicker\">UNA DUDA, UNA RESPUESTA\u003c/span>\u003ch2>Lo necesario para jugar\u003c/h2>\u003cp>Abre solo la pregunta que tengas ahora. Puedes aprender jugando desde el panel.\u003c/p>\u003c/div>\u003c/div>\n      \u003cdiv class=\"ev-contraste-recursos\">\u003cdiv>\u003ci class=\"fa-solid fa-droplet\" aria-hidden=\"true\">\u003c/i>\u003cb>Verbe = actuar\u003c/b>\u003cspan>Se gasta por uso. Se recupera descansando.\u003c/span>\u003c/div>\u003cdiv>\u003ci class=\"fa-solid fa-pen-nib\" aria-hidden=\"true\">\u003c/i>\u003cb>Trazos = aprender\u003c/b>\u003cspan>Compras una mejora y la conservas.\u003c/span>\u003c/div>\u003c/div>\n      \u003cdiv class=\"ev-preguntas\">\u003cdetails>\u003csummary>¿Qué hago para usar una técnica?\u003c/summary>\u003cp>Abre Mis técnicas. Si afecta a otro, marca su token. Pulsa Usar técnica y resuelve la ventana de dnd5e. El Verbe se comprueba y descuenta al confirmar. Respeta la acción, el alcance y las condiciones de la ficha. También puedes usarla desde Técnicas del Verbe en tu hoja.\u003c/p>\u003c/details>\u003cdetails>\u003csummary>¿Qué diferencia hay entre Verbe y Trazos?\u003c/summary>\u003cp>Verbe es energía: la gastas al actuar y vuelve al descansar. Trazos son puntos para aprender técnicas y comprar mejoras: pagas una vez y lo aprendido permanece. No se cambian automáticamente entre sí. Puedes guardar Trazos.\u003c/p>\u003c/details>\u003cdetails>\u003csummary>¿Qué significa grado, rango o afinidad?\u003c/summary>\u003cp>Grado es la potencia de una técnica. Rango es tu formación en una rama y limita qué técnicas aprendes o elevas. Afinidad es lo bien que manejas tu elemento. En Mejorar verás qué te aporta la siguiente compra y sus requisitos.\u003c/p>\u003c/details>\u003cdetails>\u003csummary>¿Por qué no puedo aprender o usar algo?\u003c/summary>\u003cp>Cada opción muestra el motivo: Trazos insuficientes, nivel, rango, naturaleza, energía, reacción ocupada o un estado. Aprender y usar tienen requisitos distintos. Si pide maestro o un permiso de la historia, el botón envía la solicitud al DM; no concede el poder al instante.\u003c/p>\u003c/details>\u003cdetails>\u003csummary>¿Qué pasa si no me queda energía?\u003c/summary>\u003cp>Puedes entrar en sobreesfuerzo hasta -10 de Verbe. Cada gasto que queda en negativo exige Constitución o gana Agotamiento. Con Agotamiento 4 no puedes gastar en negativo. Recuperar cada punto de deuda cuesta dos; los puntos impares se guardan. Las técnicas de grado 0 necesitan al menos 1 de Verbe.\u003c/p>\u003c/details>\u003cdetails>\u003csummary>¿Cuánto recupero al descansar?\u003c/summary>\u003cp>Tu Descanso Largo en Santuario aporta 10 puntos de recuperación. Los cortos, Aliento y las noches a la intemperie comparten un presupuesto de 5 entre largos; ahora quedan 5. Con tu reserva actual (18), quedarías en 21 o 21, respectivamente. Las dotes pueden modificar esas cantidades; el descanso real aplica tus mejoras. La deuda siempre se paga al doble. Solo el largo renueva el presupuesto breve y los poderes diarios.\u003c/p>\u003c/details>\u003cdetails>\u003csummary>¿Cómo funcionan mis acciones y reacciones?\u003c/summary>\u003cp>La ficha indica Acción, Acción adicional, Reacción o un tiempo más largo. Usar la técnica no te regala una acción extra. Si ya gastaste tu reacción o estás Cargado, las defensas y técnicas de reacción quedan bloqueadas hasta recuperarla.\u003c/p>\u003c/details>\u003cdetails>\u003csummary>¿Qué pasa con las heridas?\u003c/summary>\u003cp>Recuperar PG no borra Malherido ni Herida No Tratada. Busca tratamiento y reposo. Si estás Acechado por la Muerte, no puedes tomar acciones, acciones adicionales ni reacciones: pide ayuda y sigue las indicaciones de tu estado. El Santuario mejora el descanso; fuera de él recuperas menos.\u003c/p>\u003c/details>\u003cdetails>\u003csummary>¿Cómo mejoro sin equivocarme?\u003c/summary>\u003cp>En Mejorar puedes subir tu especialidad, comprar una dote o entrenar una técnica conocida. Mira el coste y lo que ganas antes de elegir. Inventar técnicas es opcional y requiere al DM; el oro y los días de entrenamiento se resuelven en mesa. Si compras algo por error, el DM puede deshacerlo.\u003c/p>\u003c/details>\u003cdetails>\u003csummary>¿Qué hace automáticamente el módulo?\u003c/summary>\u003cp>Administra compras, energía, tiradas y varios estados. El DM decide objetivos válidos, posición, ilusiones, invocaciones y efectos narrativos. Las defensas automáticas requieren midi-qol y pueden necesitar ajustes de mesa en críticos o áreas. Una descripción no significa que todo su efecto ocurra solo.\u003c/p>\u003c/details>\u003c/div>\n      \u003cp class=\"ev-nota\">Para consultar una excepción o profundizar, tienes la guía de referencia.\u003c/p>\u003cbutton type=\"button\" data-action=\"guia\" data-s=\"\">Abrir referencia completa\u003c/button>\u003c/section>"},"riesgo":{"resumen":"\u003cheader class=\"ecos-verbe-cabpanel\">\n      \u003cdiv class=\"ev-identidad\">\u003cspan class=\"ev-kicker\">EL VERBE · NIVEL 3\u003c/span>\u003cstrong>Ari · viajero del valle\u003c/strong>\u003csmall>Forma · Fuego\u003c/small>\u003c/div>\n      \u003cdiv class=\"ecos-verbe-res\">\u003cdiv class=\"ev-recurso-titulo\">\u003cb>\u003ci class=\"fa-solid fa-droplet\" aria-hidden=\"true\">\u003c/i> Verbe \u003cspan>0 / 21\u003c/span>\u003c/b>\u003csmall>ENERGÍA PARA USAR\u003c/small>\u003c/div>\u003cdiv class=\"ecos-verbe-barra grande \" role=\"meter\" aria-label=\"Reserva de Verbe\" aria-valuemin=\"0\" aria-valuemax=\"21\" aria-valuenow=\"0\" aria-valuetext=\"0 de 21 de Verbe\">\u003cdiv style=\"width:0%\">\u003c/div>\u003c/div>\n        \u003csmall>Se gasta al usar técnicas; vuelve al descansar.\u003c/small>\u003c/div>\n      \u003cdiv class=\"ecos-verbe-trazos hay\">\u003cspan class=\"n\">16\u003c/span>\u003cspan class=\"t\">\u003cb>Trazos\u003c/b> para aprender\u003c/span>\u003csmall>Se gastan una vez por compra\u003c/small>\u003c/div>\n    \u003c/header>\u003cnav class=\"ecos-verbe-tabs\" aria-label=\"Panel del Verbe\">\u003cbutton type=\"button\" class=\"activa \" aria-current=\"page\" data-action=\"pestana\" data-p=\"resumen\">\u003ci class=\"fa-solid fa-house\" aria-hidden=\"true\">\u003c/i> Inicio\u003c/button>\u003cbutton type=\"button\" class=\" \"  data-action=\"pestana\" data-p=\"jugar\">\u003ci class=\"fa-solid fa-bolt\" aria-hidden=\"true\">\u003c/i> Mis técnicas\u003c/button>\u003cbutton type=\"button\" class=\" \"  data-action=\"pestana\" data-p=\"tienda\">\u003ci class=\"fa-solid fa-book-open\" aria-hidden=\"true\">\u003c/i> Aprender\u003c/button>\u003cbutton type=\"button\" class=\" \"  data-action=\"pestana\" data-p=\"ramas\">\u003ci class=\"fa-solid fa-seedling\" aria-hidden=\"true\">\u003c/i> Mejorar\u003c/button>\u003cbutton type=\"button\" class=\" \"  data-action=\"pestana\" data-p=\"guia\">\u003ci class=\"fa-solid fa-circle-question\" aria-hidden=\"true\">\u003c/i> Ayuda rápida\u003c/button>\u003c/nav>\u003csection class=\"ecos-verbe-cuerpo\" aria-label=\"Inicio\">\u003caside class=\"ev-avisos\" aria-label=\"Tu estado\">\u003cdiv role=\"status\">\u003cb>\u003ci class=\"fa-solid fa-triangle-exclamation\" aria-hidden=\"true\">\u003c/i> Sin reacción mientras estés Cargado\u003c/b>\u003cp>Tus técnicas de reacción y tus defensas quedan bloqueadas.\u003c/p>\u003c/div>\u003cdiv role=\"status\">\u003cb>\u003ci class=\"fa-solid fa-triangle-exclamation\" aria-hidden=\"true\">\u003c/i> Malherido: necesitas cuidados\u003c/b>\u003cp>La curación tiene un tope mientras sigas Malherido. Pide tratamiento; recuperar PG no elimina por sí solo la herida.\u003c/p>\u003c/div>\u003cdiv role=\"status\">\u003cb>\u003ci class=\"fa-solid fa-triangle-exclamation\" aria-hidden=\"true\">\u003c/i> Agotamiento 4\u003c/b>\u003cp>No puedes gastar Verbe en negativo. Todavía puedes usar una técnica si tienes energía suficiente y tu estado te permite actuar.\u003c/p>\u003c/div>\u003c/aside>\u003col class=\"ev-progreso\" aria-label=\"Primeros pasos\">\u003cli class=\"hecho\" >\u003cspan aria-hidden=\"true\">✓\u003c/span>Elige elemento\u003c/li>\u003cli class=\"hecho\" >\u003cspan aria-hidden=\"true\">✓\u003c/span>Elige especialidad\u003c/li>\u003cli class=\"hecho\" >\u003cspan aria-hidden=\"true\">✓\u003c/span>Aprende una técnica\u003c/li>\u003cli class=\"actual\" aria-current=\"step\">\u003cspan aria-hidden=\"true\">4\u003c/span>Listo para jugar\u003c/li>\u003c/ol>\u003csection class=\"ev-bienvenida\">\u003cspan class=\"ev-kicker\">TU REPERTORIO ESTÁ PREPARADO\u003c/span>\u003ch2>Ya puedes entrar en acción\u003c/h2>\u003cp>Conoces \u003cb>3 técnicas\u003c/b>. Abre tu repertorio, elige qué hacer y usa el botón de la técnica.\u003c/p>\u003cdiv class=\"ev-acciones\">\u003cbutton type=\"button\" class=\"ev-principal\" data-action=\"pestana\" data-p=\"jugar\">\u003ci class=\"fa-solid fa-bolt\" aria-hidden=\"true\">\u003c/i> Usar mis técnicas\u003c/button>\u003cbutton type=\"button\" data-action=\"pestana\" data-p=\"tienda\">Aprender algo nuevo\u003c/button>\u003c/div>\n      \u003cdiv class=\"ev-mini-pasos\">\u003cspan>\u003cb>1\u003c/b> Marca el objetivo, si hace falta\u003c/span>\u003cspan>\u003cb>2\u003c/b> Pulsa «Usar técnica»\u003c/span>\u003cspan>\u003cb>3\u003c/b> Resuelve la ventana de dnd5e\u003c/span>\u003c/div>\u003cp class=\"ev-nota\">El gasto se comprueba al confirmar el uso. La posición, la visibilidad y los efectos narrativos se resuelven con el DM.\u003c/p>\u003c/section>\n      \u003cdiv class=\"ev-estadisticas\">\u003cdiv>\u003csmall>CD de tus técnicas\u003c/small>\u003cb>13\u003c/b>\u003cspan>El rival debe igualar o superar esta dificultad.\u003c/span>\u003c/div>\u003cdiv>\u003csmall>Ataque con Verbe\u003c/small>\u003cb>+5\u003c/b>\u003cspan>La técnica puede usar otra característica.\u003c/span>\u003c/div>\u003cdiv>\u003csmall>Grado máximo por nivel\u003c/small>\u003cb>2\u003c/b>\u003cspan>Cada rama también tiene su propio límite.\u003c/span>\u003c/div>\u003c/div>\n      \u003cdetails class=\"ev-ficha-personal\">\u003csummary>Mi personaje: afinidades, linaje y otros detalles\u003c/summary>\n      \u003ctable class=\"ecos-verbe-datos\">\n        \u003ctr>\u003cth>Característica \u003ci class=\"ecos-verbe-ayuda fa-solid fa-circle-question\" data-tooltip=\"La característica con la que usas el Verbe. Da la CD de tus técnicas (8 + competencia + modificador), su bonificador de ataque y suma a tu reserva.\">\u003c/i>\u003c/th>\u003ctd>Sabiduría · CD de tus técnicas \u003cb>13\u003c/b> · ataque \u003cb>+5\u003c/b>\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Naturaleza\u003c/th>\u003ctd>Fuego\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Otra naturaleza\u003c/th>\u003ctd>Puede que tu Verbe responda a otra naturaleza que no conoces. Se intenta descubrir con «Probar» en Aprender; si responde, aprender la técnica cuesta los Trazos indicados.\u003c/td>\u003c/tr>\n        \n        \u003ctr>\u003cth>Linaje\u003c/th>\u003ctd>Desconocido. Hay cosas de tu sangre que no tienes manera de saber; si las hay, aparecen jugando.\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Rama principal\u003c/th>\u003ctd>Forma\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Grado máximo \u003ci class=\"ecos-verbe-ayuda fa-solid fa-circle-question\" data-tooltip=\"Qué tan fuerte es una técnica, de 0 a 11 (como el nivel de un conjuro, con dos grados más arriba del 9). Tu grado máximo sube con tu nivel: grado 1 en el nivel 1, 2 en el 3, 3 en el 5… 9 en el 17, 10 en el 19 y 11 en el 20. En cada rama, además, llegas solo hasta lo que deja tu rango.\">\u003c/i>\u003c/th>\u003ctd>2 (eres nivel 3) · el grado 3 llega en el nivel 5\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Control del Verbe \u003ci class=\"ecos-verbe-ayuda fa-solid fa-circle-question\" data-tooltip=\"Una habilidad nueva de tu hoja (con Sabiduría). Se tira para ganar un choque entre dos técnicas, romper un Velo, abrir los Cerrojos y no perderse en la Quietud. Se compra en Mejorar → Especialidades.\">\u003c/i>\u003c/th>\u003ctd>Sin competencia (se compra en Ramas)\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Sobreesfuerzo \u003ci class=\"ecos-verbe-ayuda fa-solid fa-circle-question\" data-tooltip=\"Puedes gastar Verbe que no tienes: tu barra baja de 0 hasta la mitad de tu reserva en negativo. Cada técnica que usas en negativo te pide una salvación de CON (CD 10 + su grado); si fallas, ganas 1 Agotamiento. Lo que quede en negativo cuesta el doble de recuperar.\">\u003c/i>\u003c/th>\u003ctd>Puedes gastar Verbe que no tienes hasta llegar a -10.\u003c/td>\u003c/tr>\n        \n        \n      \u003c/table>\u003c/details>\n      \n      \u003cdetails>\u003csummary>Historial\u003c/summary>\u003cul>\u003c/ul>\u003c/details>\u003c/section>","jugar":"\u003cheader class=\"ecos-verbe-cabpanel\">\n      \u003cdiv class=\"ev-identidad\">\u003cspan class=\"ev-kicker\">EL VERBE · NIVEL 3\u003c/span>\u003cstrong>Ari · viajero del valle\u003c/strong>\u003csmall>Forma · Fuego\u003c/small>\u003c/div>\n      \u003cdiv class=\"ecos-verbe-res\">\u003cdiv class=\"ev-recurso-titulo\">\u003cb>\u003ci class=\"fa-solid fa-droplet\" aria-hidden=\"true\">\u003c/i> Verbe \u003cspan>0 / 21\u003c/span>\u003c/b>\u003csmall>ENERGÍA PARA USAR\u003c/small>\u003c/div>\u003cdiv class=\"ecos-verbe-barra grande \" role=\"meter\" aria-label=\"Reserva de Verbe\" aria-valuemin=\"0\" aria-valuemax=\"21\" aria-valuenow=\"0\" aria-valuetext=\"0 de 21 de Verbe\">\u003cdiv style=\"width:0%\">\u003c/div>\u003c/div>\n        \u003csmall>Se gasta al usar técnicas; vuelve al descansar.\u003c/small>\u003c/div>\n      \u003cdiv class=\"ecos-verbe-trazos hay\">\u003cspan class=\"n\">16\u003c/span>\u003cspan class=\"t\">\u003cb>Trazos\u003c/b> para aprender\u003c/span>\u003csmall>Se gastan una vez por compra\u003c/small>\u003c/div>\n    \u003c/header>\u003cnav class=\"ecos-verbe-tabs\" aria-label=\"Panel del Verbe\">\u003cbutton type=\"button\" class=\" \"  data-action=\"pestana\" data-p=\"resumen\">\u003ci class=\"fa-solid fa-house\" aria-hidden=\"true\">\u003c/i> Inicio\u003c/button>\u003cbutton type=\"button\" class=\"activa \" aria-current=\"page\" data-action=\"pestana\" data-p=\"jugar\">\u003ci class=\"fa-solid fa-bolt\" aria-hidden=\"true\">\u003c/i> Mis técnicas\u003c/button>\u003cbutton type=\"button\" class=\" \"  data-action=\"pestana\" data-p=\"tienda\">\u003ci class=\"fa-solid fa-book-open\" aria-hidden=\"true\">\u003c/i> Aprender\u003c/button>\u003cbutton type=\"button\" class=\" \"  data-action=\"pestana\" data-p=\"ramas\">\u003ci class=\"fa-solid fa-seedling\" aria-hidden=\"true\">\u003c/i> Mejorar\u003c/button>\u003cbutton type=\"button\" class=\" \"  data-action=\"pestana\" data-p=\"guia\">\u003ci class=\"fa-solid fa-circle-question\" aria-hidden=\"true\">\u003c/i> Ayuda rápida\u003c/button>\u003c/nav>\u003csection class=\"ecos-verbe-cuerpo\" aria-label=\"Mis técnicas\">\u003caside class=\"ev-avisos\" aria-label=\"Tu estado\">\u003cdiv role=\"status\">\u003cb>\u003ci class=\"fa-solid fa-triangle-exclamation\" aria-hidden=\"true\">\u003c/i> Sin reacción mientras estés Cargado\u003c/b>\u003cp>Tus técnicas de reacción y tus defensas quedan bloqueadas.\u003c/p>\u003c/div>\u003cdiv role=\"status\">\u003cb>\u003ci class=\"fa-solid fa-triangle-exclamation\" aria-hidden=\"true\">\u003c/i> Malherido: necesitas cuidados\u003c/b>\u003cp>La curación tiene un tope mientras sigas Malherido. Pide tratamiento; recuperar PG no elimina por sí solo la herida.\u003c/p>\u003c/div>\u003cdiv role=\"status\">\u003cb>\u003ci class=\"fa-solid fa-triangle-exclamation\" aria-hidden=\"true\">\u003c/i> Agotamiento 4\u003c/b>\u003cp>No puedes gastar Verbe en negativo. Todavía puedes usar una técnica si tienes energía suficiente y tu estado te permite actuar.\u003c/p>\u003c/div>\u003c/aside>\u003cdiv class=\"ev-titulo-pagina\">\u003cdiv>\u003cspan class=\"ev-kicker\">TU REPERTORIO\u003c/span>\u003ch2>¿Qué quieres hacer?\u003c/h2>\u003cp>Usa una técnica desde aquí. Se abrirá la ventana habitual de dnd5e para confirmar el uso.\u003c/p>\u003c/div>\u003cspan class=\"ev-contador\">3 conocidas\u003c/span>\u003c/div>\n      \u003cdiv class=\"ev-instruccion\">\u003ci class=\"fa-solid fa-crosshairs\" aria-hidden=\"true\">\u003c/i>\u003cspan>\u003cb>Si afecta a otro, marca su token antes de usarla.\u003c/b> El alcance y las condiciones de cada técnica siguen contando.\u003c/span>\u003c/div>\n      \u003cdiv class=\"ecos-verbe-filtros\">\u003clabel class=\"ev-busqueda\">\u003cspan>Buscar en mis técnicas\u003c/span>\u003cinput type=\"search\" data-filtro-uso=\"texto\" placeholder=\"Nombre o efecto…\" value=\"\">\u003c/label>\u003clabel>\u003cinput type=\"checkbox\" data-filtro-uso=\"solo\" > Ocultar las bloqueadas por recursos o estado\u003c/label>\u003c/div>\n      \u003cdiv class=\"ev-tarjetas\">\u003carticle class=\"ev-tecnica \">\n    \u003cdiv class=\"ev-tec-top\">\u003cspan class=\"ev-etiqueta\">Grado 1\u003c/span>\u003cspan class=\"ev-etiqueta suave\">Forma\u003c/span>\u003cspan class=\"ev-etiqueta suave\">Fuego\u003c/span>\u003c/div>\n    \u003ch3>Aliento de brasa\u003c/h3>\u003cp class=\"ev-texto-tecnica\">DES, mitad: 3d6 fuego. Prende lo que arde. Sube: +1d6.\u003c/p>\n    \u003cdiv class=\"ev-tec-datos\">\u003cspan>\u003ci class=\"fa-regular fa-clock\" aria-hidden=\"true\">\u003c/i> Acción\u003c/span>\u003cspan>\u003ci class=\"fa-solid fa-crosshairs\" aria-hidden=\"true\">\u003c/i> sobre ti\u003c/span>\u003cspan>cono 4,5 m\u003c/span>\u003c/div>\n    \u003cdiv class=\"ev-costes\">\u003cspan>\u003cb>2\u003c/b> Verbe \u003csmall>por uso base\u003c/small>\u003c/span>\u003c/div>\n    \u003cp class=\"ev-disponibilidad bloqueada\">\u003ci class=\"fa-solid fa-lock\" aria-hidden=\"true\">\u003c/i> Con Agotamiento 4 no puede gastar Verbe en negativo.\u003c/p>\u003cp class=\"ev-nota\">Puedes elevar el grado en la ventana de uso; el coste aumentará.\u003c/p>\n    \u003cfooter>\u003cbutton type=\"button\" class=\"ev-principal\" data-action=\"usar\" data-id=\"fuego-aliento\" disabled>Usar técnica\u003c/button>\u003cbutton type=\"button\" data-action=\"ficha\" data-id=\"fuego-aliento\">Ver detalles\u003c/button>\u003c/footer>\n  \u003c/article>\u003carticle class=\"ev-tecnica \">\n    \u003cdiv class=\"ev-tec-top\">\u003cspan class=\"ev-etiqueta\">Grado 1\u003c/span>\u003cspan class=\"ev-etiqueta suave\">Forma\u003c/span>\u003c/div>\n    \u003ch3>Sustitución\u003c/h3>\u003csmall class=\"ev-referencia\">Kawarimi no Jutsu\u003c/small>\u003cp class=\"ev-texto-tecnica\">Cuando un ataque con tirada que ves venir te va a impactar, te cambias por un objeto de tu tamaño o menor a 3 m o menos (un tronco, una capa, una piedra): el ataque falla y el objeto recibe el golpe. Cuesta 2 Verbe, y 2 más por cada grado que el ataque supere tu grado máximo (grado de un ataque: el de su técnica o conjuro; si es un arma o una criatura, la mitad de su nivel o VD). No sirve contra áreas ni salvaciones, ni sin un objeto cerca.\u003c/p>\n    \u003cdiv class=\"ev-tec-datos\">\u003cspan>\u003ci class=\"fa-regular fa-clock\" aria-hidden=\"true\">\u003c/i> Reacción\u003c/span>\u003cspan>\u003ci class=\"fa-solid fa-crosshairs\" aria-hidden=\"true\">\u003c/i> sobre ti\u003c/span>\u003c/div>\n    \u003cdiv class=\"ev-costes\">\u003cspan>\u003cb>2\u003c/b> Verbe \u003csmall>por uso base\u003c/small>\u003c/span>\u003c/div>\n    \u003cp class=\"ev-disponibilidad bloqueada\">\u003ci class=\"fa-solid fa-lock\" aria-hidden=\"true\">\u003c/i> No tiene una reacción disponible.\u003c/p>\u003cp class=\"ev-nota\">Con midi-qol, se ofrece al recibir un ataque. Sin esa integración, resuélvela con el DM. El coste final depende del ataque.\u003c/p>\n    \u003cfooter>\u003cbutton type=\"button\" class=\"ev-principal\" data-action=\"ficha\" data-id=\"forma-sustitucion\" >Cómo usar esta defensa\u003c/button>\u003cbutton type=\"button\" data-action=\"ficha\" data-id=\"forma-sustitucion\">Ver detalles\u003c/button>\u003c/footer>\n  \u003c/article>\u003carticle class=\"ev-tecnica \">\n    \u003cdiv class=\"ev-tec-top\">\u003cspan class=\"ev-etiqueta\">Grado 1\u003c/span>\u003cspan class=\"ev-etiqueta suave\">Forma\u003c/span>\u003c/div>\n    \u003ch3>Andar por muros\u003c/h3>\u003csmall class=\"ev-referencia\">Kinobori no Waza\u003c/small>\u003cp class=\"ev-texto-tecnica\">Caminas por paredes, techos y agua como por el suelo, con las manos libres. Si pierdes la Concentración en una pared, caes.\u003c/p>\n    \u003cdiv class=\"ev-tec-datos\">\u003cspan>\u003ci class=\"fa-regular fa-clock\" aria-hidden=\"true\">\u003c/i> Acción adicional\u003c/span>\u003cspan>\u003ci class=\"fa-solid fa-crosshairs\" aria-hidden=\"true\">\u003c/i> sobre ti\u003c/span>\u003c/div>\n    \u003cdiv class=\"ev-costes\">\u003cspan>\u003cb>2\u003c/b> Verbe \u003csmall>por uso base\u003c/small>\u003c/span>\u003c/div>\n    \u003cp class=\"ev-disponibilidad bloqueada\">\u003ci class=\"fa-solid fa-lock\" aria-hidden=\"true\">\u003c/i> Con Agotamiento 4 no puede gastar Verbe en negativo.\u003c/p>\u003cp class=\"ev-nota\">Puedes elevar el grado en la ventana de uso; el coste aumentará.\u003c/p>\n    \u003cfooter>\u003cbutton type=\"button\" class=\"ev-principal\" data-action=\"usar\" data-id=\"forma-andar\" disabled>Usar técnica\u003c/button>\u003cbutton type=\"button\" data-action=\"ficha\" data-id=\"forma-andar\">Ver detalles\u003c/button>\u003c/footer>\n  \u003c/article>\u003c/div>\u003c/section>"},"dm":{"resumen":"\u003cheader class=\"ecos-verbe-cabpanel\">\n      \u003cdiv class=\"ev-identidad\">\u003cspan class=\"ev-kicker\">EL VERBE · NIVEL 3\u003c/span>\u003cstrong>Ari · viajero del valle\u003c/strong>\u003csmall>Forma · Fuego + Viento + Tierra\u003c/small>\u003c/div>\n      \u003cdiv class=\"ecos-verbe-res\">\u003cdiv class=\"ev-recurso-titulo\">\u003cb>\u003ci class=\"fa-solid fa-droplet\" aria-hidden=\"true\">\u003c/i> Verbe \u003cspan>18 / 21\u003c/span>\u003c/b>\u003csmall>ENERGÍA PARA USAR\u003c/small>\u003c/div>\u003cdiv class=\"ecos-verbe-barra grande \" role=\"meter\" aria-label=\"Reserva de Verbe\" aria-valuemin=\"0\" aria-valuemax=\"21\" aria-valuenow=\"18\" aria-valuetext=\"18 de 21 de Verbe\">\u003cdiv style=\"width:85.71428571428571%\">\u003c/div>\u003c/div>\n        \u003csmall>Se gasta al usar técnicas; vuelve al descansar.\u003c/small>\u003c/div>\n      \u003cdiv class=\"ecos-verbe-trazos hay\">\u003cspan class=\"n\">16\u003c/span>\u003cspan class=\"t\">\u003cb>Trazos\u003c/b> para aprender\u003c/span>\u003csmall>Se gastan una vez por compra\u003c/small>\u003c/div>\n    \u003c/header>\u003cdetails class=\"ecos-verbe-dmbar\">\u003csummary>\u003ci class=\"fa-solid fa-sliders\" aria-hidden=\"true\">\u003c/i> Herramientas del DM \u003c/summary>\u003cdiv>\u003cb>Trazos:\u003c/b>\n        \u003cbutton type=\"button\" data-action=\"trazosDM\" data-n=\"-1\">-1\u003c/button>\u003cbutton type=\"button\" data-action=\"trazosDM\" data-n=\"1\">+1\u003c/button>\u003cbutton type=\"button\" data-action=\"trazosDM\" data-n=\"2\">+2\u003c/button>\u003cbutton type=\"button\" data-action=\"trazosDM\" data-n=\"5\">+5\u003c/button>\n        · \u003cbutton type=\"button\" data-action=\"verbeDM\" data-n=\"lleno\">Llenar Verbe\u003c/button>\n        · \u003cbutton type=\"button\" data-action=\"comoJugador\" class=\"\">\u003ci class=\"fa-solid fa-eye\">\u003c/i> Ver como el jugador\u003c/button>\u003c/div>\u003c/details>\u003cnav class=\"ecos-verbe-tabs\" aria-label=\"Panel del Verbe\">\u003cbutton type=\"button\" class=\" \"  data-action=\"pestana\" data-p=\"resumen\">\u003ci class=\"fa-solid fa-house\" aria-hidden=\"true\">\u003c/i> Inicio\u003c/button>\u003cbutton type=\"button\" class=\" \"  data-action=\"pestana\" data-p=\"jugar\">\u003ci class=\"fa-solid fa-bolt\" aria-hidden=\"true\">\u003c/i> Mis técnicas\u003c/button>\u003cbutton type=\"button\" class=\" \"  data-action=\"pestana\" data-p=\"tienda\">\u003ci class=\"fa-solid fa-book-open\" aria-hidden=\"true\">\u003c/i> Aprender\u003c/button>\u003cbutton type=\"button\" class=\" \"  data-action=\"pestana\" data-p=\"ramas\">\u003ci class=\"fa-solid fa-seedling\" aria-hidden=\"true\">\u003c/i> Mejorar\u003c/button>\u003cbutton type=\"button\" class=\" \"  data-action=\"pestana\" data-p=\"guia\">\u003ci class=\"fa-solid fa-circle-question\" aria-hidden=\"true\">\u003c/i> Ayuda rápida\u003c/button>\u003cbutton type=\"button\" class=\"activa dm\" aria-current=\"page\" data-action=\"pestana\" data-p=\"dm\">\u003ci class=\"fa-solid fa-sliders\" aria-hidden=\"true\">\u003c/i> DM\u003c/button>\u003c/nav>\u003csection class=\"ecos-verbe-cuerpo\" aria-label=\"DM\">\u003cp>\u003cbutton type=\"button\" data-action=\"editorCatalogo\">\u003ci class=\"fa-solid fa-pen-nib\">\u003c/i> Taller del DM · crear y publicar técnicas universales\u003c/button>\u003c/p>\u003cdiv class=\"ecos-verbe-intro\">\u003cp>\u003cb>Solo tú ves esta pestaña.\u003c/b> Pedidos, Trazos, deshacer compras y cambios a mano. «Ver como el jugador» (arriba) muestra el panel tal como lo ve él.\u003c/p>\u003c/div>\n      \u003cdetails class=\"ecos-verbe-dmsec\" >\u003csummary>Repertorio shinobi: tradiciones, bestias y rituales\u003c/summary>\n        \u003cp>Tradición: \u003cselect name=\"shinobiTradicion\">\u003coption value=\"rayo-negro\" >Rayo negro\u003c/option>\u003coption value=\"cuervo\" >Cuervos del contrato\u003c/option>\u003coption value=\"sombra\" >Atadura de sombra\u003c/option>\u003coption value=\"mente\" >Cambio de mente\u003c/option>\u003coption value=\"expansion\" >Expansión corporal\u003c/option>\u003coption value=\"enjambre\" >Colonia de insectos\u003c/option>\u003coption value=\"colmillo\" >Manada de colmillos\u003c/option>\u003coption value=\"marioneta\" >Marionetismo\u003c/option>\u003coption value=\"tinta\" >Tinta viva\u003c/option>\u003coption value=\"papel\" >Arte del papel\u003c/option>\u003coption value=\"arcilla\" >Escultura explosiva\u003c/option>\u003coption value=\"sonido\" >Genjutsu sonoro\u003c/option>\u003coption value=\"arena\" >Control de arena\u003c/option>\u003coption value=\"magnetismo\" >Magnetismo\u003c/option>\u003coption value=\"sellado\" >Fórmulas de sellado\u003c/option>\u003coption value=\"barrera\" >Formaciones de barrera\u003c/option>\u003coption value=\"medicina-avanzada\" >Medicina avanzada\u003c/option>\u003coption value=\"alma\" >Artes del alma\u003c/option>\u003coption value=\"sensor\" >Sensor especializado\u003c/option>\u003coption value=\"sabio-sapo\" >Maestría sabia de los sapos\u003c/option>\u003coption value=\"sabio-serpiente\" >Maestría sabia de las serpientes\u003c/option>\u003coption value=\"invocacion-inversa\" >Invocación inversa\u003c/option>\u003coption value=\"sapo\" >Contrato: sapo\u003c/option>\u003coption value=\"serpiente\" n value=\"gyuki\" >Gyūki · ocho colas\u003c/option>\u003coption value=\"kurama\" >Kurama · nueve colas\u003c/option>\u003coption value=\"juubi\" >Jūbi · receptáculo mayor\u003c/option>\u003coption value=\"sora\" >Pseudohuésped residual (anime)\u003c/option>\u003c/select> Vínculo \u003cselect name=\"shinobiVinculo\">\u003coption value=\"1\" selected>1 · inestable\u003c/option>\u003coption value=\"2\" >2 · control\u003c/option>\u003coption value=\"3\" >3 · cooperación\u003c/option>\u003c/select>\u003cbutton type=\"button\" data-action=\"shinobiDM\" data-campo=\"vasija\" data-de=\"shinobiBestia\">Guardar vínculo\u003c/button>\u003c/p>\n        \u003cp>Ritual preparado: \u003cselect name=\"shinobiRitual\">\u003c/select>\u003cbutton type=\"button\" data-action=\"shinobiDM\" data-campo=\"ritual\" data-de=\"shinobiRitual\">Autorizar un uso\u003c/button>\u003c/p>\u003cp class=\"ecos-nota\">Confirma antes preparación, participantes, precio, salvación y resultado. El permiso se consume al usarlo; un descanso no lo repone.\u003c/p>\n        \u003cp>Desgaste ocular: \u003cselect name=\"shinobiOjo\">\u003coption value=\"aster\" >Ojo que registra: 0/6 · 0 sacrificados\u003c/option>\u003coption value=\"ikkra\" >Ojo de vidrio: 0/6 · 0 sacrificados\u003c/option>\u003coption value=\"nocta\" >Ojo que arropa: 0/6 · 0 sacrificados\u003c/option>\u003coption value=\"madre\" >Ojo de los caminos: 0/6 · 0 sacrificados\u003c/option>\u003coption value=\"ennia\" >Ojo de aguja: 0/6 · 0 sacrificados\u003c/option>\u003coption value=\"moneta\" >Ojo de la balanza: 0/6 · 0 sacrificados\u003c/option>\u003coption value=\"ahnkree\" >Ojo que devuelve: 0/6 · 0 sacrificados\u003c/option>\u003coption value=\"orbe\" >Ojo de los seis senderos: 0/6 · 0 sacrificados\u003c/option>\u003coption value=\"carmesi\" >Ojo carmesí: 0/6 · 0 sacrificados\u003c/option>\u003coption value=\"brasa\" >Ojo de la brasa oculta: 0/6 · 0 sacrificados\u003c/option>\u003c/select>\u003cbutton type=\"button\" data-action=\"shinobiDM\" data-campo=\"ocular\" data-de=\"shinobiOjo\">Restaurar tras resolver la historia\u003c/button>\u003c/p>\n        \u003cp>Reliquia: \u003cselect name=\"shinobiArtefacto\">\u003coption value=\"samehada\" >Samehada\u003c/option>\u003coption value=\"kubikiribocho\" >Kubikiribōchō\u003c/option>\u003coption value=\"hiramekarei\" >Hiramekarei\u003c/option>\u003coption value=\"kiba\" >Kiba\u003c/option>\u003coption value=\"shibuki\" >Shibuki\u003c/option>\u003coption value=\"nuibari\" >Nuibari\u003c/option>\u003coption value=\"kabutowari\" >Kabutowari\u003c/option>\u003coption value=\"kusanagi\" >Kusanagi\u003c/option>\u003coption value=\"gunbai\" >Gunbai\u003c/option>\u003coption value=\"bashosen\" >Bashōsen\u003c/option>\u003coption value=\"totsuka\" >Espada de Totsuka\u003c/option>\u003coption value=\"yata\" >Espejo de Yata\u003c/option>\u003coption value=\"benihisago\" >Benihisago\u003c/option>\u003coption value=\"kokinjo\" >Kōkinjō\u003c/option>\u003coption value=\"shichiseiken\" >Shichiseiken\u003c/option>\u003coption value=\"kohaku\" >Kohaku no Jōhei\u003c/option>\u003coption value=\"marioneta-kazekage\" >Marioneta del Tercer Kazekage\u003c/option>\u003c/select>\u003cbutton type=\"button\" data-action=\"artefactoDM\">Dar objeto equipado\u003c/button>\u003c/p>\n        \u003cp>Transferir energía positiva a: \u003cselect name=\"shinobiDestino\">\u003c/select>\u003cinput name=\"shinobiCantidad\" type=\"number\" min=\"1\" value=\"1\" style=\"width:5em\">\u003cbutton type=\"button\" data-action=\"transferirDM\">Transferir Verbe\u003c/button>\u003c/p>\u003cp class=\"ecos-nota\">Descuenta al origen; el receptor paga deuda a 2:1 y respeta su máximo. Úsalo solo después de resolver contacto, absorción y salvación.\u003c/p>\u003c/details>\n      \u003cdetails class=\"ecos-verbe-dmsec\" >\u003csummary>Pedidos (0)\u003c/summary>\u003cul>\u003cli>Nada pendiente.\u003c/li>\u003c/ul>\u003c/details>\n      \u003cdetails class=\"ecos-verbe-dmsec\" open>\u003csummary>Trazos\u003c/summary>\u003cp>Tiene \u003cb>16\u003c/b> libres · 0 gastados · 16 en total (16 por nivel y 0 dados por ti o por Monedas).\u003c/p>\n        \u003cp>Dar o quitar: \u003cinput type=\"number\" name=\"trazosN\" value=\"1\" style=\"width:5em\"> \u003cbutton type=\"button\" data-action=\"trazosDM\" data-n=\"campo\">Aplicar\u003c/button> \u003csmall>(un número negativo los quita)\u003c/small>\u003c/p>\n        \u003cp>Dejarle exactamente \u003cinput type=\"number\" name=\"trazosFijar\" min=\"0\" value=\"16\" style=\"width:5em\"> libres \u003cbutton type=\"button\" data-action=\"fijarTrazos\">Fijar\u003c/button>\u003c/p>\n        \u003cp>Verbe: \u003cbutton type=\"button\" data-action=\"verbeDM\" data-n=\"-5\">-5\u003c/button> \u003cbutton type=\"button\" data-action=\"verbeDM\" data-n=\"-1\">-1\u003c/button> \u003cbutton type=\"button\" data-action=\"verbeDM\" data-n=\"1\">+1\u003c/button> \u003cbutton type=\"button\" data-action=\"verbeDM\" data-n=\"5\">+5\u003c/button> \u003cbutton type=\"button\" data-action=\"verbeDM\" data-n=\"lleno\">Llenar\u003c/button>\u003c/p>\u003c/details>\n      \u003cdetails class=\"ecos-verbe-dmsec\" >\u003csummary>Deshacer compras\u003c/summary>\u003cp class=\"ecos-nota\">«DM, no me gustó esto»: deshaz la compra y vuelven sus Trazos. Las de un mismo camino se deshacen de la más alta a la más baja.\u003c/p>\n        \u003cul>\u003cli>No ha comprado nada todavía.\u003c/li>\u003c/ul>\n        \u003cp>\u003cb>Rehacer desde cero\u003c/b>: devuelve todo lo comprado. \u003clabel>\u003cinput type=\"checkbox\" name=\"rehacerNat\"> y que vuelva a elegir naturaleza\u003c/label> \u003clabel>\u003cinput type=\"checkbox\" name=\"rehacerPrincipal\"> y rama principal\u003c/label>\n          \u003cbutton type=\"button\" data-action=\"rehacer\">\u003ci class=\"fa-solid fa-rotate-left\">\u003c/i> Rehacer\u003c/button>\u003c/p>\u003c/details>\n      \u003cdetails class=\"ecos-verbe-dmsec\" >\u003csummary>Cambiar a mano (no toca los Trazos)\u003c/summary>\n        \ s concedidas: Fuego, Viento, Tierra. Abre Sangre con fuerza distinta de «Sin sangre» y permite técnicas que piden Disolución.\u003c/p>\n      \u003cp>\u003cb>Despertar:\u003c/b> La brasa: resistencia al fuego, y sus técnicas de Fuego, Viento y Tierra suman 1d6.\u003c/p>\u003c/div>\u003cdiv class=\"ecos-verbe-desc\" data-de=\"fuerza\">\u003cp>\u003cb>Sangre Media.\u003c/b> Sus técnicas de Sangre llegan hasta grado 5, además de los límites por nivel y rango. Cada subida de rango de Sangre cuesta lo habitual, sin recargo. El don Mítico de Sangre supera el tope de fuerza; no supera tu nivel ni el rango de rama.\u003c/p>\u003cp>La fuerza no cambia por sí sola la reserva base ni concede etapas de Mirada. Esas ventajas dependen del linaje y de sus dones específicos.\u003c/p>\u003c/div>\n        \u003cp class=\"ecos-nota\">El linaje lo eliges siempre tú: el jugador nunca lo elige. Si no lo sabe, en su panel dice «Desconocido», igual que para quien no tiene ninguno.\u003c/p>\u003c/details>\n      \u003cdetails class=\"ecos-verbe-dmsec\" >\u003csummary>Ramas, ojos, pactos y escuela\u003c/summary>\u003cp>Abrir una rama: \u003cselect name=\"abiertas\">\u003coption value=\"mirada\" >Mirada\u003c/option>\u003coption value=\"pacto\" >Pacto\u003c/option>\u003coption value=\"pulso\" >Pulso\u003c/option>\u003coption value=\"vasija\" >Vasija\u003c/option>\u003c/select> \u003cbutton type=\"button\" data-action=\"lista\" data-campo=\"abiertas\" data-texto=\"rama\">Abrir\u003c/button>\u003c/p>\n        \u003cp>Despertar un ojo: \u003cselect name=\"mirada\">\u003coption value=\"aster\" >Ojo que registra (Ojo de Aster, «el que registra»)\u003c/option>\u003coption value=\"ikkra\" >Ojo de vidrio (Ojo de Ikkra, «de vidrio»)\u003c/option>\u003coption value=\"nocta\" >Ojo que arropa (Ojo de Nocta, «el que arropa»)\u003c/option>\u003coption value=\"madre\" >Ojo de los caminos (Ojo de la Madre)\u003c/option>\u003coption value=\"ennia\" >Ojo de aguja (Ojo de Ennia, «la aguja»)\u003c/option>\u003co
