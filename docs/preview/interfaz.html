nde \" role=\"meter\" aria-label=\"Reserva de Verbe\" aria-valuemin=\"0\" aria-valuemax=\"170\" aria-valuenow=\"48\" aria-valuetext=\"48 de 170 de Verbe\">\u003cdiv style=\"width:28.235294117647058%\">\u003c/div>\u003c/div>\n        \u003csmall>Se gasta al usar técnicas; vuelve al descansar.\u003c/small>\u003c/div>\n      \u003cdiv class=\"ecos-verbe-trazos hay\">\u003cspan class=\"n\">84\u003c/span>\u003cspan class=\"t\">\u003cb>Trazos\u003c/b> para aprender\u003c/span>\u003csmall>Se gastan una vez por compra\u003c/small>\u003c/div>\n    \u003c/header>\u003cnav class=\"ecos-verbe-tabs\" aria-label=\"Panel del Verbe\">\u003cbutton type=\"button\" class=\"activa \" aria-current=\"page\" data-action=\"pestana\" data-p=\"resumen\">\u003ci class=\"fa-solid fa-house\" aria-hidden=\"true\">\u003c/i> Inicio\u003c/button>\u003cbutton type=\"button\" class=\" \"  data-action=\"pestana\" data-p=\"jugar\">\u003ci class=\"fa-solid fa-bolt\" aria-hidden=\"true\">\u003c/i> Mis técnicas\u003c/button>\u003cbutton type=\"button\" class=\" \"  data-action=\"pestana\" data-p=\"tienda\">\u003ci class=\"fa-solid fa-book-open\" aria-hidden=\"true\">\u003c/i> Aprender\u003c/button>\u003cbutton type=\"button\" class=\" \"  data-action=\"pestana\" data-p=\"ramas\">\u003ci class=\"fa-solid fa-seedling\" aria-hidden=\"true\">\u003c/i> Mejorar\u003c/button>\u003cbutton type=\"button\" class=\" \"  data-action=\"pestana\" data-p=\"guia\">\u003ci class=\"fa-solid fa-circle-question\" aria-hidden=\"true\">\u003c/i> Ayuda rápida\u003c/button>\u003c/nav>\u003csection class=\"ecos-verbe-cuerpo\" aria-label=\"Inicio\">\u003col class=\"ev-progreso\" aria-label=\"Primeros pasos\">\u003cli class=\"hecho\" >\u003cspan aria-hidden=\"true\">✓\u003c/span>Elige elemento\u003c/li>\u003cli class=\"hecho\" >\u003cspan aria-hidden=\"true\">✓\u003c/span>Elige especialidad\u003c/li>\u003cli class=\"hecho\" >\u003cspan aria-hidden=\"true\">✓\u003c/span>Aprende una técnica\u003c/li>\u003cli class=\"actual\" aria-current=\"step\">\u003cspan aria-hidden=\"true\">4\u003c/span>Listo para jugar\u003c/li>\u003c/ol>\u003csection class=\"ev-bienvenida\">\u003cspan class=\"ev-kicker\">TU REPERTORIO ESTÁ PREPARADO\u003c/span>\u003ch2>Ya puedes entrar en acción\u003c/h2>\u003cp>Conoces \u003cb>4 técnicas\u003c/b>. Abre tu repertorio, elige qué hacer y usa el botón de la técnica.\u003c/p>\u003cdiv class=\"ev-acciones\">\u003cbutton type=\"button\" class=\"ev-principal\" data-action=\"pestana\" data-p=\"jugar\">\u003ci class=\"fa-solid fa-bolt\" aria-hidden=\"true\">\u003c/i> Usar mis técnicas\u003c/button>\u003cbutton type=\"button\" data-action=\"pestana\" data-p=\"tienda\">Aprender algo nuevo\u003c/button>\u003c/div>\n      \u003cdiv class=\"ev-mini-pasos\">\u003cspan>\u003cb>1\u003c/b> Marca el objetivo, si hace falta\u003c/span>\u003cspan>\u003cb>2\u003c/b> Pulsa «Usar técnica»\u003c/span>\u003cspan>\u003cb>3\u003c/b> Resuelve la ventana de dnd5e\u003c/span>\u003c/div>\u003cp class=\"ev-nota\">El gasto se comprueba al confirmar el uso. La posición, la visibilidad y los efectos narrativos se resuelven con el DM.\u003c/p>\u003c/section>\n      \u003cdiv class=\"ev-estadisticas\">\u003cdiv>\u003csmall>CD de tus técnicas\u003c/small>\u003cb>13\u003c/b>\u003cspan>El rival debe igualar o superar esta dificultad.\u003c/span>\u003c/div>\u003cdiv>\u003csmall>Ataque con Verbe\u003c/small>\u003cb>+5\u003c/b>\u003cspan>La técnica puede usar otra característica.\u003c/span>\u003c/div>\u003cdiv>\u003csmall>Grado máximo por nivel\u003c/small>\u003cb>11\u003c/b>\u003cspan>Cada rama también tiene su propio límite.\u003c/span>\u003c/div>\u003c/div>\n      \u003cdetails class=\"ev-ficha-personal\">\u003csummary>Mi personaje: afinidades, linaje y otros detalles\u003c/summary>\n      \u003ctable class=\"ecos-verbe-datos\">\n        \u003ctr>\u003cth>Característica \u003ci class=\"ecos-verbe-ayuda fa-solid fa-circle-question\" data-tooltip=\"La característica con la que usas el Verbe. Da la CD de tus técnicas (8 + competencia + modificador), su bonificador de ataque y suma a tu reserva.\">\u003c/i>\u003c/th>\u003ctd>Sabiduría · CD de tus técnicas \u003cb>13\u003c/b> · ataque \u003cb>+5\u003c/b>\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Naturaleza\u003c/th>\u003ctd>Fuego\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Otra naturaleza\u003c/th>\u003ctd>Puede que tu Verbe responda a otra naturaleza que no conoces. Se intenta descubrir con «Probar» en Aprender; si responde, aprender la técnica cuesta los Trazos indicados.\u003c/td>\u003c/tr>\n        \n        \u003ctr>\u003cth>Linaje\u003c/th>\u003ctd>Desconocido. Hay cosas de tu sangre que no tienes manera de saber; si las hay, aparecen jugando.\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Rama principal\u003c/th>\u003ctd>Umbral\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Grado máximo \u003ci class=\"ecos-verbe-ayuda fa-solid fa-circle-question\" data-tooltip=\"Qué tan fuerte es una técnica, de 0 a 11 (como el nivel de un conjuro, con dos grados más arriba del 9). Tu grado máximo sube con tu nivel: grado 1 en el nivel 1, 2 en el 3, 3 en el 5… 9 en el 17, 10 en el 19 y 11 en el 20. En cada rama, además, llegas solo hasta lo que deja tu rango.\">\u003c/i>\u003c/th>\u003ctd>11 (eres nivel 20) · es el grado más alto\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Control del Verbe \u003ci class=\"ecos-verbe-ayuda fa-solid fa-circle-question\" data-tooltip=\"Una habilidad nueva de tu hoja (con Sabiduría). Se tira para ganar un choque entre dos técnicas, romper un Velo, abrir los Cerrojos y no perderse en la Quietud. Se compra en Mejorar → Especialidades.\">\u003c/i>\u003c/th>\u003ctd>Sin competencia (se compra en Ramas)\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Sobreesfuerzo \u003ci class=\"ecos-verbe-ayuda fa-solid fa-circle-question\" data-tooltip=\"Puedes gastar Verbe que no tienes: tu barra baja de 0 hasta la mitad de tu reserva en negativo. Cada técnica que usas en negativo te pide una salvación de CON (CD 10 + su grado); si fallas, ganas 1 Agotamiento. Lo que quede en negativo cuesta el doble de recuperar.\">\u003c/i>\u003c/th>\u003ctd>Puedes gastar Verbe que no tienes hasta llegar a -85.\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Ojos\u003c/th>\u003ctd>Ojo que registra, etapa 4\u003c/td>\u003c/tr>\n        \n      \u003c/table>\u003c/details>\n      \n      \u003cdetails>\u003csummary>Historial\u003c/summary>\u003cul>\u003c/ul>\u003c/details>\u003c/section>","ramas":"\u003cheader class=\"ecos-verbe-cabpanel\">\n      \u003cdiv class=\"ev-identidad\">\u003cspan class=\"ev-kicker\">EL VERBE · NIVEL 20\u003c/span>\u003cstrong>Ari · viajero del valle\u003c/strong>\u003csmall>Umbral · Fuego\u003c/small>\u003c/div>\n      \u003cdiv class=\"ecos-verbe-res\">\u003cdiv class=\"ev-recurso-titulo\">\u003cb>\u003ci class=\"fa-solid fa-droplet\" aria-hidden=\"true\">\u003c/i> Verbe \u003cspan>48 / 170\u003c/span>\u003c/b>\u003csmall>ENERGÍA PARA USAR\u003c/small>\u003c/div>\u003cdiv class=\"ecos-verbe-barra grande \" role=\"meter\" aria-label=\"Reserva de Verbe\" aria-valuemin=\"0\" aria-valuemax=\"170\" aria-valuenow=\"48\" aria-valuetext=\"48 de 170 de Verbe\">\u003cdiv style=\"width:28.235294117647058%\">\u003c/div>\u003c/div>\n        \u003csmall>Se gasta al usar técnicas; vuelve al descansar.\u003c/small>\u003c/div>\n      \u003cdiv class=\"ecos-verbe-trazos hay\">\u003cspan class=\"n\">84\u003c/span>\u003cspan class=\"t\">\u003cb>Trazos\u003c/b> para aprender\u003c/span>\u003csmall>Se gastan una vez por compra\u003c/small>\u003c/div>\n    \u003c/header>\u003cnav class=\"ecos-verbe-tabs\" aria-label=\"Panel del Verbe\">\u003cbutton type=\"button\" class=\" \"  data-action=\"pestana\" data-p=\"resumen\">\u003ci class=\"fa-solid fa-house\" aria-hidden=\"true\">\u003c/i> Inicio\u003c/button>\u003cbutton type=\"button\" class=\" \"  data-action=\"pestana\" data-p=\"jugar\">\u003ci class=\"fa-solid fa-bolt\" aria-hidden=\"true\">\u003c/i> Mis técnicas\u003c/button>\u003cbutton type=\"button\" class=\" \"  data-action=\"pestana\" data-p=\"tienda\">\u003ci class=\"fa-solid fa-book-open\" aria-hidden=\"true\">\u003c/i> Aprender\u003c/button>\u003cbutton type=\"button\" class=\"activa \" aria-current=\"page\" data-action=\"pestana\" data-p=\"ramas\">\u003ci class=\"fa-solid fa-seedling\" aria-hidden=\"true\">\u003c/i> Mejorar\u003c/button>\u003cbutton type=\"button\" class=\" \"  data-action=\"pestana\" data-p=\"guia\">\u003ci class=\"fa-solid fa-circle-question\" aria-hidden=\"true\">\u003c/i> Ayuda rápida\u003c/button>\u003c/nav>\u003csection class=\"ecos-verbe-cuerpo\" aria-label=\"Mejorar\">\u003cnav class=\"ev-subnav\" aria-label=\"Cómo quieres mejorar\">\u003cbutton type=\"button\" data-action=\"pestana\" data-p=\"ramas\" aria-current=\"page\">Especialidades\u003c/button>\u003cbutton type=\"button\" data-action=\"pestana\" data-p=\"dotes\" >Dotes\u003c/button>\u003cbutton type=\"button\" data-action=\"pestana\" data-p=\"cultivo\" >Entrenar técnicas\u003c/button>\u003cbutton type=\"button\" data-action=\"pestana\" data-p=\"crear\" >Inventar una técnica\u003c/button>\u003c/nav>\u003cdiv class=\"ecos-verbe-intro\">\u003cp>\u003cb>Cada rama es un tipo de técnica (Forma, Velo, Cuerpo…).\u003c/b> Tu rango en una rama dice hasta qué grado puedes aprender técnicas de ella. Se sube con Trazos; desde Experto, sus técnicas que dañan o curan tiran dados de más y ganas los dones de la rama. \u003ca class=\"ecos-verbe-guia\" data-action=\"guia\" data-s=\"ramas-y-rangos\" data-tooltip=\"Abre la guía escrita en esa parte\">\u003ci class=\"fa-solid fa-book-open\">\u003c/i> Guía\u003c/a>\u003c/p>\u003cdetails>\u003csummary>Saber más\u003c/summary>\u003cp>Tu \u003cb>rama principal\u003c/b> empieza en Entrenado gratis, cada rango le cuesta 1 Trazo menos y sus dones llegan un rango antes. Desde la \u003cb>tercera rama\u003c/b> que entrenes, cada rango cuesta 1 Trazo más: conviene especializarse.\u003c/p>\u003ctable class=\"ecos-verbe-tabla\">\u003ctr>\u003cth>Rango\u003c/th>\u003cth>Aprendes técnicas de la rama hasta\u003c/th>\u003cth>Pide\u003c/th>\u003cth>Cuesta\u003c/th>\u003cth>Te da\u003c/th>\u003c/tr>\n      \u003ctr>\u003ctd>\u003cb>Novato\u003c/b>\u003c/td>\u003ctd>grado 1\u003c/td>\u003ctd>—\u003c/td>\n        \u003ctd>gratis: toda rama abierta empieza aquí\u003c/td>\n        \u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>Entrenado\u003c/b>\u003c/td>\u003ctd>grado 3\u003c/td>\u003ctd>—\u003c/td>\n        \u003ctd>1 Trazo (0 en tu rama principal)\u003c/td>\n        \u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>Experto\u003c/b>\u003c/td>\u003ctd>grado 5\u003c/td>\u003ctd>nivel 5\u003c/td>\n        \u003ctd>3 Trazos (2 en tu rama principal)\u003c/td>\n        \u003ctd>1 dado más en sus técnicas que dañan o curan, y su primer don\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>Maestro\u003c/b>\u003c/td>\u003ctd>grado 8\u003c/td>\u003ctd>nivel 11\u003c/td>\n        \u003ctd>5 Trazos (4 en tu rama principal)\u003c/td>\n        \u003ctd>2 dados más en sus técnicas que dañan o curan, y su segundo don\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>Legendario\u003c/b>\u003c/td>\u003ctd>grado 9\u003c/td>\u003ctd>nivel 17\u003c/td>\n        \u003ctd>8 Trazos (7 en tu rama principal)\u003c/td>\n        \u003ctd>3 dados más en sus técnicas que dañan o curan, y su tercer don\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>Mítico\u003c/b>\u003c/td>\u003ctd>grado 11\u003c/td>\u003ctd>nivel 19\u003c/td>\n        \u003ctd>10 Trazos (9 en tu rama principal)\u003c/td>\n        \u003ctd>4 dados más en sus técnicas que dañan o curan, y su cuarto don\u003c/td>\u003c/tr>\u003c/table>\u003c/details>\u003c/div>\n      \u003csection class=\"ecos-verbe-rama \">\n        \u003cheader>\u003cb>Forma\u003c/b>\n          \u003cspan>Rango \u003cb>Mítico\u003c/b> · tu límite ahora es \u003cb>grado 11\u003c/b> · +4 dados al dañar o curar.\u003c/span>\u003cspan class=\"ecos-nota\">Es el rango más alto.\u003c/span>\u003c/header>\n        \u003cp class=\"ecos-nota\">El Verbe hecho forma: proyectiles, réplicas, sustituciones y las técnicas de los elementos (fuego, agua, viento, tierra y rayo). Es la rama donde están las técnicas de tu naturaleza. \u003c/p>\u003cdetails class=\"ev-dones\">\u003csummary>Qué dones gano en esta rama\u003c/summary>\u003cul class=\"ecos-verbe-dones\">\u003cli class=\"tiene\">\u003cb>Primer don · Forma precisa\u003c/b> \u003cspan class=\"ecos-nota\">ya lo tienes\u003c/span>\u003cbr>Cuando usas una técnica de Forma que cubre un área, eliges hasta tantas criaturas como tu modificador de Verbe; esas pasan la salvación sin tirar y no reciben daño. Sirve para no herir a tus aliados.\u003c/li>\u003cli class=\"tiene\">\u003cb>Segundo don · Forma doble\u003c/b> \u003cspan class=\"ecos-nota\">ya lo tienes\u003c/span>\u003cbr>Cuando usas una técnica de Forma con tu acción, en el mismo turno puedes usar otra técnica de Forma de grado 0 con tu acción adicional.\u003c/li>\u003cli class=\"tiene\">\u003cb>Tercer don · Forma sin fin\u003c/b> \u003cspan class=\"ecos-nota\">ya lo tienes\u003c/span>\u003cbr>Una vez por Descanso Largo, usas una técnica de Forma de grado 5 o menos sin gastar Verbe.\u003c/li>\u003cli class=\"tiene\">\u003cb>Cuarto don · Forma total\u003c/b> \u003cspan class=\"ecos-nota\">ya lo tienes\u003c/span>\u003cbr>Una vez por Descanso Largo, usas una técnica de Forma de grado 9 o menos sin gastar Verbe, y el daño de tus técnicas de Forma ignora la resistencia.\u003c/li>\u003c/ul>\u003c/details>\u003c/section>\u003csection class=\"ecos-verbe-rama \">\n        \u003cheader>\u003cb>Velo\u003c/b>\n          \u003cspan>Rango \u003cb>Mítico\u003c/b> · tu límite ahora es \u003cb>grado 11\u003c/b> · +4 dados al dañar o curar.\u003c/span>\u003cspan class=\"ecos-nota\">Es el rango más alto.\u003c/span>\u003c/header>\n        \u003cp class=\"ecos-nota\">Ilusiones que se meten en el Verbe del otro: ver lo que no está, sentir miedo, confundirse. Casi todo pide salvación de Sabiduría. Arrasa con la gente común; otro usuario puede romperlas con Control. \u003c/p>\u003cdetails class=\"ev-dones\">\u003csummary>Qué dones gano en esta rama\u003c/summary>\u003cul class=\"ecos-verbe-dones\">\u003cli class=\"tiene\">\u003cb>Primer don · Velo hondo\u003c/b> \u003cspan class=\"ecos-nota\">ya lo tienes\u003c/span>\u003cbr>Quien no te vio usar el Velo tiene desventaja en su primera salvación contra él.\u003c/li>\u003cli class=\"tiene\">\u003cb>Segundo don · Velo dentro del Velo\u003c/b> \u003cspan class=\"ecos-nota\">ya lo tienes\u003c/span>\u003cbr>Cuando alguien rompe o supera un Velo tuyo, puedes usar tu reacción para ponerle otro Velo de grado 2 o menos, sin gastar Verbe.\u003c/li>\u003cli class=\"tiene\">\u003cb>Tercer don · Mundo propio\u003c/b> \u003cspan class=\"ecos-nota\">ya lo tienes\u003c/span>\u003cbr>Tu Velo engaña también a quien ve el Verbe (por ejemplo, con un ojo heredado) y a los constructos y no muertos que piensan.\u003c/li>\u003cli class=\"tiene\">\u003cb>Cuarto don · Sueño sin salida\u003c/b> \u003cspan class=\"ecos-nota\">ya lo tienes\u003c/span>\u003cbr>Quien falla una salvación contra tu Velo no puede intentar romperlo con Control hasta el final de tu siguiente turno, y tus Velos de Concentración duran 1 minuto más aunque pierdas la Concentración.\u003c/li>\u003c/ul>\u003c/details>\u003c/section>\u003csection class=\"ecos-verbe-rama \">\n        \u003cheader>\u003cb>Cuerpo\u003c/b>\n          \u003cspan>Rango \u003cb>Mítico\u003c/b> · tu límite ahora es \u003cb>grado 11\u003c/b> · +4 dados al dañar o curar.\u003c/span>\u003cspan class=\"ecos-nota\">Es el rango más alto.\u003c/span>\u003c/header>\n        \u003cp class=\"ecos-nota\">El Verbe dentro del cuerpo: golpes más fuertes, saltos y aguante. Ataca con Fuerza o Destreza, como un arma, y casi todo es acción adicional, para sumarse a tus ataques. Aquí están los Ocho Cerrojos. \u003c/p>\u003cdetails class=\"ev-dones\">\u003csummary>Qué dones gano en esta rama\u003c/summary>\u003cul class=\"ecos-verbe-dones\">\u003cli class=\"tiene\">\u003cb>Primer don · Cuerpo templado\u003c/b> \u003cspan class=\"ecos-nota\">ya lo tienes\u003c/span>\u003cbr>Mientras no lleves armadura pesada, +1 a tu CA y +3 m a tu velocidad.\u003c/li>\u003cli class=\"tiene\">\u003cb>Segundo don · Golpe que no se pierde\u003c/b> \u003cspan class=\"ecos-nota\">ya lo tienes\u003c/span>\u003cbr>Cuando fallas un ataque cuerpo a cuerpo, igual haces tanto daño como tu modificador de Fuerza o de Destreza (el mayor).\u003c/li>\u003cli class=\"tiene\">\u003cb>Tercer don · Cerrojos sin precio\u003c/b> \u003cspan class=\"ecos-nota\">ya lo tienes\u003c/span>\u003cbr>Con los Siete Cerrojos abiertos pierdes la mitad de los PG por turno.\u003c/li>\u003cli class=\"tiene\">\u003cb>Cuarto don · Cuerpo que no cae\u003c/b> \u003cspan class=\"ecos-nota\">ya lo tienes\u003c/span>\u003cbr>Cerrar el séptimo Cerrojo te pide CON CD 10 en vez de 20, y una vez por Descanso Largo, cuando caerías a 0 PG, quedas a 1.\u003c/li>\u003c/ul>\u003c/details>\u003c/section>\u003csection class=\"ecos-verbe-rama \">\n        \u003cheader>\u003cb>Mirada\u003c/b>\n          \u003cspan>Rango \u003cb>Mítico\u003c/b> · tu límite ahora es \u003cb>grado 11\u003c/b> · +4 dados al dañar o curar.\u003c/span>\u003cspan class=\"ecos-nota\">Es el rango más alto.\u003c/span>\u003c/header>\n        \u003cp class=\"ecos-nota\">Ojos que ven el Verbe. No se compran: se heredan o se reciben, y despiertan en la historia. Sus técnicas vienen con cada etapa del ojo. \u003c/p>\u003cdetails class=\"ev-dones\">\u003csummary>Qué dones gano en esta rama\u003c/summary>\u003cul class=\"ecos-verbe-dones\">\u003cli class=\"tiene\">\u003cb>Primer don · Ojo largo\u003c/b> \u003cspan class=\"ecos-nota\">ya lo tienes\u003c/span>\u003cbr>El alcance de tus técnicas de Mirada se duplica.\u003c/li>\u003cli class=\"tiene\">\u003cb>Segundo don · Ojo que no se cansa\u003c/b> \u003cspan class=\"ecos-nota\">ya lo tienes\u003c/span>\u003cbr>Mantener el ojo abierto ya no gasta Verbe.\u003c/li>\u003cli class=\"tiene\">\u003cb>Tercer don · Ojo pleno\u003c/b> \u003cspan class=\"ecos-nota\">ya lo tienes\u003c/span>\u003cbr>Una vez por Descanso Largo, usas una técnica de la etapa 3 de tu ojo sin gastar Verbe, y el blanco tiene desventaja en su salvación.\u003c/li>\u003cli class=\"tiene\">\u003cb>Cuarto don · Ojo que todo lo ve\u003c/b> \u003cspan class=\"ecos-nota\">ya lo tienes\u003c/span>\u003cbr>Con el ojo abierto ves a través de ilusiones, oscuridad y lo invisible a 36 m, y nada que veas te sorprende.\u003c/li>\u003c/ul>\u003c/details>\u003c/section>\u003csection class=\"ecos-verbe-rama \">\n        \u003cheader>\u003cb>Sello\u003c/b>\n          \u003cspan>Rango \u003cb>Mítico\u003c/b> · tu límite ahora es \u003cb>grado 11\u003c/b> · +4 dados al dañar o curar.\u003c/span>\u003cspan class=\"ecos-nota\">Es el rango más alto.\u003c/span>\u003c/header>\n        \u003cp class=\"ecos-nota\">Sellos, barreras y marcas: cerrar puertas, encerrar, guardar técnicas en papel. Casi todo pide Gestos y, a veces, tinta o papel. \u003c/p>\u003cdetails class=\"ev-dones\">\u003csummary>Qué dones gano en esta rama\u003c/summary>\u003cul class=\"ecos-verbe-dones\">\u003cli class=\"tiene\">\u003cb>Primer don · Dos sellos\u003c/b> \u003cspan class=\"ecos-nota\">ya lo tienes\u003c/span>\u003cbr>Puedes mantener a la vez dos técnicas de Sello que piden Concentración.\u003c/li>\u003cli class=\"tiene\">\u003cb>Segundo don · Sellos que duran\u003c/b> \u003cspan class=\"ecos-nota\">ya lo tienes\u003c/span>\u003cbr>Tus sellos preparados (Ruptura, Que avisa, Cierre y Círculo de guarda) duran hasta que tú los rompas.\u003c/li>\u003cli class=\"tiene\">\u003cb>Tercer don · Gran sello\u003c/b> \u003cspan class=\"ecos-nota\">ya lo tienes\u003c/span>\u003cbr>Tu Sello de encierro sirve también con las criaturas mayores, con un ritual de tres días.\u003c/li>\u003cli class=\"tiene\">\u003cb>Cuarto don · Sello sin llave\u003c/b> \u003cspan class=\"ecos-nota\">ya lo tienes\u003c/span>\u003cbr>Tus sellos solo los rompe quien tenga tu rango en Sello o uno más alto, y una vez por Descanso Largo pones un Sello de grado 7 o menos sin gastar Verbe ni tinta.\u003c/li>\u003c/ul>\u003c/details>\u003c/section>\u003csection class=\"ecos-verbe-rama cerrada\">\n        \u003cheader>\u003cb>Pacto\u003c/b>\n          \u003cspan>\u003cb>Cerrada\u003c/b>.\u003c/span>\u003c/header>\n        \u003cp class=\"ecos-nota\">Un contrato de sangre con un linaje de criaturas, que se gana en la historia. Invocas a tus aliados y peleas junto a ellos. \u003cb>Se abre con un pacto que se gana en la historia.\u003c/b>\u003c/p>\u003cdetails class=\"ev-dones\">\u003csummary>Qué dones gano en esta rama\u003c/summary>\u003cul class=\"ecos-verbe-dones\">\u003cli class=\"tiene\">\u003cb>Primer don · Vínculo fuerte\u003c/b> \u003cspan class=\"ecos-nota\">ya lo tienes\u003c/span>\u003cbr>Tu invocación suma tu bonificador de competencia a su CA y a su daño.\u003c/li>\u003cli class=\"tiene\">\u003cb>Segundo don · Dos del linaje\u003c/b> \u003cspan class=\"ecos-nota\">ya lo tienes\u003c/span>\u003cbr>Invocar al linaje trae dos criaturas en vez de una, cada una con la ficha dos grados más baja.\u003c/li>\u003cli class=\"tiene\">\u003cb>Tercer don · Sangre compartida\u003c/b> \u003cspan class=\"ecos-nota\">ya lo tienes\u003c/span>\u003cbr>Una vez por Descanso Largo, cuando tu invocación cae a 0 PG, queda a 1 PG y tú pierdes los PG que le faltaron.\u003c/li>\u003cli class=\"tiene\">\u003cb>Cuarto don · El linaje responde\u003c/b> \u003cspan class=\"ecos-nota\">ya lo tienes\u003c/span>\u003cbr>Tu invocación ya no pide Concentración, y una vez por Descanso Largo llamas al mayor de tu linaje durante 1 minuto sin gastar Verbe.\u003c/li>\u003c/ul>\u003c/details>\u003c/section>\u003csection class=\"ecos-verbe-rama cerrada\">\n        \u003cheader>\u003cb>Pulso\u003c/b>\n          \u003cspan>\u003cb>Cerrada\u003c/b>.\u003c/span>\u003c/header>\n        \u003cp class=\"ecos-nota\">El Verbe que cura y el que daña por dentro. Se abre con la dote Control fino del Verbe. Para las heridas de la casa cuenta como magia que cura. \u003cb>Se abre con la dote Control fino del Verbe (Mejorar → Dotes).\u003c/b>\u003c/p>\u003cdetails class=\"ev-dones\">\u003csummary>Qué dones gano en esta rama\u003c/summary>\u003cul class=\"ecos-verbe-dones\">\u003cli class=\"tiene\">\u003cb>Primer don · Manos firmes\u003c/b> \u003cspan class=\"ecos-nota\">ya lo tienes\u003c/span>\u003cbr>Tus técnicas que curan suman tu modificador de Verbe una vez más.\u003c/li>\u003cli class=\"tiene\">\u003cb>Segundo don · Cirujano\u003c/b> \u003cspan class=\"ecos-nota\">ya lo tienes\u003c/span>\u003cbr>Una vez al día por paciente, Palma que cierra le baja también un nivel de Herida No Tratada.\u003c/li>\u003cli class=\"tiene\">\u003cb>Tercer don · Vida guardada\u003c/b> \u003cspan class=\"ecos-nota\">ya lo tienes\u003c/span>\u003cbr>Cada día guardas hasta el doble de tu nivel en Verbe. Si caes a 0 PG, ese Verbe se suelta solo y recuperas el doble en PG.\u003c/li>\u003cli class=\"tiene\">\u003cb>Cuarto don · Pulso que devuelve\u003c/b> \u003cspan class=\"ecos-nota\">ya lo tienes\u003c/span>\u003cbr>Una vez por Descanso Largo, tocas a alguien que murió hace 1 minuto o menos y vuelve con la mitad de sus PG y 1 nivel de Agotamiento.\u003c/li>\u003c/ul>\u003c/details>\u003c/section>\u003csection class=\"ecos-verbe-rama \">\n        \u003cheader>\u003cb>Hilo\u003c/b>\n          \u003cspan>Rango \u003cb>Mítico\u003c/b> · tu límite ahora es \u003cb>grado 11\u003c/b> · +4 dados al dañar o curar.\u003c/span>\u003cspan class=\"ecos-nota\">Es el rango más alto.\u003c/span>\u003c/header>\n        \u003cp class=\"ecos-nota\">Armas y herramientas con Verbe: hilos, agujas, armas que vuelan y marionetas. Ataca con Fuerza o Destreza, como un arma. \u003c/p>\u003cdetails class=\"ev-dones\">\u003csummary>Qué dones gano en esta rama\u003c/summary>\u003cul class=\"ecos-verbe-dones\">\u003cli class=\"tiene\">\u003cb>Primer don · Diez dedos\u003c/b> \u003cspan class=\"ecos-nota\">ya lo tienes\u003c/span>\u003cbr>Mueves dos marionetas o dos armas suspendidas a la vez.\u003c/li>\u003cli class=\"tiene\">\u003cb>Segundo don · Hilo que no se ve\u003c/b> \u003cspan class=\"ecos-nota\">ya lo tienes\u003c/span>\u003cbr>Tus ataques de Hilo a distancia no tienen desventaja por alcance largo y no revelan dónde estás.\u003c/li>\u003cli class=\"tiene\">\u003cb>Tercer don · Lluvia sin fin\u003c/b> \u003cspan class=\"ecos-nota\">ya lo tienes\u003c/span>\u003cbr>Una vez por Descanso Corto, usas una técnica que pide pergamino de armas sin gastar el pergamino.\u003c/li>\u003cli class=\"tiene\">\u003cb>Cuarto don · Mil hilos\u003c/b> \u003cspan class=\"ecos-nota\">ya lo tienes\u003c/span>\u003cbr>Mueves hasta cinco marionetas o armas suspendidas a la vez, y una vez por turno, cuando una criatura a 9 m se mueve, la enredas: su velocidad queda en 0 hasta el final de su turno.\u003c/li>\u003c/ul>\u003c/details>\u003c/section>\u003csection class=\"ecos-verbe-rama \">\n        \u003cheader>\u003cb>Quietud\u003c/b>\n          \u003cspan>Rango \u003cb>Mítico\u003c/b> · tu límite ahora es \u003cb>grado 11\u003c/b> · +4 dados al dañar o curar.\u003c/span>\u003cspan class=\"ecos-nota\">Es el rango más alto.\u003c/span>\u003c/header>\n        \u003cp class=\"ecos-nota\">Tomar el Verbe del mundo en vez del propio, con Sabiduría. Da mucho, pero el mundo cobra: si fallas, lo salvaje te deja su marca. \u003c/p>\u003cdetails class=\"ev-dones\">\u003csummary>Qué dones gano en esta rama\u003c/summary>\u003cul class=\"ecos-verbe-dones\">\u003cli class=\"tiene\">\u003cb>Primer don · Raíz honda\u003c/b> \u003cspan class=\"ecos-nota\">ya lo tienes\u003c/span>\u003cbr>Las salvaciones que te pide la Quietud bajan 2 de CD.\u003c/li>\u003cli class=\"tiene\">\u003cb>Segundo don · Quietud en movimiento\u003c/b> \u003cspan class=\"ecos-nota\">ya lo tienes\u003c/span>\u003cbr>Entras en Estado de Quietud con tu acción adicional.\u003c/li>\u003cli class=\"tiene\">\u003cb>Tercer don · El mundo te conoce\u003c/b> \u003cspan class=\"ecos-nota\">ya lo tienes\u003c/span>\u003cbr>Una vez por Descanso Largo, si fallas una salvación de Quietud, no pasa nada.\u003c/li>\u003cli class=\"tiene\">\u003cb>Cuarto don · El mundo es tu casa\u003c/b> \u003cspan class=\"ecos-nota\">ya lo tienes\u003c/span>\u003cbr>Al aire libre, el Estado de Quietud ya no te pide salvaciones, y mientras dura tus técnicas cuestan 1 Verbe menos (mínimo 1).\u003c/li>\u003c/ul>\u003c/details>\u003c/section>\u003csection class=\"ecos-verbe-rama \">\n        \u003cheader>\u003cb>Rastro\u003c/b>\n          \u003cspan>Rango \u003cb>Mítico\u003c/b> · tu límite ahora es \u003cb>grado 11\u003c/b> · +4 dados al dañar o curar.\u003c/span>\u003cspan class=\"ecos-nota\">Es el rango más alto.\u003c/span>\u003c/header>\n        \u003cp class=\"ecos-nota\">Sentir el Verbe a distancia: quién lo usa, dónde está y cuánto le queda. Con Sabiduría. \u003c/p>\u003cdetails class=\"ev-dones\">\u003csummary>Qué dones gano en esta rama\u003c/summary>\u003cul class=\"ecos-verbe-dones\">\u003cli class=\"tiene\">\u003cb>Primer don · Rastro fino\u003c/b> \u003cspan class=\"ecos-nota\">ya lo tienes\u003c/span>\u003cbr>Cuando sientes a alguien con el Verbe, sabes también su naturaleza y cuánto Verbe le queda (lleno, a medias o poco).\u003c/li>\u003cli class=\"tiene\">\u003cb>Segundo don · Nunca por sorpresa\u003c/b> \u003cspan class=\"ecos-nota\">ya lo tienes\u003c/span>\u003cbr>Nada te sorprende, y tus aliados a 9 m suman tu bonificador de competencia a la iniciativa.\u003c/li>\u003cli class=\"tiene\">\u003cb>Tercer don · Antes del golpe\u003c/b> \u003cspan class=\"ecos-nota\">ya lo tienes\u003c/span>\u003cbr>Una vez por turno, cuando te ataca una criatura que estás sintiendo, el ataque tiene desventaja.\u003c/li>\u003cli class=\"tiene\">\u003cb>Cuarto don · Rastro sin distancia\u003c/b> \u003cspan class=\"ecos-nota\">ya lo tienes\u003c/span>\u003cbr>Sientes a cualquier criatura con Verbe que hayas tocado alguna vez, esté donde esté: sabes en qué dirección y a qué distancia está.\u003c/li>\u003c/ul>\u003c/details>\u003c/section>\u003csection class=\"ecos-verbe-rama cerrada\">\n        \u003cheader>\u003cb>Sangre\u003c/b>\n          \u003cspan>\u003cb>Cerrada\u003c/b>.\u003c/span>\u003c/header>\n        \u003cp class=\"ecos-nota\"> \u003cb>Se abre con una herencia de sangre. No tienes manera de saber si la tienes; si es así, la historia lo dirá.\u003c/b>\u003c/p>\u003c/section>\u003csection class=\"ecos-verbe-rama \">\n        \u003cheader>\u003cb>Umbral\u003c/b> \u003cspan class='ecos-verbe-pill'>principal\u003c/span>\n          \u003cspan>Rango \u003cb>Mítico\u003c/b> · tu límite ahora es \u003cb>grado 11\u003c/b> · +4 dados al dañar o curar.\u003c/span>\u003cspan class=\"ecos-nota\">Es el rango más alto.\u003c/span>\u003c/header>\n        \u003cp class=\"ecos-nota\">Espacio-tiempo: marcas, traslado e intercambio. Una marca y un destino seguro importan tanto como la energía. No crea copias ni dominios infinitos. \u003c/p>\u003c/section>\u003csection class=\"ecos-verbe-rama \">\n        \u003cheader>\u003cb>Vasija\u003c/b>\n          \u003cspan>Rango \u003cb>Mítico\u003c/b> · tu límite ahora es \u003cb>grado 11\u003c/b> · +4 dados al dañar o curar.\u003c/span>\u003cspan class=\"ecos-nota\">Es el rango más alto.\u003c/span>\u003c/header>\n        \u003cp class=\"ecos-nota\">Técnicas del huésped de una bestia. El DM concede entidad y vínculo; las transformaciones comparten tu vida, reserva y acciones. \u003c/p>\u003c/section>\n      \u003csection class=\"ev-naturalezas\">\u003ch3>Tus elementos\u003c/h3>\u003cp>Fuego. Puedes descubrir tu segunda naturaleza probando una técnica.\u003c/p>\n      \n      \n      \u003cp>Naturaleza combinada abre una combinación desde nivel 9 con maestro; Tercera naturaleza abre otro elemento desde nivel 7 con maestro. Una tercera naturaleza no concede por sí sola una combinación.\u003c/p>\u003c/section>\n      \u003ch3>Afinidad con tu naturaleza\u003c/h3>\u003cp class=\"ecos-nota\">Qué tan bien manejas tu elemento. Entrenada: sus técnicas tiran 1 dado más y sus estados duran el doble. Maestra: 2 dados más, y quien falla contra ella no resiste su daño.\u003c/p>\u003cul>\u003cli>\u003cb>Fuego\u003c/b>: Despierta \u003cbutton type=\"button\" data-action=\"afinidad\" data-nat=\"fuego\" data-tooltip=\"+1 dado a sus técnicas e infusiones, y sus estados duran el doble\">Subir a Entrenada · 2 Trazos (nivel 5, pide un maestro)\u003c/button>\u003c/li>\u003c/ul>\n      \u003csection class=\"ev-naturalezas\">\u003ch3>Tradiciones y vínculos\u003c/h3>\u003cp>Atadura de sombra, Marionetismo, Fórmulas de sellado, Contrato: sapo\u003c/p>\u003cp>Bestia: Kurama · nueve colas · vínculo 3.\u003c/p>\u003c/section>\n      \u003ch3>Control del Verbe \u003ci class=\"ecos-verbe-ayuda fa-solid fa-circle-question\" data-tooltip=\"Una habilidad nueva de tu hoja (con Sabiduría). Se tira para ganar un choque entre dos técnicas, romper un Velo, abrir los Cerrojos y no perderse en la Quietud. Se compra en Mejorar → Especialidades.\">\u003c/i>\u003c/h3>\u003cp>Sin competencia. \u003cbutton type=\"button\" data-action=\"control\" data-tooltip=\"Sumas tu competencia a las pruebas de Control\">Volverte competente · 2 Trazos\u003c/button>\u003c/p>\n      \u003ch3>Ocho Cerrojos\u003c/h3>\u003cp class=\"ecos-nota\">Un estado de Cuerpo: pegas más fuerte y más rápido, pagando PG cada turno y Agotamiento al cerrar. \u003ca class=\"ecos-verbe-guia\" data-action=\"guia\" data-s=\"siete-cerrojos\">\u003ci class=\"fa-solid fa-book-open\">\u003c/i> Guía\u003c/a>\u003c/p>\n      \u003cp>No sabes ninguno. \u003cbutton type=\"button\" data-action=\"aprenderCerrojo\" data-tooltip=\"La piel: +2 al daño de tus golpes y ventaja en pruebas de Fuerza. Grado 1.\">Aprender el 1 · La piel · 1 Trazo\u003c/button>\u003c/p>\u003c/section>"},"inicio":{"resumen":"\u003cheader class=\"ecos-verbe-cabpanel\">\n      \u003cdiv class=\"ev-identidad\">\u003cspan class=\"ev-kicker\">EL VERBE · NIVEL 3\u003c/span>\u003cstrong>Ari · viajero del valle\u003c/strong>\u003csmall>Tu aventura empieza aquí\u003c/small>\u003c/div>\n      \u003cdiv class=\"ecos-verbe-res\">\u003cdiv class=\"ev-recurso-titulo\">\u003cb>\u003ci class=\"fa-solid fa-droplet\" aria-hidden=\"true\">\u003c/i> Verbe \u003cspan>18 / 21\u003c/span>\u003c/b>\u003csmall>ENERGÍA PARA USAR\u003c/small>\u003c/div>\u003cdiv class=\"ecos-verbe-barra grande \" role=\"meter\" aria-label=\"Reserva de Verbe\" aria-valuemin=\"0\" aria-valuemax=\"21\" aria-valuenow=\"18\" aria-valuetext=\"18 de 21 de Verbe\">\u003cdiv style=\"width:85.71428571428571%\">\u003c/div>\u003c/div>\n        \u003csmall>Se gasta al usar técnicas; vuelve al descansar.\u003c/small>\u003c/div>\n      \u003cdiv class=\"ecos-verbe-trazos hay\">\u003cspan class=\"n\">16\u003c/span>\u003cspan class=\"t\">\u003cb>Trazos\u003c/b> para aprender\u003c/span>\u003csmall>Se gastan una vez por compra\u003c/small>\u003c/div>\n    \u003c/header>\u003cnav class=\"ecos-verbe-tabs\" aria-label=\"Panel del Verbe\">\u003cbutton type=\"button\" class=\"activa \" aria-current=\"page\" data-action=\"pestana\" data-p=\"resumen\">\u003ci class=\"fa-solid fa-house\" aria-hidden=\"true\">\u003c/i> Inicio\u003c/button>\u003cbutton type=\"button\" class=\" \"  data-action=\"pestana\" data-p=\"jugar\">\u003ci class=\"fa-solid fa-bolt\" aria-hidden=\"true\">\u003c/i> Mis técnicas\u003c/button>\u003cbutton type=\"button\" class=\" \"  data-action=\"pestana\" data-p=\"tienda\">\u003ci class=\"fa-solid fa-book-open\" aria-hidden=\"true\">\u003c/i> Aprender\u003c/button>\u003cbutton type=\"button\" class=\" \"  data-action=\"pestana\" data-p=\"ramas\">\u003ci class=\"fa-solid fa-seedling\" aria-hidden=\"true\">\u003c/i> Mejorar\u003c/button>\u003cbutton type=\"button\" class=\" \"  data-action=\"pestana\" data-p=\"guia\">\u003ci class=\"fa-solid fa-circle-question\" aria-hidden=\"true\">\u003c/i> Ayuda rápida\u003c/button>\u003c/nav>\u003csection class=\"ecos-verbe-cuerpo\" aria-label=\"Inicio\">\u003col class=\"ev-progreso\" aria-label=\"Primeros pasos\">\u003cli class=\"actual\" aria-current=\"step\">\u003cspan aria-hidden=\"true\">1\u003c/span>Elige elemento\u003c/li>\u003cli class=\"\" >\u003cspan aria-hidden=\"true\">2\u003c/span>Elige especialidad\u003c/li>\u003cli class=\"\" >\u003cspan aria-hidden=\"true\">3\u003c/span>Aprende una técnica\u003c/li>\u003cli class=\"\" >\u003cspan aria-hidden=\"true\">4\u003c/span>Listo para jugar\u003c/li>\u003c/ol>\u003csection class=\"ev-bienvenida\">\u003cspan class=\"ev-kicker\">TU SIGUIENTE PASO · 1 DE 3\u003c/span>\u003ch2>¿Qué elemento responde a ti?\u003c/h2>\u003cp>Elige un elemento por su estilo. Funciona con cualquier especialidad. Verás una confirmación antes de guardarlo.\u003c/p>\u003cdiv class=\"ev-elecciones\">\u003cbutton type=\"button\" class=\"ev-eleccion fuego\" data-action=\"elegir\" data-campo=\"nat\" data-valor=\"fuego\">\u003cspan class=\"ev-elemento\" aria-hidden=\"true\">✦\u003c/span>\u003cstrong>Fuego\u003c/strong>\u003csmall>1d6 de fuego al inicio de cada turno. Lo apagan una acción, el agua o la tierra.\u003c/small>\u003cspan>Elegir Fuego →\u003c/span>\u003c/button>\u003cbutton type=\"button\" class=\"ev-eleccion agua\" data-action=\"elegir\" data-campo=\"nat\" data-valor=\"agua\">\u003cspan class=\"ev-elemento\" aria-hidden=\"true\">≈\u003c/span>\u003cstrong>Agua\u003c/strong>\u003csmall>Resistencia al fuego y vulnerabilidad al relámpago.\u003c/small>\u003cspan>Elegir Agua →\u003c/span>\u003c/button>\u003cbutton type=\"button\" class=\"ev-eleccion viento\" data-action=\"elegir\" data-campo=\"nat\" data-valor=\"viento\">\u003cspan class=\"ev-elemento\" aria-hidden=\"true\">≋\u003c/span>\u003cstrong>Viento\u003c/strong>\u003csmall>Desventaja en su próximo ataque; si lo empujan, va el doble de lejos.\u003c/small>\u003cspan>Elegir Viento →\u003c/span>\u003c/button>\u003cbutton type=\"button\" class=\"ev-eleccion tierra\" data-action=\"elegir\" data-campo=\"nat\" data-valor=\"tierra\">\u003cspan class=\"ev-elemento\" aria-hidden=\"true\">◆\u003c/span>\u003cstrong>Tierra\u003c/strong>\u003csmall>Velocidad a la mitad y desventaja en las salvaciones de DES.\u003c/small>\u003cspan>Elegir Tierra →\u003c/span>\u003c/button>\u003cbutton type=\"button\" class=\"ev-eleccion rayo\" data-action=\"elegir\" data-campo=\"nat\" data-valor=\"rayo\">\u003cspan class=\"ev-elemento\" aria-hidden=\"true\">ϟ\u003c/span>\u003cstrong>Rayo\u003c/strong>\u003csmall>No usa reacciones; si lleva metal, el próximo ataque con arma de metal contra él tiene ventaja.\u003c/small>\u003cspan>Elegir Rayo →\u003c/span>\u003c/button>\u003c/div>\u003c/section>\n      \u003cdiv class=\"ev-estadisticas\">\u003cdiv>\u003csmall>CD de tus técnicas\u003c/small>\u003cb>13\u003c/b>\u003cspan>El rival debe igualar o superar esta dificultad.\u003c/span>\u003c/div>\u003cdiv>\u003csmall>Ataque con Verbe\u003c/small>\u003cb>+5\u003c/b>\u003cspan>La técnica puede usar otra característica.\u003c/span>\u003c/div>\u003cdiv>\u003csmall>Grado máximo por nivel\u003c/small>\u003cb>2\u003c/b>\u003cspan>Cada rama también tiene su propio límite.\u003c/span>\u003c/div>\u003c/div>\n      \u003cdetails class=\"ev-ficha-personal\">\u003csummary>Mi personaje: afinidades, linaje y otros detalles\u003c/summary>\n      \u003ctable class=\"ecos-verbe-datos\">\n        \u003ctr>\u003cth>Característica \u003ci class=\"ecos-verbe-ayuda fa-solid fa-circle-question\" data-tooltip=\"La característica con la que usas el Verbe. Da la CD de tus técnicas (8 + competencia + modificador), su bonificador de ataque y suma a tu reserva.\">\u003c/i>\u003c/th>\u003ctd>Sabiduría · CD de tus técnicas \u003cb>13\u003c/b> · ataque \u003cb>+5\u003c/b>\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Naturaleza\u003c/th>\u003ctd>por elegir\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Otra naturaleza\u003c/th>\u003ctd>Puede que tu Verbe responda a otra naturaleza que no conoces. Se intenta descubrir con «Probar» en Aprender; si responde, aprender la técnica cuesta los Trazos indicados.\u003c/td>\u003c/tr>\n        \n        \u003ctr>\u003cth>Linaje\u003c/th>\u003ctd>Desconocido. Hay cosas de tu sangre que no tienes manera de saber; si las hay, aparecen jugando.\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Rama principal\u003c/th>\u003ctd>por elegir\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Grado máximo \u003ci class=\"ecos-verbe-ayuda fa-solid fa-circle-question\" data-tooltip=\"Qué tan fuerte es una técnica, de 0 a 11 (como el nivel de un conjuro, con dos grados más arriba del 9). Tu grado máximo sube con tu nivel: grado 1 en el nivel 1, 2 en el 3, 3 en el 5… 9 en el 17, 10 en el 19 y 11 en el 20. En cada rama, además, llegas solo hasta lo que deja tu rango.\">\u003c/i>\u003c/th>\u003ctd>2 (eres nivel 3) · el grado 3 llega en el nivel 5\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Control del Verbe \u003ci class=\"ecos-verbe-ayuda fa-solid fa-circle-question\" data-tooltip=\"Una habilidad nueva de tu hoja (con Sabiduría). Se tira para ganar un choque entre dos técnicas, romper un Velo, abrir los Cerrojos y no perderse en la Quietud. Se compra en Mejorar → Especialidades.\">\u003c/i>\u003c/th>\u003ctd>Sin competencia (se compra en Ramas)\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Sobreesfuerzo \u003ci class=\"ecos-verbe-ayuda fa-solid fa-circle-question\" data-tooltip=\"Puedes gastar Verbe que no tienes: tu barra baja de 0 hasta la mitad de tu reserva en negativo. Cada técnica que usas en negativo te pide una salvación de CON (CD 10 + su grado); si fallas, ganas 1 Agotamiento. Lo que quede en negativo cuesta el doble de recuperar.\">\u003c/i>\u003c/th>\u003ctd>Puedes gastar Verbe que no tienes hasta llegar a -10.\u003c/td>\u003c/tr>\n        \n        \n      \u003c/table>\u003c/details>\n      \n      \u003cdetails>\u003csummary>Historial\u003c/summary>\u003cul>\u003c/ul>\u003c/details>\u003c/section>"},"rama":{"resumen":"\u003cheader class=\"ecos-verbe-cabpanel\">\n      \u003cdiv class=\"ev-identidad\">\u003cspan class=\"ev-kicker\">EL VERBE · NIVEL 3\u003c/span>\u003cstrong>Ari · viajero del valle\u003c/strong>\u003csmall>Tu aventura empieza aquí · Fuego\u003c/small>\u003c/div>\n      \u003cdiv class=\"ecos-verbe-res\">\u003cdiv class=\"ev-recurso-titulo\">\u003cb>\u003ci class=\"fa-solid fa-droplet\" aria-hidden=\"true\">\u003c/i> Verbe \u003cspan>18 / 21\u003c/span>\u003c/b>\u003csmall>ENERGÍA PARA USAR\u003c/small>\u003c/div>\u003cdiv class=\"ecos-verbe-barra grande \" role=\"meter\" aria-label=\"Reserva de Verbe\" aria-valuemin=\"0\" aria-valuemax=\"21\" aria-valuenow=\"18\" aria-valuetext=\"18 de 21 de Verbe\">\u003cdiv style=\"width:85.71428571428571%\">\u003c/div>\u003c/div>\n        \u003csmall>Se gasta al usar técnicas; vuelve al descansar.\u003c/small>\u003c/div>\n      \u003cdiv class=\"ecos-verbe-trazos hay\">\u003cspan class=\"n\">16\u003c/span>\u003cspan class=\"t\">\u003cb>Trazos\u003c/b> para aprender\u003c/span>\u003csmall>Se gastan una vez por compra\u003c/small>\u003c/div>\n    \u003c/header>\u003cnav class=\"ecos-verbe-tabs\" aria-label=\"Panel del Verbe\">\u003cbutton type=\"button\" class=\"activa \" aria-current=\"page\" data-action=\"pestana\" data-p=\"resumen\">\u003ci class=\"fa-solid fa-house\" aria-hidden=\"true\">\u003c/i> Inicio\u003c/button>\u003cbutton type=\"button\" class=\" \"  data-action=\"pestana\" data-p=\"jugar\">\u003ci class=\"fa-solid fa-bolt\" aria-hidden=\"true\">\u003c/i> Mis técnicas\u003c/button>\u003cbutton type=\"button\" class=\" \"  data-action=\"pestana\" data-p=\"tienda\">\u003ci class=\"fa-solid fa-book-open\" aria-hidden=\"true\">\u003c/i> Aprender\u003c/button>\u003cbutton type=\"button\" class=\" \"  data-action=\"pestana\" data-p=\"ramas\">\u003ci class=\"fa-solid fa-seedling\" aria-hidden=\"true\">\u003c/i> Mejorar\u003c/button>\u003cbutton type=\"button\" class=\" \"  data-action=\"pestana\" data-p=\"guia\">\u003ci class=\"fa-solid fa-circle-question\" aria-hidden=\"true\">\u003c/i> Ayuda rápida\u003c/button>\u003c/nav>\u003csection class=\"ecos-verbe-cuerpo\" aria-label=\"Inicio\">\u003col class=\"ev-progreso\" aria-label=\"Primeros pasos\">\u003cli class=\"hecho\" >\u003cspan aria-hidden=\"true\">✓\u003c/span>Elige elemento\u003c/li>\u003cli class=\"actual\" aria-current=\"step\">\u003cspan aria-hidden=\"true\">2\u003c/span>Elige especialidad\u003c/li>\u003cli class=\"\" >\u003cspan aria-hidden=\"true\">3\u003c/span>Aprende una técnica\u003c/li>\u003cli class=\"\" >\u003cspan aria-hidden=\"true\">4\u003c/span>Listo para jugar\u003c/li>\u003c/ol>\u003csection class=\"ev-bienvenida\">\u003cspan class=\"ev-kicker\">TU SIGUIENTE PASO · 2 DE 3\u003c/span>\u003ch2>¿Cómo quieres usar tu poder?\u003c/h2>\u003cp>Tu especialidad se llama \u003cb>rama principal\u003c/b>. Empiezas Entrenado gratis; puedes aprender otras ramas después.\u003c/p>\u003cdiv class=\"ev-elecciones ramas\">\u003cbutton type=\"button\" class=\"ev-eleccion\" data-action=\"elegir\" data-campo=\"principal\" data-valor=\"forma\">\u003ci class=\"fa-solid fa-wand-magic-sparkles\" aria-hidden=\"true\">\u003c/i>\u003cstrong>Forma\u003c/strong>\u003cb>Ataques y elementos\u003c/b>\u003csmall>Dale forma a tu energía y úsala a distancia.\u003c/small>\u003cspan>Elegir Forma →\u003c/span>\u003c/button>\u003cbutton type=\"button\" class=\"ev-eleccion\" data-action=\"elegir\" data-campo=\"principal\" data-valor=\"velo\">\u003ci class=\"fa-solid fa-masks-theater\" aria-hidden=\"true\">\u003c/i>\u003cstrong>Velo\u003c/strong>\u003cb>Engaño e ilusiones\u003c/b>\u003csmall>Confunde, distrae y cambia lo que otros perciben.\u003c/small>\u003cspan>Elegir Velo →\u003c/span>\u003c/button>\u003cbutton type=\"button\" class=\"ev-eleccion\" data-action=\"elegir\" data-campo=\"principal\" data-valor=\"cuerpo\">\u003ci class=\"fa-solid fa-hand-fist\" aria-hidden=\"true\">\u003c/i>\u003cstrong>Cuerpo\u003c/strong>\u003cb>Combate cercano\u003c/b>\u003csmall>Refuerza tu cuerpo, tus golpes y tu movimiento.\u003c/small>\u003cspan>Elegir Cuerpo →\u003c/span>\u003c/button>\u003cbutton type=\"button\" class=\"ev-eleccion\" data-action=\"elegir\" data-campo=\"principal\" data-valor=\"sello\">\u003ci class=\"fa-solid fa-draw-polygon\" aria-hidden=\"true\">\u003c/i>\u003cstrong>Sello\u003c/strong>\u003cb>Protección y control\u003c/b>\u003csmall>Prepara marcas, barreras y restricciones.\u003c/small>\u003cspan>Elegir Sello →\u003c/span>\u003c/button>\u003cbutton type=\"button\" class=\"ev-eleccion\" data-action=\"elegir\" data-campo=\"principal\" data-valor=\"hilo\">\u003ci class=\"fa-solid fa-bezier-curve\" aria-hidden=\"true\">\u003c/i>\u003cstrong>Hilo\u003c/strong>\u003cb>Herramientas y precisión\u003c/b>\u003csmall>Maneja hilos y mecanismos con tu energía.\u003c/small>\u003cspan>Elegir Hilo →\u003c/span>\u003c/button>\u003cbutton type=\"button\" class=\"ev-eleccion\" data-action=\"elegir\" data-campo=\"principal\" data-valor=\"quietud\">\u003ci class=\"fa-solid fa-leaf\" aria-hidden=\"true\">\u003c/i>\u003cstrong>Quietud\u003c/strong>\u003cb>Calma y entorno\u003c/b>\u003csmall>Trabaja con la energía del mundo que te rodea.\u003c/small>\u003cspan>Elegir Quietud →\u003c/span>\u003c/button>\u003cbutton type=\"button\" class=\"ev-eleccion\" data-action=\"elegir\" data-campo=\"principal\" data-valor=\"rastro\">\u003ci class=\"fa-solid fa-compass\" aria-hidden=\"true\">\u003c/i>\u003cstrong>Rastro\u003c/strong>\u003cb>Exploración y sentidos\u003c/b>\u003csmall>Encuentra señales y percibe lo que otros pasan por alto.\u003c/small>\u003cspan>Elegir Rastro →\u003c/span>\u003c/button>\u003cbutton type=\"button\" class=\"ev-eleccion\" data-action=\"elegir\" data-campo=\"principal\" data-valor=\"umbral\">\u003ci class=\"fa-solid fa-door-open\" aria-hidden=\"true\">\u003c/i>\u003cstrong>Umbral\u003c/strong>\u003cb>Marcas y espacio-tiempo\u003c/b>\u003csmall>Prepara anclas y mueve a tus aliados entre posiciones.\u003c/small>\u003cspan>Elegir Umbral →\u003c/span>\u003c/button>\u003c/div>\u003c/section>\n      \u003cdiv class=\"ev-estadisticas\">\u003cdiv>\u003csmall>CD de tus técnicas\u003c/small>\u003cb>13\u003c/b>\u003cspan>El rival debe igualar o superar esta dificultad.\u003c/span>\u003c/div>\u003cdiv>\u003csmall>Ataque con Verbe\u003c/small>\u003cb>+5\u003c/b>\u003cspan>La técnica puede usar otra característica.\u003c/span>\u003c/div>\u003cdiv>\u003csmall>Grado máximo por nivel\u003c/small>\u003cb>2\u003c/b>\u003cspan>Cada rama también tiene su propio límite.\u003c/span>\u003c/div>\u003c/div>\n      \u003cdetails class=\"ev-ficha-personal\">\u003csummary>Mi personaje: afinidades, linaje y otros detalles\u003c/summary>\n      \u003ctable class=\"ecos-verbe-datos\">\n        \u003ctr>\u003cth>Característica \u003ci class=\"ecos-verbe-ayuda fa-solid fa-circle-question\" data-tooltip=\"La característica con la que usas el Verbe. Da la CD de tus técnicas (8 + competencia + modificador), su bonificador de ataque y suma a tu reserva.\">\u003c/i>\u003c/th>\u003ctd>Sabiduría · CD de tus técnicas \u003cb>13\u003c/b> · ataque \u003cb>+5\u003c/b>\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Naturaleza\u003c/th>\u003ctd>Fuego\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Otra naturaleza\u003c/th>\u003ctd>Puede que tu Verbe responda a otra naturaleza que no conoces. Se intenta descubrir con «Probar» en Aprender; si responde, aprender la técnica cuesta los Trazos indicados.\u003c/td>\u003c/tr>\n        \n        \u003ctr>\u003cth>Linaje\u003c/th>\u003ctd>Desconocido. Hay cosas de tu sangre que no tienes manera de saber; si las hay, aparecen jugando.\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Rama principal\u003c/th>\u003ctd>por elegir\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Grado máximo \u003ci class=\"ecos-verbe-ayuda fa-solid fa-circle-question\" data-tooltip=\"Qué tan fuerte es una técnica, de 0 a 11 (como el nivel de un conjuro, con dos grados más arriba del 9). Tu grado máximo sube con tu nivel: grado 1 en el nivel 1, 2 en el 3, 3 en el 5… 9 en el 17, 10 en el 19 y 11 en el 20. En cada rama, además, llegas solo hasta lo que deja tu rango.\">\u003c/i>\u003c/th>\u003ctd>2 (eres nivel 3) · el grado 3 llega en el nivel 5\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Control del Verbe \u003ci class=\"ecos-verbe-ayuda fa-solid fa-circle-question\" data-tooltip=\"Una habilidad nueva de tu hoja (con Sabiduría). Se tira para ganar un choque entre dos técnicas, romper un Velo, abrir los Cerrojos y no perderse en la Quietud. Se compra en Mejorar → Especialidades.\">\u003c/i>\u003c/th>\u003ctd>Sin competencia (se compra en Ramas)\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Sobreesfuerzo \u003ci class=\"ecos-verbe-ayuda fa-solid fa-circle-question\" data-tooltip=\"Puedes gastar Verbe que no tienes: tu barra baja de 0 hasta la mitad de tu reserva en negativo. Cada técnica que usas en negativo te pide una salvación de CON (CD 10 + su grado); si fallas, ganas 1 Agotamiento. Lo que quede en negativo cuesta el doble de recuperar.\">\u003c/i>\u003c/th>\u003ctd>Puedes gastar Verbe que no tienes hasta llegar a -10.\u003c/td>\u003c/tr>\n        \n        \n      \u003c/table>\u003c/details>\n      \n      \u003cdetails>\u003csummary>Historial\u003c/summary>\u003cul>\u003c/ul>\u003c/details>\u003c/section>"},"aprender":{"resumen":"\u003cheader class=\"ecos-verbe-cabpanel\">\n      \u003cdiv class=\"ev-identidad\">\u003cspan class=\"ev-kicker\">EL VERBE · NIVEL 3\u003c/span>\u003cstrong>Ari · viajero del valle\u003c/strong>\u003csmall>Forma · Fuego\u003c/small>\u003c/div>\n      \u003cdiv class=\"ecos-verbe-res\">\u003cdiv class=\"ev-recurso-titulo\">\u003cb>\u003ci class=\"fa-solid fa-droplet\" aria-hidden=\"true\">\u003c/i> Verbe \u003cspan>18 / 21\u003c/span>\u003c/b>\u003csmall>ENERGÍA PARA USAR\u003c/small>\u003c/div>\u003cdiv class=\"ecos-verbe-barra grande \" role=\"meter\" aria-label=\"Reserva de Verbe\" aria-v a jugar\u003c/li>\u003c/ol>\u003csection class=\"ev-bienvenida\">\u003cspan class=\"ev-kicker\">TU SIGUIENTE PASO · 3 DE 3\u003c/span>\u003ch2>Aprende tu primera técnica\u003c/h2>\u003cp>Aprender cuesta \u003cb>Trazos\u003c/b> una sola vez. Usar después la técnica cuesta \u003cb>Verbe\u003c/b>. Estas opciones encajan con tus elecciones; tú decides.\u003c/p>\n        \u003cdiv class=\"ev-tarjetas\">\u003carticle class=\"ev-tecnica \">\n    \u003cdiv class=\"ev-tec-top\">\u003cspan class=\"ev-etiqueta\">Grado 0\u003c/span>\u003cspan class=\"ev-etiqueta suave\">Forma\u003c/span>\u003cspan class=\"ev-etiqueta suave\">Fuego\u003c/span>\u003c/div>\n    \u003ch3>Brasa\u003c/h3>\u003cp class=\"ev-texto-tecnica\">Ataque: 1d10 fuego. Lo inflamable que no lleva nadie prende. Sube un dado en los niveles 5, 11 y 17.\u003c/p>\n    \u003cdiv class=\"ev-tec-datos\">\u003cspan>\u003ci class=\"fa-regular fa-clock\" aria-hidden=\"true\">\u003c/i> Acción\u003c/span>\u003cspan>\u003ci class=\"fa-solid fa-crosshairs\" aria-hidden=\"true\">\u003c/i> 18 m\u003c/span>\u003c/div>\n    \u003cdiv class=\"ev-costes\">\u003cspan>\u003cb>0\u003c/b> Verbe \u003csmall>por uso base\u003c/small>\u003c/span>\u003cspan>\u003cb>1\u003c/b> Trazos \u003csmall>para aprender\u003c/small>\u003c/span>\u003c/div>\n    \u003cp class=\"ev-disponibilidad\">Te quedarán 15 Trazos después de aprenderla.\u003c/p>\u003cp class=\"ev-nota\">Aprender no gasta Verbe. Lo gastarás al usarla.\u003c/p>\n    \u003cfooter>\u003cbutton type=\"button\" class=\"ev-principal\" data-action=\"aprender\" data-id=\"fuego-brasa\" >Aprender · 1 Trazo\u003c/button>\u003cbutton type=\"button\" data-action=\"ficha\" data-id=\"fuego-brasa\">Ver detalles\u003c/button>\u003c/footer>\n  \u003c/article>\u003carticle class=\"ev-tecnica \">\n    \u003cdiv class=\"ev-tec-top\">\u003cspan class=\"ev-etiqueta\">Grado 0\u003c/span>\u003cspan class=\"ev-etiqueta suave\">Forma\u003c/span>\u003cspan class=\"ev-etiqueta suave\">Fuego\u003c/span>\u003c/div>\n    \u003ch3>Soplo de brasa\u003c/h3>\u003cp class=\"ev-texto-tecnica\">DES, si falla: 1d6 fuego. Sube un dado en los niveles 5, 11 y 17.\u003c/p>\n    \u003cdiv class=\"ev-tec-datos\">\u003cspan>\u003ci class=\"fa-regular fa-clock\" aria-hidden=\"true\">\u003c/i> Acción\u003c/span>\u003cspan>\u003ci class=\"fa-solid fa-crosshairs\" aria-hidden=\"true\">\u003c/i> sobre ti\u003c/span>\u003cspan>cono 3 m\u003c/span>\u003c/div>\n    \u003cdiv class=\"ev-costes\">\u003cspan>\u003cb>0\u003c/b> Verbe \u003csmall>por uso base\u003c/small>\u003c/span>\u003cspan>\u003cb>1\u003c/b> Trazos \u003csmall>para aprender\u003c/small>\u003c/span>\u003c/div>\n    \u003cp class=\"ev-disponibilidad\">Te quedarán 15 Trazos después de aprenderla.\u003c/p>\u003cp class=\"ev-nota\">Aprender no gasta Verbe. Lo gastarás al usarla.\u003c/p>\n    \u003cfooter>\u003cbutton type=\"button\" class=\"ev-principal\" data-action=\"aprender\" data-id=\"fuego-soplo\" >Aprender · 1 Trazo\u003c/button>\u003cbutton type=\"button\" data-action=\"ficha\" data-id=\"fuego-soplo\">Ver detalles\u003c/button>\u003c/footer>\n  \u003c/article>\u003carticle class=\"ev-tecnica \">\n    \u003cdiv class=\"ev-tec-top\">\u003cspan class=\"ev-etiqueta\">Grado 0\u003c/span>\u003cspan class=\"ev-etiqueta suave\">Forma\u003c/span>\u003cspan class=\"ev-etiqueta suave\">Fuego\u003c/span>\u003c/div>\n    \u003ch3>Dedos de brasa\u003c/h3>\u003cp class=\"ev-texto-tecnica\">Ataque: 1d10 fuego. Tus dedos arden: un toque que quema. Sube un dado en los niveles 5, 11 y 17.\u003c/p>\n    \u003cdiv class=\"ev-tec-datos\">\u003cspan>\u003ci class=\"fa-regular fa-clock\" aria-hidden=\"true\">\u003c/i> Acción\u003c/span>\u003cspan>\u003ci class=\"fa-solid fa-crosshairs\" aria-hidden=\"true\">\u003c/i> toque\u003c/span>\u003c/div>\n    \u003cdiv class=\"ev-costes\">\u003cspan>\u003cb>0\u003c/b> Verbe \u003csmall>por uso base\u003c/small>\u003c/span>\u003cspan>\u003cb>1\u003c/b> Trazos \u003csmall>para aprender\u003c/small>\u003c/span>\u0
