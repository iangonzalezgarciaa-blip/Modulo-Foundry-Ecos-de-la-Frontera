/* Ecos de la frontera · tarjetas del chat y diálogos */

.ecos-card.ecos-verbe-chat { border-color: #2d5f9e; background: rgba(45, 123, 224, 0.08); }

/* Capa V v1.1: cabecera, pasos, tienda y dotes */
.ecos-verbe-cabpanel { display: flex; gap: 10px; align-items: center; padding: 8px 10px 4px; flex: none; }
.ecos-verbe-trazos { display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: 92px; padding: 4px 8px; border-radius: 8px; border: 2px solid rgba(127, 127, 127, 0.5); }
.ecos-verbe-trazos.hay { border-color: #c9a227; background: rgba(218, 165, 32, 0.12); }
.ecos-verbe-trazos .n { font-size: 26px; font-weight: bold; line-height: 1; }
.ecos-verbe-trazos .t { font-size: 11px; opacity: 0.85; text-align: center; }
.ecos-verbe-res { flex: 1; min-width: 0; }
.ecos-verbe-res small { opacity: 0.8; }
.ecos-verbe-dmbar { margin: 0 10px 4px; padding: 3px 8px; border-radius: 4px; background: rgba(47, 79, 122, 0.15); font-size: 0.85em; display: flex; flex-wrap: wrap; gap: 4px; align-items: center; flex: none; }
.ecos-verbe-dmbar button { width: auto; line-height: 1.4; padding: 0 6px; font-size: 0.95em; }
.ecos-verbe-dmbar button.activo { background: rgba(218, 165, 32, 0.35); }
.ecos-verbe-tabs a.dm { color: #6f8fc4; }
.ecos-verbe-intro { margin: 0 0 8px; padding: 6px 8px; border-left: 3px solid #3d8bef; background: rgba(45, 123, 224, 0.07); border-radius: 0 4px 4px 0; }
.ecos-verbe-intro p { margin: 0; }
.ecos-verbe-intro details { margin-top: 4px; font-size: 0.92em; }
.ecos-verbe-guia { cursor: pointer; white-space: nowrap; font-size: 0.9em; }
.ecos-verbe-ayuda { cursor: help; opacity: 0.7; font-size: 0.85em; }
.ecos-verbe-lista { margin: 4px 0; padding-left: 1.2em; }
.ecos-verbe-lista li { margin: 2px 0; }
.ecos-verbe-paso { display: flex; gap: 8px; margin: 6px 0; padding: 6px 8px; border: 1px solid rgba(127, 127, 127, 0.35); border-radius: 6px; }
.ecos-verbe-paso .num { flex: none; width: 24px; height: 24px; border-radius: 50%; background: #3d8bef; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: bold; }
.ecos-verbe-paso.hecho { opacity: 0.75; }
.ecos-verbe-paso.hecho .num { background: #3b6b3b; }
.ecos-verbe-paso > div:last-child { flex: 1; min-width: 0; }
.ecos-verbe-eleccion p { margin: 4px 0; }
.ecos-verbe-desc { margin: 4px 0; padding: 6px 8px; border-radius: 4px; background: rgba(127, 127, 127, 0.08); font-size: 0.92em; }
.ecos-verbe-desc p { margin: 2px 0; }
.ecos-verbe-glosario dt { font-weight: bold; margin-top: 4px; }
.ecos-verbe-glosario dd { margin: 0 0 2px 1em; }
.ecos-verbe-dmsec { margin: 4px 0; border: 1px solid rgba(47, 79, 122, 0.4); border-radius: 6px; padding: 2px 8px; }
.ecos-verbe-dmsec > summary { cursor: pointer; font-weight: bold; padding: 2px 0; }
details.ecos-verbe-grupo { margin: 6px 0; border: 1px solid rgba(127, 127, 127, 0.35); border-radius: 6px; }
details.ecos-verbe-grupo > summary { cursor: pointer; padding: 4px 8px; background: rgba(127, 127, 127, 0.1); border-radius: 6px; }
details.ecos-verbe-grupo > summary span { font-size: 0.85em; opacity: 0.8; margin-left: 6px; }
details.ecos-verbe-tec { border-top: 1px dotted rgba(127, 127, 127, 0.35); }
details.ecos-verbe-tec > summary { display: flex; align-items: center; gap: 8px; padding: 3px 8px; cursor: pointer; list-style: none; }
details.ecos-verbe-tec > summary::-webkit-details-marker { display: none; }
details.ecos-verbe-tec > summary:hover { background: rgba(45, 123, 224, 0.08); }
details.ecos-verbe-tec .gr { flex: none; min-width: 2.4em; text-align: center; font-weight: bold; border-radius: 4px; padding: 0 4px; background: rgba(45, 123, 224, 0.18); }
details.ecos-verbe-tec .nom { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.2; }
details.ecos-verbe-tec .nom small { opacity: 0.75; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
details.ecos-verbe-tec .vb { flex: none; font-size: 0.85em; opacity: 0.85; }
details.ecos-verbe-tec .acc { flex: none; max-width: 40%; text-align: right; }
details.ecos-verbe-tec .acc button { width: auto; line-height: 1.6; padding: 0 8px; }
details.ecos-verbe-tec.sabe .gr { background: rgba(59, 107, 59, 0.35); }
details.ecos-verbe-tec.no { opacity: 0.8; }
details.ecos-verbe-tec[open] > summary { background: rgba(45, 123, 224, 0.12); }
.ecos-verbe-ficha-cont { padding: 4px 10px 8px 3.2em; font-size: 0.92em; }
.ecos-verbe-ficha-cont .texto { margin: 2px 0 6px; }
.ecos-verbe-ficha { width: 100%; border-collapse: collapse; }
.ecos-verbe-ficha th { text-align: left; white-space: nowrap; padding: 2px 6px 2px 0; opacity: 0.8; vertical-align: top; width: 1%; }
.ecos-verbe-ficha td { padding: 2px 8px 2px 0; vertical-align: top; }

/* v2.7: dinero en el chat, descansos con Dados de Golpe, clima y motivos de los relojes */
.ecos-card.ecos-dinero { border-color: #8a6a2a; background: rgba(218, 165, 32, 0.07); font-size: 0.95em; }
.ecos-card.ecos-dinero h3 { border-bottom-color: rgba(138, 106, 42, 0.4); }
.ecos-card.ecos-clima { border-color: #3d6b8a; background: rgba(61, 107, 138, 0.08); }
.ecos-card.ecos-clima h3 { border-bottom-color: rgba(61, 107, 138, 0.45); }
.ecos-card.ecos-clima .ecos-guia { border-top-color: rgba(61, 107, 138, 0.45); }
.window-header .ecos-cabecera.ecos-descansos { padding: 0 6px; }
.window-header .ecos-cabecera.ecos-descansos.activo { color: #7fbf7f; }
.ecos-gastar-dg .window-content, .ecos-ajustes-descansos .window-content, .ecos-clima-dm .window-content { padding: 8px 10px; }
.ecos-gastar-dg .ecos-dg-botones { display: flex; flex-direction: column; gap: 4px; margin: 6px 0; }
.ecos-gastar-dg .ecos-dg-botones button { text-align: left; }
.ecos-ajustes-descansos .ecos-tabla th { width: 38%; }
.ecos-ajustes-descansos .ecos-tabla td select { width: auto; max-width: 100%; }
.ecos-ajustes-descansos h3 { margin: 10px 0 4px; font-size: 1.05em; }
.ecos-lista-desc { list-style: none; margin: 0; padding: 0; max-height: 220px; overflow-y: auto; }
.ecos-lista-desc li { display: flex; align-items: center; gap: 6px; padding: 2px 0; border-bottom: 1px dotted rgba(127, 127, 127, 0.3); }
.ecos-lista-desc li a { flex: 0 0 auto; font-weight: bold; cursor: pointer; }
.ecos-lista-desc li .ecos-nota { flex: 1; }
.ecos-lista-desc li button { flex: 0 0 26px; width: 26px; height: 22px; line-height: 1; padding: 0; }
.ecos-ajustes-descansos .ecos-botones, .ecos-gastar-dg .ecos-botones, .ecos-clima-dm .ecos-botones { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.ecos-ajustes-descansos .ecos-botones button, .ecos-gastar-dg .ecos-botones button, .ecos-clima-dm .ecos-botones button { flex: 1 1 auto; }
.ecos-clima-dm .ecos-clima-hoy { padding: 4px 8px; border: 1px solid rgba(61, 107, 138, 0.45); border-radius: 6px; background: rgba(61, 107, 138, 0.06); }
.ecos-clima-dm .ecos-clima-hoy h3 { margin: 2px 0; font-size: 1.05em; }
.ecos-clima-dm .ecos-clima-hoy ul, .ecos-clima-dm .ecos-clima-vista ul { margin: 2px 0 4px; padding-left: 1.2em; }
.ecos-clima-dm h3 { margin: 8px 0 2px; font-size: 1em; }
.ecos-clima-dm .ecos-tabla select { width: auto; }
.ecos-clima-dm p button { width: auto; line-height: 1.6; padding: 0 6px; margin-left: 4px; }
.ecos-relojes .ecos-reloj-motivos { margin: 3px 0 0; font-size: 0.9em; }
.ecos-relojes .ecos-reloj-motivos summary { cursor: pointer; opacity: 0.85; }
.ecos-relojes .ecos-reloj-motivos summary a { margin-left: 6px; opacity: 0.7; }
.ecos-relojes .ecos-reloj-motivos ul { margin: 0 0 3px; padding-left: 1.2em; }
.ecos-relojes .ecos-reloj-motivos li { margin: 1px 0; }
.ecos-relojes p.ecos-motivo-sube { color: #b5503f; }
.ecos-relojes p.ecos-motivo-frena { color: #8a7a3a; }
.ecos-relojes p.ecos-motivo-baja { color: #4f8a4f; }
.ecos-motivos-form label { display: block; margin: 4px 0; }
.ecos-motivos-form textarea { width: 100%; font-size: 0.92em; }
/* Capa V v1.2: crece, se mejora con y lo que cuesta contra alguien más fuerte */
.ecos-verbe-crece, .ecos-verbe-mejora { margin: 4px 0; padding: 3px 8px; border-left: 3px solid rgba(218, 165, 32, 0.55); font-size: 0.9em; }
.ecos-verbe-mejora { border-left-color: rgba(79, 138, 79, 0.6); }
.ecos-verbe-crece ul, .ecos-verbe-mejora ul { margin: 2px 0; padding-left: 1.2em; }
.ecos-verbe-crece li, .ecos-verbe-mejora li { margin: 1px 0; }
.ecos-verbe-fuerte { margin: 4px 0; padding: 3px 8px; border-left: 3px solid rgba(168, 50, 45, 0.6); font-size: 0.9em; }

/* Panel 2.9: inicio guiado y repertorio de juego. Los colores siempre van acompañados de texto. */
.ecos-verbe-panel {
  --ev-fondo: #f3eee2; --ev-papel: #fffcf4; --ev-tinta: #292724; --ev-suave: #655d50;
  --ev-linea: #d7ceba; --ev-acento: #443d32; --ev-acento-texto: #fff; --ev-agua: #eee7d8;
  --ev-oro: #775719; --ev-oro-fondo: #f7efd9; --ev-alerta: #85401e; --ev-alerta-fondo: #fff0df;
  --ev-bloqueo: #7d3636;
}
.theme-dark .ecos-verbe-panel, .ecos-verbe-panel.theme-dark {
  --ev-fondo: #1f2023; --ev-papel: #2a2c30; --ev-tinta: #f2eee2; --ev-suave: #c4bfb1;
  --ev-linea: #535159; --ev-acento: #ead9a4; --ev-acento-texto: #252525; --ev-agua: #373530;
  --ev-oro: #ead18b; --ev-oro-fondo: #3d3523; --ev-alerta: #ffc593; --ev-alerta-fondo: #422e23;
  --ev-bloqueo: #ffb8b3;
}
.ecos-verbe-panel .window-content {
  background: var(--ev-fondo); color: var(--ev-tinta); font-size: 14px; line-height: 1.45;
  container-type: inline-size; container-name: panel-verbe; min-height: 0;
}
.ecos-verbe-panel button, .ecos-verbe-panel input, .ecos-verbe-panel select { font: inherit; }
.ecos-verbe-panel button { color: var(--ev-tinta); background: var(--ev-papel); border: 1px solid var(--ev-linea); border-radius: 7px; cursor: pointer; }
.ecos-verbe-panel button:hover:not(:disabled) { border-color: var(--ev-acento); background: var(--ev-agua); box-shadow: none; }
.ecos-verbe-panel button:disabled { cursor: not-allowed; opacity: .65; }
.ecos-verbe-panel :is(button, summary, input, select, a):focus-visible { outline: 3px solid var(--ev-acento); outline-offset: 3px; }
.ecos-verbe-panel input:not([type="checkbox"]), .ecos-verbe-panel select { background: var(--ev-papel); color: var(--ev-tinta); border: 1px solid var(--ev-linea); border-radius: 6px; min-height: 36px; padding: 5px 8px; }
.ecos-verbe-panel input[type="checkbox"] { accent-color: var(--ev-acento); }
.ecos-verbe-panel .ecos-verbe-cabpanel { display: grid; grid-template-columns: 1.05fr 1.3fr .9fr; gap: 22px; padding: 20px; align-items: center; background: var(--ev-papel); margin: 0; border-bottom: 1px solid var(--ev-linea); }
.ecos-verbe-panel .ev-identidad { display: flex; flex-direction: column; min-width: 0; gap: 4px; }
.ecos-verbe-panel .ev-identidad strong { font-size: 24px; font-family: Georgia, serif; line-height: 1.15; overflow-wrap: anywhere; }
.ecos-verbe-panel .ev-kicker { font-size: 10px; letter-spacing: .13em; font-weight: 750; color: var(--ev-acento); }
.ecos-verbe-panel .ev-identidad small { color: var(--ev-suave); font-size: 12px; }
.ecos-verbe-panel .ecos-verbe-trazos { border: 1px solid var(--ev-linea); border-radius: 10px; min-width: 0; padding: 10px 8px; gap: 2px; }
.ecos-verbe-panel .ecos-verbe-trazos.hay { background: var(--ev-oro-fondo); color: var(--ev-oro); border-color: color-mix(in srgb, var(--ev-oro) 32%, transparent); }
.ecos-verbe-panel .ecos-verbe-trazos .n { font-size: 30px; }
.ecos-verbe-panel .ecos-verbe-trazos .t { font-size: 12px; opacity: 1; }
.ecos-verbe-panel .ecos-verbe-trazos small { font-size: 10px; text-align: center; }
.ecos-verbe-panel .ev-recurso-titulo { display: flex; flex-direction: column; gap: 3px; }
.ecos-verbe-panel .ev-recurso-titulo b { display: flex; align-items: center; gap: 5px; }
.ecos-verbe-panel .ev-recurso-titulo b span { margin-left: auto; font-variant-numeric: tabular-nums; }
.ecos-verbe-panel .ev-recurso-titulo small { font-size: 10px; letter-spacing: .08em; color: var(--ev-suave); }
.ecos-verbe-panel .ecos-verbe-barra.grande { height: 9px; margin: 7px 0; background: var(--ev-agua); border: 0; border-radius: 20px; }
.ecos-verbe-panel .ecos-verbe-barra > div { background: var(--ev-acento); }
.ecos-verbe-panel .ecos-verbe-barra.negativo > div { background: var(--ev-alerta); }
.ecos-verbe-panel .ecos-verbe-res > small { color: var(--ev-suave); font-size: 11px; opacity: 1; }
.ecos-verbe-panel .ecos-verbe-tabs { padding: 8px 12px; gap: 4px; background: var(--ev-papel); border-color: var(--ev-linea); flex-wrap: wrap; }
.ecos-verbe-panel .ecos-verbe-tabs button { flex: 1 1 auto; width: auto; min-height: 38px; padding: 6px 10px; border-color: transparent; background: transparent; font-size: 13px; }
.ecos-verbe-panel .ecos-verbe-tabs button i { margin-right: 4px; }
.ecos-verbe-panel .ecos-verbe-tabs button.activa { background: var(--ev-agua); border-color: var(--ev-linea); color: var(--ev-acento); font-weight: 750; }
.ecos-verbe-panel .ecos-verbe-cuerpo { padding: 20px; min-height: 0; }
.ecos-verbe-panel .ecos-verbe-cuerpo :is(h2, h3) { color: var(--ev-tinta); border: 0; }
.ecos-verbe-panel .ecos-verbe-cuerpo h2 { font: 600 27px/1.2 Georgia, serif; margin: 5px 0 12px; }
.ecos-verbe-panel .ecos-verbe-cuerpo h3 { font-size: 17px; margin: 6px 0; }
.ecos-verbe-panel .ecos-verbe-cuerpo p { margin: 6px 0 12px; }
.ecos-verbe-panel .ecos-verbe-cuerpo button { min-height: 36px; padding: 6px 10px; font-size: 13px; line-height: 1.3; white-space: normal; }
.ecos-verbe-panel button.ev-principal { background: var(--ev-acento); border-color: var(--ev-acento); color: var(--ev-acento-texto); font-weight: 700; }
.ecos-verbe-panel button.ev-principal:hover:not(:disabled) { filter: brightness(.93); background: var(--ev-acento); color: var(--ev-acento-texto); }
.ecos-verbe-panel .ev-progreso { display: flex; list-style: none; margin: 0 0 18px; padding: 0; gap: 8px; }
.ecos-verbe-panel .ev-progreso li { display: flex; align-items: center; gap: 6px; flex: 1; font-size: 11px; color: var(--ev-suave); }
.ecos-verbe-panel .ev-progreso li > span { width: 24px; height: 24px; border: 1px solid var(--ev-linea); border-radius: 50%; display: grid; place-items: center; flex: none; background: var(--ev-papel); }
.ecos-verbe-panel .ev-progreso .actual { color: var(--ev-acento); font-weight: 750; }
.ecos-verbe-panel .ev-progreso .actual > span { background: var(--ev-acento); color: var(--ev-acento-texto); }
.ecos-verbe-panel .ev-progreso .hecho > span { background: var(--ev-agua); color: var(--ev-acento); }
.ecos-verbe-panel .ev-bienvenida { padding: 20px; background: var(--ev-papel); border: 1px solid var(--ev-linea); border-radius: 12px; margin-bottom: 18px; }
.ecos-verbe-panel .ev-bienvenida > p { color: var(--ev-suave); max-width: 74ch; }
.ecos-verbe-panel .ev-elecciones { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 18px; }
.ecos-verbe-panel .ev-eleccion { display: flex; flex-direction: column; align-items: flex-start; text-align: left; gap: 7px; padding: 15px; min-height: 155px; }
.ecos-verbe-panel .ev-eleccion strong { font-size: 18px; }
.ecos-verbe-panel .ev-eleccion b { font-size: 12px; }
.ecos-verbe-panel .ev-eleccion small { font-size: 12px; line-height: 1.5; color: var(--ev-suave); }
.ecos-verbe-panel .ev-eleccion > span:last-child { color: var(--ev-acento); font-size: 11px; font-weight: 700; margin-top: auto; }
.ecos-verbe-panel .ev-eleccion .ev-elemento { font-size: 27px; line-height: 1; color: var(--ev-acento); }
.ecos-verbe-panel .ev-eleccion.fuego .ev-elemento { color: #b6542b; }
.ecos-verbe-panel .ev-eleccion.rayo .ev-elemento { color: var(--ev-oro); }
.ecos-verbe-panel .ev-eleccion.agua .ev-elemento { color: #3985ad; }
.ecos-verbe-panel .ev-tarjetas { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; margin: 16px 0; }
.ecos-verbe-panel .ev-bienvenida .ev-tarjetas { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.ecos-verbe-panel .ev-tecnica { display: flex; flex-direction: column; min-width: 0; border: 1px solid var(--ev-linea); border-radius: 10px; background: var(--ev-papel); padding: 16px; }
.ecos-verbe-panel .ev-tecnica.riesgo { border-color: var(--ev-alerta); }
.ecos-verbe-panel .ev-tec-top { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 9px; }
.ecos-verbe-panel .ev-etiqueta { border-radius: 5px; padding: 3px 6px; background: var(--ev-agua); color: var(--ev-acento); font-size: 10px; font-weight: 700; }
.ecos-verbe-panel .ev-etiqueta.suave { background: var(--ev-fondo); color: var(--ev-suave); }
.ecos-verbe-panel .ev-tecnica h3 { font: 600 21px/1.2 Georgia, serif; overflow-wrap: anywhere; }
.ecos-verbe-panel .ev-texto-tecnica { font-size: 13px; color: var(--ev-suave); }
.ecos-verbe-panel .ev-tec-datos { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 11px; margin: 2px 0 10px; color: var(--ev-suave); }
.ecos-verbe-panel .ev-costes { display: flex; flex-wrap: wrap; gap: 14px; padding: 10px 0; border-block: 1px solid var(--ev-linea); font-size: 12px; margin-top: auto; }
.ecos-verbe-panel .ev-costes > span { display: block; }
.ecos-verbe-panel .ev-costes b { font-size: 20px; color: var(--ev-acento); }
.ecos-verbe-panel .ev-costes small { display: block; color: var(--ev-suave); font-size: 10px; }
.ecos-verbe-panel .ev-tecnica footer { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.ecos-verbe-panel .ev-tecnica footer button { flex: 1; font-size: 12px; }
.ecos-verbe-panel p.ev-disponibilidad { color: var(--ev-acento); font-size: 12px; margin: 10px 0 5px; }
.ecos-verbe-panel p.ev-disponibilidad.bloqueada { color: var(--ev-bloqueo); }
.ecos-verbe-panel p.ev-disponibilidad.riesgo { color: var(--ev-alerta); }
.ecos-verbe-panel .ev-nota { font-size: 12px; color: var(--ev-suave); }
.ecos-verbe-panel .ev-acciones { display: flex; flex-wrap: wrap; gap: 8px; margin: 18px 0; }
.ecos-verbe-panel .ev-mini-pasos { display: flex; flex-wrap: wrap; gap: 8px 16px; margin: 18px 0 12px; font-size: 12px; }
.ecos-verbe-panel .ev-mini-pasos b { display: inline-grid; place-items: center; background: var(--ev-agua); color: var(--ev-acento); width: 22px; height: 22px; border-radius: 50%; margin-right: 3px; }
.ecos-verbe-panel .ev-estadisticas { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin: 15px 0; }
.ecos-verbe-panel .ev-estadisticas > div { display: flex; flex-direction: column; gap: 5px; border: 1px solid var(--ev-linea); border-radius: 8px; padding: 13px; background: var(--ev-papel); }
.ecos-verbe-panel .ev-estadisticas small { color: var(--ev-suave); font-size: 11px; }
.ecos-verbe-panel .ev-estadisticas b { font-size: 26px; line-height: 1.1; }
.ecos-verbe-panel .ev-estadisticas span { font-size: 11px; color: var(--ev-suave); }
.ecos-verbe-panel .ev-ficha-personal, .ecos-verbe-panel .ev-filtros-extra { border: 1px solid var(--ev-linea); border-radius: 8px; padding: 10px 12px; margin: 12px 0; background: var(--ev-papel); }
.ecos-verbe-panel summary { cursor: pointer; min-height: 28px; }
.ecos-verbe-panel .ev-ficha-personal > summary { font-weight: 650; }
.ecos-verbe-panel .ev-reponer { background: var(--ev-oro-fondo); border: 1px solid var(--ev-linea); border-radius: 8px; padding: 14px; margin: 15px 0; display: flex; gap: 15px; }
.ecos-verbe-panel .ev-reponer > div { flex: 1; min-width: 0; }
.ecos-verbe-panel .ev-reponer p { font-size: 12px; color: var(--ev-suave); }

      \u003cdiv class=\"ecos-verbe-trazos hay\">\u003cspan class=\"n\">84\u003c/span>\u003cspan class=\"t\">\u003cb>Trazos\u003c/b> para aprender\u003c/span>\u003csmall>Se gastan una vez por compra\u003c/small>\u003c/div>\n    \u003c/header>\u003cdetails class=\"ecos-verbe-dmbar\">\u003csummary>\u003ci class=\"fa-solid fa-sliders\" aria-hidden=\"true\">\u003c/i> Herramientas del DM \u003c/summary>\u003cdiv>\u003cb>Trazos:\u003c/b>\n        \u003cbutton type=\"button\" data-action=\"trazosDM\" data-n=\"-1\">-1\u003c/button>\u003cbutton type=\"button\" data-action=\"trazosDM\" data-n=\"1\">+1\u003c/button>\u003cbutton type=\"button\" data-action=\"trazosDM\" data-n=\"2\">+2\u003c/button>\u003cbutton type=\"button\" data-action=\"trazosDM\" data-n=\"5\">+5\u003c/button>\n        · \u003cbutton type=\"button\" data-action=\"verbeDM\" data-n=\"lleno\">Llenar Verbe\u003c/button>\n        · \u003cbutton type=\"button\" data-action=\"comoJugador\" class=\"\">\u003ci class=\"fa-solid fa-eye\">\u003c/i> Ver como el jugador\u003c/button>\u003c/div>\u003c/details>\u003cnav class=\"ecos-verbe-tabs\" aria-label=\"Panel del Verbe\">\u003cbutton type=\"button\" class=\"activa \" aria-current=\"page\" data-action=\"pestana\" data-p=\"resumen\">\u003ci class=\"fa-solid fa-house\" aria-hidden=\"true\">\u003c/i> Inicio\u003c/button>\u003cbutton type=\"button\" class=\" \"  data-action=\"pestana\" data-p=\"jugar\">\u003ci class=\"fa-solid fa-bolt\" aria-hidden=\"true\">\u003c/i> Mis técnicas\u003c/button>\u003cbutton type=\"button\" class=\" \"  data-action=\"pestana\" data-p=\"tienda\">\u003ci class=\"fa-solid fa-book-open\" aria-hidden=\"true\">\u003c/i> Aprender\u003c/button>\u003cbutton type=\"button\" class=\" \"  data-action=\"pestana\" data-p=\"ramas\">\u003ci class=\"fa-solid fa-seedling\" aria-hidden=\"true\">\u003c/i> Mejorar\u003c/button>\u003cbutton type=\"button\" class=\" \"  data-action=\"pestana\" data-p=\"guia\">\u003ci class=\"fa-solid fa-circle-question\" aria-hidden=\"true\">\u003c/i> Ayuda rápida\u003c/button>\u003cbutton type=\"button\" class=\" dm\"  data-action=\"pestana\" data-p=\"dm\">\u003ci class=\"fa-solid fa-sliders\" aria-hidden=\"true\">\u003c/i> DM\u003c/button>\u003c/nav>\u003csection class=\"ecos-verbe-cuerpo\" aria-label=\"Inicio\">\u003col class=\"ev-progreso\" aria-label=\"Primeros pasos\">\u003cli class=\"hecho\" >\u003cspan aria-hidden=\"true\">✓\u003c/span>Elige elemento\u003c/li>\u003cli class=\"hecho\" >\u003cspan aria-hidden=\"true\">✓\u003c/span>Elige especialidad\u003c/li>\u003cli class=\"hecho\" >\u003cspan aria-hidden=\"true\">✓\u003c/span>Aprende una técnica\u003c/li>\u003cli class=\"actual\" aria-current=\"step\">\u003cspan aria-hidden=\"true\">4\u003c/span>Listo para jugar\u003c/li>\u003c/ol>\u003csection class=\"ev-bienvenida\">\u003cspan class=\"ev-kicker\">TU REPERTORIO ESTÁ PREPARADO\u003c/span>\u003ch2>Ya puedes entrar en acción\u003c/h2>\u003cp>Conoces \u003cb>4 técnicas\u003c/b>. Abre tu repertorio, elige qué hacer y usa el botón de la técnica.\u003c/p>\u003cdiv class=\"ev-acciones\">\u003cbutton type=\"button\" class=\"ev-principal\" data-action=\"pestana\" data-p=\"jugar\">\u003ci class=\"fa-solid fa-bolt\" aria-hidden=\"true\">\u003c/i> Usar mis técnicas\u003c/button>\u003cbutton type=\"button\" data-action=\"pestana\" data-p=\"tienda\">Aprender algo nuevo\u003c/button>\u003c/div>\n      \u003cdiv class=\"ev-mini-pasos\">\u003cspan>\u003cb>1\u003c/b> Marca el objetivo, si hace falta\u003c/span>\u003cspan>\u003cb>2\u003c/b> Pulsa «Usar técnica»\u003c/span>\u003cspan>\u003cb>3\u003c/b> Resuelve la ventana de dnd5e\u003c/span>\u003c/div>\u003cp class=\"ev-nota\">El gasto se comprueba al confirmar el uso. La posición, la visibilidad y los efectos narrativos se resuelven con el DM.\u003c/p>\u003c/section>\n      \u003cdiv class=\"ev-estadisticas\">\u003cdiv>\u003csmall>CD de tus técnicas\u003c/small>\u003cb>13\u003c/b>\u003cspan>El rival debe igualar o superar esta dificultad.\u003c/span>\u003c/div>\u003cdiv>\u003csmall>Ataque con Verbe\u003c/small>\u003cb>+5\u003c/b>\u003cspan>La técnica puede usar otra característica.\u003c/span>\u003c/div>\u003cdiv>\u003csmall>Grado máximo por nivel\u003c/small>\u003cb>11\u003c/b>\u003cspan>Cada rama también tiene su propio límite.\u003c/span>\u003c/div>\u003c/div>\n      \u003cdetails class=\"ev-ficha-personal\">\u003csummary>Mi personaje: afinidades, linaje y otros detalles\u003c/summary>\n      \u003ctable class=\"ecos-verbe-datos\">\n        \u003ctr>\u003cth>Característica \u003ci class=\"ecos-verbe-ayuda fa-solid fa-circle-question\" data-tooltip=\"La característica con la que usas el Verbe. Da la CD de tus técnicas (8 + competencia + modificador), su bonificador de ataque y suma a tu reserva.\">\u003c/i>\u003c/th>\u003ctd>Sabiduría · CD de tus técnicas \u003cb>13\u003c/b> · ataque \u003cb>+5\u003c/b>\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Naturaleza\u003c/th>\u003ctd>Fuego\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Otra naturaleza\u003c/th>\u003ctd>Puede que tu Verbe responda a otra naturaleza que no conoces. Se intenta descubrir con «Probar» en Aprender; si responde, aprender la técnica cuesta los Trazos indicados.\u003c/td>\u003c/tr>\n        \n        \u003ctr>\u003cth>Linaje\u003c/th>\u003ctd>Linaje del ojo que registra · Aster (Plena) · \u003ci>el jugador no lo sabe\u003c/i>\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Rama principal\u003c/th>\u003ctd>Vasija\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Grado máximo \u003ci class=\"ecos-verbe-ayuda fa-solid fa-circle-question\" data-tooltip=\"Qué tan fuerte es una técnica, de 0 a 11 (como el nivel de un conjuro, con dos grados más arriba del 9). Tu grado máximo sube con tu nivel: grado 1 en el nivel 1, 2 en el 3, 3 en el 5… 9 en el 17, 10 en el 19 y 11 en el 20. En cada rama, además, llegas solo hasta lo que deja tu rango.\">\u003c/i>\u003c/th>\u003ctd>11 (eres nivel 20) · es el grado más alto\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Control del Verbe \u003ci class=\"ecos-verbe-ayuda fa-solid fa-circle-question\" data-tooltip=\"Una habilidad nueva de tu hoja (con Sabiduría). Se tira para ganar un choque entre dos técnicas, romper un Velo, abrir los Cerrojos y no perderse en la Quietud. Se compra en Mejorar → Especialidades.\">\u003c/i>\u003c/th>\u003ctd>Sin competencia (se compra en Ramas)\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Sobreesfuerzo \u003ci class=\"ecos-verbe-ayuda fa-solid fa-circle-question\" data-tooltip=\"Puedes gastar Verbe que no tienes: tu barra baja de 0 hasta la mitad de tu reserva en negativo. Cada técnica que usas en negativo te pide una salvación de CON (CD 10 + su grado); si fallas, ganas 1 Agotamiento. Lo que quede en negativo cuesta el doble de recuperar.\">\u003c/i>\u003c/th>\u003ctd>Puedes gastar Verbe que no tienes hasta llegar a -85.\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Ojos\u003c/th>\u003ctd>Ojo que registra, etapa 4\u003c/td>\u003c/tr>\n        \n      \u003c/table>\u003c/details>\n      \n      \u003cdetails>\u003csummary>Historial\u003c/summary>\u003cul>\u003c/ul>\u003c/details>\u003c/section>","jugar":"\u003cheader class=\"ecos-verbe-cabpanel\">\n      \u003cdiv class=\"ev-identidad\">\u003cspan class=\"ev-kicker\">EL VERBE · NIVEL 20\u003c/span>\u003cstrong>Ari · viajero del valle\u003c/strong>\u003csmall>Vasija · Fuego\u003c/small>\u003c/div>\n      \u003cdiv class=\"ecos-verbe-res\">\u003cdiv class=\"ev-recurso-titulo\">\u003cb>\u003ci class=\"fa-solid fa-droplet\" aria-hidden=\"true\">\u003c/i> Verbe \u003cspan>48 / 170\u003c/span>\u003c/b>\u003csmall>ENERGÍA PARA USAR\u003c/small>\u003c/div>\u003cdiv class=\"ecos-verbe-barra grande \" role=\"meter\" aria-label=\"Reserva de Verbe\" aria-valuemin=\"0\" aria-valuemax=\"170\" aria-valuenow=\"48\" aria-valuetext=\"48 de 170 de Verbe\">\u003cdiv style=\"width:28.235294117647058%\">\u003c/div>\u003c/div>\n        \u003csmall>Se gasta al usar técnicas; vuelve al descansar.\u003c/small>\u003c/div>\n      \u003cdiv class=\"ecos-verbe-trazos hay\">\u003cspan class=\"n\">84\u003c/span>\u003cspan class=\"t\">\u003cb>Trazos\u003c/b> para aprender\u003c/span>\u003csmall>Se gastan una vez por compra\u003c/small>\u003c/div>\n    \u003c/header>\u003cdetails class=\"ecos-verbe-dmbar\">\u003csummary>\u003ci class=\"fa-solid fa-sliders\" aria-hidden=\"true\">\u003c/i> Herramientas del DM \u003c/summary>\u003cdiv>\u003cb>Trazos:\u003c/b>\n        \u003cbutton type=\"button\" data-action=\"trazosDM\" data-n=\"-1\">-1\u003c/button>\u003cbutton type=\"button\" data-action=\"trazosDM\" data-n=\"1\">+1\u003c/button>\u003cbutton type=\"button\" data-action=\"trazosDM\" data-n=\"2\">+2\u003c/button>\u003cbutton type=\"button\" data-action=\"trazosDM\" data-n=\"5\">+5\u003c/button>\n        · \u003cbutton type=\"button\" data-action=\"verbeDM\" data-n=\"lleno\">Llenar Verbe\u003c/button>\n        · \u003cbutton type=\"button\" data-action=\"comoJugador\" class=\"\">\u003ci class=\"fa-solid fa-eye\">\u003c/i> Ver como el jugador\u003c/button>\u003c/div>\u003c/details>\u003cnav class=\"ecos-verbe-tabs\" aria-label=\"Panel del Verbe\">\u003cbutton type=\"button\" class=\" \"  data-action=\"pestana\" data-p=\"resumen\">\u003ci class=\"fa-solid fa-house\" aria-hidden=\"true\">\u003c/i> Inicio\u003c/button>\u003cbutton type=\"button\" class=\"activa \" aria-current=\"page\" data-action=\"pestana\" data-p=\"jugar\">\u003ci class=\"fa-solid fa-bolt\" aria-hidden=\"true\">\u003c/i> Mis técnicas\u003c/button>\u003cbutton type=\"button\" class=\" \"  data-action=\"pestana\" data-p=\"tienda\">\u003ci class=\"fa-solid fa-book-open\" aria-hidden=\"true\">\u003c/i> Aprender\u003c/button>\u003cbutton type=\"button\" class=\" \"  data-action=\"pestana\" data-p=\"ramas\">\u003ci class=\"fa-solid fa-seedling\" aria-hidden=\"true\">\u003c/i> Mejorar\u003c/button>\u003cbutton type=\"button\" class=\" \"  data-action=\"pestana\" data-p=\"guia\">\u003ci class=\"fa-solid fa-circle-question\" aria-hidden=\"true\">\u003c/i> Ayuda rápida\u003c/button>\u003cbutton type=\"button\" class=\" dm\"  data-action=\"pestana\" data-p=\"dm\">\u003ci class=\"fa-solid fa-sliders\" aria-hidden=\"true\">\u003c/i> DM\u003c/button>\u003c/nav>\u003csection class=\"ecos-verbe-cuerpo\" aria-label=\"Mis técnicas\">\u003cdiv class=\"ev-instruccion\">\u003cspan>\u003cb>Reserva repartida en réplicas: 12 Verbe\u003c/b>Una acción ofensiva conjunta por turno. «Usar desde réplica» gasta ese saldo y solo admite grado 0–2. Al disipar, se pierde el saldo restante.\u003c/span>\u003cbutton type=\"button\" data-action=\"cerrarReplicas\">Disipar réplicas\u003c/button>\u003c/div>\u003cdiv class=\"ev-titulo-pagina\">\u003cdiv>\u003cspan class=\"ev-kicker\">TU REPERTORIO\u003c/span>\u003ch2>¿Qué quieres hacer?\u003c/h2>\u003cp>Usa una técnica desde aquí. Se abrirá la ventana habitual de dnd5e para confirmar el uso.\u003c/p>\u003c/div>\u003cspan class=\"ev-contador\">4 conocidas\u003c/span>\u003c/div>\n      \u003cdiv class=\"ev-instruccion\">\u003ci class=\"fa-solid fa-crosshairs\" aria-hidden=\"true\">\u003c/i>\u003cspan>\u003cb>Si afecta a otro, marca su token antes de usarla.\u003c/b> El alcance y las condiciones de cada técnica siguen contando.\u003c/span>\u003c/div>\n      \u003cdiv class=\"ecos-verbe-filtros\">\u003clabel class=\"ev-busqueda\">\u003cspan>Buscar en mis técnicas\u003c/span>\u003cinput type=\"search\" data-filtro-uso=\"texto\" placeholder=\"Nombre o efecto…\" value=\"\">\u003c/label>\u003clabel>\u003cinput type=\"checkbox\" data-filtro-uso=\"solo\" > Ocultar las bloqueadas por recursos o estado\u003c/label>\u003c/div>\n      \u003cdiv class=\"ev-tarjetas\">\u003carticle class=\"ev-tecnica \">\n    \u003cdiv class=\"ev-tec-top\">\u003cspan class=\"ev-etiqueta\">Grado 3\u003c/span>\u003cspan class=\"ev-etiqueta suave\">Forma\u003c/span>\u003c/div>\n    \u003ch3>Réplica sólida\u003c/h3>\u003csmall class=\"ev-referencia\">Kage Bunshin no Jutsu\u003c/small>\u003cp class=\"ev-texto-tecnica\">Creas una réplica física de 1 PG con tu CA. Tras pagar, la energía positiva restante se divide de verdad entre original y copias. Todas las copias comparten un saldo separado y una acción ofensiva conjunta por turno: un ataque con arma, Ayudar o una técnica de grado 0–2 pagada con ese saldo mediante «Usar desde réplica». Su reacción es la del original. No recuperan recursos descansando, no duplican equipo, depósitos, hitos, Trazos o usos diarios. Al disiparse se pierde el saldo restante y recuperas lo que vieron; esos recuerdos no conceden progreso adicional. La formación requiere representación y movimiento en mesa; la tarjeta no crea tokens. No aumenta el número de copias al elevar el grado.\u003c/p>\n    \u003cdiv class=\"ev-tec-datos\">\u003cspan>\u003ci class=\"fa-regular fa-clock\" aria-hidden=\"true\">\u003c/i> Acción\u003c/span>\u003cspan>\u003ci class=\"fa-solid fa-crosshairs\" aria-hidden=\"true\">\u003c/i> sobre ti\u003c/span>\u003c/div>\n    \u003cdiv class=\"ev-costes\">\u003cspan>\u003cb>5\u003c/b> Verbe \u003csmall>por uso base\u003c/small>\u003c/span>\u003c/div>\n    \u003cp class=\"ev-disponibilidad\">\u003ci class=\"fa-solid fa-circle-check\" aria-hidden=\"true\">\u003c/i> Te quedarían 43 de Verbe al usar el grado base.\u003c/p>\u003cp class=\"ev-nota\">Puedes elevar el grado en la ventana de uso; el coste aumentará.\u003c/p>\n    \u003cfooter>\u003cbutton type=\"button\" class=\"ev-principal\" data-action=\"usar\" data-id=\"forma-replica-solida\" >Usar técnica\u003c/button>\u003cbutton type=\"button\" data-action=\"ficha\" data-id=\"forma-replica-solida\">Ver detalles\u003c/button>\u003c/footer>\n  \u003c/article>\u003carticle class=\"ev-tecnica \">\n    \u003cdiv class=\"ev-tec-top\">\u003cspan class=\"ev-etiqueta\">Grado 1\u003c/span>\u003cspan class=\"ev-etiqueta suave\">Forma\u003c/span>\u003cspan class=\"ev-etiqueta suave\">Fuego\u003c/span>\u003c/div>\n    \u003ch3>Aliento de brasa\u003c/h3>\u003cp class=\"ev-texto-tecnica\">DES, mitad: 3d6 fuego. Prende lo que arde. Sube: +1d6.\u003c/p>\n    \u003cdiv class=\"ev-tec-datos\">\u003cspan>\u003ci class=\"fa-regular fa-clock\" aria-hidden=\"true\">\u003c/i> Acción\u003c/span>\u003cspan>\u003ci class=\"fa-solid fa-crosshairs\" aria-hidden=\"true\">\u003c/i> sobre ti\u003c/span>\u003cspan>cono 4,5 m\u003c/span>\u003c/div>\n    \u003cdiv class=\"ev-costes\">\u003cspan>\u003cb>2\u003c/b> Verbe \u003csmall>por uso base\u003c/small>\u003c/span>\u003c/div>\n    \u003cp class=\"ev-disponibilidad\">\u003ci class=\"fa-solid fa-circle-check\" aria-hidden=\"true\">\u003c/i> Te quedarían 46 de Verbe al usar el grado base.\u003c/p>\u003cp class=\"ev-nota\">Puedes elevar el grado en la ventana de uso; el coste aumentará.\u003c/p>\n    \u003cfooter>\u003cbutton type=\"button\" data-action=\"usarReplica\" data-id=\"fuego-aliento\" >Usar desde réplica\u003c/button>\u003cbutton type=\"button\" class=\"ev-principal\" data-action=\"usar\" data-id=\"fuego-aliento\" >Usar técnica\u003c/button>\u003cbutton type=\"button\" data-action=\"ficha\" data-id=\"fuego-aliento\">Ver detalles\u003c/button>\u003c/footer>\n  \u003c/article>\u003carticle class=\"ev-tecnica \">\n    \u003cdiv class=\"ev-tec-top\">\u003cspan class=\"ev-etiqueta\">Grado 5\u003c/span>\u003cspan class=\"ev-etiqueta suave\">Umbral\u003c/span>\u003c/div>\n    \u003ch3>Paso a la fórmula\u003c/h3>\u003csmall class=\"ev-referencia\">Hiraishin no Jutsu\u003c/small>\u003cp class=\"ev-texto-tecnica\">Te trasladas a una marca personal válida a no más de 150 m, con tu equipo portado y un espacio de llegada libre. Límites: Requiere marca preparada y reconocida por el DM. No atraviesa sellos que bloqueen espacio-tiempo ni lleva criaturas renuentes; el movimiento del token se resuelve en mesa.\u003c/p>\n    \u003cdiv class=\"ev-tec-datos\">\u003cspan>\u003ci class=\"fa-regular fa-clock\" aria-hidden=\"true\">\u003c/i> Acción\u003c/span>\u003cspan>\u003ci class=\"fa-solid fa-crosshairs\" aria-hidden=\"true\">\u003c/i> 150 m\u003c/span>\u003c/div>\n    \u003cdiv class=\"ev-costes\">\u003cspan>\u003cb>7\u003c/b> Verbe \u003csmall>por uso base\u003c/small>\u003c/span>\u003c/div>\n    \u003cp class=\"ev-disponibilidad\">\u003ci class=\"fa-solid fa-circle-check\" aria-hidden=\"true\">\u003c/i> Te quedarían 41 de Verbe al usar el grado base.\u003c/p>\u003cp class=\"ev-nota\">Puedes elevar el grado en la ventana de uso; el coste aumentará.\u003c/p>\n    \u003cfooter>\u003cbutton type=\"button\" class=\"ev-principal\" data-action=\"usar\" data-id=\"umbral-raijin\" >Usar técnica\u003c/button>\u003cbutton type=\"button\" data-action=\"ficha\" data-id=\"umbral-raijin\">Ver detalles\u003c/button>\u003c/footer>\n  \u003c/article>\u003carticle class=\"ev-tecnica \">\n    \u003cdiv class=\"ev-tec-top\">\u003cspan class=\"ev-etiqueta\">Grado 5\u003c/span>\u003cspan class=\"ev-etiqueta suave\">Mirada\u003c/span>\u003c/div>\n    \u003ch3>Costillas del guardián\u003c/h3>\u003csmall class=\"ev-referencia\">Susanoo parcial\u003c/small>\u003cp class=\"ev-texto-tecnica\">Un esqueleto de energía te envuelve y proporciona +2 a la CA mientras mantengas Concentración. Límites: No se acumula con otra transformación de su mismo grupo. No concede turnos, descansos ni reservas adicionales.\u003c/p>\n    \u003cdiv class=\"ev-tec-datos\">\u003cspan>\u003ci class=\"fa-regular fa-clock\" aria-hidden=\"true\">\u003c/i> Acción adicional\u003c/span>\u003cspan>\u003ci class=\"fa-solid fa-crosshairs\" aria-hidden=\"true\">\u003c/i> sobre ti\u003c/span>\u003c/div>\n    \u003cdiv class=\"ev-costes\">\u003cspan>\u003cb>7\u003c/b> Verbe \u003csmall>por uso base\u003c/small>\u003c/span>\u003c/div>\n    \u003cp class=\"ev-disponibilidad bloqueada\">\u003ci class=\"fa-solid fa-lock\" aria-hidden=\"true\">\u003c/i> Primero abre la Mirada que utiliza esta técnica.\u003c/p>\u003cp class=\"ev-nota\">Puedes elevar el grado en la ventana de uso; el coste aumentará.\u003c/p>\n    \u003cfooter>\u003cbutton type=\"button\" class=\"ev-principal\" data-action=\"usar\" data-id=\"mirada-aster-costillas\" disabled>Usar técnica\u003c/button>\u003cbutton type=\"button\" data-action=\"ficha\" data-id=\"mirada-aster-costillas\">Ver detalles\u003c/button>\u003c/footer>\n  \u003c/article>\u003c/div>\u003c/section>","ramas":"\u003cheader class=\"ecos-verbe-cabpanel\">\n      \u003cdiv class=\"ev-identidad\">\u003cspan class=\"ev-kicker\">EL VERBE · NIVEL 20\u003c/span>\u003cstrong>Ari · viajero del valle\u003c/strong>\u003csmall>Vasija · Fuego\u003c/small>\u003c/div>\n      \u003cdiv class=\"ecos-verbe-res\">\u003cdiv class=\"ev-recurso-titulo\">\u003cb>\u003ci class=\"fa-solid fa-droplet\" aria-hidden=\"true\">\u003c/i> Verbe \u003cspan>48 / 170\u003c/span>\u003c/b>\u003csmall>ENERGÍA PARA USAR\u003c/small>\u003c/div>\u003cdiv class=\"ecos-verbe-barra grande \" role=\"meter\" aria-label=\"Reserva de Verbe\" aria-valuemin=\"0\" aria-valuemax=\"170\" aria-valuenow=\"48\" aria-valuetext=\"48 de 170 de Verbe\">\u003cdiv style=\"width:28.235294117647058%\">\u003c/div>\u003c/div>\n        \u003csmall>Se gasta al usar técnicas; vuelve al descansar.\u003c/small>\u003c/div>\n      \u003cdiv class=\"ecos-verbe-trazos hay\">\u003cspan class=\"n\">84\u003c/span>\u003cspan class=\"t\">\u003cb>Trazos\u003c/b> para aprender\u003c/span>\u003csmall>Se gastan una vez por compra\u003c/small>\u003c/div>\n    \u003c/header>\u003cdetails class=\"ecos-verbe-dmbar\">\u003csummary>\u003ci class=\"fa-solid fa-sliders\" aria-hidden=\"true\">\u003c/i> Herramientas del DM \u003c/summary>\u003cdiv>\u003cb>Trazos:\u003c/b>\n        \u003cbutton type=\"button\" data-action=\"trazosDM\" data-n=\"-1\">-1\u003c/button>\u003cbutton type=\"button\" data-action=\"trazosDM\" data-n=\"1\">+1\u003c/button>\u003cbutton type=\"button\" data-action=\"trazosDM\" data-n=\"2\">+2\u003c/button>\u003cbutton type=\"button\" data-action=\"trazosDM\" data-n=\"5\">+5\u003c/button>\n        · \u003cbutton type=\"button\" data-action=\"verbeDM\" data-n=\"lleno\">Llenar Verbe\u003c/button>\n        · \u003cbutton type=\"button\" data-action=\"comoJugador\" class=\"\">\u003ci class=\"fa-solid fa-eye\">\u003c/i> Ver como el jugador\u003c/button>\u003c/div>\u003c/details>\u003cnav class=\"ecos-verbe-tabs\" aria-label=\"Panel del Verbe\">\u003cbutton type=\"button\" class=\" \"  data-action=\"pestana\" data-p=\"resumen\">\u003ci class=\"fa-solid fa-house\" aria-hidden=\"true\">\u003c/i> Inicio\u003c/button>\u003cbutton type=\"button\" class=\" \"  data-action=\"pestana\" data-p=\"jugar\">\u003ci class=\"fa-solid fa-bolt\" aria-hidden=\"true\">\u003c/i> Mis técnicas\u003c/button>\u003cbutton type=\"button\" class=\" \"  data-action=\"pestana\" data-p=\"tienda\">\u003ci class=\"fa-solid fa-book-open\" aria-hidden=\"true\">\u003c/i> Aprender\u003c/button>\u003cbutton type=\"button\" class=\"activa \" aria-current=\"page\" data-action=\"pestana\" data-p=\"ramas\">\u003ci class=\"fa-solid fa-seedling\" aria-hidden=\"true\">\u003c/i> Mejorar\u003c/button>\u003cbutton type=\"button\" class=\" \"  data-action=\"pestana\" data-p=\"guia\">\u003ci class=\"fa-solid fa-circle-question\" aria-hidden=\"true\">\u003c/i> Ayuda rápida\u003c/button>\u003cbutton type=\"button\" class=\" dm\"  data-action=\"pestana\" data-p=\"dm\">\u003ci class=\"fa-solid fa-sliders\" aria-hidden=\"true\">\u003c/i> DM\u003c/button>\u003c/nav>\u003csection class=\"ecos-verbe-cuerpo\" aria-label=\"Mejorar\">\u003cnav class=\"ev-subnav\" aria-label=\"Cómo quieres mejorar\">\u003cbutton type=\"button\" data-action=\"pestana\" data-p=\"ramas\" aria-current=\"page\">Especialidades\u003c/button>\u003cbutton type=\"button\" data-action=\"pestana\" data-p=\"dotes\" >Dotes\u003c/button>\u003cbutton type=\"button\" data-action=\"pestana\" data-p=\"cultivo\" >Entrenar técnicas\u003c/button>\u003cbutton type=\"button\" data-action=\"pestana\" data-p=\"crear\" >Inventar una técnica\u003c/button>\u003c/nav>\u003cdiv class=\"ecos-verbe-intro\">\u003cp>\u003cb>Cada rama es un tipo de técnica (Forma, Velo, Cuerpo…).\u003c/b> Tu rango en una rama dice hasta qué grado puedes aprender técnicas de ella. Se sube con Trazos; desde Experto, sus técnicas que dañan o curan tiran dados de más y ganas los dones de la rama. \u003ca class=\"ecos-verbe-guia\" data-action=\"guia\" data-s=\"ramas-y-rangos\" data-tooltip=\"Abre la guía escrita en esa parte\">\u003ci class=\"fa-solid fa-book-open\">\u003c/i> Guía\u003c/a>\u003c/p>\u003cdetails>\u003csummary>Saber más\u003c/summary>\u003cp>Tu \u003cb>rama principal\u003c/b> empieza en Entrenado gratis, cada rango le cuesta 1 Trazo menos y sus dones llegan un rango antes. Desde la \u003cb>tercera rama\u003c/b> que entrenes, cada rango cuesta 1 Trazo más: conviene especializarse.\u003c/p>\u003ctable class=\"ecos-verbe-tabla\">\u003ctr>\u003cth>Rango\u003c/th>\u003cth>Aprendes técnicas de la rama hasta\u003c/th>\u003cth>Pide\u003c/th>\u003cth>Cuesta\u003c/th>\u003cth>Te da\u003c/th>\u003c/tr>\n      \u003ctr>\u003ctd>\u003cb>Novato\u003c/b>\u003c/td>\u003ctd>grado 1\u003c/td>\u003ctd>—\u003c/td>\n        \u003ctd>gratis: toda rama abierta empieza aquí\u003c/td>\n        \u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>Entrenado\u003c/b>\u003c/td>\u003ctd>grado 3\u003c/td>\u003ctd>—\u003c/td>\n        \u003ctd>1 Trazo (0 en tu rama principal)\u003c/td>\n        \u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>Experto\u003c/b>\u003c/td>\u003ctd>grado 5\u003c/td>\u003ctd>nivel 5\u003c/td>\n        \u003ctd>3 Trazos (2 en tu rama principal)\u003c/td>\n        \u003ctd>1 dado más en sus técnicas que dañan o curan, y su primer don\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>Maestro\u003c/b>\u003c/td>\u003ctd>grado 8\u003c/td>\u003ctd>nivel 11\u003c/td>\n        \u003ctd>5 Trazos (4 en tu rama principal)\u003c/td>\n        \u003ctd>2 dados más en sus técnicas que dañan o curan, y su segundo don\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>Legendario\u003c/b>\u003c/td>\u003ctd>grado 9\u003c/td>\u003ctd>nivel 17\u003c/td>\n        \u003ctd>8 Trazos (7 en tu rama principal)\u003c/td>\n        \u003ctd>3 dados más en sus técnicas que dañan o curan, y su tercer don\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>Mítico\u003c/b>\u003c/td>\u003ctd>grado 11\u003c/td>\u003ctd>nivel 19\u003c/td>\n        \u003ctd>10 Trazos (9 en tu rama principal)\u003c/td>\n        \u003ctd>4 dados más en sus técnicas que dañan o curan, y su cuarto don\u003c/td>\u003c/tr>\u003c/table>\u003c/details>\u003c/div>\n      \u003csection class=\"ecos-verbe-rama \">\n        \u003cheader>\u003cb>Forma\u003c/b>\n          \u003cspan>Rango \u003cb>Mítico\u003c/b> · tu límite ahora es \u003cb>grado 11\u003c/b> · +4 dados al dañar o curar.\u003c/span>\u003cspan class=\"ecos-nota\">Es el rango más alto.\u003c/span>\u003c/header>\n        \u003cp class=\"ecos-nota\">El Verbe hecho forma: proyectiles, réplicas, sustituciones y las técnicas de los elementos (fuego, agua, viento, tierra y rayo). Es la rama donde están las técnicas de tu naturaleza. \u003c/p>\u003cdetails class=\"ev-dones\">\u003csummary>Qué dones gano en esta rama\u003c/summary>\u003cul class=\"ecos-verbe-dones\">\u003cli class=\"tiene\">\u003cb>Primer don · Forma precisa\u003c/b> \u003cspan class=\"ecos-nota\">ya lo tienes\u003c/span>\u003cbr>Cuando usas una técnica de Forma que cubre un área, eliges hasta tantas criaturas como tu modificador de Verbe; esas pasan la salvación sin tirar y no reciben daño. Sirve para no herir a tus aliados.\u003c/li>\u003cli class=\"tiene\">\u003cb>Segundo don · Forma doble\u003c/b> \u003cspan class=\"ecos-nota\">ya lo tienes\u003c/span>\u003cbr>Cuando usas una técnica de Forma con tu acción, en el mismo turno puedes usar otra técnica de Forma de grado 0 con tu acción adicional.\u003c/li>\u003cli class=\"tiene\">\u003cb>Tercer don · Forma sin fin\u003c/b> \u003cspan class=\"ecos-nota\">ya lo tienes\u003c/span>\u003cbr>Una vez por Descanso Largo, usas una técnica de Forma de grado 5 o menos sin gastar Verbe.\u003c/li>\u003cli class=\"tiene\">\u003cb>Cuarto don · Forma total\u003c/b> \u003cspan class=\"ecos-nota\">ya lo tienes\u003c/span>\u003cbr>Una vez por Descanso Largo, usas una técnica de Forma de grado 9 o menos sin gastar Verbe, y el daño de tus técnicas de Forma ignora la resistencia.\u003c/li>\u003c/ul>\u003c/details>\u003c/section>\u003csection class=\"ecos-verbe-rama \">\n        \u003cheader>\u003cb>Velo\u003c/b>\n          \u003cspan>Rango \u003cb>Mítico\u003c/b> · tu límite ahora es \u003cb>grado 11\u003c/b> · +4 dados al dañar o curar.\u003c/span>\u003cspan class=\"ecos-nota\">Es el rango más alto.\u003c/span>\u003c/header>\n        \u003cp class=\"ecos-nota\">Ilusiones que se meten en el Verbe del otro. Casi todo pide salvación de Sabiduría, y quien despertó puede romperlas con Control: el Velo aplasta a la gente común y cuesta contra otro usuario. \u003c/p>\u003cdetails class=\"ev-dones\">\u003csummary>Qué dones gano en esta rama\u003c/summary>\u003cul class=\"ecos-verbe-dones\">\u003cli class=\"tiene\">\u003cb>Primer don · Velo hondo\u003c/b> \u003cspan class=\"ecos-nota\">ya lo tienes\u003c/span>\u003cbr>Quien no te vio usar el Velo tiene desventaja en su primera salvación contra él.\u003c/li>\u003cli class=\"tiene\">\u003cb>Segundo don · Velo dentro del Velo\u003c/b> \u003cspan class=\"ecos-nota\">ya lo tienes\u003c/span>\u003cbr>Cuando alguien rompe o supera un Velo tuyo, puedes usar tu reacción para ponerle otro Velo de grado 2 o menos, sin gastar Verbe.\u003c/li>\u003cli class=\"tiene\">\u003cb>Tercer don · Mundo propio\u003c/b> \u003cspan class=\"ecos-nota\">ya lo tienes\u003c/span>\u003cbr>Tu Velo engaña también a quien ve el Verbe (por ejemplo, con un ojo heredado) y a los constructos y no muertos que piensan.\u003c/li>\u003cli class=\"tiene\">\u003cb>Cuarto don · Sueño sin salida\u003c/b> \u003cspan class=\"ecos-nota\">ya lo tienes\u003c/span>\u003cbr>Quien falla una salvación contra tu Velo no puede intentar romperlo con Control hasta el final de tu siguiente turno, y tus Velos de Concentración duran 1 minuto más aunque pierdas la Concentración.\u003c/li>\u003c/ul>\u003c/details>\u003c/section>\u003csection class=\"ecos-verbe-rama \">\n        \u003cheader>\u003cb>Cuerpo\u003c/b>\n          \u003cspan>Rango \u003cb>Mítico\u003c/b> · tu límite ahora es \u003cb>grado 11\u003c/b> · +4 dados al dañar o curar.\u003c/span>\u003cspan class=\"ecos-nota\">Es el rango más alto.\u003c/span>\u003c/header>\n        \u003cp class=\"ecos-nota\">El Verbe dentro del cuerpo. Ataca con Fuerza o Destreza, como un arma, y casi todo es acción adicional, para sumarse a tus ataques. Es la que mejor le calza a Claudia. \u003c/p>\u003cdetails class=\"ev-dones\">\u003csummary>Qué dones gano en esta rama\u003c/summary>\u003cul class=\"ecos-verbe-dones\">\u003cli class=\"tiene\">\u003cb>Primer don · Cuerpo templado\u003c/b> \u003cspan class=\"ecos-nota\">ya lo tienes\u003c/span>\u003cbr>Mientras no lleves armadura pesada, +1 a tu CA y +3 m a tu velocidad.\u003c/li>\u003cli class=\"tiene\">\u003cb>Segundo don · Golpe que no se pierde\u003c/b> \u003cspan class=\"ecos-nota\">ya lo tienes\u003c/span>\u003cbr>Cuando fallas un ataque cuerpo a cuerpo, igual haces tanto daño como tu modificador de Fuerza o de Destreza (el mayor).\u003c/li>\u003cli class=\"tiene\">\u003cb>Tercer don · Cerrojos sin precio\u003c/b> \u003cspan class=\"ecos-nota\">ya lo tienes\u003c/span>\u003cbr>Con los Siete Cerrojos abiertos pierdes la mitad de los PG por turno.\u003c/li>\u003cli class=\"tiene\">\u003cb>Cuarto don · Cuerpo que no cae\u003c/b> \u003cspan class=\"ecos-nota\">ya lo tienes\u003c/span>\u003cbr>Cerrar el séptimo Cerrojo te pide CON CD 10 en vez de 20, y una vez por Descanso Largo, cuando caerías a 0 PG, quedas a 1.\u003c/li>\u003c/ul>\u003c/details>\u003c/section>\u003csection class=\"ecos-verbe-rama \">\n        \u003cheader>\u003cb>Mirada\u003c/b>\n          \u003cspan>Rango \u003cb>Mítico\u003c/b> · tu límite ahora es \u003cb>grado 11\u003c/b> · +4 dados al dañar o curar.\u003c/span>\u003cspan class=\"ecos-nota\">Es el rango más alto.\u003c/span>\u003c/header>\n        \u003cp class=\"ecos-nota\">Ojos heredados: solo se tienen por linaje o por trasplante. Despiertan con una emoción fuerte (tú pulsas «Despertar ojo») y cada etapa se paga en un hito: 3, 5 y 8 Trazos. Las técnicas de cada etapa vienen incluidas. \u003c/p>\u003cdetails class=\"ev-dones\">\u003csummary>Qué dones gano en esta rama\u003c/summary>\u003cul class=\"ecos-verbe-dones\">\u003cli class=\"tiene\">\u003cb>Primer don · Ojo largo\u003c/b> \u003cspan class=\"ecos-nota\">ya lo tienes\u003c/span>\u003cbr>El alcance de tus técnicas de Mirada se duplica.\u003c/li>\u003cli class=\"tiene\">\u003cb>Segundo don · Ojo que no se cansa\u003c/b> \u003cspan class=\"ecos-nota\">ya lo tienes\u003c/span>\u003cbr>Mantener el ojo abierto ya no gasta Verbe.\u003c/li>\u003cli class=\"tiene\">\u003cb>Tercer don · Ojo pleno\u003c/b> \u003cspan class=\"ecos-nota\">ya lo tienes\u003c/span>\u003cbr>Una vez por Descanso Largo, usas una técnica de la etapa 3 de tu ojo sin gastar Verbe, y el blanco tiene desventaja en su salvación.\u003c/li>\u003cli class=\"tiene\">\u003cb>Cuarto don · Ojo que todo lo ve\u003c/b> \u003cspan class=\"ecos-nota\">ya lo tienes\u003c/span>\u003cbr>Con el ojo abierto ves a través de ilusiones, oscuridad y lo invisible a 36 m, y nada que veas te sorprende.\u003c/li>\u003c/ul>\u003c/details>\u003c/section>\u003csection class=\"ecos-verbe-rama \">\n        \u003cheader>\u003cb>Sello\u003c/b>\n          \u003cspan>Rango \u003cb>Mítico\u003c/b> · tu límite ahora es \u003cb>grado 11\u003c/b> · +4 dados al dañar o curar.\u003c/span>\u003cspan class=\"ecos-nota\">Es el rango más alto.\u003c/span>\u003c/header>\n        \u003cp class=\"ecos-nota\">Sellos, barreras y marcas. Casi todo pide Gestos y, a veces, papel o tinta de Verbe (ver Equipo). A Claudia le calza por la Marca del Regreso: la luz para el que vuelve. \u003c/p>\u003cdetails class=\"ev-dones\">\u003csummary>Qué dones gano en esta rama\u003c/summary>\u003cul class=\"ecos-verbe-dones\">\u003cli class=\"tiene\">\u003cb>Primer don · Dos sellos\u003c/b> \u003cspan class=\"ecos-nota\">ya lo tienes\u003c/span>\u003cbr>Puedes mantener a la vez dos técnicas de Sello que piden Concentración.\u003c/li>\u003cli class=\"tiene\">\u003cb>Segundo don · Sellos que duran\u003c/b> \u003cspan class=\"ecos-nota\">ya lo tienes\u003c/span>\u003cbr>Tus sellos preparados (Ruptura, Que avisa, Cierre y Círculo de guarda) duran hasta que tú los rompas.\u003c/li>\u003cli class=\"tiene\">\u003cb>Tercer don · Gran sello\u003c/b> \u003cspan class=\"ecos-nota\">ya lo tienes\u003c/span>\u003cbr>Tu Sello de encierro sirve también con las criaturas mayores, con un ritual de tres días.\u003c/li>\u003cli class=\"tiene\">\u003cb>Cuarto don · Sello sin llave\u003c/b> \u003cspan class=\"ecos-nota\">ya lo tienes\u003c/span>\u003cbr>Tus sellos solo los rompe quien tenga tu rango en Sello o uno más alto, y una vez por Descanso Largo pones un Sello de grado 7 o menos sin gastar Verbe ni tinta.\u003c/li>\u003c/ul>\u003c/details>\u003c/section>\u003csection class=\"ecos-verbe-rama cerrada\">\n        \u003cheader>\u003cb>Pacto\u003c/b>\n          \u003cspan>\u003cb>Cerrada\u003c/b>.\u003c/span>\u003c/header>\n        \u003cp class=\"ecos-nota\">Un contrato de sangre con un linaje de criaturas, que se gana en una misión. Las técnicas generales sirven con cualquier pacto; las de cada linaje, solo con el suyo. \u003cb>Se abre con un pacto que se gana en la historia.\u003c/b>\u003c/p>\u003cdetails class=\"ev-dones\">\u003csummary>Qué dones gano en esta rama\u003c/summary>\u003cul class=\"ecos-verbe-dones\">\u003cli class=\"tiene\">\u003cb>Primer don · Vínculo fuerte\u003c/b> \u003cspan class=\"ecos-nota\">ya lo tienes\u003c/span>\u003cbr>Tu invocación suma tu bonificador de competencia a su CA y a su daño.\u003c/li>\u003cli class=\"tiene\">\u003cb>Segundo don · Dos del linaje\u003c/b> \u003cspan class=\"ecos-nota\">ya lo tienes\u003c/span>\u003cbr>Invocar al linaje trae dos criaturas en vez de una, cada una con la ficha dos grados más baja.\u003c/li>\u003cli class=\"tiene\">\u003cb>Tercer don · Sangre compartida\u003c/b> \u003cspan class=\"ecos-nota\">ya lo tienes\u003c/span>\u003cbr>Una vez por Descanso Largo, cuando tu invocación cae a 0 PG, queda a 1 PG y tú pierdes los PG que le faltaron.\u003c/li>\u003cli class=\"tiene\">\u003cb>Cuarto don · El linaje responde\u003c/b> \u003cspan class=\"ecos-nota\">ya lo tienes\u003c/span>\u003cbr>Tu invocación ya no pide Concentración, y una vez por Descanso Largo llamas al mayor de tu linaje durante 1 minuto sin gastar Verbe.\u003c/li>\u003c/ul>\u003c/details>\u003c/section>\u003csection class=\"ecos-verbe-rama cerrada\">\n        \u003cheader>\u003cb>Pulso\u003c/b>\n          \u003cspan>\u003cb>Cerrada\u003c/b>.\u003c/span>\u003c/header>\n        \u003cp class=\"ecos-nota\">Verbe positivo y negativo. Toda la rama pide la dote Control fino del Verbe. Para las reglas de heridas de la casa cuenta como magia que cura. \u003cb>Se abre con la dote Control fino del Verbe (Mejorar → Dotes).\u003c/b>\u003c/p>\u003cdetails class=\"ev-dones\">\u003csummary>Qué dones gano en esta rama\u003c/summary>\u003cul class=\"ecos-verbe-dones\">\u003cli class=\"tiene\">\u003cb>Primer don · Manos firmes\u003c/b> \u003cspan class=\"ecos-nota\">ya lo tienes\u003c/span>\u003cbr>Tus técnicas que curan suman tu modificador de Verbe una vez más.\u003c/li>\u003cli class=\"tiene\">\u003cb>Segundo don · Cirujano\u003c/b> \u003cspan class=\"ecos-nota\">ya lo tienes\u003c/span>\u003cbr>Una vez al día por paciente, Palma que cierra le baja también un nivel de Herida No Tratada.\u003c/li>\u003cli class=\"tiene\">\u003cb>Tercer don · Vida guardada\u003c/b> \u003cspan class=\"ecos-nota\">ya lo tienes\u003c/span>\u003cbr>Cada día guardas hasta el doble de tu nivel en Verbe. Si caes a 0 PG, ese Verbe se suelta solo y recuperas el doble en PG.\u003c/li>\u003cli class=\"tiene\">\u003cb>Cuarto don · Pulso que devuelve\u003c/b> \u003cspan class=\"ecos-nota\">ya lo tienes\u003c/span>\u003cbr>Una vez por Descanso Largo, tocas a alguien que murió hace 1 minuto o menos y vuelve con la mitad de sus PG y 1 nivel de Agotamiento.\u003c/li>\u003c/ul>\u003c/details>\u003c/section>\u003csection class=\"ecos-verbe-rama \">\n        \u003cheader>\u003cb>Hilo\u003c/b>\n          \u003cspan>Rango \u003cb>Mítico\u003c/b> · tu límite ahora es \u003cb>grado 11\u003c/b> · +4 dados al dañar o curar.\u003c/span>\u003cspan class=\"ecos-nota\">Es el rango más alto.\u003c/span>\u003c/header>\n        \u003cp class=\"ecos-nota\">Armas y herramientas con Verbe. Ataca con Fuerza o Destreza, como un arma. A Odonata le calza por los cuatro brazos. \u003c/p>\u003cdetails class=\"ev-dones\">\u003csummary>Qué dones gano en esta rama\u003c/summary>\u003cul class=\"ecos-verbe-dones\">\u003cli class=\"tiene\">\u003cb>Primer don · Diez dedos\u003c/b> \u003cspan class=\"ecos-nota\">ya lo tienes\u003c/span>\u003cbr>Mueves dos marionetas o dos armas suspendidas a la vez.\u003c/li>\u003cli class=\"tiene\">\u003cb>Segundo don · Hilo que no se ve\u003c/b> \u003cspan class=\"ecos-nota\">ya lo tienes\u003c/span>\u003cbr>Tus ataques de Hilo a distancia no tienen desventaja por alcance largo y no revelan dónde estás.\u003c/li>\u003cli class=\"tiene\">\u003cb>Tercer don · Lluvia sin fin\u003c/b> \u003cspan class=\"ecos-nota\">ya lo tienes\u003c/span>\u003cbr>Una vez por Descanso Corto, usas una técnica que pide pergamino de armas sin gastar el pergamino.\u003c/li>\u003cli class=\"tiene\">\u003cb>Cuarto don · Mil hilos\u003c/b> \u003cspan class=\"ecos-nota\">ya lo tienes\u003c/span>\u003cbr>Mueves hasta cinco marionetas o armas suspendidas a la vez, y una vez por turno, cuando una criatura a 9 m se mueve, la enredas: su velocidad queda en 0 hasta el final de su turno.\u003c/li>\u003c/ul>\u003c/details>\u003c/section>\u003csection class=\"ecos-verbe-rama \">\n        \u003cheader>\u003cb>Quietud\u003c/b>\n          \u003cspan>Rango \u003cb>Mítico\u003c/b> · tu límite ahora es \u003cb>grado 11\u003c/b> · +4 dados al dañar o curar.\u003c/span>\u003cspan class=\"ecos-nota\">Es el rango más alto.\u003c/span>\u003c/header>\n        \u003cp class=\"ecos-nota\">Tomar el Verbe del mundo en vez del propio, con Sabiduría. Da mucho y el mundo cobra: fallar acerca al Vorrh (niveles de adopción, Tramas · 3) o deja marcas de lo salvaje. \u003c/p>\u003cdetails class=\"ev-dones\">\u003csummary>Qué dones gano en esta rama\u003c/summary>\u003cul class=\"ecos-verbe-dones\">\u003cli class=\"tiene\">\u003cb>Primer don · Raíz honda\u003c/b> \u003cspan class=\"ecos-nota\">ya lo tienes\u003c/span>\u003cbr>Las salvaciones que te pide la Quietud bajan 2 de CD.\u003c/li>\u003cli class=\"tiene\">\u003cb>Segundo don · Quietud en movimiento\u003c/b> \u003cspan class=\"ecos-nota\">ya lo tienes\u003c/span>\u003cbr>Entras en Estado de Quietud con tu acción adicional.\u003c/li>\u003cli class=\"tiene\">\u003cb>Tercer don · El mundo te conoce\u003c/b> \u003cspan class=\"ecos-nota\">ya lo tienes\u003c/span>\u003cbr>Una vez por Descanso Largo, si fallas una salvación de Quietud, no pasa nada.\u003c/li>\u003cli class=\"tiene\">\u003cb>Cuarto don · El mundo es tu casa\u003c/b> \u003cspan class=\"ecos-nota\">ya lo tienes\u003c/span>\u003cbr>Al aire libre, el Estado de Quietud ya no te pide salvaciones, y mientras dura tus técnicas cuestan 1 Verbe menos (mínimo 1).\u003c/li>\u003c/ul>\u003c/details>\u003c/section>\u003csection class=\"ecos-verbe-rama \">\n        \u003cheader>\u003cb>Rastro\u003c/b>\n          \u003cspan>Rango \u003cb>Mítico\u003c/b> · tu límite ahora es \u003cb>grado 11\u003c/b> · +4 dados al dañar o curar.\u003c/span>\u003cspan class=\"ecos-nota\">Es el rango más alto.\u003c/span>\u003c/header>\n        \u003cp class=\"ecos-nota\">Sentir el Verbe a distancia, por su firma o por su pulso, con Sabiduría. A Odonata le calza. \u003c/p>\u003cdetails class=\"ev-dones\">\u003csummary>Qué dones gano en esta rama\u003c/summary>\u003cul class=\"ecos-verbe-dones\">\u003cli class=\"tiene\">\u003cb>Primer don · Rastro fino\u003c/b> \u003cspan class=\"ecos-nota\">ya lo tienes\u003c/span>\u003cbr>Cuando sientes a alguien con el Verbe, sabes también su naturaleza y cuánto Verbe le queda (lleno, a medias o poco).\u003c/li>\u003cli class=\"tiene\">\u003cb>Segundo don · Nunca por sorpresa\u003c/b> \u003cspan class=\"ecos-nota\">ya lo tienes\u003c/span>\u003cbr>Nada te sorprende, y tus aliados a 9 m suman tu bonificador de competencia a la iniciativa.\u003c/li>\u003cli class=\"tiene\">\u003cb>Tercer don · Antes del golpe\u003c/b> \u003cspan class=\"ecos-nota\">ya lo tienes\u003c/span>\u003cbr>Una vez por turno, cuando te ataca una criatura que estás sintiendo, el ataque tiene desventaja.\u003c/li>\u003cli class=\"tiene\">\u003cb>Cuarto don · Rastro sin distancia\u003c/b> \u003cspan class=\"ecos-nota\">ya lo tienes\u003c/span>\u003cbr>Sientes a cualquier criatura con Verbe que hayas tocado alguna vez, esté donde esté: sabes en qué dirección y a qué distancia está.\u003c/li>\u003c/ul>\u003c/details>\u003c/section>\u003csection class=\"ecos-verbe-rama cerrada\">\n        \u003cheader>\u003cb>Sangre\u003c/b>\n          \u003cspan>\u003cb>Cerrada\u003c/b>.\u003c/span>\u003c/header>\n        \u003cp class=\"ecos-nota\"> \u003cb>Se abre con una herencia de sangre. No tienes manera de saber si la tienes; si es así, la historia lo dirá.\u003c/b>\u003c/p>\u003cdetails class=\"ev-dones\">\u003csummary>Qué dones gano en esta rama\u003c/summary>\u003cul class=\"ecos-verbe-dones\">\u003cli class=\"tiene\">\u003cb>Primer don · Sangre despierta\u003c/b> \u003cspan class=\"ecos-nota\">ya lo tienes\u003c/span>\u003cbr>El Despertar del linaje dura 10 minutos en vez de 1.\u003c/li>\u003cli class=\"tiene\">\u003cb>Segundo don · Sangre que manda\u003c/b> \u003cspan class=\"ecos-nota\">ya lo tienes\u003c/span>\u003cbr>Tus técnicas de Sangre cuestan 1 Verbe menos (mínimo 1).\u003c/li>\u003cli class=\"tiene\">\u003cb>Tercer don · Igual a tu dios\u003c/b> \u003cspan class=\"ecos-nota\">ya lo tienes\u003c/span>\u003cbr>Una vez por Descanso Largo, el Despertar del linaje no te deja Agotamiento (en la Sangre Antigua, el Reloj sube igual).\u003c/li>\u003cli class=\"tiene\">\u003cb>Cuarto don · Sangre entera\u003c/b> \u003cspan class=\"ecos-nota\">ya lo tienes\u003c/span>\u003cbr>Tus técnicas de Sangre llegan hasta tu grado máximo aunque tu sangre sea débil, y mientras dura el Despertar tienes resistencia a todo el daño.\u003c/li>\u003c/ul>\u003c/details>\u003c/section>\u003csection class=\"ecos-verbe-rama \">\n        \u003cheader>\u003cb>Umbral\u003c/b>\n          \u003cspan>Rango \u003cb>Mítico\u003c/b> · tu límite ahora es \u003cb>grado 11\u003c/b> · +4 dados al dañar o curar.\u003c/span>\u003cspan class=\"ecos-nota\">Es el rango más alto.\u003c/span>\u003c/header>\n        \u003cp class=\"ecos-nota\">Espacio-tiempo: marcas, traslado e intercambio. Una marca y un destino seguro importan tanto como la energía. No crea copias ni dominios infinitos. \u003c/p>\u003c/section>\u003csection class=\"ecos-verbe-rama \">\n        \u003cheader>\u003cb>Vasija\u003c/b> \u003cspan class='ecos-verbe-pill'>principal\u003c/span>\n          \u003cspan>Rango \u003cb>Mítico\u003c/b> · tu límite ahora es \u003cb>grado 11\u003c/b> · +4 dados al dañar o curar.\u003c/span>\u003cspan class=\"ecos-nota\">Es el rango más alto.\u003c/span>\u003c/header>\n        \u003cp class=\"ecos-nota\">Técnicas del huésped de una bestia. El DM concede entidad y vínculo; las transformaciones comparten tu vida, reserva y acciones. \u003c/p>\u003c/section>\n      \u003csection class=\"ev-naturalezas\">\u003ch3>Tus elementos\u003c/h3>\u003cp>Fuego. Puedes descubrir tu segunda naturaleza probando una técnica.\u003c/p>\n      \n      \n      \u003cp>Naturaleza combinada abre una combinación desde nivel 9 con maestro; Tercera naturaleza abre otro elemento desde nivel 7 con maestro. Una tercera naturaleza no concede por sí sola una combinación.\u003c/p>\u003c/section>\n      \u003ch3>Afinidad con tu naturaleza\u003c/h3>\u003cp class=\"ecos-nota\">Qué tan bien manejas tu elemento. Entrenada: sus técnicas tiran 1 dado más y sus estados duran el doble. Maestra: 2 dados más, y quien falla contra ella no resiste su daño.\u003c/p>\u003cul>\u003cli>\u003cb>Fuego\u003c/b>: Despierta \u003cbutton type=\"button\" data-action=\"afinidad\" data-nat=\"fuego\" data-tooltip=\"+1 dado a sus técnicas e infusiones, y sus estados duran el doble\">Subir a Entrenada · 2 Trazos (nivel 5, pide un maestro)\u003c/button>\u003c/li>\u003c/ul>\n      \u003csection class=\"ev-naturalezas\">\u003ch3>Tradiciones y vínculos\u003c/h3>\u003cp>Atadura de sombra, Marionetismo, Fórmulas de sellado, Contrato: sapo\u003c/p>\u003cp>Bestia: Kurama · nueve colas · vínculo 3.\u003c/p>\u003c/section>\n      \u003ch3>Control del Verbe \u003ci class=\"ecos-verbe-ayuda fa-solid fa-circle-question\" data-tooltip=\"Una habilidad nueva de tu hoja (con Sabiduría). Se tira para ganar un choque entre dos técnicas, romper un Velo, abrir los Cerrojos y no perderse en la Quietud. Se compra en Mejorar → Especialidades.\">\u003c/i>\u003c/h3>\u003cp>Sin competencia. \u003cbutton type=\"button\" data-action=\"control\" data-tooltip=\"Sumas tu competencia a las pruebas de Control\">Volverte competente · 2 Trazos\u003c/button>\u003c/p>\n      \u003ch3>Ocho Cerrojos\u003c/h3>\u003cp class=\"ecos-nota\">Un estado de Cuerpo: pegas más fuerte y más rápido, pagando PG cada turno y Agotamiento al cerrar. \u003ca class=\"ecos-verbe-guia\" data-action=\"guia\" data-s=\"siete-cerrojos\">\u003ci class=\"fa-solid fa-book-open\">\u003c/i> Guía\u003c/a>\u003c/p>\n      \u003cp>No sabes ninguno. \u003cbutton type=\"button\" data-action=\"aprenderCerrojo\" data-tooltip=\"La piel: +2 al daño de tus golpes y ventaja en pruebas de Fuerza. Grado 1.\">Aprender el 1 · La piel · 1 Trazo\u003c/button>\u003c/p>\u003c/section>","dm":"\u003cheader class=\"ecos-verbe-cabpanel\">\n      \u003cdiv class=\"ev-identidad\">\u003cspan class=\"ev-kicker\">EL VERBE · NIVEL 20\u003c/span>\u003cstrong>Ari · viajero del valle\u003c/strong>\u003csmall>Vasija · Fuego\u003c/small>\u003c/div>\n      \u003cdiv class=\"ecos-verbe-res\">\u003cdiv class=\"ev-recurso-titulo\">\u003cb>\u003ci class=\"fa-solid fa-droplet\" aria-hidden=\"true\">\u003c/i> Verbe \u003cspan>48 / 170\u003c/span>\u003c/b>\u003csmall>ENERGÍA PARA USAR\u003c/small>\u003c/div>\u003cdiv class=\"ecos-verbe-barra grande \" role=\"meter\" aria-label=\"Reserva de Verbe\" aria-valuemin=\"0\" aria-valuemax=\"170\" aria-valuenow=\"48\" aria-valuetext=\"48 de 170 de Verbe\">\u003cdiv style=\"width:28.235294117647058%\">\u003c/div>\u003c/div>\n        \u003csmall>Se gasta al usar técnicas; vuelve al descansar.\u003c/small>\u003c/div>\n      \u003cdiv class=\"ecos-verbe-trazos hay\">\u003cspan class=\"n\">84\u003c/span>\u003cspan class=\"t\">\u003cb>Trazos\u003c/b> para aprender\u003c/span>\u003csmall>Se gastan una vez por compra\u003c/small>\u003c/div>\n    \u003c/header>\u003cdetails class=\"ecos-verbe-dmbar\">\u003csummary>\u003ci class=\"fa-solid fa-sliders\" aria-hidden=\"true\">\u003c/i> Herramientas del DM \u003c/summary>\u003cdiv>\u003cb>Trazos:\u003c/b>\n        \u003cbutton type=\"button\" data-action=\"trazosDM\" data-n=\"-1\">-1\u003c/button>\u003cbutton type=\"button\" data-action=\"trazosDM\" data-n=\"1\">+1\u003c/button>\u003cbutton type=\"button\" data-action=\"trazosDM\" data-n=\"2\">+2\u003c/button>\u003cbutton type=\"button\" data-action=\"trazosDM\" data-n=\"5\">+5\u003c/button>\n        · \u003cbutton type=\"button\" data-action=\"verbeDM\" data-n=\"lleno\">Llenar Verbe\u003c/button>\n        · \u003cbutton type=\"button\" data-action=\"comoJugador\" class=\"\">\u003ci class=\"fa-solid fa-eye\">\u003c/i> Ver como el jugador\u003c/button>\u003c/div>\u003c/details>\u003cnav class=\"ecos-verbe-tabs\" aria-label=\"Panel del Verbe\">\u003cbutton type=\"button\" class=\" \"  data-action=\"pestana\" data-p=\"resumen\">\u003ci class=\"fa-solid fa-house\" aria-hidden=\"true\">\u003c/i> Inicio\u003c/button>\u003cbutton type=\"button\" class=\" \"  data-action=\"pestana\" data-p=\"jugar\">\u003ci class=\"fa-solid fa-bolt\" aria-hidden=\"true\">\u003c/i> Mis técnicas\u003c/button>\u003cbutton type=\"button\" class=\" \"  data-action=\"pestana\" data-p=\"tienda\">\u003ci class=\"fa-solid fa-book-open\" aria-hidden=\"true\">\u003c/i> Aprender\u003c/button>\u003cbutton type=\"button\" class=\" \"  data-action=\"pestana\" data-p=\"ramas\">\u003ci class=\"fa-solid fa-seedling\" aria-hidden=\"true\">\u003c/i> Mejorar\u003c/button>\u003cbutton type=\"button\" class=\" \"  data-action=\"pestana\" data-p=\"guia\">\u003ci class=\"fa-solid fa-circle-question\" aria-hidden=\"true\">\u003c/i> Ayuda rápida\u003c/button>\u003cbutton type=\"button\" class=\"activa dm\" aria-current=\"page\" data-action=\"pestana\" data-p=\"dm\">\u003ci class=\"fa-solid fa-sliders\" aria-hidden=\"true\">\u003c/i> DM\u003c/button>\u003c/nav>\u003csection class=\"ecos-verbe-cuerpo\" aria-label=\"DM\">\u003cp>\u003cbutton type=\"button\" data-action=\"editorCatalogo\">\u003ci class=\"fa-solid fa-pen-nib\">\u003c/i> Taller del DM · crear y publicar técnicas universales\u003c/button>\u003c/p>\u003cdiv class=\"ecos-verbe-intro\">\u003cp>\u003cb>Solo tú ves esta pestaña.\u003c/b> Pedidos, Trazos, deshacer compras y cambios a mano. «Ver como el jugador» (arriba) muestra el panel tal como lo ve él.\u003c/p>\u003c/div>\n      \u003cdetails class=\"ecos-verbe-dmsec\" >\u003csummary>Repertorio shinobi: tradiciones, bestias y rituales\u003c/summary>\n        \u003cp>Tradición: \u003cselect name=\"shinobiTradicion\">\u003coption value=\"rayo-negro\" >Rayo negro\u003c/option>\u003coption value=\"cuervo\" >Cuervos del contrato\u003c/option>\u003coption value=\"sombra\" >✓ Atadura de sombra\u003c/option>\u003coption value=\"mente\" >Cambio de mente\u0
