ados en los niveles 5, 11 y 17)\u003c/li>\u003cli>rango en Velo (Experto +1 dado, Maestro +2, Legendario +3, Mítico +4)\u003c/li>\u003cli>los dones de rango de Velo\u003c/li>\u003cli>infundirla con tu elemento (Cultivo)\u003c/li>\u003cli>Cultivo: Pulida, Dominada y Propia\u003c/li>\u003cli>la dote Alcance largo\u003c/li>\u003cli>la dote Trucos afilados\u003c/li>\u003cli>la dote Doble fondo\u003c/li>\u003cli>la escuela La Escuela del Espejo\u003c/li>\u003c/ul>\u003c/div>\u003c/div>"},"velo-romper":{"title":"Romper el Velo","html":"\u003cdiv class=\"ecos-dialogo\">\u003cp class=\"texto\">Prueba de Control contra la CD de quien lo hizo: si la superas, termina un efecto del Velo sobre ti. Con una acción, sobre una criatura que tocas. Es lo primero que enseña cualquier maestro de Velo.\u003c/p>\u003cp class=\"ecos-nota\">Referencia: \u003cb>Genjutsu Kai\u003c/b> · manga/anime · estudio, p. 20. Grado y cifras adaptados a esta campaña.\u003c/p>\n      \u003ctable class=\"ecos-verbe-ficha\">\n        \u003ctr>\u003cth>Rama\u003c/th>\u003ctd>Velo\u003c/td>\u003cth>Grado\u003c/th>\u003ctd>0\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Tiempo\u003c/th>\u003ctd>Acción adicional\u003c/td>\u003cth>Alcance\u003c/th>\u003ctd>sobre ti\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Área\u003c/th>\u003ctd>—\u003c/td>\u003cth>Duración\u003c/th>\u003ctd>instantánea\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Componentes\u003c/th>\u003ctd>sin gestos ni voz\u003c/td>\u003cth>Tirada\u003c/th>\u003ctd>Ninguna\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Daño o curación\u003c/th>\u003ctd>—\u003c/td>\u003cth>Deja\u003c/th>\u003ctd>—\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Usa\u003c/th>\u003ctd>usa tu característica de Verbe\u003c/td>\u003cth>Sube\u003c/th>\u003ctd>—\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Verbe por uso\u003c/th>\u003ctd>0 Verbe (pide tener al menos 1)\u003c/td>\u003cth>Para aprender\u003c/th>\u003ctd>1 Trazo\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Pide\u003c/th>\u003ctd>—\u003c/td>\u003cth>Puedes\u003c/th>\u003ctd>sí\u003c/td>\u003c/tr>\n      \u003c/table>\n      \n      \n      \u003cdiv class=\"ecos-verbe-mejora\">\u003cb>Se mejora con\u003c/b>\u003cul>\u003cli>los dones de rango de Velo\u003c/li>\u003cli>Cultivo: Pulida, Dominada y Propia\u003c/li>\u003cli>la dote Doble fondo\u003c/li>\u003cli>la escuela La Escuela del Espejo\u003c/li>\u003c/ul>\u003c/div>\u003c/div>"},"velo-ruido":{"title":"Ruido falso","html":"\u003cdiv class=\"ecos-dialogo\">\u003cp class=\"texto\">Un sonido que no existe, donde quieras: pasos, una voz, un grito, un cristal que se rompe.\u003c/p>\n      \u003ctable class=\"ecos-verbe-ficha\">\n        \u003ctr>\u003cth>Rama\u003c/th>\u003ctd>Velo\u003c/td>\u003cth>Grado\u003c/th>\u003ctd>0\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Tiempo\u003c/th>\u003ctd>Acción\u003c/td>\u003cth>Alcance\u003c/th>\u003ctd>36 m\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Área\u003c/th>\u003ctd>—\u003c/td>\u003cth>Duración\u003c/th>\u003ctd>1 min\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Componentes\u003c/th>\u003ctd>voz\u003c/td>\u003cth>Tirada\u003c/th>\u003ctd>Ninguna\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Daño o curación\u003c/th>\u003ctd>—\u003c/td>\u003cth>Deja\u003c/th>\u003ctd>—\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Usa\u003c/th>\u003ctd>usa tu característica de Verbe\u003c/td>\u003cth>Sube\u003c/th>\u003ctd>—\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Verbe por uso\u003c/th>\u003ctd>0 Verbe (pide tener al menos 1)\u003c/td>\u003cth>Para aprender\u003c/th>\u003ctd>1 Trazo\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Pide\u003c/th>\u003ctd>—\u003c/td>\u003cth>Puedes\u003c/th>\u003ctd>sí\u003c/td>\u003c/tr>\n      \u003c/table>\n      \n      \n      \u003cdiv class=\"ecos-verbe-mejora\">\u003cb>Se mejora con\u003c/b>\u003cul>\u003cli>los dones de rango de Velo\u003c/li>\u003cli>Cultivo: Pulida, Dominada y Propia\u003c/li>\u003cli>la dote Alcance largo\u003c/li>\u003cli>la dote Doble fondo\u003c/li>\u003cli>la escuela La Escuela del Espejo\u003c/li>\u003c/ul>\u003c/div>\u003c/div>"},"velo-susurro":{"title":"Susurro falso","html":"\u003cdiv class=\"ecos-dialogo\">\u003cp class=\"texto\">Un sonido, o una imagen quieta de hasta 1,5 m. Investigación contra tu CD lo revela; la imagen no aguanta que la toquen.\u003c/p>\n      \u003ctable class=\"ecos-verbe-ficha\">\n        \u003ctr>\u003cth>Rama\u003c/th>\u003ctd>Velo\u003c/td>\u003cth>Grado\u003c/th>\u003ctd>0\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Tiempo\u003c/th>\u003ctd>Acción\u003c/td>\u003cth>Alcance\u003c/th>\u003ctd>9 m\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Área\u003c/th>\u003ctd>—\u003c/td>\u003cth>Duración\u003c/th>\u003ctd>1 min\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Componentes\u003c/th>\u003ctd>gestos\u003c/td>\u003cth>Tirada\u003c/th>\u003ctd>Ninguna\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Daño o curación\u003c/th>\u003ctd>—\u003c/td>\u003cth>Deja\u003c/th>\u003ctd>—\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Usa\u003c/th>\u003ctd>usa tu característica de Verbe\u003c/td>\u003cth>Sube\u003c/th>\u003ctd>—\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Verbe por uso\u003c/th>\u003ctd>0 Verbe (pide tener al menos 1)\u003c/td>\u003cth>Para aprender\u003c/th>\u003ctd>1 Trazo\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Pide\u003c/th>\u003ctd>—\u003c/td>\u003cth>Puedes\u003c/th>\u003ctd>sí\u003c/td>\u003c/tr>\n      \u003c/table>\n      \n      \n      \u003cdiv class=\"ecos-verbe-mejora\">\u003cb>Se mejora con\u003c/b>\u003cul>\u003cli>los dones de rango de Velo\u003c/li>\u003cli>Cultivo: Pulida, Dominada y Propia\u003c/li>\u003cli>la dote Alcance largo\u003c/li>\u003cli>la dote Doble fondo\u003c/li>\u003cli>la escuela La Escuela del Espejo\u003c/li>\u003c/ul>\u003c/div>\u003c/div>"},"velo-cansancio":{"title":"Cansancio","html":"\u003cdiv class=\"ecos-dialogo\">\u003cp class=\"texto\">SAB. Cree que lleva días sin dormir: si falla, tiene desventaja en los ataques y en las pruebas de FUE. Repite al final de cada turno. Sube: una criatura más.\u003c/p>\n      \u003ctable class=\"ecos-verbe-ficha\">\n        \u003ctr>\u003cth>Rama\u003c/th>\u003ctd>Velo\u003c/td>\u003cth>Grado\u003c/th>\u003ctd>1\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Tiempo\u003c/th>\u003ctd>Acción\u003c/td>\u003cth>Alcance\u003c/th>\u003ctd>18 m\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Área\u003c/th>\u003ctd>—\u003c/td>\u003cth>Duración\u003c/th>\u003ctd>Concentración, 1 min\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Componentes\u003c/th>\u003ctd>gestos\u003c/td>\u003cth>Tirada\u003c/th>\u003ctd>Salvación de SAB\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Daño o curación\u003c/th>\u003ctd>—\u003c/td>\u003cth>Deja\u003c/th>\u003ctd>—\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Usa\u003c/th>\u003ctd>usa tu característica de Verbe\u003c/td>\u003cth>Sube\u003c/th>\u003ctd>una criatura más por cada grado de más\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Verbe por uso\u003c/th>\u003ctd>grado 1: 2 Verbe\u003c/td>\u003cth>Para aprender\u003c/th>\u003ctd>1 Trazo\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Pide\u003c/th>\u003ctd>nivel 1\u003c/td>\u003cth>Puedes\u003c/th>\u003ctd>sí\u003c/td>\u003c/tr>\n      \u003c/table>\u003cp class=\"ecos-nota\">CD con tu Verbe: 13.\u003c/p>\n      \n      \n      \u003cdiv class=\"ecos-verbe-mejora\">\u003cb>Se mejora con\u003c/b>\u003cul>\u003cli>usarla a más grado (una criatura más por grado)\u003c/li>\u003cli>los dones de rango de Velo\u003c/li>\u003cli>Cultivo: Pulida, Dominada y Propia\u003c/li>\u003cli>la dote Alcance largo\u003c/li>\u003cli>la dote Doble fondo\u003c/li>\u003cli>la escuela La Escuela del Espejo\u003c/li>\u003c/ul>\u003c/div>\u003c/div>"},"velo-imagen":{"title":"Imagen falsa","html":"\u003cdiv class=\"ecos-dialogo\">\u003cp class=\"texto\">Una imagen muda de algo que cabe en el cubo. La mueves con una acción. Investigación contra tu CD la revela; quien la toca la atraviesa.\u003c/p>\n      \u003ctable class=\"ecos-verbe-ficha\">\n        \u003ctr>\u003cth>Rama\u003c/th>\u003ctd>Velo\u003c/td>\u003cth>Grado\u003c/th>\u003ctd>1\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Tiempo\u003c/th>\u003ctd>Acción\u003c/td>\u003cth>Alcance\u003c/th>\u003ctd>18 m\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Área\u003c/th>\u003ctd>cubo 4,5 m\u003c/td>\u003cth>Duración\u003c/th>\u003ctd>Concentración, 10 min\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Componentes\u003c/th>\u003ctd>gestos y voz\u003c/td>\u003cth>Tirada\u003c/th>\u003ctd>Ninguna\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Daño o curación\u003c/th>\u003ctd>—\u003c/td>\u003cth>Deja\u003c/th>\u003ctd>—\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Usa\u003c/th>\u003ctd>usa tu característica de Verbe\u003c/td>\u003cth>Sube\u003c/th>\u003ctd>—\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Verbe por uso\u003c/th>\u003ctd>grado 1: 2 Verbe\u003c/td>\u003cth>Para aprender\u003c/th>\u003ctd>1 Trazo\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Pide\u003c/th>\u003ctd>nivel 1\u003c/td>\u003cth>Puedes\u003c/th>\u003ctd>sí\u003c/td>\u003c/tr>\n      \u003c/table>\n      \n      \u003cdiv class=\"ecos-verbe-crece\">\u003cb>Crece\u003c/b>\u003cul>\u003cli>Escalera: Imagen falsa (1) → Escenario (3) → Ciudad falsa (6).\u003c/li>\u003c/ul>\u003c/div>\n      \u003cdiv class=\"ecos-verbe-mejora\">\u003cb>Se mejora con\u003c/b>\u003cul>\u003cli>los dones de rango de Velo\u003c/li>\u003cli>Cultivo: Pulida, Dominada y Propia\u003c/li>\u003cli>la dote Alcance largo\u003c/li>\u003cli>la dote Área ancha\u003c/li>\u003cli>la dote Doble fondo\u003c/li>\u003cli>la escuela La Escuela del Espejo\u003c/li>\u003c/ul>\u003c/div>\u003c/div>"},"velo-salir-flujo":{"title":"Interferencia de un aliado","html":"\u003cdiv class=\"ecos-dialogo\">\u003cp class=\"texto\">Tocas a una criatura y alteras suavemente su flujo: puede repetir inmediatamente una salvación contra una ilusión o Hechizado que permita liberación por chakra. Límites: Una repetición por víctima y turno; no elimina estados físicos, no garantiza éxito y no rompe los poderes oculares excepcionales sin cumplir sus condiciones.\u003c/p>\u003cp class=\"ecos-nota\">Referencia: \u003cb>Interferencia externa\u003c/b> · manga/anime · estudio, p. 20. Grado y cifras adaptados a esta campaña.\u003c/p>\u003cp class=\"ecos-nota\">El DM resuelve desplazamientos, información, cuerpos o preparativos; la tarjeta no crea tokens ni cambia el escenario automáticamente.\u003c/p>\n      \u003ctable class=\"ecos-verbe-ficha\">\n        \u003ctr>\u003cth>Rama\u003c/th>\u003ctd>Velo\u003c/td>\u003cth>Grado\u003c/th>\u003ctd>1\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Tiempo\u003c/th>\u003ctd>Acción\u003c/td>\u003cth>Alcance\u003c/th>\u003ctd>1.5 m\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Área\u003c/th>\u003ctd>—\u003c/td>\u003cth>Duración\u003c/th>\u003ctd>instantánea\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Componentes\u003c/th>\u003ctd>gestos\u003c/td>\u003cth>Tirada\u003c/th>\u003ctd>Ninguna\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Daño o curación\u003c/th>\u003ctd>—\u003c/td>\u003cth>Deja\u003c/th>\u003ctd>—\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Usa\u003c/th>\u003ctd>usa tu característica de Verbe\u003c/td>\u003cth>Sube\u003c/th>\u003ctd>—\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Verbe por uso\u003c/th>\u003ctd>grado 1: 2 Verbe\u003c/td>\u003cth>Para aprender\u003c/th>\u003ctd>1 Trazo\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Pide\u003c/th>\u003ctd>nivel 1\u003c/td>\u003cth>Puedes\u003c/th>\u003ctd>sí\u003c/td>\u003c/tr>\n      \u003c/table>\n      \n      \n      \u003c/div>"},"velo-lugar-falso":{"title":"Lugar que no es","html":"\u003cdiv class=\"ecos-dialogo\">\u003cp class=\"texto\">Alteras rótulos, distancias aparentes o una habitación de hasta 6 m sin cambiar su materia. Una acción de Investigación contra tu CD descubre la contradicción; tocar un obstáculo real revela el engaño. Límites: Afecta solo al objetivo o área indicados; no ignora cobertura total, inmunidades ni requisitos de la técnica.\u003c/p>\u003cp class=\"ecos-nota\">Referencia: \u003cb>Kokoni Arazu no Jutsu\u003c/b> · manga/anime · estudio, p. 19. Grado y cifras adaptados a esta campaña.\u003c/p>\u003cp class=\"ecos-nota\">El DM resuelve desplazamientos, información, cuerpos o preparativos; la tarjeta no crea tokens ni cambia el escenario automáticamente.\u003c/p>\n      \u003ctable class=\"ecos-verbe-ficha\">\n        \u003ctr>\u003cth>Rama\u003c/th>\u003ctd>Velo\u003c/td>\u003cth>Grado\u003c/th>\u003ctd>1\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Tiempo\u003c/th>\u003ctd>Acción\u003c/td>\u003cth>Alcance\u003c/th>\u003ctd>18 m\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Área\u003c/th>\u003ctd>—\u003c/td>\u003cth>Duración\u003c/th>\u003ctd>Concentración, 600 s\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Componentes\u003c/th>\u003ctd>gestos\u003c/td>\u003cth>Tirada\u003c/th>\u003ctd>Ninguna\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Daño o curación\u003c/th>\u003ctd>—\u003c/td>\u003cth>Deja\u003c/th>\u003ctd>—\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Usa\u003c/th>\u003ctd>usa tu característica de Verbe\u003c/td>\u003cth>Sube\u003c/th>\u003ctd>—\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Verbe por uso\u003c/th>\u003ctd>grado 1: 2 Verbe\u003c/td>\u003cth>Para aprender\u003c/th>\u003ctd>1 Trazo\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Pide\u003c/th>\u003ctd>nivel 1\u003c/td>\u003cth>Puedes\u003c/th>\u003ctd>sí\u003c/td>\u003c/tr>\n      \u003c/table>\n      \n      \n      \u003c/div>"},"velo-parpados":{"title":"Párpados de plomo","html":"\u003cdiv class=\"ecos-dialogo\">\u003cp class=\"texto\">SAB. Si falla, queda Incapacitada. Al final de su próximo turno repite: si falla otra vez, se duerme hasta que la dañen o alguien la sacuda con una acción.\u003c/p>\n      \u003ctable class=\"ecos-verbe-ficha\">\n        \u003ctr>\u003cth>Rama\u003c/th>\u003ctd>Velo\u003c/td>\u003cth>Grado\u003c/th>\u003ctd>1\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Tiempo\u003c/th>\u003ctd>Acción\u003c/td>\u003cth>Alcance\u003c/th>\u003ctd>18 m\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Área\u003c/th>\u003ctd>esfera 1,5 m\u003c/td>\u003cth>Duración\u003c/th>\u003ctd>Concentración, 1 min\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Componentes\u003c/th>\u003ctd>gestos y voz\u003c/td>\u003cth>Tirada\u003c/th>\u003ctd>Salvación de SAB\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Daño o curación\u003c/th>\u003ctd>—\u003c/td>\u003cth>Deja\u003c/th>\u003ctd>Incapacitado\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Usa\u003c/th>\u003ctd>usa tu característica de Verbe\u003c/td>\u003cth>Sube\u003c/th>\u003ctd>—\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Verbe por uso\u003c/th>\u003ctd>grado 1: 2 Verbe\u003c/td>\u003cth>Para aprender\u003c/th>\u003ctd>1 Trazo\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Pide\u003c/th>\u003ctd>nivel 1\u003c/td>\u003cth>Puedes\u003c/th>\u003ctd>sí\u003c/td>\u003c/tr>\n      \u003c/table>\u003cp class=\"ecos-nota\">CD con tu Verbe: 13.\u003c/p>\n      \n      \u003cdiv class=\"ecos-verbe-crece\">\u003cb>Crece\u003c/b>\u003cul>\u003cli>Escalera: Párpados de plomo (1) → Ojos cerrados (2) → Noche para todos (8).\u003c/li>\u003c/ul>\u003c/div>\n      \u003cdiv class=\"ecos-verbe-mejora\">\u003cb>Se mejora con\u003c/b>\u003cul>\u003cli>los dones de rango de Velo\u003c/li>\u003cli>Cultivo: Pulida, Dominada y Propia\u003c/li>\u003cli>la dote Alcance largo\u003c/li>\u003cli>la dote Área ancha\u003c/li>\u003cli>la dote Doble fondo\u003c/li>\u003cli>la escuela La Escuela del Espejo\u003c/li>\u003c/ul>\u003c/div>\u003c/div>"},"velo-paso-falso":{"title":"Paso falso","html":"\u003cdiv class=\"ecos-dialogo\">\u003cp class=\"ecos-verbe-intro\">\u003cb>Es una defensa reactiva.\u003c/b> Con midi-qol se ofrece cuando un ataque va a impactarte; el aviso muestra el coste según el ataque. No la lances como una técnica normal antes del golpe. Sin esa integración, el DM resuelve la reacción, el objeto y el coste en mesa.\u003c/p>\u003cp class=\"texto\">Cuando te va a atacar una criatura que te ve, te ve 1,5 m corrido: ese ataque, y los demás contra ti hasta el inicio de tu turno, tienen desventaja.\u003c/p>\n      \u003ctable class=\"ecos-verbe-ficha\">\n        \u003ctr>\u003cth>Rama\u003c/th>\u003ctd>Velo\u003c/td>\u003cth>Grado\u003c/th>\u003ctd>1\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Tiempo\u003c/th>\u003ctd>Reacción\u003c/td>\u003cth>Alcance\u003c/th>\u003ctd>sobre ti\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Área\u003c/th>\u003ctd>—\u003c/td>\u003cth>Duración\u003c/th>\u003ctd>1 asalto\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Componentes\u003c/th>\u003ctd>sin gestos ni voz\u003c/td>\u003cth>Tirada\u003c/th>\u003ctd>Ninguna\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Daño o curación\u003c/th>\u003ctd>—\u003c/td>\u003cth>Deja\u003c/th>\u003ctd>—\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Usa\u003c/th>\u003ctd>usa tu característica de Verbe\u003c/td>\u003cth>Sube\u003c/th>\u003ctd>—\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Verbe por uso\u003c/th>\u003ctd>grado 1: 2 Verbe\u003c/td>\u003cth>Para aprender\u003c/th>\u003ctd>1 Trazo\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Pide\u003c/th>\u003ctd>nivel 1\u003c/td>\u003cth>Puedes\u003c/th>\u003ctd>sí\u003c/td>\u003c/tr>\n      \u003c/table>\n      \n      \n      \u003cdiv class=\"ecos-verbe-mejora\">\u003cb>Se mejora con\u003c/b>\u003cul>\u003cli>los dones de rango de Velo\u003c/li>\u003cli>Cultivo: Pulida, Dominada y Propia\u003c/li>\u003cli>la dote Esquivar sin Verbe\u003c/li>\u003cli>la dote Doble fondo\u003c/li>\u003cli>la escuela La Escuela del Espejo\u003c/li>\u003c/ul>\u003c/div>\u003c/div>"},"velo-amigo":{"title":"Rostro amigo","html":"\u003cdiv class=\"ecos-dialogo\">\u003cp class=\"texto\">SAB. Un humanoide te ve como un amigo: si falla, queda Hechizado. Tiene ventaja si tú o los tuyos lo atacan. Al terminar sabe que fuiste tú. Sube: una criatura más.\u003c/p>\n      \u003ctable class=\"ecos-verbe-ficha\">\n        \u003ctr>\u003cth>Rama\u003c/th>\u003ctd>Velo\u003c/td>\u003cth>Grado\u003c/th>\u003ctd>1\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Tiempo\u003c/th>\u003ctd>Acción\u003c/td>\u003cth>Alcance\u003c/th>\u003ctd>9 m\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Área\u003c/th>\u003ctd>—\u003c/td>\u003cth>Duración\u003c/th>\u003ctd>1 h\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Componentes\u003c/th>\u003ctd>gestos y voz\u003c/td>\u003cth>Tirada\u003c/th>\u003ctd>Salvación de SAB\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Daño o curación\u003c/th>\u003ctd>—\u003c/td>\u003cth>Deja\u003c/th>\u003ctd>Hechizado\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Usa\u003c/th>\u003ctd>usa tu característica de Verbe\u003c/td>\u003cth>Sube\u003c/th>\u003ctd>una criatura más por cada grado de más\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Verbe por uso\u003c/th>\u003ctd>grado 1: 2 Verbe\u003c/td>\u003cth>Para aprender\u003c/th>\u003ctd>1 Trazo\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Pide\u003c/th>\u003ctd>nivel 1\u003c/td>\u003cth>Puedes\u003c/th>\u003ctd>sí\u003c/td>\u003c/tr>\n      \u003c/table>\u003cp class=\"ecos-nota\">CD con tu Verbe: 13.\u003c/p>\n      \n      \n      \u003cdiv class=\"ecos-verbe-mejora\">\u003cb>Se mejora con\u003c/b>\u003cul>\u003cli>usarla a más grado (una criatura más por grado)\u003c/li>\u003cli>los dones de rango de Velo\u003c/li>\u003cli>Cultivo: Pulida, Dominada y Propia\u003c/li>\u003cli>la dote Alcance largo\u003c/li>\u003cli>la dote Doble fondo\u003c/li>\u003cli>la escuela La Escuela del Espejo\u003c/li>\u003c/ul>\u003c/div>\u003c/div>"},"velo-miedo":{"title":"Rostro del miedo","html":"\u003cdiv class=\"ecos-dialogo\">\u003cp class=\"texto\">SAB. Si falla, queda Asustada. Repite la salvación al final de cada turno en que no te ve. Sube: una criatura más.\u003c/p>\u003cp class=\"ecos-nota\">Referencia: \u003cb>Narakumi no Jutsu\u003c/b> · manga/anime · estudio, p. 19. Grado y cifras adaptados a esta campaña.\u003c/p>\n      \u003ctable class=\"ecos-verbe-ficha\">\n        \u003ctr>\u003cth>Rama\u003c/th>\u003ctd>Velo\u003c/td>\u003cth>Grado\u003c/th>\u003ctd>1\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Tiempo\u003c/th>\u003ctd>Acción\u003c/td>\u003cth>Alcance\u003c/th>\u003ctd>18 m\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Área\u003c/th>\u003ctd>—\u003c/td>\u003cth>Duración\u003c/th>\u003ctd>Concentración, 1 min\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Componentes\u003c/th>\u003ctd>voz\u003c/td>\u003cth>Tirada\u003c/th>\u003ctd>Salvación de SAB\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Daño o curación\u003c/th>\u003ctd>—\u003c/td>\u003cth>Deja\u003c/th>\u003ctd>Asustado\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Usa\u003c/th>\u003ctd>usa tu característica de Verbe\u003c/td>\u003cth>Sube\u003c/th>\u003ctd>una criatura más por cada grado de más\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Verbe por uso\u003c/th>\u003ctd>grado 1: 2 Verbe\u003c/td>\u003cth>Para aprender\u003c/th>\u003ctd>1 Trazo\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Pide\u003c/th>\u003ctd>nivel 1\u003c/td>\u003cth>Puedes\u003c/th>\u003ctd>sí\u003c/td>\u003c/tr>\n      \u003c/table>\u003cp class=\"ecos-nota\">CD con tu Verbe: 13.\u003c/p>\n      \n      \u003cdiv class=\"ecos-verbe-crece\">\u003cb>Crece\u003c/b>\u003cul>\u003cli>Escalera: Rostro del miedo (1) → Pesadilla despierta (3) → Reino del sueño (7) → Velo del mundo entero (10) → El sueño que no termina (11).\u003c/li>\u003c/ul>\u003c/div>\n      \u003cdiv class=\"ecos-verbe-mejora\">\u003cb>Se mejora con\u003c/b>\u003cul>\u003cli>usarla a más grado (una criatura más por grado)\u003c/li>\u003cli>los dones de rango de Velo\u003c/li>\u003cli>Cultivo: Pulida, Dominada y Propia\u003c/li>\u003cli>la dote Alcance largo\u003c/li>\u003cli>la dote Doble fondo\u003c/li>\u003cli>la escuela La Escuela del Espejo\u003c/li>\u003c/ul>\u003c/div>\u003c/div>"},"cuerpo-golpe-hondo":{"title":"Golpe hondo","html":"\u003cdiv class=\"ecos-dialogo\">\u003cp class=\"texto\">Haces un ataque con un arma cuerpo a cuerpo o un golpe sin armas. Si impacta, suma 1d6 de fuerza (2d6 en el nivel 5, 3d6 en el 11 y 4d6 en el 17).\u003c/p>\n      \u003ctable class=\"ecos-verbe-ficha\">\n        \u003ctr>\u003cth>Rama\u003c/th>\u003ctd>Cuerpo\u003c/td>\u003cth>Grado\u003c/th>\u003ctd>0\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Tiempo\u003c/th>\u003ctd>Acción\u003c/td>\u003cth>Alcance\u003c/th>\u003ctd>sobre ti\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Área\u003c/th>\u003ctd>—\u003c/td>\u003cth>Duración\u003c/th>\u003ctd>instantánea\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Componentes\u003c/th>\u003ctd>sin gestos ni voz\u003c/td>\u003cth>Tirada\u003c/th>\u003ctd>Ninguna\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Daño o curación\u003c/th>\u003ctd>—\u003c/td>\u003cth>Deja\u003c/th>\u003ctd>—\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Usa\u003c/th>\u003ctd>ataca con Fuerza o Destreza, como un arma\u003c/td>\u003cth>Sube\u003c/th>\u003ctd>—\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Verbe por uso\u003c/th>\u003ctd>0 Verbe (pide tener al menos 1)\u003c/td>\u003cth>Para aprender\u003c/th>\u003ctd>1 Trazo\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Pide\u003c/th>\u003ctd>—\u003c/td>\u003cth>Puedes\u003c/th>\u003ctd>sí\u003c/td>\u003c/tr>\n      \u003c/table>\n      \n      \n      \u003cdiv class=\"ecos-verbe-mejora\">\u003cb>Se mejora con\u003c/b>\u003cul>\u003cli>los dones de rango de Cuerpo\u003c/li>\u003cli>Cultivo: Pulida, Dominada y Propia\u003c/li>\u003cli>la escuela Los Cerrojeros\u003c/li>\u003c/ul>\u003c/div>\u003c/div>"},"cuerpo-guardia":{"title":"Guardia de hierro","html":"\u003cdiv class=\"ecos-dialogo\">\u003cp class=\"texto\">+1 a la CA hasta el inicio de tu próximo turno, pero tu velocidad es 0.\u003c/p>\n      \u003ctable class=\"ecos-ve ón\u003c/th>\u003ctd>1 asalto\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Componentes\u003c/th>\u003ctd>sin gestos ni voz\u003c/td>\u003cth>Tirada\u003c/th>\u003ctd>Ninguna\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Daño o curación\u003c/th>\u003ctd>—\u003c/td>\u003cth>Deja\u003c/th>\u003ctd>—\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Usa\u003c/th>\u003ctd>ataca con Fuerza o Destreza, como un arma\u003c/td>\u003cth>Sube\u003c/th>\u003ctd>—\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Verbe por uso\u003c/th>\u003ctd>0 Verbe (pide tener al menos 1)\u003c/td>\u003cth>Para aprender\u003c/th>\u003ctd>1 Trazo\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Pide\u003c/th>\u003ctd>—\u003c/td>\u003cth>Puedes\u003c/th>\u003ctd>sí\u003c/td>\u003c/tr>\n      \u003c/table>\n      \n      \n      \u003cdiv class=\"ecos-verbe-mejora\">\u003cb>Se mejora con\u003c/b>\u003cul>\u003cli>los dones de rango de Cuerpo\u003c/li>\u003cli>Cultivo: Pulida, Dominada y Propia\u003c/li>\u003cli>la escuela Los Cerrojeros\u003c/li>\u003c/ul>\u003c/div>\u003c/div>"},"cuerpo-nudos-libres":{"title":"Manos fuera del nudo","html":"\u003cdiv class=\"ecos-dialogo\">\u003cp class=\"texto\">Aflojas una atadura mundana si superas una prueba de Destreza o Juego de Manos contra la CD del nudo fijada por el DM. Límites: Una acción y una prueba, no éxito automático. No rompe cadenas, presas de criaturas o sellos mágicos.\u003c/p>\u003cp class=\"ecos-nota\">Referencia: \u003cb>Nawanuke no Jutsu\u003c/b> · manga/anime · estudio, p. 9. Grado y cifras adaptados a esta campaña.\u003c/p>\u003cp class=\"ecos-nota\">El DM resuelve desplazamientos, información, cuerpos o preparativos; la tarjeta no crea tokens ni cambia el escenario automáticamente.\u003c/p>\n      \u003ctable class=\"ecos-verbe-ficha\">\n        \u003ctr>\u003cth>Rama\u003c/th>\u003ctd>Cuerpo\u003c/td>\u003cth>Grado\u003c/th>\u003ctd>0\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Tiempo\u003c/th>\u003ctd>Acción\u003c/td>\u003cth>Alcance\ /tr>\n        \u003ctr>\u003cth>Verbe por uso\u003c/th>\u003ctd>0 Verbe (pide tener al menos 1)\u003c/td>\u003cth>Para aprender\u003c/th>\u003ctd>1 Trazo\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Pide\u003c/th>\u003ctd>—\u003c/td>\u003cth>Puedes\u003c/th>\u003ctd>sí\u003c/td>\u003c/tr>\n      \u003c/table>\n      \n      \n      \u003cdiv class=\"ecos-verbe-mejora\">\u003cb>Se mejora con\u003c/b>\u003cul>\u003cli>los dones de rango de Cuerpo\u003c/li>\u003cli>Cultivo: Pulida, Dominada y Propia\u003c/li>\u003cli>la escuela Los Cerrojeros\u003c/li>\u003c/ul>\u003c/div>\u003c/div>"},"cuerpo-aguantar":{"title":"Aguantar el golpe","html":"\u003cdiv class=\"ecos-dialogo\">\u003cp class=\"texto\">Cuando recibes daño contundente, cortante o perforante, lo reduces en 2d8 + tu mod. de FUE o DES. Sube: +1d8.\u003c/p>\n      \u003ctable class=\"ecos-verbe-ficha\">\n        \u003ctr>\u003cth>Rama\u003c/th>\u003ctd>Cuerpo\u003c/td>\u003cth>Grado\u003c/th>\u003ctd>1\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Tiempo\u003c/th>\u003ctd>Reacción\u003c/td>\u003cth>Alcance\u003c/th>\u003ctd>sobre ti\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Área\u003c/th>\u003ctd>—\u003c/td>\u003cth>Duración\u003c/th>\u003ctd>instantánea\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Componentes\u003c/th>\u003ctd>sin gestos ni voz\u003c/td>\u003cth>Tirada\u003c/th>\u003ctd>Ninguna\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Daño o curación\u003c/th>\u003ctd>—\u003c/td>\u003cth>Deja\u003c/th>\u003ctd>—\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Usa\u003c/th>\u003ctd>ataca con Fuerza o Destreza, como un arma\u003c/td>\u003cth>Sube\u003c/th>\u003ctd>+1d8 por cada grado de más\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Verbe por uso\u003c/th>\u003ctd>grado 1: 2 Verbe\u003c/td>\u003cth>Para aprender\u003c/th>\u003ctd>1 Trazo\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Pide\u003c/th>\u003ctd>nivel 1\u003c/td>\u003cth>Puedes\u003c/th>\u003ctd>sí\u003c/td>\u003c/tr>\n      \u003c/table>\n      \n      \n      \u003cdiv class=\"ecos-verbe-mejora\">\u003cb>Se mejora con\u003c/b>\u003cul>\u003cli>usarla a más grado (+1d8 por grado)\u003c/li>\u003cli>los dones de rango de Cuerpo\u003c/li>\u003cli>Cultivo: Pulida, Dominada y Propia\u003c/li>\u003cli>la escuela Los Cerrojeros\u003c/li>\u003c/ul>\u003c/div>\u003c/div>"},"cuerpo-codazo":{"title":"Codazo","html":"\u003cdiv class=\"ecos-dialogo\">\u003cp class=\"texto\">Ataque: 2d6 contundente. Un golpe corto con el codo: si impacta y el blanco es Mediano o menor y falla FUE, queda Derribado. Sube: +1d6.\u003c/p>\n      \u003ctable class=\"ecos-verbe-ficha\">\n        \u003ctr>\u003cth>Rama\u003c/th>\u003ctd>Cuerpo\u003c/td>\u003cth>Grado\u003c/th>\u003ctd>1\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Tiempo\u003c/th>\u003ctd>Acción adicional\u003c/td>\u003cth>Alcance\u003c/th>\u003ctd>toque\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Área\u003c/th>\u003ctd>—\u003c/td>\u003cth>Duración\u003c/th>\u003ctd>instantánea\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Componentes\u003c/th>\u003ctd>sin gestos ni voz\u003c/td>\u003cth>Tirada\u003c/th>\u003ctd>Ataque\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Daño o curación\u003c/th>\u003ctd>2d6 contundente\u003c/td>\u003cth>Deja\u003c/th>\u003ctd>Derribado\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Usa\u003c/th>\u003ctd>ataca con Fuerza o Destreza, como un arma\u003c/td>\u003cth>Sube\u003c/th>\u003ctd>+1d6 por cada grado de más\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Verbe por uso\u003c/th>\u003ctd>grado 1: 2 Verbe\u003c/td>\u003cth>Para aprender\u003c/th>\u003ctd>1 Trazo\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Pide\u003c/th>\u003ctd>nivel 1\u003c/td>\u003cth>Puedes\u003c/th>\u003ctd>sí\u003c/td>\u003c/tr>\n      \u003c/table>\n      \n      \n      \u003cdiv class=\"ecos-verbe-mejora\">\u003cb>Se mejora con\u003c/b>\u003cul>\u003cli>usarla a más grado (+1d6 por grado)\u003c/li>\u003cli>rango en Cuerpo (Experto +1 dado, Maestro +2, Legendario +3, Mítico +4)\u003c/li>\u003cli>los dones de rango de Cuerpo\u003c/li>\u003cli>infundirla con tu elemento (Cultivo)\u003c/li>\u003cli>Cultivo: Pulida, Dominada y Propia\u003c/li>\u003cli>la dote Cuerpo de hierro\u003c/li>\u003cli>la escuela Los Cerrojeros\u003c/li>\u003c/ul>\u003c/div>\u003c/div>"},"cuerpo-martillo":{"title":"Golpe de martillo","html":"\u003cdiv class=\"ecos-dialogo\">\u003cp class=\"texto\">Tu próximo golpe cuerpo a cuerpo que impacte suma 2d6 de fuerza, y el blanco hace FUE o queda Derribado. Sube: +1d6.\u003c/p>\n      \u003ctable class=\"ecos-verbe-ficha\">\n        \u003ctr>\u003cth>Rama\u003c/th>\u003ctd>Cuerpo\u003c/td>\u003cth>Grado\u003c/th>\u003ctd>1\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Tiempo\u003c/th>\u003ctd>Acción adicional\u003c/td>\u003cth>Alcance\u003c/th>\u003ctd>sobre ti\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Área\u003c/th>\u003ctd>—\u003c/td>\u003cth>Duración\u003c/th>\u003ctd>1 min\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Componentes\u003c/th>\u003ctd>sin gestos ni voz\u003c/td>\u003cth>Tirada\u003c/th>\u003ctd>Ninguna\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Daño o curación\u003c/th>\u003ctd>—\u003c/td>\u003cth>Deja\u003c/th>\u003ctd>—\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Usa\u003c/th>\u003ctd>ataca con Fuerza o Destreza, como un arma\u003c/td>\u003cth>Sube\u003c/th>\u003ctd>+1d6 por cada grado de más\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Verbe por uso\u003c/th>\u003ctd>grado 1: 2 Verbe\u003c/td>\u003cth>Para aprender\u003c/th>\u003ctd>1 Trazo\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Pide\u003c/th>\u003ctd>nivel 1\u003c/td>\u003cth>Puedes\u003c/th>\u003ctd>sí\u003c/td>\u003c/tr>\n      \u003c/table>\n      \n      \n      \u003cdiv class=\"ecos-verbe-mejora\">\u003cb>Se mejora con\u003c/b>\u003cul>\u003cli>usarla a más grado (+1d6 por grado)\u003c/li>\u003cli>los dones de rango de Cuerpo\u003c/li>\u003cli>Cultivo: Pulida, Dominada y Propia\u003c/li>\u003cli>la escuela Los Cerrojeros\u003c/li>\u003c/ul>\u003c/div>\u003c/div>"},"cuerpo-lluvia":{"title":"Lluvia de puños","html":"\u003cdiv class=\"ecos-dialogo\">\u003cp class=\"texto\">Haces dos golpes sin armas.\u003c/p>\n      \u003ctable class=\"ecos-verbe-ficha\">\n        \u003ctr>\u003cth>Rama\u003c/th>\u003ctd>Cuerpo\u003c/td>\u003cth>Grado\u003c/th>\u003ctd>1\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Tiempo\u003c/th>\u003ctd>Acción adicional\u003c/td>\u003cth>Alcance\u003c/th>\u003ctd>sobre ti\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Área\u003c/th>\u003ctd>—\u003c/td>\u003cth>Duración\u003c/th>\u003ctd>instantánea\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Componentes\u003c/th>\u003ctd>sin gestos ni voz\u003c/td>\u003cth>Tirada\u003c/th>\u003ctd>Ninguna\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Daño o curación\u003c/th>\u003ctd>—\u003c/td>\u003cth>Deja\u003c/th>\u003ctd>—\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Usa\u003c/th>\u003ctd>ataca con Fuerza o Destreza, como un arma\u003c/td>\u003cth>Sube\u003c/th>\u003ctd>—\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Verbe por uso\u003c/th>\u003ctd>grado 1: 2 Verbe\u003c/td>\u003cth>Para aprender\u003c/th>\u003ctd>1 Trazo\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Pide\u003c/th>\u003ctd>nivel 1\u003c/td>\u003cth>Puedes\u003c/th>\u003ctd>sí\u003c/td>\u003c/tr>\n      \u003c/table>\n      \n      \n      \u003cdiv class=\"ecos-verbe-mejora\">\u003cb>Se mejora con\u003c/b>\u003cul>\u003cli>los dones de rango de Cuerpo\u003c/li>\u003cli>Cultivo: Pulida, Dominada y Propia\u003c/li>\u003cli>la escuela Los Cerrojeros\u003c/li>\u003c/ul>\u003c/div>\u003c/div>"},"cuerpo-salto":{"title":"Salto del Verbe","html":"\u003cdiv class=\"ecos-dialogo\">\u003cp class=\"texto\">Saltas el triple de lo normal, y caer desde esa altura no te hace daño.\u003c/p>\n      \u003ctable class=\"ecos-verbe-ficha\">\n        \u003ctr>\u003cth>Rama\u003c/th>\u003ctd>Cuerpo\u003c/td>\u003cth>Grado\u003c/th>\u003ctd>1\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Tiempo\u003c/th>\u003ctd>Acción adicional\u003c/td>\u003cth>Alcance\u003c/th>\u003ctd>sobre ti\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Área\u003c/th>\u003ctd>—\u003c/td>\u003cth>Duración\u003c/th>\u003ctd>1 asalto\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Componentes\u003c/th>\u003ctd>sin gestos ni voz\u003c/td>\u003cth>Tirada\u003c/th>\u003ctd>Ninguna\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Daño o curación\u003c/th>\u003ctd>—\u003c/td>\u003cth>Deja\u003c/th>\u003ctd>—\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Usa\u003c/th>\u003ctd>ataca con Fuerza o Destreza, como un arma\u003c/td>\u003cth>Sube\u003c/th>\u003ctd>—\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Verbe por uso\u003c/th>\u003ctd>grado 1: 2 Verbe\u003c/td>\u003cth>Para aprender\u003c/th>\u003ctd>1 Trazo\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Pide\u003c/th>\u003ctd>nivel 1\u003c/td>\u003cth>Puedes\u003c/th>\u003ctd>sí\u003c/td>\u003c/tr>\n      \u003c/table>\n      \n      \n      \u003cdiv class=\"ecos-verbe-mejora\">\u003cb>Se mejora con\u003c/b>\u003cul>\u003cli>los dones de rango de Cuerpo\u003c/li>\u003cli>Cultivo: Pulida, Dominada y Propia\u003c/li>\u003cli>la escuela Los Cerrojeros\u003c/li>\u003c/ul>\u003c/div>\u003c/div>"},"cuerpo-sombra-danzante":{"title":"Sombra bajo el salto","html":"\u003cdiv class=\"ecos-dialogo\">\u003cp class=\"texto\">Te desplazas hasta 3 m hacia un objetivo elevado que puedas alcanzar. Tus saltos no necesitan carrera mientras dura la postura. Límites: El desplazamiento usa tu movimiento, no es teletransporte ni concede vuelo o ataques adicionales.\u003c/p>\u003cp class=\"ecos-nota\">Referencia: \u003cb>Kage Buyō\u003c/b> · manga/anime · estudio, p. 21. Grado y cifras adaptados a esta campaña.\u003c/p>\u003cp class=\"ecos-nota\">Ataque/salvación y dados nativos; confirma los estados en los objetivos. Repeticiones de salvación, empujes y condiciones del terreno se resuelven con el DM.\u003c/p>\n      \u003ctable class=\"ecos-verbe-ficha\">\n        \u003ctr>\u003cth>Rama\u003c/th>\u003ctd>Cuerpo\u003c/td>\u003cth>Grado\u003c/th>\u003ctd>1\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Tiempo\u003c/th>\u003ctd>Acción adicional\u003c/td>\u003cth>Alcance\u003c/th>\u003ctd>sobre ti\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Área\u003c/th>\u003ctd>—\u003c/td>\u003cth>Duración\u003c/th>\u003ctd>6 s\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Componentes\u003c/th>\u003ctd>gestos\u003c/td>\u003cth>Tirada\u003c/th>\u003ctd>Ninguna\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Daño o curación\u003c/th>\u003ctd>—\u003c/td>\u003cth>Deja\u003c/th>\u003ctd>Sombra bajo el salto\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Usa\u003c/th>\u003ctd>ataca con Fuerza o Destreza, como un arma\u003c/td>\u003cth>Sube\u003c/th>\u003ctd>—\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Verbe por uso\u003c/th>\u003ctd>grado 1: 2 Verbe\u003c/td>\u003cth>Para aprender\u003c/th>\u003ctd>1 Trazo\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Pide\u003c/th>\u003ctd>nivel 1\u003c/td>\u003cth>Puedes\u003c/th>\u003ctd>sí\u003c/td>\u003c/tr>\n      \u003c/table>\n      \n      \n      \u003c/div>"},"sello-guardar":{"title":"Guardar","html":"\u003cdiv class=\"ecos-dialogo\">\u003cp class=\"texto\">Guardas en un pergamino un objeto que no lleva nadie, de hasta 5 kg. Sacarlo es una AA. Pide un pergamino con tinta de Verbe, que se puede volver a usar.\u003c/p>\n      \u003ctable class=\"ecos-verbe-ficha\">\n        \u003ctr>\u003cth>Rama\u003c/th>\u003ctd>Sello\u003c/td>\u003cth>Grado\u003c/th>\u003ctd>0\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Tiempo\u003c/th>\u003ctd>Acción\u003c/td>\u003cth>Alcance\u003c/th>\u003ctd>toque\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Área\u003c/th>\u003ctd>—\u003c/td>\u003cth>Duración\u003c/th>\u003ctd>hasta sacarlo\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Componentes\u003c/th>\u003ctd>gestos\u003c/td>\u003cth>Tirada\u003c/th>\u003ctd>Ninguna\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Daño o curación\u003c/th>\u003ctd>—\u003c/td>\u003cth>Deja\u003c/th>\u003ctd>—\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Usa\u003c/th>\u003ctd>usa tu característica de Verbe\u003c/td>\u003cth>Sube\u003c/th>\u003ctd>—\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Verbe por uso\u003c/th>\u003ctd>0 Verbe (pide tener al menos 1)\u003c/td>\u003cth>Para aprender\u003c/th>\u003ctd>1 Trazo\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Pide\u003c/th>\u003ctd>—\u003c/td>\u003cth>Puedes\u003c/th>\u003ctd>sí\u003c/td>\u003c/tr>\n      \u003c/table>\n      \n      \n      \u003cdiv class=\"ecos-verbe-mejora\">\u003cb>Se mejora con\u003c/b>\u003cul>\u003cli>los dones de rango de Sello\u003c/li>\u003cli>Cultivo: Pulida, Dominada y Propia\u003c/li>\u003cli>la dote Sello firme\u003c/li>\u003cli>la escuela La Casa del Nudo\u003c/li>\u003c/ul>\u003c/div>\u003c/div>"},"sello-marca":{"title":"Marca menor","html":"\u003cdiv class=\"ecos-dialogo\">\u003cp class=\"texto\">Dejas una marca invisible de tu Verbe en un objeto o una superficie. Sabes en qué dirección y a qué distancia está, hasta 1,5 km. Tienes tantas como tu competencia.\u003c/p>\n      \u003ctable class=\"ecos-verbe-ficha\">\n        \u003ctr>\u003cth>Rama\u003c/th>\u003ctd>Sello\u003c/td>\u003cth>Grado\u003c/th>\u003ctd>0\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Tiempo\u003c/th>\u003ctd>Acción\u003c/td>\u003cth>Alcance\u003c/th>\u003ctd>toque\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Área\u003c/th>\u003ctd>—\u003c/td>\u003cth>Duración\u003c/th>\u003ctd>hasta borrarla\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Componentes\u003c/th>\u003ctd>gestos\u003c/td>\u003cth>Tirada\u003c/th>\u003ctd>Ninguna\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Daño o curación\u003c/th>\u003ctd>—\u003c/td>\u003cth>Deja\u003c/th>\u003ctd>—\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Usa\u003c/th>\u003ctd>usa tu característica de Verbe\u003c/td>\u003cth>Sube\u003c/th>\u003ctd>—\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Verbe por uso\u003c/th>\u003ctd>0 Verbe (pide tener al menos 1)\u003c/td>\u003cth>Para aprender\u003c/th>\u003ctd>1 Trazo\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Pide\u003c/th>\u003ctd>—\u003c/td>\u003cth>Puedes\u003c/th>\u003ctd>sí\u003c/td>\u003c/tr>\n      \u003c/table>\n      \n      \n      \u003cdiv class=\"ecos-verbe-mejora\">\u003cb>Se mejora con\u003c/b>\u003cul>\u003cli>los dones de rango de Sello\u003c/li>\u003cli>Cultivo: Pulida, Dominada y Propia\u003c/li>\u003cli>la dote Sello firme\u003c/li>\u003cli>la escuela La Casa del Nudo\u003c/li>\u003c/ul>\u003c/div>\u003c/div>"},"sello-estalla":{"title":"Papel que estalla","html":"\u003cdiv class=\"ecos-dialogo\">\u003cp class=\"texto\">DES, mitad: 2d6 fuego. Pegas un sello de papel: estalla cuando lo tocan o cuando tú quieras (AA, a 36 m). Sube: +1d6.\u003c/p>\n      \u003ctable class=\"ecos-verbe-ficha\">\n        \u003ctr>\u003cth>Rama\u003c/th>\u003ctd>Sello\u003c/td>\u003cth>Grado\u003c/th>\u003ctd>1\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Tiempo\u003c/th>\u003ctd>Acción\u003c/td>\u003cth>Alcance\u003c/th>\u003ctd>toque\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Área\u003c/th>\u003ctd>esfera 3 m\u003c/td>\u003cth>Duración\u003c/th>\u003ctd>24 h\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Componentes\u003c/th>\u003ctd>gestos\u003c/td>\u003cth>Tirada\u003c/th>\u003ctd>Salvación de DES, mitad si la supera\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Daño o curación\u003c/th>\u003ctd>2d6 fuego\u003c/td>\u003cth>Deja\u003c/th>\u003ctd>—\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Usa\u003c/th>\u003ctd>usa tu característica de Verbe\u003c/td>\u003cth>Sube\u003c/th>\u003ctd>+1d6 por cada grado de más\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Verbe por uso\u003c/th>\u003ctd>grado 1: 2 Verbe\u003c/td>\u003cth>Para aprender\u003c/th>\u003ctd>1 Trazo\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Pide\u003c/th>\u003ctd>nivel 1\u003c/td>\u003cth>Puedes\u003c/th>\u003ctd>sí\u003c/td>\u003c/tr>\n      \u003c/table>\u003cp class=\"ecos-nota\">CD con tu Verbe: 13.\u003c/p>\n      \n      \n      \u003cdiv class=\"ecos-verbe-mejora\">\u003cb>Se mejora con\u003c/b>\u003cul>\u003cli>usarla a más grado (+1d6 por grado)\u003c/li>\u003cli>rango en Sello (Experto +1 dado, Maestro +2, Legendario +3, Mítico +4)\u003c/li>\u003cli>los dones de rango de Sello\u003c/li>\u003cli>Cultivo: Pulida, Dominada y Propia\u003c/li>\u003cli>la dote Área ancha\u003c/li>\u003cli>la dote Sello firme\u003c/li>\u003cli>la escuela La Casa del Nudo\u003c/li>\u003c/ul>\u003c/div>\u003c/div>"},"sello-cierre":{"title":"Sello de cierre","html":"\u003cdiv class=\"ecos-dialogo\">\u003cp class=\"texto\">Una puerta, un cofre o una ventana queda cerrada: se abre rompiéndola o con Control contra tu CD. Tú y quien nombres la abren.\u003c/p>\n      \u003ctable class=\"ecos-verbe-ficha\">\n        \u003ctr>\u003cth>Rama\u003c/th>\u003ctd>Sello\u003c/td>\u003cth>Grado\u003c/th>\u003ctd>1\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Tiempo\u003c/th>\u003ctd>Acción\u003c/td>\u003cth>Alcance\u003c/th>\u003ctd>toque\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Área\u003c/th>\u003ctd>—\u003c/td>\u003cth>Duración\u003c/th>\u003ctd>24 h\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Componentes\u003c/th>\u003ctd>gestos\u003c/td>\u003cth>Tirada\u003c/th>\u003ctd>Ninguna\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Daño o curación\u003c/th>\u003ctd>—\u003c/td>\u003cth>Deja\u003c/th>\u003ctd>—\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Usa\u003c/th>\u003ctd>usa tu característica de Verbe\u003c/td>\u003cth>Sube\u003c/th>\u003ctd>—\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Verbe por uso\u003c/th>\u003ctd>grado 1: 2 Verbe\u003c/td>\u003cth>Para aprender\u003c/th>\u003ctd>1 Trazo\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Pide\u003c/th>\u003ctd>nivel 1\u003c/td>\u003cth>Puedes\u003c/th>\u003ctd>sí\u003c/td>\u003c/tr>\n      \u003c/table>\n      \n      \n      \u003cdiv class=\"ecos-verbe-mejora\">\u003cb>Se mejora con\u003c/b>\u003cul>\u003cli>los dones de rango de Sello\u003c/li>\u003cli>Cultivo: Pulida, Dominada y Propia\u003c/li>\u003cli>la dote Sello firme\u003c/li>\u003cli>la escuela La Casa del Nudo\u003c/li>\u003c/ul>\u003c/div>\u003c/div>"},"sello-peso":{"title":"Sello de peso","html":"\u003cdiv class=\"ecos-dialogo\">\u003cp class=\"texto\">FUE. Un objeto o una criatura pesa diez veces más. Si es una criatura y falla, su velocidad baja a la mitad y no salta ni vuela. Repite la salvación al final de cada turno.\u003c/p>\n      \u003ctable class=\"ecos-verbe-ficha\">\n        \u003ctr>\u003cth>Rama\u003c/th>\u003ctd>Sello\u003c/td>\u003cth>Grado\u003c/th>\u003ctd>1\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Tiempo\u003c/th>\u003ctd>Acción\u003c/td>\u003cth>Alcance\u003c/th>\u003ctd>toque\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Área\u003c/th>\u003ctd>—\u003c/td>\u003cth>Duración\u003c/th>\u003ctd>1 min\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Componentes\u003c/th>\u003ctd>gestos\u003c/td>\u003cth>Tirada\u003c/th>\u003ctd>Salvación de FUE\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Daño o curación\u003c/th>\u003ctd>—\u003c/td>\u003cth>Deja\u003c/th>\u003ctd>—\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Usa\u003c/th>\u003ctd>usa tu característica de Verbe\u003c/td>\u003cth>Sube\u003c/th>\u003ctd>—\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Verbe por uso\u003c/th>\u003ctd>grado 1: 2 Verbe\u003c/td>\u003cth>Para aprender\u003c/th>\u003ctd>1 Trazo\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Pide\u003c/th>\u003ctd>nivel 1\u003c/td>\u003cth>Puedes\u003c/th>\u003ctd>sí\u003c/td>\u003c/tr>\n      \u003c/table>\u003cp class=\"ecos-nota\">CD con tu Verbe: 13.\u003c/p>\n      \n      \n      \u003cdiv class=\"ecos-verbe-mejora\">\u003cb>Se mejora con\u003c/b>\u003cul>\u003cli>los dones de rango de Sello\u003c/li>\u003cli>Cultivo: Pulida, Dominada y Propia\u003c/li>\u003cli>la dote Sello firme\u003c/li>\u003cli>la escuela La Casa del Nudo\u003c/li>\u003c/ul>\u003c/div>\u003c/div>"},"sello-ruptura":{"title":"Sello de ruptura","html":"\u003cdiv class=\"ecos-dialogo\">\u003cp class=\"texto\">DES, mitad: 2d8 fuerza. Preparas un sello de papel que estalla cuando quieres (AA, a 36 m) o cuando alguien lo toca o lo abre. Pide un sello de papel. Sube: +1d8.\u003c/p>\n      \u003ctable class=\"ecos-verbe-ficha\">\n        \u003ctr>\u003cth>Rama\u003c/th>\u003ctd>Sello\u003c/td>\u003cth>Grado\u003c/th>\u003ctd>1\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Tiempo\u003c/th>\u003ctd>1 minuto\u003c/td>\u003cth>Alcance\u003c/th>\u003ctd>toque\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Área\u003c/th>\u003ctd>esfera 3 m\u003c/td>\u003cth>Duración\u003c/th>\u003ctd>hasta que estalle\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Componentes\u003c/th>\u003ctd>gestos\u003c/td>\u003cth>Tirada\u003c/th>\u003ctd>Salvación de DES, mitad si la supera\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Daño o curación\u003c/th>\u003ctd>2d8 fuerza\u003c/td>\u003cth>Deja\u003c/th>\u003ctd>—\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Usa\u003c/th>\u003ctd>usa tu característica de Verbe\u003c/td>\u003cth>Sube\u003c/th>\u003ctd>+1d8 por cada grado de más\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Verbe por uso\u003c/th>\u003ctd>grado 1: 2 Verbe\u003c/td>\u003cth>Para aprender\u003c/th>\u003ctd>1 Trazo\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Pide\u003c/th>\u003ctd>nivel 1\u003c/td>\u003cth>Puedes\u003c/th>\u003ctd>sí\u003c/td>\u003c/tr>\n      \u003c/table>\u003cp class=\"ecos-nota\">CD con tu Verbe: 13.\u003c/p>\n      \n      \n      \u003cdiv class=\"ecos-verbe-mejora\">\u003cb>Se mejora con\u003c/b>\u003cul>\u003cli>usarla a más grado (+1d8 por grado)\u003c/li>\u003cli>rango en Sello (Experto +1 dado, Maestro +2, Legendario +3, Mítico +4)\u003c/li>\u003cli>los dones de rango de Sello\u003c/li>\u003cli>Cultivo: Pulida, Dominada y Propia\u003c/li>\u003cli>la dote Área ancha\u003c/li>\u003cli>la dote Sello firme\u003c/li>\u003cli>la escuela La Casa del Nudo\u003c/li>\u003c/ul>\u003c/div>\u003c/div>"},"sello-alarma":{"title":"Sello que avisa","html":"\u003cdiv class=\"ecos-dialogo\">\u003cp class=\"texto\">Cuando entra al área una criatura que no nombraste, te despierta o te llega como un pinchazo, a hasta 1,5 km.\u003c/p>\n      \u003ctable class=\"ecos-verbe-ficha\">\n        \u003ctr>\u003cth>Rama\u003c/th>\u003ctd>Sello\u003c/td>\u003cth>Grado\u003c/th>\u003ctd>1\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Tiempo\u003c/th>\u003ctd>1 minuto\u003c/td>\u003cth>Alcance\u003c/th>\u003ctd>9 m\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Área\u003c/th>\u003ctd>cubo 6 m\u003c/td>\u003cth>Duración\u003c/th>\u003ctd>8 h\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Componentes\u003c/th>\u003ctd>gestos\u003c/td>\u003cth>Tirada\u003c/th>\u003ctd>Ninguna\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Daño o curación\u003c/th>\u003ctd>—\u003c/td>\u003cth>Deja\u003c/th>\u003ctd>—\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Usa\u003c/th>\u003ctd>usa tu característica de Verbe\u003c/td>\u003cth>Sube\u003c/th>\u003ctd>—\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Verbe por uso\u003c/th>\u003ctd>grado 1: 2 Verbe\u003c/td>\u003cth>Para aprender\u003c/th>\u003ctd>1 Trazo\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Pide\u003c/th>\u003ctd>nivel 1\u003c/td>\u003cth>Puedes\u003c/th>\u003ctd>sí\u003c/td>\u003c/tr>\n      \u003c/table>\n      \n      \n      \u003cdiv class=\"ecos-verbe-mejora\">\u003cb>Se mejora con\u003c/b>\u003cul>\u003cli>los dones de rango de Sello\u003c/li>\u003cli>Cultivo: Pulida, Dominada y Propia\u003c/li>\u003cli>la dote Alcance largo\u003c/li>\u003cli>la dote Área ancha\u003c/li>\u003cli>la dote Sello firme\u003c/li>\u003cli>la escuela La Casa del Nudo\u003c/li>\u003c/ul>\u003c/div>\u003c/div>"},"hilo-vuelve":{"title":"Arma que vuelve","html":"\u003cdiv class=\"ecos-dialogo\">\u003cp class=\"texto\">Haces un ataque con un arma arrojadiza. Si impacta, suma 1d6 de fuerza (2d6 en el nivel 5, 3d6 en el 11 y 4d6 en el 17), y el arma vuelve a tu mano.\u003c/p>\n      \u003ctable class=\"ecos-verbe-ficha\">\n        \u003ctr>\u003cth>Rama\u003c/th>\u003ctd>Hilo\u003c/td>\u003cth>Grado\u003c/th>\u003ctd>0\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Tiempo\u003c/th>\u003ctd>Acción\u003c/td>\u003cth>Alcance\u003c/th>\u003ctd>sobre ti\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Área\u003c/th>\u003ctd>—\u003c/td>\u003cth>Duración\u003c/th>\u003ctd>instantánea\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Componentes\u003c/th>\u003ctd>sin gestos ni voz\u003c/td>\u003cth>Tirada\u003c/th>\u003ctd>Ninguna\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Daño o curación\u003c/th>\u003ctd>—\u003c/td>\u003cth>Deja\u003c/th>\u003ctd>—\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Usa\u003c/th>\u003ctd>ataca con Fuerza o Destreza, como un arma\u003c/td>\u003cth>Sube\u003c/th>\u003ctd>—\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Verbe por uso\u003c/th>\u003ctd>0 Verbe (pide tener al menos 1)\u003c/td>\u003cth>Para aprender\u003c/th>\u003ctd>1 Trazo\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Pide\u003c/th>\u003ctd>—\u003c/td>\u003cth>Puedes\u003c/th>\u003ctd>sí\u003c/td>\u003c/tr>\n      \u003c/table>\n      \n      \n      \u003cdiv class=\"ecos-verbe-mejora\">\u003cb>Se mejora con\u003c/b>\u003cul>\u003cli>los dones de rango de Hilo\u003c/li>\u003cli>Cultivo: Pulida, Dominada y Propia\u003c/li>\u003cli>la escuela Los Titiriteros de la Rueda\u003c/li>\u003c/ul>\u003c/div>\u003c/div>"},"hilo-dardo":{"title":"Dardo de hilo","html":"\u003cdiv class=\"ecos-dialogo\">\u003cp class=\"texto\">Ataque: 1d8 perforante. Un dardo atado a un hilo de Verbe que vuelve a tu mano. Sube un dado en los niveles 5, 11 y 17.\u003c/p>\n      \u003ctable class=\"ecos-verbe-ficha\">\n        \u003ctr>\u003cth>Rama\u003c/th>\u003ctd>Hilo\u003c/td>\u003cth>Grado\u003c/th>\u003ctd>0\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Tiempo\u003c/th>\u003ctd>Acción\u003c/td>\u003cth>Alcance\u003c/th>\u003ctd>18 m\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Área\u003c/th>\u003ctd>—\u003c/td>\u003cth>Duración\u003c/th>\u003ctd>instantánea\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Componentes\u003c/th>\u003ctd>gestos\u003c/td>\u003cth>Tirada\u003c/th>\u003ctd>Ataque\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Daño o curación\u003c/th>\u003ctd>1d8 perforante\u003c/td>\u003cth>Deja\u003c/th>\u003ctd>—\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Usa\u003c/th>\u003ctd>ataca con Fuerza o Destreza, como un arma\u003c/td>\u003cth>Sube\u003c/th>\u003ctd>más dados en los niveles 5, 11 y 17\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Verbe por uso\u003c/th>\u003ctd>0 Verbe (pide tener al menos 1)\u003c/td>\u003cth>Para aprender\u003c/th>\u003ctd>1 Trazo\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Pide\u003c/th>\u003ctd>—\u003c/td>\u003cth>Puedes\u003c/th>\u003ctd>sí\u003c/td>\u003c/tr>\n      \u003c/table>\n      \n      \n      \u003cdiv class=\"ecos-verbe-mejora\">\u003cb>Se mejora con\u003c/b>\u003cul>\u003cli>tu nivel (más dados en los niveles 5, 11 y 17)\u003c/li>\u003cli>rango en Hilo (Experto +1 dado, Maestro +2, Legendario +3, Mítico +4)\u003c/li>\u003cli>los dones de rango de Hilo\u003c/li>\u003cli>infundirla con tu elemento (Cultivo)\u003c/li>\u003cli>Cultivo: Pulida, Dominada y Propia\u003c/li>\u003cli>la dote Alcance largo\u003c/li>\u003cli>la dote Trucos afilados\u003c/li>\u003cli>la dote Hilo largo\u003c/li>\u003cli>la escuela Los Titiriteros de la Rueda\u003c/li>\u003c/ul>\u003c/div>\u003c/div>"},"hilo-hilo":{"title":"Hilo de Verbe","html":"\u003cdiv class=\"ecos-dialogo\">\u003cp class=\"texto\">Un hilo que casi no se ve: atraes un objeto suelto de hasta 5 kg, tensas una trampa o te cuelgas de algo firme.\u003c/p>\n      \u003ctable class=\"ecos-verbe-ficha\">\n        \u003ctr>\u003cth>Rama\u003c/th>\u003ctd>Hilo\u003c/td>\u003cth>Grado\u003c/th>\u003ctd>0\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Tiempo\u003c/th>\u003ctd>Acción adicional\u003c/td>\u003cth>Alcance\u003c/th>\u003ctd>9 m\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Área\u003c/th>\u003ctd>—\u003c/td>\u003cth>Duración\u003c/th>\u003ctd>1 min\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Componentes\u003c/th>\u003ctd>gestos\u003c/td>\u003cth>Tirada\u003c/th>\u003ctd>Ninguna\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Daño o curación\u003c/th>\u003ctd>—\u003c/td>\u003cth>Deja\u003c/th>\u003ctd>—\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Usa\u003c/th>\u003ctd>ataca con Fuerza o Destreza, como un arma\u003c/td>\u003cth>Sube\u003c/th>\u003ctd>—\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Verbe por uso\u003c/th>\u003ctd>0 Verbe (pide tener al menos 1)\u003c/td>\u003cth>Para aprender\u003c/th>\u003ctd>1 Trazo\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Pide\u003c/th>\u003ctd>—\u003c/td>\u003cth>Puedes\u003c/th>\u003ctd>sí\u003c/td>\u003c/tr>\n      \u003c/table>\n      \n      \n      \u003cdiv class=\"ecos-verbe-mejora\">\u003cb>Se mejora con\u003c/b>\u003cul>\u003cli>los dones de rango de Hilo\u003c/li>\u003cli>Cultivo: Pulida, Dominada y Propia\u003c/li>\u003cli>la dote Alcance largo\u003c/li>\u003cli>la dote Hilo largo\u003c/li>\u003cli>la escuela Los Titiriteros de la Rueda\u003c/li>\u003c/ul>\u003c/div>\u003c/div>"},"hilo-ata":{"title":"Hilo que ata","html":"\u003cdiv class=\"ecos-dialogo\">\u003cp class=\"texto\">Tu próximo ataque con arma que impacte ata al blanco: FUE o queda Apresado y recibe 1d6 perforante al inicio de cada turno. Repite la salvación al final de cada turno. Sube: +1d6.\u003c/p>\n      \u003ctable class=\"ecos-verbe-ficha\">\n        \u003ctr>\u003cth>Rama\u003c/th>\u003ctd>Hilo\u003c/td>\u003cth>Grado\u003c/th>\u003ctd>1\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Tiempo\u003c/th>\u003ctd>Acción adicional\u003c/td>\u003cth>Alcance\u003c/th>\u003ctd>sobre ti\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Área\u003c/th>\u003ctd>—\u003c/td>\u003cth>Duración\u003c/th>\u003ctd>Concentración, 1 min\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Componentes\u003c/th>\u003ctd>gestos\u003c/td>\u003cth>Tirada\u003c/th>\u003ctd>Ninguna\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Daño o curación\u003c/th>\u003ctd>—\u003c/td>\u003cth>Deja\u003c/th>\u003ctd>—\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Usa\u003c/th>\u003ctd>ataca con Fuerza o Destreza, como un arma\u003c/td>\u003cth>Sube\u003c/th>\u003ctd>+1d6 por cada grado de más\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Verbe por uso\u003c/th>\u003ctd>grado 1: 2 Verbe\u003c/td>\u003cth>Para aprender\u003c/th>\u003ctd>1 Trazo\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Pide\u003c/th>\u003ctd>nivel 1\u003c/td>\u003cth>Puedes\u003c/th>\u003ctd>sí\u003c/td>\u003c/tr>\n      \u003c/table>\n      \u003cp class=\"ecos-verbe-fuerte\">\u003cb>Contra alguien más fuerte:\u003c/b> Contra alguien más fuerte que tú (su grado es la mitad de su nivel o VD) cuesta 2 Verbe más por cada grado que pase de tu grado máximo. El módulo lo cobra solo si lo tienes como objetivo.\u003c/p>\n      \n      \u003cdiv class=\"ecos-verbe-mejora\">\u003cb>Se mejora con\u003c/b>\u003cul>\u003cli>usarla a más grado (+1d6 por grado)\u003c/li>\u003cli>los dones de rango de Hilo\u003c/li>\u003cli>Cultivo: Pulida, Dominada y Propia\u003c/li>\u003cli>la escuela Los Titiriteros de la Rueda\u003c/li>\u003c/ul>\u003c/div>\u003c/div>"},"hilo-marioneta":{"title":"Hilos a la marioneta","html":"\u003cdiv class=\"ecos-dialogo\">\u003cp class=\"texto\">Mueves una marioneta tuya (ver Equipo): actúa en tu turno con la ficha de marioneta a este grado. Si te alejas más de 9 m, cae. Sube: la ficha sube con el grado.\u003c/p>\n      \u003ctable class=\"ecos-verbe-ficha\">\n        \u003ctr>\u003cth>Rama\u003c/th>\u003ctd>Hilo\u003c/td>\u003cth>Grado\u003c/th>\u003ctd>1\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Tiempo\u003c/th>\u003ctd>Acción\u003c/td> n      \u003cdiv class=\"ecos-verbe-mejora\">\u003cb>Se mejora con\u003c/b>\u003cul>\u003cli>los dones de rango de Quietud\u003c/li>\u003cli>Cultivo: Pulida, Dominada y Propia\u003c/li>\u003cli>la escuela Los del Árbol Quieto\u003c/li>\u003c/ul>\u003c/div>\u003c/div>"},"quietud-golpe":{"title":"Golpe del mundo","html":"\u003cdiv class=\"ecos-dialogo\">\u003cp class=\"texto\">Tu próximo golpe cuerpo a cuerpo que impacte suma 2d6 de fuerza, y para ese golpe tu alcance es 1,5 m mayor: el mundo golpea contigo. Sube: +1d6.\u003c/p>\n      \u003ctable class=\"ecos-verbe-ficha\">\n        \u003ctr>\u003cth>Rama\u003c/th>\u003ctd>Quietud\u003c/td>\u003cth>Grado\u003c/th>\u003ctd>1\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Tiempo\u003c/th>\u003ctd>Acción adicional\u003c/td>\u003cth>Alcance\u003c/th>\u003ctd>sobre ti\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Área\u003c/th>\u003ctd>—\u003c/td>\u003cth>Duración\u003c/th>\u003ctd>1 min\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Componentes\u003c/th>\u003ctd>sin gestos ni voz\u003c/td>\u003cth>Tirada\u003c/th>\u003ctd>Ninguna\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Daño o curación\u003c/th>\u003ctd>—\u003c/td>\u003cth>Deja\u003c/th>\u003ctd>—\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Usa\u003c/th>\u003ctd>usa Sabiduría\u003c/td>\u003cth>Sube\u003c/th>\u003ctd>+1d6 por cada grado de más\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Verbe por uso\u003c/th>\u003ctd>grado 1: 2 Verbe\u003c/td>\u003cth>Para aprender\u003c/th>\u003ctd>1 Trazo\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Pide\u003c/th>\u003ctd>nivel 1\u003c/td>\u003cth>Puedes\u003c/th>\u003ctd>sí\u003c/td>\u003c/tr>\n      \u003c/table>\n      \n      \n      \u003cdiv class=\"ecos-verbe-mejora\">\u003cb>Se mejora con\u003c/b>\u003cul>\u003cli>usarla a más grado (+1d6 por grado)\u003c/li>\u003cli>los dones de rango de Quietud\u003c/li>\u003cli>Cultivo: Pulida, Dominada y Propia\u003c/li>\u003cli>la escuela Los del Árbol Quieto\u003c/li>\u003c/ul>\u003c/div>\u003c/div>"},"quietud-sin-peso":{"title":"Paso sin peso","html":"\u003cdiv class=\"ecos-dialogo\">\u003cp class=\"texto\">Caminas sobre agua, nieve y ramas finas sin hundirte ni dejar huella.\u003c/p>\n      \u003ctable class=\"ecos-verbe-ficha\">\n        \u003ctr>\u003cth>Rama\u003c/th>\u003ctd>Quietud\u003c/td>\u003cth>Grado\u003c/th>\u003ctd>1\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Tiempo\u003c/th>\u003ctd>Acción adicional\u003c/td>\u003cth>Alcance\u003c/th>\u003ctd>sobre ti\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Área\u003c/th>\u003ctd>—\u003c/td>\u003cth>Duración\u003c/th>\u003ctd>Concentración, 10 min\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Componentes\u003c/th>\u003ctd>sin gestos ni voz\u003c/td>\u003cth>Tirada\u003c/th>\u003ctd>Ninguna\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Daño o curación\u003c/th>\u003ctd>—\u003c/td>\u003cth>Deja\u003c/th>\u003ctd>—\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Usa\u003c/th>\u003ctd>usa Sabiduría\u003c/td>\u003cth>Sube\u003c/th>\u003ctd>—\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Verbe por uso\u003c/th>\u003ctd>grado 1: 2 Verbe\u003c/td>\u003cth>Para aprender\u003c/th>\u003ctd>1 Trazo\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Pide\u003c/th>\u003ctd>nivel 1\u003c/td>\u003cth>Puedes\u003c/th>\u003ctd>sí\u003c/td>\u003c/tr>\n      \u003c/table>\n      \n      \n      \u003cdiv class=\"ecos-verbe-mejora\">\u003cb>Se mejora con\u003c/b>\u003cul>\u003cli>los dones de rango de Quietud\u003c/li>\u003cli>Cultivo: Pulida, Dominada y Propia\u003c/li>\u003cli>la escuela Los del Árbol Quieto\u003c/li>\u003c/ul>\u003c/div>\u003c/div>"},"quietud-raiz":{"title":"Raíz en el suelo","html":"\u003cdiv class=\"ecos-dialogo\">\u003cp class=\"texto\">Nada te mueve: no caes Derribado, no te empujan ni te arrastran, y tienes ventaja en las salvaciones de FUE.\u003c/p>\n      \u003ctable class=\"ecos-verbe-ficha\">\n        \u003ctr>\u003cth>Rama\u003c/th>\u003ctd>Quietud\u003c/td>\u003cth>Grado\u003c/th>\u003ctd>1\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Tiempo\u003c/th>\u003ctd>Acción adicional\u003c/td>\u003cth>Alcance\u003c/th>\u003ctd>sobre ti\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Área\u003c/th>\u003ctd>—\u003c/td>\u003cth>Duración\u003c/th>\u003ctd>Concentración, 1 min\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Componentes\u003c/th>\u003ctd>sin gestos ni voz\u003c/td>\u003cth>Tirada\u003c/th>\u003ctd>Ninguna\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Daño o curación\u003c/th>\u003ctd>—\u003c/td>\u003cth>Deja\u003c/th>\u003ctd>—\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Usa\u003c/th>\u003ctd>usa Sabiduría\u003c/td>\u003cth>Sube\u003c/th>\u003ctd>—\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Verbe por uso\u003c/th>\u003ctd>grado 1: 2 Verbe\u003c/td>\u003cth>Para aprender\u003c/th>\u003ctd>1 Trazo\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Pide\u003c/th>\u003ctd>nivel 1\u003c/td>\u003cth>Puedes\u003c/th>\u003ctd>sí\u003c/td>\u003c/tr>\n      \u003c/table>\n      \n      \n      \u003cdiv class=\"ecos-verbe-mejora\">\u003cb>Se mejora con\u003c/b>\u003cul>\u003cli>los dones de rango de Quietud\u003c/li>\u003cli>Cultivo: Pulida, Dominada y Propia\u003c/li>\u003cli>la escuela Los del Árbol Quieto\u003c/li>\u003c/ul>\u003c/div>\u003c/div>"},"rastro-firma":{"title":"Firma","html":"\u003cdiv class=\"ecos-dialogo\">\u003cp class=\"texto\">Grabas la firma del Verbe de una criatura que ves. La reconoces después aunque cambie de cara.\u003c/p>\n      \u003ctable class=\"ecos-verbe-ficha\">\n        \u003ctr>\u003cth>Rama\u003c/th>\u003ctd>Rastro\u003c/td>\u003cth>Grado\u003c/th>\u003ctd>0\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Tiempo\u003c/th>\u003ctd>Acción\u003c/td>\u003cth>Alcance\u003c/th>\u003ctd>9 m\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Área\u003c/th>\u003ctd>—\u003c/td>\u003cth>Duración\u003c/th>\u003ctd>instantánea\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Componentes\u003c/th>\u003ctd>sin gestos ni voz\u003c/td>\u003cth>Tirada\u003c/th>\u003ctd>Ninguna\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Daño o curación\u003c/th>\u003ctd>—\u003c/td>\u003cth>Deja\u003c/th>\u003ctd>—\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Usa\u003c/th>\u003ctd>usa Sabiduría\u003c/td>\u003cth>Sube\u003c/th>\u003ctd>—\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Verbe por uso\u003c/th>\u003ctd>0 Verbe (pide tener al menos 1)\u003c/td>\u003cth>Para aprender\u003c/th>\u003ctd>1 Trazo\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Pide\u003c/th>\u003ctd>—\u003c/td>\u003cth>Puedes\u003c/th>\u003ctd>sí\u003c/td>\u003c/tr>\n      \u003c/table>\n      \n      \n      \u003cdiv class=\"ecos-verbe-mejora\">\u003cb>Se mejora con\u003c/b>\u003cul>\u003cli>los dones de rango de Rastro\u003c/li>\u003cli>Cultivo: Pulida, Dominada y Propia\u003c/li>\u003cli>la dote Alcance largo\u003c/li>\u003cli>la escuela Los Lectores de Huella\u003c/li>\u003c/ul>\u003c/div>\u003c/div>"},"rastro-leer":{"title":"Leer la técnica","html":"\u003cdiv class=\"ecos-dialogo\">\u003cp class=\"texto\">Cuando alguien usa una técnica que ves, sabes su nombre, su grado y su naturaleza, y tienes ventaja si chocas con ella este turno.\u003c/p>\n      \u003ctable class=\"ecos-verbe-ficha\">\n        \u003ctr>\u003cth>Rama\u003c/th>\u003ctd>Rastro\u003c/td>\u003cth>Grado\u003c/th>\u003ctd>0\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Tiempo\u003c/th>\u003ctd>Reacción\u003c/td>\u003cth>Alcance\u003c/th>\u003ctd>18 m\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Área\u003c/th>\u003ctd>—\u003c/td>\u003cth>Duración\u003c/th>\u003ctd>instantánea\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Componentes\u003c/th>\u003ctd>sin gestos ni voz\u003c/td>\u003cth>Tirada\u003c/th>\u003ctd>Ninguna\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Daño o curación\u003c/th>\u003ctd>—\u003c/td>\u003cth>Deja\u003c/th>\u003ctd>—\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Usa\u003c/th>\u003ctd>usa Sabiduría\u003c/td>\u003cth>Sube\u003c/th>\u003ctd>—\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Verbe por uso\u003c/th>\u003ctd>0 Verbe (pide tener al menos 1)\u003c/td>\u003cth>Para aprender\u003c/th>\u003ctd>1 Trazo\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Pide\u003c/th>\u003ctd>—\u003c/td>\u003cth>Puedes\u003c/th>\u003ctd>sí\u003c/td>\u003c/tr>\n      \u003c/table>\n      \n      \n      \u003cdiv class=\"ecos-verbe-mejora\">\u003cb>Se mejora con\u003c/b>\u003cul>\u003cli>los dones de rango de Rastro\u003c/li>\u003cli>Cultivo: Pulida, Dominada y Propia\u003c/li>\u003cli>la dote Alcance largo\u003c/li>\u003cli>la escuela Los Lectores de Huella\u003c/li>\u003c/ul>\u003c/div>\u003c/div>"},"rastro-pulso":{"title":"Oír el pulso","html":"\u003cdiv class=\"ecos-dialogo\">\u003cp class=\"texto\">Ventaja en Perspicacia contra una criatura que ves: oyes cuando se le acelera el corazón.\u003c/p>\n      \u003ctable class=\"ecos-verbe-ficha\">\n        \u003ctr>\u003cth>Rama\u003c/th>\u003ctd>Rastro\u003c/td>\u003cth>Grado\u003c/th>\u003ctd>0\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Tiempo\u003c/th>\u003ctd>Acción adicional\u003c/td>\u003cth>Alcance\u003c/th>\u003ctd>3 m\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Área\u003c/th>\u003ctd>—\u003c/td>\u003cth>Duración\u003c/th>\u003ctd>1 min\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Componentes\u003c/th>\u003ctd>sin gestos ni voz\u003c/td>\u003cth>Tirada\u003c/th>\u003ctd>Ninguna\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Daño o curación\u003c/th>\u003ctd>—\u003c/td>\u003cth>Deja\u003c/th>\u003ctd>—\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Usa\u003c/th>\u003ctd>usa Sabiduría\u003c/td>\u003cth>Sube\u003c/th>\u003ctd>—\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Verbe por uso\u003c/th>\u003ctd>0 Verbe (pide tener al menos 1)\u003c/td>\u003cth>Para aprender\u003c/th>\u003ctd>1 Trazo\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Pide\u003c/th>\u003ctd>—\u003c/td>\u003cth>Puedes\u003c/th>\u003ctd>sí\u003c/td>\u003c/tr>\n      \u003c/table>\n      \n      \n      \u003cdiv class=\"ecos-verbe-mejora\">\u003cb>Se mejora con\u003c/b>\u003cul>\u003cli>los dones de rango de Rastro\u003c/li>\u003cli>Cultivo: Pulida, Dominada y Propia\u003c/li>\u003cli>la dote Alcance largo\u003c/li>\u003cli>la escuela Los Lectores de Huella\u003c/li>\u003c/ul>\u003c/div>\u003c/div>"},"rastro-cerca":{"title":"Sentir cerca","html":"\u003cdiv class=\"ecos-dialogo\">\u003cp class=\"texto\">Sabes quién usa Verbe dentro del área, y hacia dónde está, aunque no lo veas.\u003c/p>\n      \u003ctable class=\"ecos-verbe-ficha\">\n        \u003ctr>\u003cth>Rama\u003c/th>\u003ctd>Rastro\u003c/td>\u003cth>Grado\u003c/th>\u003ctd>0\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Tiempo\u003c/th>\u003ctd>Acción adicional\u003c/td>\u003cth>Alcance\u003c/th>\u003ctd>sobre ti\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Área\u003c/th>\u003ctd>esfera 9 m\u003c/td>\u003cth>Duración\u003c/th>\u003ctd>Concentración, 1 min\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Componentes\u003c/th>\u003ctd>sin gestos ni voz\u003c/td>\u003cth>Tirada\u003c/th>\u003ctd>Ninguna\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Daño o curación\u003c/th>\u003ctd>—\u003c/td>\u003cth>Deja\u003c/th>\u003ctd>—\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Usa\u003c/th>\u003ctd>usa Sabiduría\u003c/td>\u003cth>Sube\u003c/th>\u003ctd>—\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Verbe por uso\u003c/th>\u003ctd>0 Verbe (pide tener al menos 1)\u003c/td>\u003cth>Para aprender\u003c/th>\u003ctd>1 Trazo\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Pide\u003c/th>\u003ctd>—\u003c/td>\u003cth>Puedes\u003c/th>\u003ctd>sí\u003c/td>\u003c/tr>\n      \u003c/table>\n      \n      \u003cdiv class=\"ecos-verbe-crece\">\u003cb>Crece\u003c/b>\u003cul>\u003cli>Escalera: Sentir cerca (0) → Sentir lejos (2) → Sentir el valle (3) → Red de sentidos (6) → El valle entero (7) → Ver todo el Verbe (10) → El hilo de cada vida (11).\u003c/li>\u003c/ul>\u003c/div>\n      \u003cdiv class=\"ecos-verbe-mejora\">\u003cb>Se mejora con\u003c/b>\u003cul>\u003cli>los dones de rango de Rastro\u003c/li>\u003cli>Cultivo: Pulida, Dominada y Propia\u003c/li>\u003cli>la dote Área ancha\u003c/li>\u003cli>la escuela Los Lectores de Huella\u003c/li>\u003c/ul>\u003c/div>\u003c/div>"},"rastro-instinto":{"title":"Instinto","html":"\u003cdiv class=\"ecos-dialogo\">\u003cp class=\"texto\">No te sorprenden quienes llevan Verbe, y sumas tu competencia a la iniciativa.\u003c/p>\n      \u003ctable class=\"ecos-verbe-ficha\">\n        \u003ctr>\u003cth>Rama\u003c/th>\u003ctd>Rastro\u003c/td>\u003cth>Grado\u003c/th>\u003ctd>1\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Tiempo\u003c/th>\u003ctd>1 minuto\u003c/td>\u003cth>Alcance\u003c/th>\u003ctd>sobre ti\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Área\u003c/th>\u003ctd>—\u003c/td>\u003cth>Duración\u003c/th>\u003ctd>8 h\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Componentes\u003c/th>\u003ctd>sin gestos ni voz\u003c/td>\u003cth>Tirada\u003c/th>\u003ctd>Ninguna\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Daño o curación\u003c/th>\u003ctd>—\u003c/td>\u003cth>Deja\u003c/th>\u003ctd>—\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Usa\u003c/th>\u003ctd>usa Sabiduría\u003c/td>\u003cth>Sube\u003c/th>\u003ctd>—\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Verbe por uso\u003c/th>\u003ctd>grado 1: 2 Verbe\u003c/td>\u003cth>Para aprender\u003c/th>\u003ctd>1 Trazo\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Pide\u003c/th>\u003ctd>nivel 1\u003c/td>\u003cth>Puedes\u003c/th>\u003ctd>sí\u003c/td>\u003c/tr>\n      \u003c/table>\n      \n      \n      \u003cdiv class=\"ecos-verbe-mejora\">\u003cb>Se mejora con\u003c/b>\u003cul>\u003cli>los dones de rango de Rastro\u003c/li>\u003cli>Cultivo: Pulida, Dominada y Propia\u003c/li>\u003cli>la escuela Los Lectores de Huella\u003c/li>\u003c/ul>\u003c/div>\u003c/div>"},"rastro-marcar":{"title":"Marcar la firma","html":"\u003cdiv class=\"ecos-dialogo\">\u003cp class=\"texto\">Marcas
