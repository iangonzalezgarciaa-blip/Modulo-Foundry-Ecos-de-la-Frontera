dden=\"true\">\u003c/i> Ayuda rápida\u003c/button>\u003c/nav>\u003csection class=\"ecos-verbe-cuerpo\" aria-label=\"Inicio\">\u003col class=\"ev-progreso\" aria-label=\"Primeros pasos\">\u003cli class=\"hecho\" >\u003cspan aria-hidden=\"true\">✓\u003c/span>Elige elemento\u003c/li>\u003cli class=\"hecho\" >\u003cspan aria-hidden=\"true\">✓\u003c/span>Elige especialidad\u003c/li>\u003cli class=\"hecho\" >\u003cspan aria-hidden=\"true\">✓\u003c/span>Aprende una técnica\u003c/li>\u003cli class=\"actual\" aria-current=\"step\">\u003cspan aria-hidden=\"true\">4\u003c/span>Listo para jugar\u003c/li>\u003c/ol>\u003csection class=\"ev-bienvenida\">\u003cspan class=\"ev-kicker\">TU REPERTORIO ESTÁ PREPARADO\u003c/span>\u003ch2>Ya puedes entrar en acción\u003c/h2>\u003cp>Conoces \u003cb>3 técnicas\u003c/b>. Abre tu repertorio, elige qué hacer y usa el botón de la técnica.\u003c/p>\u003cdiv class=\"ev-acciones\">\u003cbutton type=\"button\" class=\"ev-principal\" data-action=\"pestana\" data-p=\"jugar\">\u003ci class=\"fa-solid fa-bolt\" aria-hidden=\"true\">\u003c/i> Usar mis técnicas\u003c/button>\u003cbutton type=\"button\" data-action=\"pestana\" data-p=\"tienda\">Aprender algo nuevo\u003c/button>\u003c/div>\n      \u003cdiv class=\"ev-mini-pasos\">\u003cspan>\u003cb>1\u003c/b> Marca el objetivo, si hace falta\u003c/span>\u003cspan>\u003cb>2\u003c/b> Pulsa «Usar técnica»\u003c/span>\u003cspan>\u003cb>3\u003c/b> Resuelve la ventana de dnd5e\u003c/span>\u003c/div>\u003cp class=\"ev-nota\">El gasto se comprueba al confirmar el uso. La posición, la visibilidad y los efectos narrativos se resuelven con el DM.\u003c/p>\u003c/section>\n      \u003cdiv class=\"ev-estadisticas\">\u003cdiv>\u003csmall>CD de tus técnicas\u003c/small>\u003cb>13\u003c/b>\u003cspan>El rival debe igualar o superar esta dificultad.\u003c/span>\u003c/div>\u003cdiv>\u003csmall>Ataque con Verbe\u003c/small>\u003cb>+5\u003c/b>\u003cspan>La técnica puede usar otra característica.\u003c/span>\u003c/div>\u003cdiv>\u003csmall>Grado máximo por nivel\u003c/small>\u003cb>2\u003c/b>\u003cspan>Cada rama también tiene su propio límite.\u003c/span>\u003c/div>\u003c/div>\n      \u003cdetails class=\"ev-ficha-personal\">\u003csummary>Mi personaje: afinidades, linaje y otros detalles\u003c/summary>\n      \u003ctable class=\"ecos-verbe-datos\">\n        \u003ctr>\u003cth>Característica \u003ci class=\"ecos-verbe-ayuda fa-solid fa-circle-question\" data-tooltip=\"La característica con la que usas el Verbe. Da la CD de tus técnicas (8 + competencia + modificador), su bonificador de ataque y suma a tu reserva.\">\u003c/i>\u003c/th>\u003ctd>Sabiduría · CD de tus técnicas \u003cb>13\u003c/b> · ataque \u003cb>+5\u003c/b>\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Naturaleza\u003c/th>\u003ctd>Fuego\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Otra naturaleza\u003c/th>\u003ctd>Puede que tu Verbe responda a otra naturaleza que no conoces. Se intenta descubrir con «Probar» en Aprender; si responde, aprender la técnica cuesta los Trazos indicados.\u003c/td>\u003c/tr>\n        \n        \u003ctr>\u003cth>Linaje\u003c/th>\u003ctd>Desconocido. Hay cosas de tu sangre que no tienes manera de saber; si las hay, aparecen jugando.\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Rama principal\u003c/th>\u003ctd>Forma\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Grado máximo \u003ci class=\"ecos-verbe-ayuda fa-solid fa-circle-question\" data-tooltip=\"Qué tan fuerte es una técnica, de 0 a 11 (como el nivel de un conjuro, con dos grados más arriba del 9). Tu grado máximo sube con tu nivel: grado 1 en el nivel 1, 2 en el 3, 3 en el 5… 9 en el 17, 10 en el 19 y 11 en el 20. En cada rama, además, llegas solo hasta lo que deja tu rango.\">\u003c/i>\u003c/th>\u003ctd>2 (eres nivel 3) · el grado 3 llega en el nivel 5\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Control del Verbe \u003ci class=\"ecos-verbe-ayuda fa-solid fa-circle-question\" data-tooltip=\"Una habilidad nueva de tu hoja (con Sabiduría). Se tira para ganar un choque entre dos técnicas, romper un Velo, abrir los Cerrojos y no perderse en la Quietud. Se compra en Mejorar → Especialidades.\">\u003c/i>\u003c/th>\u003ctd>Sin competencia (se compra en Ramas)\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Sobreesfuerzo \u003ci class=\"ecos-verbe-ayuda fa-solid fa-circle-question\" data-tooltip=\"Puedes gastar Verbe que no tienes: tu barra baja de 0 hasta la mitad de tu reserva en negativo. Cada técnica que usas en negativo te pide una salvación de CON (CD 10 + su grado); si fallas, ganas 1 Agotamiento. Lo que quede en negativo cuesta el doble de recuperar.\">\u003c/i>\u003c/th>\u003ctd>Puedes gastar Verbe que no tienes hasta llegar a -10.\u003c/td>\u003c/tr>\n        \n        \n      \u003c/table>\u003c/details>\n      \n      \u003cdetails>\u003csummary>Historial\u003c/summary>\u003cul>\u003c/ul>\u003c/details>\u003c/section>","jugar":"\u003cheader class=\"ecos-verbe-cabpanel\">\n      \u003cdiv class=\"ev-identidad\">\u003cspan class=\"ev-kicker\">EL VERBE · NIVEL 3\u003c/span>\u003cstrong>Ari · viajero del valle\u003c/strong>\u003csmall>Forma · Fuego\u003c/small>\u003c/div>\n      \u003cdiv class=\"ecos-verbe-res\">\u003cdiv class=\"ev-recurso-titulo\">\u003cb>\u003ci class=\"fa-solid fa-droplet\" aria-hidden=\"true\">\u003c/i> Verbe \u003cspan>18 / 21\u003c/span>\u003c/b>\u003csmall>ENERGÍA PARA USAR\u003c/small>\u003c/div>\u003cdiv class=\"ecos-verbe-barra grande \" role=\"meter\" aria-label=\"Reserva de Verbe\" aria-valuemin=\"0\" aria-valuemax=\"21\" aria-valuenow=\"18\" aria-valuetext=\"18 de 21 de Verbe\">\u003cdiv style=\"width:85.71428571428571%\">\u003c/div>\u003c/div>\n        \u003csmall>Se gasta al usar técnicas; vuelve al descansar.\u003c/small>\u003c/div>\n      \u003cdiv class=\"ecos-verbe-trazos hay\">\u003cspan class=\"n\">16\u003c/span>\u003cspan class=\"t\">\u003cb>Trazos\u003c/b> para aprender\u003c/span>\u003csmall>Se gastan una vez por compra\u003c/small>\u003c/div>\n    \u003c/header>\u003cnav class=\"ecos-verbe-tabs\" aria-label=\"Panel del Verbe\">\u003cbutton type=\"button\" class=\" \"  data-action=\"pestana\" data-p=\"resumen\">\u003ci class=\"fa-solid fa-house\" aria-hidden=\"true\">\u003c/i> Inicio\u003c/button>\u003cbutton type=\"button\" class=\"activa \" aria-current=\"page\" data-action=\"pestana\" data-p=\"jugar\">\u003ci class=\"fa-solid fa-bolt\" aria-hidden=\"true\">\u003c/i> Mis técnicas\u003c/button>\u003cbutton type=\"button\" class=\" \"  data-action=\"pestana\" data-p=\"tienda\">\u003ci class=\"fa-solid fa-book-open\" aria-hidden=\"true\">\u003c/i> Aprender\u003c/button>\u003cbutton type=\"button\" class=\" \"  data-action=\"pestana\" data-p=\"ramas\">\u003ci class=\"fa-solid fa-seedling\" aria-hidden=\"true\">\u003c/i> Mejorar\u003c/button>\u003cbutton type=\"button\" class=\" \"  data-action=\"pestana\" data-p=\"guia\">\u003ci class=\"fa-solid fa-circle-question\" aria-hidden=\"true\">\u003c/i> Ayuda rápida\u003c/button>\u003c/nav>\u003csection class=\"ecos-verbe-cuerpo\" aria-label=\"Mis técnicas\">\u003cdiv class=\"ev-titulo-pagina\">\u003cdiv>\u003cspan class=\"ev-kicker\">TU REPERTORIO\u003c/span>\u003ch2>¿Qué quieres hacer?\u003c/h2>\u003cp>Usa una técnica desde aquí. Se abrirá la ventana habitual de dnd5e para confirmar el uso.\u003c/p>\u003c/div>\u003cspan class=\"ev-contador\">3 conocidas\u003c/span>\u003c/div>\n      \u003cdiv class=\"ev-instruccion\">\u003ci class=\"fa-solid fa-crosshairs\" aria-hidden=\"true\">\u003c/i>\u003cspan>\u003cb>Si afecta a otro, marca su token antes de usarla.\u003c/b> El alcance y las condiciones de cada técnica siguen contando.\u003c/span>\u003c/div>\n      \u003cdiv class=\"ecos-verbe-filtros\">\u003clabel class=\"ev-busqueda\">\u003cspan>Buscar en mis técnicas\u003c/span>\u003cinput type=\"search\" data-filtro-uso=\"texto\" placeholder=\"Nombre o efecto…\" value=\"\">\u003c/label>\u003clabel>\u003cinput type=\"checkbox\" data-filtro-uso=\"solo\" > Ocultar las bloqueadas por recursos o estado\u003c/label>\u003c/div>\n      \u003cdiv class=\"ev-tarjetas\">\u003carticle class=\"ev-tecnica \">\n    \u003cdiv class=\"ev-tec-top\">\u003cspan class=\"ev-etiqueta\">Grado 1\u003c/span>\u003cspan class=\"ev-etiqueta suave\">Forma\u003c/span>\u003cspan class=\"ev-etiqueta suave\">Fuego\u003c/span>\u003c/div>\n    \u003ch3>Aliento de brasa\u003c/h3>\u003cp class=\"ev-texto-tecnica\">DES, mitad: 3d6 fuego. Prende lo que arde. Sube: +1d6.\u003c/p>\n    \u003cdiv class=\"ev-tec-datos\">\u003cspan>\u003ci class=\"fa-regular fa-clock\" aria-hidden=\"true\">\u003c/i> Acción\u003c/span>\u003cspan>\u003ci class=\"fa-solid fa-crosshairs\" aria-hidden=\"true\">\u003c/i> sobre ti\u003c/span>\u003cspan>cono 4,5 m\u003c/span>\u003c/div>\n    \u003cdiv class=\"ev-costes\">\u003cspan>\u003cb>2\u003c/b> Verbe \u003csmall>por uso base\u003c/small>\u003c/span>\u003c/div>\n    \u003cp class=\"ev-disponibilidad\">\u003ci class=\"fa-solid fa-circle-check\" aria-hidden=\"true\">\u003c/i> Te quedarían 16 de Verbe al usar el grado base.\u003c/p>\u003cp class=\"ev-nota\">Puedes elevar el grado en la ventana de uso; el coste aumentará.\u003c/p>\n    \u003cfooter>\u003cbutton type=\"button\" class=\"ev-principal\" data-action=\"usar\" data-id=\"fuego-aliento\" >Usar técnica\u003c/button>\u003cbutton type=\"button\" data-action=\"ficha\" data-id=\"fuego-aliento\">Ver detalles\u003c/button>\u003c/footer>\n  \u003c/article>\u003carticle class=\"ev-tecnica \">\n    \u003cdiv class=\"ev-tec-top\">\u003cspan class=\"ev-etiqueta\">Grado 1\u003c/span>\u003cspan class=\"ev-etiqueta suave\">Forma\u003c/span>\u003c/div>\n    \u003ch3>Sustitución\u003c/h3>\u003csmall class=\"ev-referencia\">Kawarimi no Jutsu\u003c/small>\u003cp class=\"ev-texto-tecnica\">Cuando un ataque con tirada que ves venir te va a impactar, te cambias por un objeto de tu tamaño o menor a 3 m o menos (un tronco, una capa, una piedra): el ataque falla y el objeto recibe el golpe. Cuesta 2 Verbe, y 2 más por cada grado que el ataque supere tu grado máximo (grado de un ataque: el de su técnica o conjuro; si es un arma o una criatura, la mitad de su nivel o VD). No sirve contra áreas ni salvaciones, ni sin un objeto cerca.\u003c/p>\n    \u003cdiv class=\"ev-tec-datos\">\u003cspan>\u003ci class=\"fa-regular fa-clock\" aria-hidden=\"true\">\u003c/i> Reacción\u003c/span>\u003cspan>\u003ci class=\"fa-solid fa-crosshairs\" aria-hidden=\"true\">\u003c/i> sobre ti\u003c/span>\u003c/div>\n    \u003cdiv class=\"ev-costes\">\u003cspan>\u003cb>2\u003c/b> Verbe \u003csmall>por uso base\u003c/small>\u003c/span>\u003c/div>\n    \u003cp class=\"ev-disponibilidad\">\u003ci class=\"fa-solid fa-circle-check\" aria-hidden=\"true\">\u003c/i> Te quedarían 16 de Verbe al usar el grado base.\u003c/p>\u003cp class=\"ev-nota\">Con midi-qol, se ofrece al recibir un ataque. Sin esa integración, resuélvela con el DM. El coste final depende del ataque.\u003c/p>\n    \u003cfooter>\u003cbutton type=\"button\" class=\"ev-principal\" data-action=\"ficha\" data-id=\"forma-sustitucion\" >Cómo usar esta defensa\u003c/button>\u003cbutton type=\"button\" data-action=\"ficha\" data-id=\"forma-sustitucion\">Ver detalles\u003c/button>\u003c/footer>\n  \u003c/article>\u003carticle class=\"ev-tecnica \">\n    \u003cdiv class=\"ev-tec-top\">\u003cspan class=\"ev-etiqueta\">Grado 1\u003c/span>\u003cspan class=\"ev-etiqueta suave\">Forma\u003c/span>\u003c/div>\n    \u003ch3>Andar por muros\u003c/h3>\u003csmall class=\"ev-referencia\">Kinobori no Waza\u003c/small>\u003cp class=\"ev-texto-tecnica\">Caminas por paredes, techos y agua como por el suelo, con las manos libres. Si pierdes la Concentración en una pared, caes.\u003c/p>\n    \u003cdiv class=\"ev-tec-datos\">\u003cspan>\u003ci class=\"fa-regular fa-clock\" aria-hidden=\"true\">\u003c/i> Acción adicional\u003c/span>\u003cspan>\u003ci class=\"fa-solid fa-crosshairs\" aria-hidden=\"true\">\u003c/i> sobre ti\u003c/span>\u003c/div>\n    \u003cdiv class=\"ev-costes\">\u003cspan>\u003cb>2\u003c/b> Verbe \u003csmall>por uso base\u003c/small>\u003c/span>\u003c/div>\n    \u003cp class=\"ev-disponibilidad\">\u003ci class=\"fa-solid fa-circle-check\" aria-hidden=\"true\">\u003c/i> Te quedarían 16 de Verbe al usar el grado base.\u003c/p>\u003cp class=\"ev-nota\">Puedes elevar el grado en la ventana de uso; el coste aumentará.\u003c/p>\n    \u003cfooter>\u003cbutton type=\"button\" class=\"ev-principal\" data-action=\"usar\" data-id=\"forma-andar\" >Usar técnica\u003c/button>\u003cbutton type=\"button\" data-action=\"ficha\" data-id=\"forma-andar\">Ver detalles\u003c/button>\u003c/footer>\n  \u003c/article>\u003c/div>\u003c/section>","tienda":"\u003cheader class=\"ecos-verbe-cabpanel\">\n      \u003cdiv class=\"ev-identidad\">\u003cspan class=\"ev-kicker\">EL VERBE · NIVEL 3\u003c/span>\u003cstrong>Ari · viajero del valle\u003c/strong>\u003csmall>Forma · Fuego\u003c/small>\u003c/div>\n      \u003cdiv class=\"ecos-verbe-res\">\u003cdiv class=\"ev-recurso-titulo\">\u003cb>\u003ci class=\"fa-solid fa-droplet\" aria-hidden=\"true\">\u003c/i> Verbe \u003cspan>18 / 21\u003c/span>\u003c/b>\u003csmall>ENERGÍA PARA USAR\u003c/small>\u003c/div>\u003cdiv class=\"ecos-verbe-barra grande \" role=\"meter\" aria-label=\"Reserva de Verbe\" aria-valuemin=\"0\" aria-valuemax=\"21\" aria-valuenow=\"18\" aria-valuetext=\"18 de 21 de Verbe\">\u003cdiv style=\"width:85.71428571428571%\">\u003c/div>\u003c/div>\n        \u003csmall>Se gasta al usar técnicas; vuelve al descansar.\u003c/small>\u003c/div>\n      \u003cdiv class=\"ecos-verbe-trazos hay\">\u003cspan class=\"n\">16\u003c/span>\u003cspan class=\"t\">\u003cb>Trazos\u003c/b> para aprender\u003c/span>\u003csmall>Se gastan una vez por compra\u003c/small>\u003c/div>\n    \u003c/header>\u003cnav class=\"ecos-verbe-tabs\" aria-label=\"Panel del Verbe\">\u003cbutton type=\"button\" class=\" \"  data-action=\"pestana\" data-p=\"resumen\">\u003ci class=\"fa-solid fa-house\" aria-hidden=\"true\">\u003c/i> Inicio\u003c/button>\u003cbutton type=\"button\" class=\" \"  data-action=\"pestana\" data-p=\"jugar\">\u003ci class=\"fa-solid fa-bolt\" aria-hidden=\"true\">\u003c/i> Mis técnicas\u003c/button>\u003cbutton type=\"button\" class=\"activa \" aria-current=\"page\" data-action=\"pestana\" data-p=\"tienda\">\u003ci class=\"fa-solid fa-book-open\" aria-hidden=\"true\">\u003c/i> Aprender\u003c/button>\u003cbutton type=\"button\" class=\" \"  data-action=\"pestana\" data-p=\"ramas\">\u003ci class=\"fa-solid fa-seedling\" aria-hidden=\"true\">\u003c/i> Mejorar\u003c/button>\u003cbutton type=\"button\" class=\" \"  data-action=\"pestana\" data-p=\"guia\">\u003ci class=\"fa-solid fa-circle-question\" aria-hidden=\"true\">\u003c/i> Ayuda rápida\u003c/button>\u003c/nav>\u003csection class=\"ecos-verbe-cuerpo\" aria-label=\"Aprender\">\u003cdiv class=\"ecos-verbe-intro\">\u003cp>\u003cb>Aquí aprendes técnicas.\u003c/b> Haz clic en una para ver su ficha completa. Se aprende una vez, pagando Trazos; después, cada vez que la usas desde tu hoja gasta Verbe. \u003ca class=\"ecos-verbe-guia\" data-action=\"guia\" data-s=\"tecnicas-y-grados\" data-tooltip=\"Abre la guía escrita en esa parte\">\u003ci class=\"fa-solid fa-book-open\">\u003c/i> Guía\u003c/a>\u003c/p>\u003cdetails>\u003csummary>Saber más\u003c/summary>\u003cul class=\"ecos-verbe-lista\">\u003cli>\u003cb>G\u003c/b> es el grado: qué tan fuerte es. Puedes aprender hasta tu grado máximo (2) y, en cada rama, hasta lo que deja tu rango en ella (Mejorar → Especialidades).\u003c/li>\n        \u003cli>\u003cb>Verbe\u003c/b> es lo que gasta cada uso; el botón dice cuántos \u003cb>Trazos\u003c/b> cuesta aprenderla.\u003c/li>\n        \u003cli>\u003cb>Probar\u003c/b>: es de una naturaleza que no tienes. Si tu Verbe responde, la aprendes; si no, no pierdes nada.\u003c/li>\n        \u003cli>\u003cb>Pedir al DM\u003c/b>: pide un maestro; el DM la aprueba.\u003c/li>\u003c/ul>\u003c/details>\u003c/div>\n      \u003cdiv class=\"ev-contraste-recursos\">\u003cdiv>\u003cb>Aprender = pagar Trazos una vez\u003c/b>\u003cspan>Lo aprendido pasa a «Mis técnicas».\u003c/span>\u003c/div>\u003cdiv>\u003cb>Usar = gastar Verbe cada vez\u003c/b>\u003cspan>El coste tiene en cuenta tus mejoras y el contexto actual.\u003c/span>\u003c/div>\u003c/div>\n      \u003cdiv class=\"ecos-verbe-filtros\">\u003clabel class=\"ev-busqueda\">\u003cspan>Buscar una técnica\u003c/span>\u003cinput type=\"search\" data-filtro=\"texto\" placeholder=\"Nombre o efecto…\" value=\"\">\u003c/label>\n      \u003clabel>\u003cinput type=\"checkbox\" data-filtro=\"solo\" checked> Solo disponibles y aprendidas\u003c/label>\u003cbutton type=\"button\" data-action=\"limpiarFiltros\">Restablecer\u003c/button>\u003c/div>\n      \u003cdetails class=\"ev-filtros-extra\" >\u003csummary>Filtrar por especialidad, grado o elemento\u003c/summary>\u003cdiv class=\"ecos-verbe-filtros\">\n      \u003clabel>Especialidad \u003cselect data-filtro=\"rama\">\u003coption value=\"\">Todas las ramas\u003c/option>\u003coption value=\"forma\" >Forma\u003c/option>\u003coption value=\"velo\" >Velo\u003c/option>\u003coption value=\"cuerpo\" >Cuerpo\u003c/option>\u003coption value=\"mirada\" >Mirada\u003c/option>\u003coption value=\"sello\" >Sello\u003c/option>\u003coption value=\"pacto\" >Pacto\u003c/option>\u003coption value=\"pulso\" >Pulso\u003c/option>\u003coption value=\"hilo\" >Hilo\u003c/option>\u003coption value=\"quietud\" >Quietud\u003c/option>\u003coption value=\"rastro\" >Rastro\u003c/option>\u003coption value=\"umbral\" >Umbral\u003c/option>\u003coption value=\"vasija\" >Vasija\u003c/option>\u003c/select>\u003c/label>\n      \u003clabel>Potencia \u003cselect data-filtro=\"grado\">\u003coption value=\"\">Todos los grados\u003c/option>\u003coption value=\"0\" >Grado 0\u003c/option>\u003coption value=\"1\" >Grado 1\u003c/option>\u003coption value=\"2\" >Grado 2\u003c/option>\u003coption value=\"3\" >Grado 3\u003c/option>\u003coption value=\"4\" >Grado 4\u003c/option>\u003coption value=\"5\" >Grado 5\u003c/option>\u003coption value=\"6\" >Grado 6\u003c/option>\u003coption value=\"7\" >Grado 7\u003c/option>\u003coption value=\"8\" >Grado 8\u003c/option>\u003coption value=\"9\" >Grado 9\u003c/option>\u003coption value=\"10\" >Grado 10\u003c/option>\u003coption value=\"11\" >Grado 11\u003c/option>\u003c/select>\u003c/label>\n      \u003clabel>Elemento \u003cselect data-filtro=\"nat\">\u003coption value=\"\">Todos los elementos\u003c/option>\u003coption value=\"fuego\" >Fuego\u003c/option>\u003coption value=\"agua\" >Agua\u003c/option>\u003coption value=\"viento\" >Viento\u003c/option>\u003coption value=\"tierra\" >Tierra\u003c/option>\u003coption value=\"rayo\" >Rayo\u003c/option>\u003c/select>\u003c/label>\n      \u003clabel>Agrupar \u003cselect data-filtro=\"agrupar\">\u003coption value=\"rama\" selected>Por especialidad\u003c/option>\u003coption value=\"grado\" >Por grado\u003c/option>\u003c/select>\u003c/label>\u003c/div>\u003c/details>\n      \u003cp class=\"ecos-nota\">Hay 491 técnicas más que todavía no puedes aprender: desmarca la casilla para verlas y saber qué piden.\u003c/p>\n      \u003cdetails class=\"ecos-verbe-grupo\" data-g=\"s-pura\" open>\u003csummary>\u003cb>Forma · Verbe puro\u003c/b> \u003cspan>13 técnicas · puedes aprender 11\u003c/span>\u003c/summary>\n        \u003cdetails class=\"ecos-verbe-tec puede\" data-id=\"forma-brillo\" data-tipo=\"tec\">\u003csummary>\n      \u003cspan class=\"gr\">Grado 0\u003c/span>\u003cspan class=\"nom\">\u003cb>Brillo\u003c/b>\u003csmall>\u003c/small>\u003csmall>Acción · toque\u003c/small>\u003csmall class=\"ev-efecto-breve\">Tu mano o un objeto da luz brillante en 6 m y tenue 6 m más, del color de tu Verbe. La apagas cuando quieras.\u003c/small>\u003c/span>\n      \u003cspan class=\"vb\">\u003cb>0 Verbe\u003c/b>\u003csmall>por uso base\u003c/small>\u003c/span>\u003cspan class=\"acc\">\u003cbutton type=\"button\" data-action=\"aprender\" data-id=\"forma-brillo\">Aprender · 1 Trazo\u003c/button>\u003csmall>Te quedarían 15 Trazos\u003c/small>\u003c/span>\u003c/summary>\u003cdiv class=\"ecos-verbe-ficha-cont\">\u003c/div>\u003c/details>\u003cdetails class=\"ecos-verbe-tec puede\" data-id=\"forma-mano\" data-tipo=\"tec\">\u003csummary>\n      \u003cspan class=\"gr\">Grado 0\u003c/span>\u003cspan class=\"nom\">\u003cb>Mano de Verbe\u003c/b>\u003csmall>\u003c/small>\u003csmall>Acción · 9 m\u003c/small>\u003csmall class=\"ev-efecto-breve\">Una mano de Verbe que levanta, empuja o abre lo que abriría una mano, hasta 5 kg. La mueves 9 m con una AA. No ataca.\u003c/small>\u003c/span>\n      \u003cspan class=\"vb\">\u003cb>0 Verbe\u003c/b>\u003csmall>por uso base\u003c/small>\u003c/span>\u003cspan class=\"acc\">\u003cbutton type=\"button\" data-action=\"aprender\" data-id=\"forma-mano\">Aprender · 1 Trazo\u003c/button>\u003csmall>Te quedarían 15 Trazos\u003c/small>\u003c/span>\u003c/summary>\u003cdiv class=\"ecos-verbe-ficha-cont\">\u003c/div>\u003c/details>\u003cdetails class=\"ecos-verbe-tec puede\" data-id=\"forma-paso-doble\" data-tipo=\"tec\">\u003csummary>\n      \u003cspan class=\"gr\">Grado 0\u003c/span>\u003cspan class=\"nom\">\u003cb>Paso doble\u003c/b>\u003csmall>\u003c/small>\u003csmall>Acción adicional · sobre ti\u003c/small>\u003csmall class=\"ev-efecto-breve\">Dejas una imagen de Verbe donde estabas: el primer ataque de oportunidad contra ti este turno tiene desventaja.\u003c/small>\u003c/span>\n      \u003cspan class=\"vb\">\u003cb>0 Verbe\u003c/b>\u003csmall>por uso base\u003c/small>\u003c/span>\u003cspan class=\"acc\">\u003cbutton type=\"button\" data-action=\"aprender\" data-id=\"forma-paso-doble\">Aprender · 1 Trazo\u003c/button>\u003csmall>Te quedarían 15 Trazos\u003c/small>\u003c/span>\u003c/summary>\u003cdiv class=\"ecos-verbe-ficha-cont\">\u003c/div>\u003c/details>\u003cdetails class=\"ecos-verbe-tec puede\" data-id=\"forma-punta\" data-tipo=\"tec\">\u003csummary>\n      \u003cspan class=\"gr\">Grado 0\u003c/span>\u003cspan class=\"nom\">\u003cb>Punta de Verbe\u003c/b>\u003csmall>\u003c/small>\u003csmall>Acción · 18 m\u003c/small>\u003csmall class=\"ev-efecto-breve\">Ataque: 1d8 fuerza. Un dardo de Verbe sin naturaleza. Sube un dado en los niveles 5, 11 y 17.\u003c/small>\u003c/span>\n      \u003cspan class=\"vb\">\u003cb>0 Verbe\u003c/b>\u003csmall>por uso base\u003c/small>\u003c/span>\u003cspan class=\"acc\">\u003cbutton type=\"button\" data-action=\"aprender\" data-id=\"forma-punta\">Aprender · 1 Trazo\u003c/button>\u003csmall>Te quedarían 15 Trazos\u003c/small>\u003c/span>\u003c/summary>\u003cdiv class=\"ecos-verbe-ficha-cont\">\u003c/div>\u003c/details>\u003cdetails class=\"ecos-verbe-tec sabe\" data-id=\"forma-andar\" data-tipo=\"tec\">\u003csummary>\n      \u003cspan class=\"gr\">Grado 1\u003c/span>\u003cspan class=\"nom\">\u003cb>Andar por muros\u003c/b>\u003csmall>Kinobori no Waza\u003c/small>\u003csmall>Acción adicional · sobre ti\u003c/small>\u003csmall class=\"ev-efecto-breve\">Caminas por paredes, techos y agua como por el suelo, con las manos libres. Si pierdes la Concentración en una pared, caes.\u003c/small>\u003c/span>\n      \u003cspan class=\"vb\">\u003cb>2 Verbe\u003c/b>\u003csmall>por uso base\u003c/small>\u003c/span>\u003cspan class=\"acc\">\u003cbutton type=\"button\" data-action=\"pestana\" data-p=\"jugar\">Aprendida · ir a Mis técnicas\u003c/button>\u003c/span>\u003c/summary>\u003cdiv class=\"ecos-verbe-ficha-cont\">\u003c/div>\u003c/details>\u003cdetails class=\"ecos-verbe-tec puede\" data-id=\"forma-cuerda\" data-tipo=\"tec\">\u003csummary>\n      \u003cspan class=\"gr\">Grado 1\u003c/span>\u003cspan class=\"nom\">\u003cb>Cuerda de Verbe\u003c/b>\u003csmall>\u003c/small>\u003csmall>Acción · 9 m\u003c/small>\u003csmall class=\"ev-efecto-breve\">FUE. Un lazo de Verbe atrapa a una criatura Mediana o menor: si falla, queda Agarrada (escape contra tu CD) y con una AA la acercas 3 m. Sube: una criatura más.\u003c/small>\u003c/span>\n      \u003cspan class=\"vb\">\u003cb>2 Verbe\u003c/b>\u003csmall>por uso base\u003c/small>\u003c/span>\u003cspan class=\"acc\">\u003cbutton type=\"button\" data-action=\"aprender\" data-id=\"forma-cuerda\">Aprender · 1 Trazo\u003c/button>\u003csmall>Te quedarían 15 Trazos\u003c/small>\u003c/span>\u003c/summary>\u003cdiv class=\"ecos-verbe-ficha-cont\">\u003c/div>\u003c/details>\u003cdetails class=\"ecos-verbe-tec puede\" data-id=\"forma-replica\" data-tipo=\"tec\">\u003csummary>\n      \u003cspan class=\"gr\">Grado 1\u003c/span>\u003cspan class=\"nom\">\u003cb>Réplica\u003c/b>\u003csmall>Bunshin no Jutsu\u003c/small>\u003csmall>Acción · sobre ti\u003c/small>\u003csmall class=\"ev-efecto-breve\">Aparece a tu lado una copia ilusoria tuya. Cuando te atacan, tira 1d20: con 11 o más el ataque va a la copia (CA 10 + tu mod. de DES), que desaparece. No engaña a quien ve el Verbe. Sube: una copia más (máx. 3).\u003c/small>\u003c/span>\n      \u003cspan class=\"vb\">\u003cb>2 Verbe\u003c/b>\u003csmall>por uso base\u003c/small>\u003c/span>\u003cspan class=\"acc\">\u003cbutton type=\"button\" data-action=\"aprender\" data-id=\"forma-replica\">Aprender · 1 Trazo\u003c/button>\u003csmall>Te quedarían 15 Trazos\u003c/small>\u003c/span>\u003c/summary>\u003cdiv class=\"ecos-verbe-ficha-cont\">\u003c/div>\u003c/details>\u003cdetails class=\"ecos-verbe-tec sabe\" data-id=\"forma-sustitucion\" data-tipo=\"tec\">\u003csummary>\n      \u003cspan class=\"gr\">Grado 1\u003c/span>\u003cspan class=\"nom\">\u003cb>Sustitución\u003c/b>\u003csmall>Kawarimi no Jutsu\u003c/small>\u003csmall>Reacción · sobre ti\u003c/small>\u003csmall class=\"ev-efecto-breve\">Cuando un ataque con tirada que ves venir te va a impactar, te cambias por un objeto de tu tamaño o menor a 3 m o menos (un tronco, una capa, una piedra): el ataque falla y el objeto recibe el golpe. Cuesta 2 Verbe, y 2 más por cada grado que el ataque supere tu grado máximo (grado de un ataque: el de su técnica o conjuro; si es un arma o una criatura, la mitad de su nivel o VD). No sirve contra áreas ni salvaciones, ni sin un objeto cerca.\u003c/small>\u003c/span>\n      \u003cspan class=\"vb\">\u003cb>2 Verbe\u003c/b>\u003csmall>por uso base\u003c/small>\u003c/span>\u003cspan class=\"acc\">\u003cbutton type=\"button\" data-action=\"pestana\" data-p=\"jugar\">Aprendida · ir a Mis técnicas\u003c/button>\u003c/span>\u003c/summary>\u003cdiv class=\"ecos-verbe-ficha-cont\">\u003c/div>\u003c/details>\u003cdetails class=\"ecos-verbe-tec puede\" data-id=\"forma-transformacion\" data-tipo=\"tec\">\u003csummary>\n      \u003cspan class=\"gr\">Grado 1\u003c/span>\u003cspan class=\"nom\">\u003cb>Transformación\u003c/b>\u003csmall>Henge no Jutsu\u003c/small>\u003csmall>Acción · sobre ti\u003c/small>\u003csmall class=\"ev-efecto-breve\">Te ves como otra persona de tu tamaño, o como un objeto de tu tamaño. Tocarte, o Investigación contra tu CD, lo revela.\u003c/small>\u003c/span>\n      \u003cspan class=\"vb\">\u003cb>2 Verbe\u003c/b>\u003csmall>por uso base\u003c/small>\u003c/span>\u003cspan class=\"acc\">\u003cbutton type=\"button\" data-action=\"aprender\" data-id=\"forma-transformacion\">Aprender · 1 Trazo\u003c/button>\u003csmall>Te quedarían 15 Trazos\u003c/small>\u003c/span>\u003c/summary>\u003cdiv class=\"ecos-verbe-ficha-cont\">\u003c/div>\u003c/details>\u003cdetails class=\"ecos-verbe-tec puede\" data-id=\"forma-tres-puntas\" data-tipo=\"tec\">\u003csummary>\n      \u003cspan class=\"gr\">Grado 1\u003c/span>\u003cspan class=\"nom\">\u003cb>Tres puntas\u003c/b>\u003csmall>\u003c/small>\u003csmall>Acción · 36 m\u003c/small>\u003csmall class=\"ev-efecto-breve\">3 × 1d4+1 fuerza. Tres puntas de Verbe que no fallan, a uno o a varios blancos que veas. Sube: una punta más.\u003c/small>\u003c/span>\n      \u003cspan class=\"vb\">\u003cb>2 Verbe\u003c/b>\u003csmall>por uso base\u003c/small>\u003c/span>\u003cspan class=\"acc\">\u003cbutton type=\"button\" data-action=\"aprender\" data-id=\"forma-tres-puntas\">Aprender · 1 Trazo\u003c/button>\u003csmall>Te quedarían 15 Trazos\u003c/small>\u003c/span>\u003c/summary>\u003cdiv class=\"ecos-verbe-ficha-cont\">\u003c/div>\u003c/details>\u003cdetails class=\"ecos-verbe-tec puede\" data-id=\"forma-esfera\" data-tipo=\"tec\">\u003csummary>\n      \u003cspan class=\"gr\">Grado 2\u003c/span>\u003cspan class=\"nom\">\u003cb>Esfera girante\u003c/b>\u003csmall>Rasengan\u003c/small>\u003csmall>Acción · toque\u003c/small>\u003csmall class=\"ev-efecto-breve\">Ataque: 3d8 fuerza. Un remolino de Verbe en la palma que estalla al tocar: si impacta, el blanco sale empujado 3 m. Sube: +1d8.\u003c/small>\u003c/span>\n      \u003cspan class=\"vb\">\u003cb>3 Verbe\u003c/b>\u003csmall>por uso base\u003c/small>\u003c/span>\u003cspan class=\"acc\">\u003cbutton type=\"button\" data-action=\"aprender\" data-id=\"forma-esfera\">Aprender · 2 Trazos\u003c/button>\u003csmall>Te quedarían 14 Trazos\u003c/small>\u003c/span>\u003c/summary>\u003cdiv class=\"ecos-verbe-ficha-cont\">\u003c/div>\u003c/details>\u003cdetails class=\"ecos-verbe-tec puede\" data-id=\"forma-nudo\" data-tipo=\"tec\">\u003csummary>\n      \u003cspan class=\"gr\">Grado 2\u003c/span>\u003cspan class=\"nom\">\u003cb>Nudo de Verbe\u003c/b>\u003csmall>\u003c/small>\u003csmall>Acción · toque\u003c/small>\u003csmall class=\"ev-efecto-breve\">Ataque: 3d10 fuerza. Aprietas el Verbe en la palma hasta que gira. Si impacta, el blanco sale empujado 3 m. Sube: +1d10.\u003c/small>\u003c/span>\n      \u003cspan class=\"vb\">\u003cb>3 Verbe\u003c/b>\u003csmall>por uso base\u003c/small>\u003c/span>\u003cspan class=\"acc\">\u003cbutton type=\"button\" data-action=\"aprender\" data-id=\"forma-nudo\">Aprender · 2 Trazos\u003c/button>\u003csmall>Te quedarían 14 Trazos\u003c/small>\u003c/span>\u003c/summary>\u003cdiv class=\"ecos-verbe-ficha-cont\">\u003c/div>\u003c/details>\u003cdetails class=\"ecos-verbe-tec puede\" data-id=\"forma-paso\" data-tipo=\"tec\">\u003csummary>\n      \u003cspan class=\"gr\">Grado 2\u003c/span>\u003cspan class=\"nom\">\u003cb> , 11 y 17.\u003c/small>\u003c/span>\n      \u003cspan class=\"vb\">\u003cb>0 Verbe\u003c/b>\u003csmall>por uso base\u003c/small>\u003c/span>\u003cspan class=\"acc\">\u003cbutton type=\"button\" data-action=\"aprender\" data-id=\"velo-punzada\">Aprender · 1 Trazo\u003c/button>\u003csmall>Te quedarían 15 Trazos\u003c/small>\u003c/span>\u003c/summary>\u003cdiv class=\"ecos-verbe-ficha-cont\">\u003c/div>\u003c/details>\u003cdetails class=\"ecos-verbe-tec puede\" data-id=\"velo-romper\" data-tipo=\"tec\">\u003csummary>\n      \u003cspan class=\"gr\">Grado 0\u003c/span>\u003cspan class=\"nom\">\u003cb>Romper el Velo\u003c/b>\u003csmall>Genjutsu Kai\u003c/small>\u003csmall>Acción adicional · sobre ti\u003c/small>\u003csmall class=\"ev-efecto-breve\">Prueba de Control contra la CD de quien lo hizo: si la superas, termina un efecto del Velo sobre ti. Con una acción, sobre una criatura que tocas. Es lo primero que enseña cualquier maestro de Velo.\u003c/small>\u003c/span>\n      \u003cspan class=\"vb\">\u003cb>0 Verbe\u003c/b>\u003csmall>por uso base\u003c/small>\u003c/span>\u003cspan class=\"acc\">\u003cbutton type=\"button\" data-action=\"aprender\" data-id=\"velo-romper\">Aprender · 1 Trazo\u003c/button>\u003csmall>Te quedarían 15 Trazos\u003c/small>\u003c/span>\u003c/summary>\u003cdiv class=\"ecos-verbe-ficha-cont\">\u003c/div>\u003c/details>\u003cdetails class=\"ecos-verbe-tec puede\" data-id=\"velo-ruido\" data-tipo=\"tec\">\u003csummary>\n      \u003cspan class=\"gr\">Grado 0\u003c/span>\u003cspan class=\"nom\">\u003cb>Ruido falso\u003c/b>\u003csmall>\u003c/small>\u003csmall>Acción · 36 m\u003c/small>\u003csmall class=\"ev-efecto-breve\">Un sonido que no existe, donde quieras: pasos, una voz, un grito, un cristal que se rompe.\u003c/small>\u003c/span>\n      \u003cspan class=\"vb\">\u003cb>0 Verbe\u003c/b>\u003csmall>por uso base\u003c/small>\u003c/span>\u003cspan class=\"acc\">\u003cbutton type=\"button\" data-action=\"aprender\" data-id=\"velo-ruido\">Aprender · 1 Trazo\u003c/button>\u003csmall>Te quedarían 15 Trazos\u003c/small>\u003c/span>\u003c/summary>\u003cdiv class=\"ecos-verbe-ficha-cont\">\u003c/div>\u003c/details>\u003cdetails class=\"ecos-verbe-tec puede\" data-id=\"velo-susurro\" data-tipo=\"tec\">\u003csummary>\n      \u003cspan class=\"gr\">Grado 0\u003c/span>\u003cspan class=\"nom\">\u003cb>Susurro falso\u003c/b>\u003csmall>\u003c/small>\u003csmall>Acción · 9 m\u003c/small>\u003csmall class=\"ev-efecto-breve\">Un sonido, o una imagen quieta de hasta 1,5 m. Investigación contra tu CD lo revela; la imagen no aguanta que la toquen.\u003c/small>\u003c/span>\n      \u003cspan class=\"vb\">\u003cb>0 Verbe\u003c/b>\u003csmall>por uso base\u003c/small>\u003c/span>\u003cspan class=\"acc\">\u003cbutton type=\"button\" data-action=\"aprender\" data-id=\"velo-susurro\">Aprender · 1 Trazo\u003c/button>\u003csmall>Te quedarían 15 Trazos\u003c/small>\u003c/span>\u003c/summary>\u003cdiv class=\"ecos-verbe-ficha-cont\">\u003c/div>\u003c/details>\u003cdetails class=\"ecos-verbe-tec puede\" data-id=\"velo-cansancio\" data-tipo=\"tec\">\u003csummary>\n      \u003cspan class=\"gr\">Grado 1\u003c/span>\u003cspan class=\"nom\">\u003cb>Cansancio\u003c/b>\u003csmall>\u003c/small>\u003csmall>Acción · 18 m\u003c/small>\u003csmall class=\"ev-efecto-breve\">SAB. Cree que lleva días sin dormir: si falla, tiene desventaja en los ataques y en las pruebas de FUE. Repite al final de cada turno. Sube: una criatura más.\u003c/small>\u003c/span>\n      \u003cspan class=\"vb\">\u003cb>2 Verbe\u003c/b>\u003csmall>por uso base\u003c/small>\u003c/span>\u003cspan class=\"acc\">\u003cbutton type=\"button\" data-action=\"aprender\" data-id=\"velo-cansancio\">Aprender · 1 Trazo\u003c/button>\u003csmall>Te quedarían 15 Trazos\u003c/small>\u003c/span>\u003c/summary>\u003cdiv class=\"ecos-verbe-ficha-cont\">\u003c/div>\u003c/details>\u003cdetails class=\"ecos-verbe-tec puede\" data-id=\"velo-imagen\" data-tipo=\"tec\">\u003csummary>\n      \u003cspan class=\"gr\">Grado 1\u003c/span>\u003cspan class=\"nom\">\u003cb>Imagen falsa\u003c/b>\u003csmall>\u003c/small>\u003csmall>Acción · 18 m · cubo 4,5 m\u003c/small>\u003csmall class=\"ev-efecto-breve\">Una imagen muda de algo que cabe en el cubo. La mueves con una acción. Investigación contra tu CD la revela; quien la toca la atraviesa.\u003c/small>\u003c/span>\n      \u003cspan class=\"vb\">\u003cb>2 Verbe\u003c/b>\u003csmall>por uso base\u003c/small>\u003c/span>\u003cspan class=\"acc\">\u003cbutton type=\"button\" data-action=\"aprender\" data-id=\"velo-imagen\">Aprender · 1 Trazo\u003c/button>\u003csmall>Te quedarían 15 Trazos\u003c/small>\u003c/span>\u003c/summary>\u003cdiv class=\"ecos-verbe-ficha-cont\">\u003c/div>\u003c/details>\u003cdetails class=\"ecos-verbe-tec puede\" data-id=\"velo-salir-flujo\" data-tipo=\"tec\">\u003csummary>\n      \u003cspan class=\"gr\">Grado 1\u003c/span>\u003cspan class=\"nom\">\u003cb>Interferencia de un aliado\u003c/b>\u003csmall>Interferencia externa\u003c/small>\u003csmall>Acción · 1.5 m\u003c/small>\u003csmall class=\"ev-efecto-breve\">Tocas a una criatura y alteras suavemente su flujo: puede repetir inmediatamente una salvación contra una ilusión o Hechizado que permita liberación por chakra. Límites: Una repetición por víctima y turno; no elimina estados físicos, no garantiza éxito y no rompe los poderes oculares excepcionales sin cumplir sus condiciones.\u003c/small>\u003c/span>\n      \u003cspan class=\"vb\">\u003cb>2 Verbe\u003c/b>\u003csmall>por uso base\u003c/small>\u003c/span>\u003cspan class=\"acc\">\u003cbutton type=\"button\" data-action=\"aprender\" data-id=\"velo-salir-flujo\">Aprender · 1 Trazo\u003c/button>\u003csmall>Te quedarían 15 Trazos\u003c/small>\u003c/span>\u003c/summary>\u003cdiv class=\"ecos-verbe-ficha-cont\">\u003c/div>\u003c/details>\u003cdetails class=\"ecos-verbe-tec puede\" data-id=\"velo-lugar-falso\" data-tipo=\"tec\">\u003csummary>\n      \u003cspan class=\"gr\">Grado 1\u003c/span>\u003cspan class=\"nom\">\u003cb>Lugar que no es\u003c/b>\u003csmall>Kokoni Arazu no Jutsu\u003c/small>\u003csmall>Acción · 18 m\u003c/small>\u003csmall class=\"ev-efecto-breve\">Alteras rótulos, distancias aparentes o una habitación de hasta 6 m sin cambiar su materia. Una acción de Investigación contra tu CD descubre la contradicción; tocar un obstáculo real revela el engaño. Límites: Afecta solo al objetivo o área indicados; no ignora cobertura total, inmunidades ni requisitos de la técnica.\u003c/small>\u003c/span>\n      \u003cspan class=\"vb\">\u003cb>2 Verbe\u003c/b>\u003csmall>por uso base\u003c/small>\u003c/span>\u003cspan class=\"acc\">\u003cbutton type=\"button\" data-action=\"aprender\" data-id=\"velo-lugar-falso\">Aprender · 1 Trazo\u003c/button>\u003csmall>Te quedarían 15 Trazos\u003c/small>\u003c/span>\u003c/summary>\u003cdiv class=\"ecos-verbe-ficha-cont\">\u003c/div>\u003c/details>\u003cdetails class=\"ecos-verbe-tec puede\" data-id=\"velo-parpados\" data-tipo=\"tec\">\u003csummary>\n      \u003cspan class=\"gr\">Grado 1\u003c/span>\u003cspan class=\"nom\">\u003cb>Párpados de plomo\u003c/b>\u003csmall>\u003c/small>\u003csmall>Acción · 18 m · esfera 1,5 m\u003c/small>\u003csmall class=\"ev-efecto-breve\">SAB. Si falla, queda Incapacitada. Al final de su próximo turno repite: si falla otra vez, se duerme hasta que la dañen o alguien la sacuda con una acción.\u003c/small>\u003c/span>\n      \u003cspan class=\"vb\">\u003cb>2 Verbe\u003c/b>\u003csmall>por uso base\u003c/small>\u003c/span>\u003cspan class=\"acc\">\u003cbutton type=\"button\" data-action=\"aprender\" data-id=\"velo-parpados\">Aprender · 1 Trazo\u003c/button>\u003csmall>Te quedarían 15 Trazos\u003c/small>\u003c/span>\u003c/summary>\u003cdiv class=\"ecos-verbe-ficha-cont\">\u003c/div>\u003c/details>\u003cdetails class=\"ecos-verbe-tec puede\" data-id=\"velo-paso-falso\" data-tipo=\"tec\">\u003csummary>\n      \u003cspan class=\"gr\">Grado 1\u003c/span>\u003cspan class=\"nom\">\u003cb>Paso falso\u003c/b>\u003csmall>\u003c/small>\u003csmall>Reacción · sobre ti\u003c/small>\u003csmall class=\"ev-efecto-breve\">Cuando te va a atacar una criatura que te ve, te ve 1,5 m corrido: ese ataque, y los demás contra ti hasta el inicio de tu turno, tienen desventaja.\u003c/small>\u003c/span>\n      \u003cspan class=\"vb\">\u003cb>2 Verbe\u003c/b>\u003csmall>por uso base\u003c/small>\u003c/span>\u003cspan class=\"acc\">\u003cbutton type=\"button\" data-action=\"aprender\" data-id=\"velo-paso-falso\">Aprender · 1 Trazo\u003c/button>\u003csmall>Te quedarían 15 Trazos\u003c/small>\u003c/span>\u003c/summary>\u003cdiv class=\"ecos-verbe-ficha-cont\">\u003c/div>\u003c/details>\u003cdetails class=\"ecos-verbe-tec puede\" data-id=\"velo-amigo\" data-tipo=\"tec\">\u003csummary>\n      \u003cspan class=\"gr\">Grado 1\u003c/span>\u003cspan class=\"nom\">\u003cb>Rostro amigo\u003c/b>\u003csmall>\u003c/small>\u003csmall>Acción · 9 m\u003c/small>\u003csmall class=\"ev-efecto-breve\">SAB. Un humanoide te ve como un amigo: si falla, queda Hechizado. Tiene ventaja si tú o los tuyos lo atacan. Al terminar sabe que fuiste tú. Sube: una criatura más.\u003c/small>\u003c/span>\n      \u003cspan class=\"vb\">\u003cb>2 Verbe\u003c/b>\u003csmall>por uso base\u003c/small>\u003c/span>\u003cspan class=\"acc\">\u003cbutton type=\"button\" data-action=\"aprender\" data-id=\"velo-amigo\">Aprender · 1 Trazo\u003c/button>\u003csmall>Te quedarían 15 Trazos\u003c/small>\u003c/span>\u003c/summary>\u003cdiv class=\"ecos-verbe-ficha-cont\">\u003c/div>\u003c/details>\u003cdetails class=\"ecos-verbe-tec puede\" data-id=\"velo-miedo\" data-tipo=\"tec\">\u003csummary>\n      \u003cspan class=\"gr\">Grado 1\u003c/span>\u003cspan class=\"nom\">\u003cb>Rostro del miedo\u003c/b>\u003csmall>Narakumi no Jutsu\u003c/small>\u003csmall>Acción · 18 m\u003c/small>\u003csmall class=\"ev-efecto-breve\">SAB. Si falla, queda Asustada. Repite la salvación al final de cada turno en que no te ve. Sube: una criatura más.\u003c/small>\u003c/span>\n      \u003cspan class=\"vb\">\u003cb>2 Verbe\u003c/b>\u003csmall>por uso base\u003c/small>\u003c/span>\u003cspan class=\"acc\">\u003cbutton type=\"button\" data-action=\"aprender\" data-id=\"velo-miedo\">Aprender · 1 Trazo\u003c/button>\u003csmall>Te quedarían 15 Trazos\u003c/small>\u003c/span>\u003c/summary>\u003cdiv class=\"ecos-verbe-ficha-cont\">\u003c/div>\u003c/details>\u003c/details>\u003cdetails class=\"ecos-verbe-grupo\" data-g=\"s-cuerpo\" open>\u003csummary>\u003cb>Cuerpo\u003c/b> \u003cspan>11 técnicas · puedes aprender 11\u003c/span>\u003c/summary>\n        \u003cdetails class=\"ecos-verbe-tec puede\" data-id=\"cuerpo-golpe-hondo\" data-tipo=\"tec\">\u003csummary>\n      \u003cspan class=\"gr\">Grado 0\u003c/span>\u003cspan class=\"nom\">\u003cb>Golpe hondo\u003c/b>\u003csmall>\u003c/small>\u003csmall>Acción · sobre ti\u003c/small>\u003csmall class=\"ev-efecto-breve\">Haces un ataque con un arma cuerpo a cuerpo o un golpe sin armas. Si impacta, suma 1d6 de fuerza (2d6 en el nivel 5, 3d6 en el 11 y 4d6 en el 17).\u003c/small>\u003c/span>\n      \u003cspan class=\"vb\">\u003cb>0 Verbe\u003c/b>\u003csmall>por uso base\u003c/small>\u003c/span>\u003cspan class=\"acc\">\u003cbutton type=\"button\" data-action=\"aprender\" data-id=\"cuerpo-golpe-hondo\">Aprender · 1 Trazo\u003c/button>\u003csmall>Te quedarían 15 Trazos\u003c/small>\u003c/span>\u003c/summary>\u003cdiv class=\"ecos-verbe-ficha-cont\">\u003c/div>\u003c/details>\u003cdetails class=\"ecos-verbe-tec puede\" data-id=\"cuerpo-guardia\" data-tipo=\"tec\">\u003csummary>\n      \u003cspan class=\"gr\">Grado 0\u003c/span>\u003cspan class=\"nom\">\u003cb>Guardia de hierro\u003c/b>\u003csmall>\u003c/small>\u003csmall>Acción adicional · sobre ti\u003c/small>\u003csmall class=\"ev-efecto-breve\">+1 a la CA hasta el inicio de tu próximo turno, pero tu velocidad es 0.\u003c/small>\u003c/span>\n      \u003cspan class=\"vb\">\u003cb>0 Verbe\u003c/b>\u003csmall>por uso base\u003c/small>\u003c/span>\u003cspan class=\"acc\">\u003cbutton type=\"button\" data-action=\"aprender\" data-id=\"cuerpo-guardia\">Aprender · 1 Trazo\u003c/button>\u003csmall>Te quedarían 15 Trazos\u003c/small>\u003c/span>\u003c/summary>\u003cdiv class=\"ecos-verbe-ficha-cont\">\u003c/div>\u003c/details>\u003cdetails class=\"ecos-verbe-tec puede\" data-id=\"cuerpo-impulso\" data-tipo=\"tec\">\u003csummary>\n      \u003cspan class=\"gr\">Grado 0\u003c/span>\u003cspan class=\"nom\">\u003cb>Impulso\u003c/b>\u003csmall>\u003c/small>\u003csmall>Acción adicional · sobre ti\u003c/small>\u003csmall class=\"ev-efecto-breve\">Hasta el final del turno tus saltos llegan al doble, y caer 6 m o menos no te hace daño.\u003c/small>\u003c/span>\n      \u003cspan class=\"vb\">\u003cb>0 Verbe\u003c/b>\u003csmall>por uso base\u003c/small>\u003c/span>\u003cspan class=\"acc\">\u003cbutton type=\"button\" data-action=\"aprender\" data-id=\"cuerpo-impulso\">Aprender · 1 Trazo\u003c/button>\u003csmall>Te quedarían 15 Trazos\u003c/small>\u003c/span>\u003c/summary>\u003cdiv class=\"ecos-verbe-ficha-cont\">\u003c/div>\u003c/details>\u003cdetails class=\"ecos-verbe-tec puede\" data-id=\"cuerpo-nudos-libres\" data-tipo=\"tec\">\u003csummary>\n      \u003cspan class=\"gr\">Grado 0\u003c/span>\u003cspan class=\"nom\">\u003cb>Manos fuera del nudo\u003c/b>\u003csmall>Nawanuke no Jutsu\u003c/small>\u003csmall>Acción · sobre ti\u003c/small>\u003csmall class=\"ev-efecto-breve\">Aflojas una atadura mundana si superas una prueba de Destreza o Juego de Manos contra la CD del nudo fijada por el DM. Límites: Una acción y una prueba, no éxito automático. No rompe cadenas, presas de criaturas o sellos mágicos.\u003c/small>\u003c/span>\n      \u003cspan class=\"vb\">\u003cb>0 Verbe\u003c/b>\u003csmall>por uso base\u003c/small>\u003c/span>\u003cspan class=\"acc\">\u003cbutton type=\"button\" data-action=\"aprender\" data-id=\"cuerpo-nudos-libres\">Aprender · 1 Trazo\u003c/button>\u003csmall>Te quedarían 15 Trazos\u003c/small>\u003c/span>\u003c/summary>\u003cdiv class=\"ecos-verbe-ficha-cont\">\u003c/div>\u003c/details>\u003cdetails class=\"ecos-verbe-tec puede\" data-id=\"cuerpo-postura\" data-tipo=\"tec\">\u003csummary>\n      \u003cspan class=\"gr\">Grado 0\u003c/span>\u003cspan class=\"nom\">\u003cb>Postura firme\u003c/b>\u003csmall>\u003c/small>\u003csmall>Acción adicional · sobre ti\u003c/small>\u003csmall class=\"ev-efecto-breve\">Hasta tu próximo turno, ventaja para no caer Derribado, no ser empujado y no ser Agarrado.\u003c/small>\u003c/span>\n      \u003cspan class=\"vb\">\u003cb>0 Verbe\u003c/b>\u003csmall>por uso base\u003c/small>\u003c/span>\u003cspan class=\"acc\">\u003cbutton type=\"button\" data-action=\"aprender\" data-id=\"cuerpo-postura\">Aprender · 1 Trazo\u003c/button>\u003csmall>Te quedarían 15 Trazos\u003c/small>\u003c/span>\u003c/summary>\u003cdiv class=\"ecos-verbe-ficha-cont\">\u003c/div>\u003c/details>\u003cdetails class=\"ecos-verbe-tec puede\" data-id=\"cuerpo-aguantar\" data-tipo=\"tec\">\u003csummary>\n      \u003cspan class=\"gr\">Grado 1\u003c/span>\u003cspan class=\"nom\">\u003cb>Aguantar el golpe\u003c/b>\u003csmall>\u003c/small>\u003csmall>Reacción · sobre ti\u003c/small>\u003csmall class=\"ev-efecto-breve\">Cuando recibes daño contundente, cortante o perforante, lo reduces en 2d8 + tu mod. de FUE o DES. Sube: +1d8.\u003c/small>\u003c/span>\n      \u003cspan class=\"vb\">\u003cb>2 Verbe\u003c/b>\u003csmall>por uso base\u003c/small>\u003c/span>\u003cspan class=\"acc\">\u003cbutton type=\"button\" data-action=\"aprender\" data-id=\"cuerpo-aguantar\">Aprender · 1 Trazo\u003c/button>\u003csmall>Te quedarían 15 Trazos\u003c/small>\u003c/span>\u003c/summary>\u003cdiv class=\"ecos-verbe-ficha-cont\">\u003c/div>\u003c/details>\u003cdetails class=\"ecos-verbe-tec puede\" data-id=\"cuerpo-codazo\" data-tipo=\"tec\">\u003csummary>\n      \u003cspan class=\"gr\">Grado 1\u003c/span>\u003cspan class=\"nom\">\u003cb>Codazo\u003c/b>\u003csmall>\u003c/small>\u003csmall>Acción adicional · toque\u003c/small>\u003csmall class=\"ev-efecto-breve\">Ataque: 2d6 contundente. Un golpe corto con el codo: si impacta y el blanco es Mediano o menor y falla FUE, queda Derribado. Sube: +1d6.\u003c/small>\u003c/span>\n      \u003cspan class=\"vb\">\u003cb>2 Verbe\u003c/b>\u003csmall>por uso base\u003c/small>\u003c/span>\u003cspan class=\"acc\">\u003cbutton type=\"button\" data-action=\"aprender\" data-id=\"cuerpo-codazo\">Aprender · 1 Trazo\u003c/button>\u003csmall>Te quedarían 15 Trazos\u003c/small>\u003c/span>\u003c/summary>\u003cdiv class=\"ecos-verbe-ficha-cont\">\u003c/div>\u003c/details>\u003cdetails class=\"ecos-verbe-tec puede\" data-id=\"cuerpo-martillo\" data-tipo=\"tec\">\u003csummary>\n      \u003cspan class=\"gr\">Grado 1\u003c/span>\u003cspan class=\"nom\">\u003cb>Golpe de martillo\u003c/b>\u003csmall>\u003c/small>\u003csmall>Acción adicional · sobre ti\u003c/small>\u003csmall class=\"ev-efecto-breve\">Tu próximo golpe cuerpo a cuerpo que impacte suma 2d6 de fuerza, y el blanco hace FUE o queda Derribado. Sube: +1d6.\u003c/small>\u003c/span>\n      \u003cspan class=\"vb\">\u003cb>2 Verbe\u003c/b>\u003csmall>por uso base\u003c/small>\u003c/span>\u003cspan class=\"acc\">\u003cbutton type=\"button\" data-action=\"aprender\" data-id=\"cuerpo-martillo\">Aprender · 1 Trazo\u003c/button>\u003csmall>Te quedarían 15 Trazos\u003c/small>\u003c/span>\u003c/summary>\u003cdiv class=\"ecos-verbe-ficha-cont\">\u003c/div>\u003c/details>\u003cdetails class=\"ecos-verbe-tec puede\" data-id=\"cuerpo-lluvia\" data-tipo=\"tec\">\u003csummary>\n      \u003cspan class=\"gr\">Grado 1\u003c/span>\u003cspan class=\"nom\">\u003cb>Lluvia de puños\u003c/b>\u003csmall>\u003c/small>\u003csmall>Acción adicional · sobre ti\u003c/small>\u003csmall class=\"ev-efecto-breve\">Haces dos golpes sin armas.\u003c/small>\u003c/span>\n      \u003cspan class=\"vb\">\u003cb>2 Verbe\u003c/b>\u003csmall>por uso base\u003c/small>\u003c/span>\u003cspan class=\"acc\">\u003cbutton type=\"button\" data-action=\"aprender\" data-id=\"cuerpo-lluvia\">Aprender · 1 Trazo\u003c/button>\u003csmall>Te quedarían 15 Trazos\u003c/small>\u003c/span>\u003c/summary>\u003cdiv class=\"ecos-verbe-ficha-cont\">\u003c/div>\u003c/details>\u003cdetails class=\"ecos-verbe-tec puede\" data-id=\"cuerpo-salto\" data-tipo=\"tec\">\u003csummary>\n      \u003cspan class=\"gr\">Grado 1\u003c/span>\u003cspan class=\"nom\">\u003cb>Salto del Verbe\u003c/b>\u003csmall>\u003c/small>\u003csmall>Acción adicional · sobre ti\u003c/small>\u003csmall class=\"ev-efecto-breve\">Saltas el triple de lo normal, y caer desde esa altura no te hace daño.\u003c/small>\u003c/span>\n      \u003cspan class=\"vb\">\u003cb>2 Verbe\u003c/b>\u003csmall>por uso base\u003c/small>\u003c/span>\u003cspan class=\"acc\">\u003cbutton type=\"button\" data-action=\"aprender\" data-id=\"cuerpo-salto\">Aprender · 1 Trazo\u003c/button>\u003csmall>Te quedarían 15 Trazos\u003c/small>\u003c/span>\u003c/summary>\u003cdiv class=\"ecos-verbe-ficha-cont\">\u003c/div>\u003c/details>\u003cdetails class=\"ecos-verbe-tec puede\" data-id=\"cuerpo-sombra-danzante\" data-tipo=\"tec\">\u003csummary>\n      \u003cspan class=\"gr\">Grado 1\u003c/span>\u003cspan class=\"nom\">\u003cb>Sombra bajo el salto\u003c/b>\u003csmall>Kage Buyō\u003c/small>\u003csmall>Acción adicional · sobre ti\u003c/small>\u003csmall class=\"ev-efecto-breve\">Te desplazas hasta 3 m hacia un objetivo elevado que puedas alcanzar. Tus saltos no necesitan carrera mientras dura la postura. Límites: El desplazamiento usa tu movimiento, no es teletransporte ni concede vuelo o ataques adicionales.\u003c/small>\u003c/span>\n      \u003cspan class=\"vb\">\u003cb>2 Verbe\u003c/b>\u003csmall>por uso base\u003c/small>\u003c/span>\u003cspan class=\"acc\">\u003cbutton type=\"button\" data-action=\"aprender\" data-id=\"cuerpo-sombra-danzante\">Aprender · 1 Trazo\u003c/button>\u003csmall>Te quedarían 15 Trazos\u003c/small>\u003c/span>\u003c/summary>\u003cdiv class=\"ecos-verbe-ficha-cont\">\u003c/div>\u003c/details>\u003c/details>\u003cdetails class=\"ecos-verbe-grupo\" data-g=\"s-sello\" open>\u003csummary>\u003cb>Sello\u003c/b> \u003cspan>7 técnicas · puedes aprender 7\u003c/span>\u003c/summary>\n        \u003cdetails class=\"ecos-verbe-tec puede\" data-id=\"sello-guardar\" data-tipo=\"tec\">\u003csummary>\n      \u003cspan class=\"gr\">Grado 0\u003c/span>\u003cspan class=\"nom\">\u003cb>Guardar\u003c/b>\u003csmall>\u003c/small>\u003csmall>Acción · toque\u003c/small>\u003csmall class=\"ev-efecto-breve\">Guardas en un pergamino un objeto que no lleva nadie, de hasta 5 kg. Sacarlo es una AA. Pide un pergamino con tinta de Verbe, que se puede volver a usar.\u003c/small>\u003c/span>\n      \u003cspan class=\"vb\">\u003cb>0 Verbe\u003c/b>\u003csmall>por uso base\u003c/small>\u003c/span>\u003cspan class=\"acc\">\u003cbutton type=\"button\" data-action=\"aprender\" data-id=\"sello-guardar\">Aprender · 1 Trazo\u003c/button>\u003csmall>Te quedarían 15 Trazos\u003c/small>\u003c/span>\u003c/summary>\u003cdiv class=\"ecos-verbe-ficha-cont\">\u003c/div>\u003c/details>\u003cdetails class=\"ecos-verbe-tec puede\" data-id=\"sello-marca\" data-tipo=\"tec\">\u003csummary>\n      \u003cspan class=\"gr\">Grado 0\u003c/span>\u003cspan class=\"nom\">\u003cb>Marca menor\u003c/b>\u003csmall>\u003c/small>\u003csmall>Acción · toque\u003c/small>\u003csmall class=\"ev-efecto-breve\">Dejas una marca invisible de tu Verbe en un objeto o una superficie. Sabes en qué dirección y a qué distancia está, hasta 1,5 km. Tienes tantas como tu competencia.\u003c/small>\u003c/span>\n      \u003cspan class=\"vb\">\u003cb>0 Verbe\u003c/b>\u003csmall>por uso base\u003c/small>\u003c/span>\u003cspan class=\"acc\">\u003cbutton type=\"button\" data-action=\"aprender\" data-id=\"sello-marca\">Aprender · 1 Trazo\u003c/button>\u003csmall>Te quedarían 15 Trazos\u003c/small>\u003c/span>\u003c/summary>\u003cdiv class=\"ecos-verbe-ficha-cont\">\u003c/div>\u003c/details>\u003cdetails class=\"ecos-verbe-tec puede\" data-id=\"sello-estalla\" data-tipo=\"tec\">\u003csummary>\n      \u003cspan class=\"gr\">Grado 1\u003c/span>\u003cspan class=\"nom\">\u003cb>Papel que estalla\u003c/b>\u003csmall>\u003c/small>\u003csmall>Acción · toque · esfera 3 m\u003c/small>\u003csmall class=\"ev-efecto-breve\">DES, mitad: 2d6 fuego. Pegas un sello de papel: estalla cuando lo tocan o cuando tú quieras (AA, a 36 m). Sube: +1d6.\u003c/small>\u003c/span>\n      \u003cspan class=\"vb\">\u003cb>2 Verbe\u003c/b>\u003csmall>por uso base\u003c/small>\u003c/span>\u003cspan class=\"acc\">\u003cbutton type=\"button\" data-action=\"aprender\" data-id=\"sello-estalla\">Aprender · 1 Trazo\u003c/button>\u003csmall>Te quedarían 15 Trazos\u003c/small>\u003c/span>\u003c/summary>\u003cdiv class=\"ecos-verbe-ficha-cont\">\u003c/div>\u003c/details>\u003cdetails class=\"ecos-verbe-tec puede\" data-id=\"sello-cierre\" data-tipo=\"tec\">\u003csummary>\n      \u003cspan class=\"gr\">Grado 1\u003c/span>\u003cspan class=\"nom\">\u003cb>Sello de cierre\u003c/b>\u003csmall>\u003c/small>\u003csmall>Acción · toque\u003c/small>\u003csmall class=\"ev-efecto-breve\">Una puerta, un cofre o una ventana queda cerrada: se abre rompiéndola o con Control contra tu CD. Tú y quien nombres la abren.\u003c/small>\u003c/span>\n      \u003cspan class=\"vb\">\u003cb>2 Verbe\u003c/b>\u003csmall>por uso base\u003c/small>\u003c/span>\u003cspan class=\"acc\">\u003cbutton type=\"button\" data-action=\"aprender\" data-id=\"sello-cierre\">Aprender · 1 Trazo\u003c/button>\u003csmall>Te quedarían 15 Trazos\u003c/small>\u003c/span>\u003c/summary>\u003cdiv class=\"ecos-verbe-ficha-cont\">\u003c/div>\u003c/details>\u003cdetails class=\"ecos-verbe-tec puede\" data-id=\"sello-peso\" data-tipo=\"tec\">\u003csummary>\n      \u003cspan class=\"gr\">Grado 1\u003c/span>\u003cspan class=\"nom\">\u003cb>Sello de peso\u003c/b>\u003csmall>\u003c/small>\u003csmall>Acción · toque\u003c/small>\u003csmall class=\"ev-efecto-breve\">FUE. Un objeto o una criatura pesa render\" data-id=\"quietud-escuchar\">Aprender · 1 Trazo\u003c/button>\u003csmall>Te quedarían 15 Trazos\u003c/small>\u003c/span>\u003c/summary>\u003cdiv class=\"ecos-verbe-ficha-cont\">\u003c/div>\u003c/details>\u003cdetails class=\"ecos-verbe-tec puede\" data-id=\"quietud-quieto\" data-tipo=\"tec\">\u003csummary>\n      \u003cspan class=\"gr\">Grado 0\u003c/span>\u003cspan class=\"nom\">\u003cb>Quieto como la piedra\u003c/b>\u003csmall>\u003c/small>\u003csmall>Acción adicional · sobre ti\u003c/small>\u003csmall class=\"ev-efecto-breve\">Mientras no te mueves, ventaja en Sigilo, y quien te busca por tu Verbe tiene desventaja.\u003c/small>\u003c/span>\n      \u003cspan class=\"vb\">\u003cb>0 Verbe\u003c/b>\u003csmall>por uso base\u003c/small>\u003c/span>\u003cspan class=\"acc\">\u003cbutton type=\"button\" data-action=\"aprender\" data-id=\"quietud-quieto\">Aprender · 1 Trazo\u003c/button>\u003csmall>Te quedarían 15 Trazos\u003c/small>\u003c/span>\u003c/summary>\u003cdiv class=\"ecos-verbe-ficha-cont\">\u003c/div>\u003c/details>\u003cdetails class=\"ecos-verbe-tec puede\" data-id=\"quietud-respirar\" data-tipo=\"tec\">\u003csummary>\n      \u003cspan class=\"gr\">Grado 0\u003c/span>\u003cspan class=\"nom\">\u003cb>Respirar con el mundo\u003c/b>\u003csmall>\u003c/small>\u003csmall>1 hora · sobre ti\u003c/small>\u003csmall class=\"ev-efecto-breve\">Meditas y tomas Verbe del mundo: recuperas 2 × tu competencia. Después, SAB CD 10 + las veces que lo hiciste hoy: si fallas, ganas un nivel de adopción o una marca de lo salvaje (corteza en la piel, ojos de animal).\u003c/small>\u003c/span>\n      \u003cspan class=\"vb\">\u003cb>0 Verbe\u003c/b>\u003csmall>por uso base\u003c/small>\u003c/span>\u003cspan class=\"acc\">\u003cbutton type=\"button\" data-action=\"aprender\" data-id=\"quietud-respirar\">Aprender · 1 Trazo\u003c/button>\u003csmall>Te quedarían 15 Trazos\u003c/small>\u003c/span>\u003c/summary>\u003cdiv class=\"ecos-verbe-ficha-cont\">\u003c/div>\u003c/details>\u00
