\u003ctd>Acción\u003c/td>\u003cth>Alcance\u003c/th>\u003ctd>sobre ti\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Área\u003c/th>\u003ctd>—\u003c/td>\u003cth>Duración\u003c/th>\u003ctd>Concentración, 1 h\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Componentes\u003c/th>\u003ctd>sin gestos ni voz\u003c/td>\u003cth>Tirada\u003c/th>\u003ctd>Ninguna\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Daño o curación\u003c/th>\u003ctd>—\u003c/td>\u003cth>Deja\u003c/th>\u003ctd>—\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Usa\u003c/th>\u003ctd>usa Sabiduría\u003c/td>\u003cth>Sube\u003c/th>\u003ctd>—\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Verbe por uso\u003c/th>\u003ctd>grado 1: 2 Verbe\u003c/td>\u003cth>Para aprender\u003c/th>\u003ctd>1 Trazo\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Pide\u003c/th>\u003ctd>nivel 1\u003c/td>\u003cth>Puedes\u003c/th>\u003ctd>sí\u003c/td>\u003c/tr>\n      \u003c/table>\n      \n      \n      \u003cdiv class=\"ecos-verbe-mejora\">\u003cb>Se mejora con\u003c/b>\u003cul>\u003cli>los dones de rango de Rastro\u003c/li>\u003cli>Cultivo: Pulida, Dominada y Propia\u003c/li>\u003cli>la escuela Los Lectores de Huella\u003c/li>\u003c/ul>\u003c/div>\u003c/div>"},"rastro-ocultar-firma":{"title":"Silencio de la firma","html":"\u003cdiv class=\"ecos-dialogo\">\u003cp class=\"texto\">Reducir tu firma obliga a un sensor a superar tu CD con Percepción o Control para localizarte por energía. Límites: No vuelve invisible al cuerpo ni esconde ruido, olor o huellas. Usar una técnica de grado 1 o más rompe la supresión.\u003c/p>\u003cp class=\"ecos-nota\">Referencia: \u003cb>Supresión\u003c/b> · manga/anime · estudio, p. 7. Grado y cifras adaptados a esta campaña.\u003c/p>\u003cp class=\"ecos-nota\">Ataque/salvación y dados nativos; confirma los estados en los objetivos. Repeticiones de salvación, empujes y condiciones del terreno se resuelven con el DM.\u003c/p>\n      \u003ctable class=\"ecos-verbe-ficha\">\n        \u003ctr>\u003cth>Rama\u003c/th>\u003ctd>Rastro\u003c/td>\u003cth>Grado\u003c/th>\u003ctd>1\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Tiempo\u003c/th>\u003ctd>Acción adicional\u003c/td>\u003cth>Alcance\u003c/th>\u003ctd>sobre ti\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Área\u003c/th>\u003ctd>—\u003c/td>\u003cth>Duración\u003c/th>\u003ctd>Concentración, 600 s\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Componentes\u003c/th>\u003ctd>gestos\u003c/td>\u003cth>Tirada\u003c/th>\u003ctd>Ninguna\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Daño o curación\u003c/th>\u003ctd>—\u003c/td>\u003cth>Deja\u003c/th>\u003ctd>Silencio de la firma\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Usa\u003c/th>\u003ctd>usa Sabiduría\u003c/td>\u003cth>Sube\u003c/th>\u003ctd>—\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Verbe por uso\u003c/th>\u003ctd>grado 1: 2 Verbe\u003c/td>\u003cth>Para aprender\u003c/th>\u003ctd>1 Trazo\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Pide\u003c/th>\u003ctd>nivel 1\u003c/td>\u003cth>Puedes\u003c/th>\u003ctd>sí\u003c/td>\u003c/tr>\n      \u003c/table>\n      \n      \n      \u003c/div>"},"umbral-formula":{"title":"Fórmula del punto de regreso","html":"\u003cdiv class=\"ecos-dialogo\">\u003cp class=\"texto\">Preparas una marca personal al tocar una superficie u objeto. El DM registra hasta tu competencia en marcas activas, con nombre, lugar y fecha. Límites: La marca no transporta ni espía por sí sola. No se duplica con copias del objeto y solo funciona para quien la preparó.\u003c/p>\u003cp class=\"ecos-nota\">Referencia: \u003cb>Hiraishin: preparación\u003c/b> · manga/anime · estudio, p. 42. Grado y cifras adaptados a esta campaña.\u003c/p>\u003cp class=\"ecos-nota\">El DM resuelve desplazamientos, información, cuerpos o preparativos; la tarjeta no crea tokens ni cambia el escenario automáticamente.\u003c/p>\n      \u003ctable class=\"ecos-verbe-ficha\">\n        \u003ctr>\u003cth>Rama\u003c/th>\u003ctd>Umbral\u003c/td>\u003cth>Grado\u003c/th>\u003ctd>0\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Tiempo\u003c/th>\u003ctd>1 minuto\u003c/td>\u003cth>Alcance\u003c/th>\u003ctd>1.5 m\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Área\u003c/th>\u003ctd>—\u003c/td>\u003cth>Duración\u003c/th>\u003ctd>instantánea\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Componentes\u003c/th>\u003ctd>gestos\u003c/td>\u003cth>Tirada\u003c/th>\u003ctd>Ninguna\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Daño o curación\u003c/th>\u003ctd>—\u003c/td>\u003cth>Deja\u003c/th>\u003ctd>—\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Usa\u003c/th>\u003ctd>usa tu característica de Verbe\u003c/td>\u003cth>Sube\u003c/th>\u003ctd>—\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Verbe por uso\u003c/th>\u003ctd>0 Verbe (pide tener al menos 1)\u003c/td>\u003cth>Para aprender\u003c/th>\u003ctd>1 Trazo\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Pide\u003c/th>\u003ctd>—\u003c/td>\u003cth>Puedes\u003c/th>\u003ctd>sí\u003c/td>\u003c/tr>\n      \u003c/table>\n      \n      \n      \u003c/div>"},"familia-tinta-dibujo":{"title":"Dibujo que vive","html":"\u003cdiv class=\"ecos-dialogo\">\u003cp class=\"texto\">Dibujas con tinta de Verbe una criatura que sale del papel, con la ficha del linaje a este grado y el movimiento y el daño que le dibujas. Se deshace en tinta con agua o a 0 PG. Sube: la ficha sube con el grado.\u003c/p>\u003cp class=\"ecos-nota\">Referencia: \u003cb>Chōjū Giga\u003c/b> · manga/anime · estudio, p. 43. Grado y cifras adaptados a esta campaña.\u003c/p>\n      \u003ctable class=\"ecos-verbe-ficha\">\n        \u003ctr>\u003cth>Rama\u003c/th>\u003ctd>Sello\u003c/td>\u003cth>Grado\u003c/th>\u003ctd>1\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Tiempo\u003c/th>\u003ctd>Acción\u003c/td>\u003cth>Alcance\u003c/th>\u003ctd>9 m\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Área\u003c/th>\u003ctd>—\u003c/td>\u003cth>Duración\u003c/th>\u003ctd>Concentración, 1 h\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Componentes\u003c/th>\u003ctd>gestos\u003c/td>\u003cth>Tirada\u003c/th>\u003ctd>Ninguna\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Daño o curación\u003c/th>\u003ctd>—\u003c/td>\u003cth>Deja\u003c/th>\u003ctd>—\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Usa\u003c/th>\u003ctd>usa tu característica de Verbe\u003c/td>\u003cth>Sube\u003c/th>\u003ctd>la ficha sube con el grado por cada grado de más\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Verbe por uso\u003c/th>\u003ctd>grado 1: 2 Verbe\u003c/td>\u003cth>Para aprender\u003c/th>\u003ctd>2 Trazos (rara: +1)\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Pide\u003c/th>\u003ctd>nivel 1 · un maestro de Tinta viva\u003c/td>\u003cth>Puedes\u003c/th>\u003ctd>sí\u003c/td>\u003c/tr>\n      \u003c/table>\n      \n      \n      \u003cdiv class=\"ecos-verbe-mejora\">\u003cb>Se mejora con\u003c/b>\u003cul>\u003cli>usarla a más grado (la ficha sube con el grado)\u003c/li>\u003cli>los dones de rango de Sello\u003c/li>\u003cli>Cultivo: Pulida, Dominada y Propia\u003c/li>\u003cli>la dote Alcance largo\u003c/li>\u003cli>la dote Sello firme\u003c/li>\u003c/ul>\u003c/div>\u003c/div>"},"familia-mano-gigante":{"title":"Mano gigante","html":"\u003cdiv class=\"ecos-dialogo\">\u003cp class=\"texto\">1d8 contundente. Tu brazo crece: tu alcance sube 3 m este turno y tu próximo golpe suma el daño.\u003c/p>\n      \u003ctable class=\"ecos-verbe-ficha\">\n        \u003ctr>\u003cth>Rama\u003c/th>\u003ctd>Cuerpo\u003c/td>\u003cth>Grado\u003c/th>\u003ctd>1\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Tiempo\u003c/th>\u003ctd>Acción adicional\u003c/td>\u003cth>Alcance\u003c/th>\u003ctd>sobre ti\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Área\u003c/th>\u003ctd>—\u003c/td>\u003cth>Duración\u003c/th>\u003ctd>1 asalto\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Componentes\u003c/th>\u003ctd>sin gestos ni voz\u003c/td>\u003cth>Tirada\u003c/th>\u003ctd>Ninguna\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Daño o curación\u003c/th>\u003ctd>1d8 contundente\u003c/td>\u003cth>Deja\u003c/th>\u003ctd>—\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Usa\u003c/th>\u003ctd>ataca con Fuerza o Destreza, como un arma\u003c/td>\u003cth>Sube\u003c/th>\u003ctd>—\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Verbe por uso\u003c/th>\u003ctd>grado 1: 2 Verbe\u003c/td>\u003cth>Para aprender\u003c/th>\u003ctd>2 Trazos (rara: +1)\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Pide\u003c/th>\u003ctd>nivel 1 · un maestro de Crecer\u003c/td>\u003cth>Puedes\u003c/th>\u003ctd>sí\u003c/td>\u003c/tr>\n      \u003c/table>\n      \n      \n      \u003cdiv class=\"ecos-verbe-mejora\">\u003cb>Se mejora con\u003c/b>\u003cul>\u003cli>rango en Cuerpo (Experto +1 dado, Maestro +2, Legendario +3, Mítico +4)\u003c/li>\u003cli>los dones de rango de Cuerpo\u003c/li>\u003cli>Cultivo: Pulida, Dominada y Propia\u003c/li>\u003cli>la dote Cuerpo de hierro\u003c/li>\u003c/ul>\u003c/div>\u003c/div>"},"familia-sombra-ata":{"title":"Sombra que ata","html":"\u003cdiv class=\"ecos-dialogo\">\u003cp class=\"texto\">FUE. Tu sombra se alarga por el suelo hasta una criatura: si falla, queda Apresada y copia tus movimientos, y tu velocidad también es 0. Pide luz que haga sombra. Repite al final de cada turno. Sube: una criatura más y 3 m más.\u003c/p>\n      \u003ctable class=\"ecos-verbe-ficha\">\n        \u003ctr>\u003cth>Rama\u003c/th>\u003ctd>Forma\u003c/td>\u003cth>Grado\u003c/th>\u003ctd>1\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Tiempo\u003c/th>\u003ctd>Acción\u003c/td>\u003cth>Alcance\u003c/th>\u003ctd>9 m\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Área\u003c/th>\u003ctd>—\u003c/td>\u003cth>Duración\u003c/th>\u003ctd>Concentración, 1 min\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Componentes\u003c/th>\u003ctd>gestos\u003c/td>\u003cth>Tirada\u003c/th>\u003ctd>Salvación de FUE\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Daño o curación\u003c/th>\u003ctd>—\u003c/td>\u003cth>Deja\u003c/th>\u003ctd>Apresado\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Usa\u003c/th>\u003ctd>usa tu característica de Verbe\u003c/td>\u003cth>Sube\u003c/th>\u003ctd>una criatura más y 3 m más por cada grado de más\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Verbe por uso\u003c/th>\u003ctd>grado 1: 2 Verbe · grado 2: 3 Verbe\u003c/td>\u003cth>Para aprender\u003c/th>\u003ctd>2 Trazos (rara: +1)\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Pide\u003c/th>\u003ctd>nivel 1 · un maestro de Atadura de sombra\u003c/td>\u003cth>Puedes\u003c/th>\u003ctd>sí\u003c/td>\u003c/tr>\n      \u003c/table>\u003cp class=\"ecos-nota\">CD con tu Verbe: 13.\u003c/p>\n      \u003cp class=\"ecos-verbe-fuerte\">\u003cb>Contra alguien más fuerte:\u003c/b> Contra alguien más fuerte que tú (su grado es la mitad de su nivel o VD) cuesta 2 Verbe más por cada grado que pase de tu grado máximo. El módulo lo cobra solo si lo tienes como objetivo.\u003c/p>\n      \n      \u003cdiv class=\"ecos-verbe-mejora\">\u003cb>Se mejora con\u003c/b>\u003cul>\u003cli>usarla a más grado (una criatura más y 3 m más por grado)\u003c/li>\u003cli>los dones de rango de Forma\u003c/li>\u003cli>Cultivo: Pulida, Dominada y Propia\u003c/li>\u003cli>la dote Alcance largo\u003c/li>\u003c/ul>\u003c/div>\u003c/div>"},"familia-voz-mente":{"title":"Voz en la mente","html":"\u003cdiv class=\"ecos-dialogo\">\u003cp class=\"texto\">Hablas mente a mente con hasta cuatro criaturas que ves; ellas pueden responderte.\u003c/p>\n      \u003ctable class=\"ecos-verbe-ficha\">\n        \u003ctr>\u003cth>Rama\u003c/th>\u003ctd>Velo\u003c/td>\u003cth>Grado\u003c/th>\u003ctd>1\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Tiempo\u003c/th>\u003ctd>Acción\u003c/td>\u003cth>Alcance\u003c/th>\u003ctd>36 m\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Área\u003c/th>\u003ctd>—\u003c/td>\u003cth>Duración\u003c/th>\u003ctd>1 h\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Componentes\u003c/th>\u003ctd>sin gestos ni voz\u003c/td>\u003cth>Tirada\u003c/th>\u003ctd>Ninguna\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Daño o curación\u003c/th>\u003ctd>—\u003c/td>\u003cth>Deja\u003c/th>\u003ctd>—\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Usa\u003c/th>\u003ctd>usa tu característica de Verbe\u003c/td>\u003cth>Sube\u003c/th>\u003ctd>—\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Verbe por uso\u003c/th>\u003ctd>grado 1: 2 Verbe\u003c/td>\u003cth>Para aprender\u003c/th>\u003ctd>2 Trazos (rara: +1)\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Pide\u003c/th>\u003ctd>nivel 1 · un maestro de Cambio de mente\u003c/td>\u003cth>Puedes\u003c/th>\u003ctd>sí\u003c/td>\u003c/tr>\n      \u003c/table>\n      \n      \n      \u003cdiv class=\"ecos-verbe-mejora\">\u003cb>Se mejora con\u003c/b>\u003cul>\u003cli>los dones de rango de Velo\u003c/li>\u003cli>Cultivo: Pulida, Dominada y Propia\u003c/li>\u003cli>la dote Alcance largo\u003c/li>\u003cli>la dote Doble fondo\u003c/li>\u003c/ul>\u003c/div>\u003c/div>"},"familia-sombra-imita":{"title":"Sombra que imita","html":"\u003cdiv class=\"ecos-dialogo\">\u003cp class=\"texto\">FUE. La criatura atada por tu sombra hace lo que tú haces: si caminas, camina; si levantas el brazo, lo levanta.\u003c/p>\u003cp class=\"ecos-nota\">Referencia: \u003cb>Kagemane no Jutsu\u003c/b> · manga/anime · estudio, p. 26. Grado y cifras adaptados a esta campaña.\u003c/p>\n      \u003ctable class=\"ecos-verbe-ficha\">\n        \u003ctr>\u003cth>Rama\u003c/th>\u003ctd>Forma\u003c/td>\u003cth>Grado\u003c/th>\u003ctd>2\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Tiempo\u003c/th>\u003ctd>Acción\u003c/td>\u003cth>Alcance\u003c/th>\u003ctd>18 m\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Área\u003c/th>\u003ctd>—\u003c/td>\u003cth>Duración\u003c/th>\u003ctd>Concentración, 1 min\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Componentes\u003c/th>\u003ctd>gestos\u003c/td>\u003cth>Tirada\u003c/th>\u003ctd>Salvación de FUE\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Daño o curación\u003c/th>\u003ctd>—\u003c/td>\u003cth>Deja\u003c/th>\u003ctd>—\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Usa\u003c/th>\u003ctd>usa tu característica de Verbe\u003c/td>\u003cth>Sube\u003c/th>\u003ctd>—\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Verbe por uso\u003c/th>\u003ctd>grado 2: 3 Verbe\u003c/td>\u003cth>Para aprender\u003c/th>\u003ctd>3 Trazos (rara: +1)\u003c/td>\u003c/tr>\n        \u003ctr>\u003cth>Pide\u003c/th>\u003ctd>nivel 3 · Entrenado en Forma · un maestro de Atadura de sombra\u003c/td>\u003cth>Puedes\u003c/th>\u003ctd>sí\u003c/td>\u003c/tr>\n      \u003c/table>\u003cp class=\"ecos-nota\">CD con tu Verbe: 13.\u003c/p>\n      \n      \n      \u003cdiv class=\"ecos-verbe-mejora\">\u003cb>Se mejora con\u003c/b>\u003cul>\u003cli>los dones de rango de Forma\u003c/li>\u003cli>Cultivo: Pulida, Dominada y Propia\u003c/li>\u003cli>la dote Alcance largo\u003c/li>\u003c/ul>\u003c/div>\u003c/div>"}}}}</script><script>
const datos=JSON.parse(document.getElementById('datos').textContent),panel=document.getElementById('panel');let escena='inicio',pagina='resumen',temporizador;const buscador=document.getElementById('escenario');
function aviso(t){clearTimeout(temporizador);document.getElementById('aviso').textContent=t;temporizador=setTimeout(()=>document.getElementById('aviso').textContent='',4500)}
function render(){document.querySelector('main').classList.toggle('ecos-editor-catalogo',escena==='taller');panel.innerHTML=(datos.paginas[escena][pagina]??datos.paginas.jugar[pagina]);buscador.value=escena}
buscador.onchange=()=>{escena=buscador.value;pagina='resumen';render()};document.getElementById('oscuro').onchange=e=>document.body.classList.toggle('theme-dark',e.target.checked);document.getElementById('cerrar-ficha').onclick=()=>document.getElementById('ficha').close();
panel.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const action=b.dataset.action;if(action==='pestana'){e.preventDefault();pagina=b.dataset.p;render()}else if(action==='ficha'){e.preventDefault();const f=datos.fichas.jugar[b.dataset.id];if(f){document.getElementById('titulo-ficha').textContent=f.title;document.getElementById('contenido-ficha').innerHTML=f.html;document.getElementById('ficha').showModal()}}else if(action==='elegir'){escena=b.dataset.campo==='nat'?'rama':'aprender';pagina='resumen';render();aviso('Demostración del siguiente paso. En Foundry se confirma tu elección antes de guardarla.')}else if(action==='aprender'){aviso('En Foundry este botón aprende la técnica y cobra sus Trazos. Esta vista no modifica personajes.')}else if(action==='usar'){aviso('En Foundry se abre la actividad de tu técnica para elegir grado y confirmar su uso.')}else if(action==='limpiarFiltros'){render()}else{aviso('Esta acción se resuelve dentro de Foundry.')}});
panel.addEventListener('change',e=>{if(e.target.type==='search'){const texto=e.target.value.toLocaleLowerCase();panel.querySelectorAll('.ev-tecnica,details.ecos-verbe-tec').forEach(c=>c.hidden=!c.textContent.toLocaleLowerCase().includes(texto))}else if(e.target.matches('[data-filtro],[data-filtro-dote],[data-filtro-uso]'))aviso('La versión instalada aplica todos los filtros; esta vista muestra el HTML de cada sección.')});render();
</script></body></html>
